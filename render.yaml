services:
  - type: worker
    name: murph-temporal-worker
    runtime: node
    region: virginia
    plan: starter
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 300
    buildCommand: "pnpm install --frozen-lockfile && pnpm --dir packages/hosted-orchestrator-temporal build"
    startCommand: "pnpm --dir packages/hosted-orchestrator-temporal temporal:ensure-device-sync-reconciler-schedule:prod && pnpm --dir packages/hosted-orchestrator-temporal temporal:worker:prod"
    envVars:
      - key: NODE_VERSION
        value: "24.14.1"
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_TASK_QUEUE
        value: murph-hosted-runtime
      - key: TEMPORAL_TLS_ENABLED
        value: "true"
      - key: TEMPORAL_API_KEY
        sync: false
      - key: HOSTED_WEB_BASE_URL
        sync: false
      - key: HOSTED_WEB_CALLBACK_SIGNING_KEY_ID
        sync: false
      - key: HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK
        sync: false
      - key: CLOUDFLARE_HOSTED_CONTROL_BASE_URL
        sync: false
      - key: HOSTED_RUNTIME_DEMAND_TIMEOUT_MS
        value: "10000"
      - key: HOSTED_TEMPORAL_ENSURE_EXECUTION_TIMEOUT_MARGIN_MS
        value: "30000"
