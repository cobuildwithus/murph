      <text x="28" y="48" font-family="Georgia,serif" font-size="23" fill="#1a1f16">Use your health data with Murph</text>
      <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#6f6d65">
        <text x="28" y="74">Murph uses health data you add or connect to personalize</text><text x="28" y="96">your experience, including through contracted AI providers.</text>
        <text x="28" y="118">We don’t sell it, use it for ads, or train general-purpose AI</text><text x="28" y="140">models with it.</text>
      </g>
      <g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#1a1f16">
        <text x="28" y="174">Terms</text><text x="78" y="174">Privacy</text><text x="132" y="174">AI Safety</text><text x="199" y="174">Health Data Notice</text>
      </g>
      <rect x="28" y="198" width="402" height="56" rx="16" fill="#5a6e32"/>
      <text x="229" y="233" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="white">Agree, consent &amp; continue</text>
    </g>
    <g transform="translate(488 250)">
