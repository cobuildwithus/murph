    <text x="0" y="76" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6f6d65">Launch consent uses one explicit action with no preselected controls. Optional feature consent keeps</text>
    <text x="0" y="98" font-family="Inter,Arial,sans-serif" font-size="14" fill="#6f6d65">its separate just-in-time flow.</text>
    <line x1="0" y1="148" x2="948" y2="148" stroke="#e5e1d8"/>
