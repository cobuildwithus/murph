    <rect x="446" y="14" width="88" height="36" rx="9" fill="#1a1f16"/><text x="462" y="37" fill="#faf8f4">Consent</text>
    <text x="555" y="37">Sections</text>
  </g>
  <g transform="translate(246 110)">
