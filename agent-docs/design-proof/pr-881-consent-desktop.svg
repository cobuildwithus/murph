    <text x="0" y="232" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="#6f6d65">COMPACT · ONBOARDING DIALOG</text>
    <text x="488" y="232" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="#6f6d65">STANDALONE · LEGAL UPDATE</text>
    <g transform="translate(0 250)">
