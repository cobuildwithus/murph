      <g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#1a1f16"><text x="28" y="130">Terms</text><text x="78" y="130">Privacy</text><text x="132" y="130">AI Safety</text><text x="199" y="130">Health Data Notice</text></g>
      <rect x="28" y="154" width="402" height="56" rx="16" fill="#9eaa82"/><text x="229" y="189" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="white">Saving...</text>
    </g>
    <g transform="translate(488 678)">
      <rect width="458" height="330" rx="16" fill="#faf8f4" stroke="#e5e1d8"/>
      <text x="28" y="48" font-family="Georgia,serif" font-size="23" fill="#1a1f16">Use your health data with Murph</text>
      <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#6f6d65"><text x="28" y="74">Murph uses health data you add or connect to personalize</text><text x="28" y="96">your experience, including through contracted AI providers.</text></g>
      <g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#1a1f16"><text x="28" y="130">Terms</text><text x="78" y="130">Privacy</text><text x="132" y="130">AI Safety</text><text x="199" y="130">Health Data Notice</text></g>
      <rect x="28" y="154" width="402" height="68" rx="12" fill="#fbf3f1" stroke="#e4bdb6"/><text x="44" y="180" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#a33b32">Unable to record consent</text><text x="44" y="202" font-family="Inter,Arial,sans-serif" font-size="13" fill="#a33b32">Could not record consent. Try again.</text>
      <rect x="28" y="246" width="402" height="56" rx="16" fill="#5a6e32"/><text x="229" y="281" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="white">Agree, consent &amp; continue</text>
