      <text x="70" y="47" font-family="Georgia,serif" font-size="23" fill="#1a1f16">Review Murph’s terms</text>
      <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#6f6d65"><text x="70" y="73">We updated the terms and disclosures that govern</text><text x="70" y="95">your use of Murph.</text></g>
      <g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#1a1f16"><text x="70" y="127">Terms</text><text x="120" y="127">Privacy</text><text x="174" y="127">AI Safety</text></g>
      <rect x="70" y="148" width="360" height="56" rx="16" fill="#5a6e32"/><text x="250" y="183" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="white">Agree &amp; continue</text>
