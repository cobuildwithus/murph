<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900">
  <rect width="390" height="900" fill="#f5f0e8"/>
  <rect width="390" height="58" fill="#f5f0e8"/>
  <line x1="0" y1="58" x2="390" y2="58" stroke="#e5e1d8"/>
  <g font-family="Inter,Arial,sans-serif" font-size="13" font-weight="600" fill="#5c5a52">
    <text x="31" y="34">Brand</text><text x="99" y="34">Components</text>
    <rect x="196" y="12" width="78" height="35" rx="9" fill="#1a1f16"/><text x="209" y="34" fill="#faf8f4">Consent</text>
    <text x="292" y="34">Sections</text>
  </g>
  <g transform="translate(20 88)">
    <text x="0" y="36" font-family="Georgia,serif" font-size="36" font-weight="600" fill="#1a1f16">Consent</text>
    <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#6f6d65">
      <text x="0" y="69">One explicit launch action. Optional feature consent</text><text x="0" y="91">stays just in time.</text>
    </g>
    <line x1="0" y1="129" x2="350" y2="129" stroke="#e5e1d8"/>
    <text x="0" y="174" font-family="monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#6f6d65">LAUNCH CONSENT</text>
    <text x="0" y="206" font-family="monospace" font-size="10" font-weight="700" letter-spacing="1.5" fill="#6f6d65">COMPACT · ONBOARDING DIALOG</text>
    <g transform="translate(0 224)">
      <rect width="350" height="352" rx="16" fill="#faf8f4" stroke="#e5e1d8"/>
      <text x="22" y="43" font-family="Georgia,serif" font-size="21" fill="#1a1f16">Use your health data with Murph</text>
      <g font-family="Inter,Arial,sans-serif" font-size="13" fill="#6f6d65">
        <text x="22" y="68">Murph uses health data you add or connect to</text><text x="22" y="89">personalize your experience, including through</text><text x="22" y="110">contracted AI providers. We don’t sell it, use it</text><text x="22" y="131">for ads, or train general-purpose AI models</text><text x="22" y="152">with it.</text>
      </g>
      <g font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#1a1f16"><text x="22" y="187">Terms</text><text x="72" y="187">Privacy</text><text x="126" y="187">AI Safety</text><text x="193" y="187">Health Data Notice</text></g>
      <rect x="22" y="211" width="306" height="54" rx="16" fill="#5a6e32"/><text x="175" y="245" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="white">Agree, consent &amp; continue</text>
      <rect x="22" y="277" width="306" height="54" rx="16" fill="#faf8f4" stroke="#b9b6ad"/><text x="175" y="311" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#1a1f16">Decline</text>
    </g>
  </g>
</svg>
