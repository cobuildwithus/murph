<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .bg { fill: #FAF8F4; }
    .outer { fill: #B5C4A1; fill-opacity: 0.3; }
    .mid { fill: #C4956A; fill-opacity: 0.55; }
    .inner { fill: #A07A4E; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1A1F16; }
      .outer { fill: #5C6B4F; fill-opacity: 0.35; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="16"/>
  <!-- Row 1 -->
  <circle class="outer" cx="20.5" cy="23" r="1.5"/>
  <circle class="mid" cx="28" cy="23" r="2"/>
  <circle class="mid" cx="36" cy="23" r="2"/>
  <circle class="outer" cx="43.5" cy="23" r="1.5"/>
  <!-- Row 2 -->
  <circle class="outer" cx="18.5" cy="32" r="1.5"/>
  <circle class="inner" cx="27" cy="32" r="3"/>
  <circle class="inner" cx="37" cy="32" r="3"/>
  <circle class="outer" cx="45.5" cy="32" r="1.5"/>
  <!-- Row 3 -->
  <circle class="outer" cx="20.5" cy="41" r="1.5"/>
  <circle class="mid" cx="28" cy="41" r="2"/>
  <circle class="mid" cx="36" cy="41" r="2"/>
  <circle class="outer" cx="43.5" cy="41" r="1.5"/>
</svg>
