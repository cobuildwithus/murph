name: PR 1097 Final Main Sync

on:
  pull_request:

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.number == 1097
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            conflicted="$(git diff --name-only --diff-filter=U)"
            if [[ "$conflicted" != "agent-docs/index.md" ]]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$conflicted"
              exit 1
            fi
            git checkout --theirs agent-docs/index.md
            git add agent-docs/index.md
          fi
      - name: Preserve the additive challenge spec index entry
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('agent-docs/index.md')
          lines = path.read_text().splitlines()
          scorecard_path = '`agent-docs/product-specs/group-challenge-formats-and-scorecards.md`'
          if not any(scorecard_path in line for line in lines):
              insert_at = next(
                  index for index, line in enumerate(lines)
                  if '`agent-docs/product-specs/group-challenge-data-diagnostics.md`' in line
              )
              lines.insert(
                  insert_at,
                  '| `agent-docs/product-specs/group-challenge-formats-and-scorecards.md` | Individual, team, and collective challenge formats plus one-to-five model-interpreted additive components with deterministic point arithmetic and aggregation. | Group challenge scorecards | High | 2026-07-29 |',
              )
              path.write_text('\n'.join(lines) + '\n')
          PY
      - name: Commit merge and remove this one-use workflow
        run: |
          rm .github/workflows/pr1097-final-main-sync.yml
          git add -A
          git commit -m "Merge current main into additive group challenges"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
