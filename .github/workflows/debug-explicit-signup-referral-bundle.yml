name: Debug explicit signup referral bundle

on:
  push:
    branches:
      - feat/explicit-signup-referral-links
    paths:
      - .github/workflows/debug-explicit-signup-referral-bundle.yml

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture production runner bundle output
        shell: bash
        run: |
          set +e
          pnpm --dir apps/cloudflare runner:bundle > runner-bundle.log 2>&1
          printf '%s\n' "$?" > runner-bundle.exit-code
          exit 0

      - name: Upload production runner bundle output
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: explicit-signup-referral-runner-bundle-log
          path: |
            runner-bundle.log
            runner-bundle.exit-code
          retention-days: 1

      - name: Preserve bundle result
        shell: bash
        run: exit "$(cat runner-bundle.exit-code)"
