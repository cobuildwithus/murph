name: Apply explicit signup referral runtime fix

on:
  push:
    branches:
      - feat/explicit-signup-referral-links
    paths:
      - .github/workflows/debug-explicit-signup-referral-bundle.yml

permissions:
  contents: write

jobs:
  apply:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: apply signup referral runtime fix') }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Apply exhaustive email-group response handling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("packages/assistant-runtime/src/hosted-runtime/workspace-assistant-phase.ts")
          source = source_path.read_text()
          function_start = source.index(
              "function buildHostedGroupEmailRestrictedActionUnavailable",
          )
          function_end = source.index("\n}\n\n/**", function_start) + 3
          function = source[function_start:function_end]
          case_anchor = '    case "preflight_set_chat_avatar":\n'
          if function.count(case_anchor) != 1:
              raise SystemExit("email-group response case anchor did not match exactly once")
          function = function.replace(
              case_anchor,
              '    case "create_signup_referral_link":\n' + case_anchor,
              1,
          )
          source_path.write_text(
              source[:function_start] + function + source[function_end:],
          )

          test_path = Path("packages/assistant-runtime/test/hosted-runtime-group-tool-linq-context.test.ts")
          test = test_path.read_text()
          old_title = '  it("denies referral actions on group email where the human sender is not authoritative", async () => {'
          new_title = '  it("denies referral and signup-link actions on group email without an authoritative sender", async () => {'
          test_start = test.index(old_title)
          test_end = test.index("\n  it(", test_start + len(old_title))
          block = test[test_start:test_end].replace(old_title, new_title, 1)
          assertion_anchor = "    expect(request).not.toHaveBeenCalled();"
          if block.count(assertion_anchor) != 1:
              raise SystemExit("email-group no-forward assertion did not match exactly once")
          signup_link_assertion = '''    await expect(groupTool.request({
              action: "create_signup_referral_link",
            })).resolves.toEqual({
              action: "create_signup_referral_link",
              result: {
                status: "unavailable",
                unavailableReason: "authenticated_sender_required",
              },
            });
          '''.replace("          ", "")
          block = block.replace(
              assertion_anchor,
              signup_link_assertion + assertion_anchor,
              1,
          )
          test_path.write_text(test[:test_start] + block + test[test_end:])

          Path(".github/workflows/debug-explicit-signup-referral-bundle.yml").unlink()
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/assistant-runtime .github/workflows/debug-explicit-signup-referral-bundle.yml
          git commit -m "fix: handle signup referral links in email group turns"
          git push
