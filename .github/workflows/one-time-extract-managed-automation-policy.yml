name: One-time managed automation test repair source

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - run: |
          node <<'NODE'
          const { spawnSync } = require('node:child_process')

          const python = process.platform === 'win32' ? 'python' : 'python3'
          const result = spawnSync(
            python,
            ['.github/repair-managed-automation-tests.py'],
            { stdio: 'inherit' },
          )
          if (result.error) {
            throw result.error
          }
          if (result.status !== 0) {
            process.exit(result.status ?? 1)
          }
          NODE
