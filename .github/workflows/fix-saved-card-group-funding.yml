name: Fix saved-card group funding typecheck

on:
  pull_request:
    branches:
      - agent/saved-card-funding-verify-runner

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reuse-saved-card-for-group-funding-v2
          fetch-depth: 0
      - name: Correct payment authorization field
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/lib/hosted-onboarding/usage-credit-stripe-financial-reconciliation.ts")
          content = path.read_text()
          old = "    checkoutAuthorization: input.paymentAuthorization,"
          new = "    paymentAuthorization: input.paymentAuthorization,"
          if content.count(old) != 1:
              raise SystemExit(f"expected exactly one stale field, found {content.count(old)}")
          path.write_text(content.replace(old, new))
          PY
          git diff --check
      - name: Commit correction
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add apps/web/src/lib/hosted-onboarding/usage-credit-stripe-financial-reconciliation.ts
          git commit -m "fix: pass direct payment authorization correctly"
          git push origin HEAD:agent/reuse-saved-card-for-group-funding-v2
