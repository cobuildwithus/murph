name: PR 1097 Merge Main

on:
  pull_request:

permissions:
  contents: write

jobs:
  merge:
    if: github.event.pull_request.number == 1097
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Merge current main and remove this one-use workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/pr1097-merge-main.yml
          git add -A
          git commit -m "Merge current main into additive group challenges"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
