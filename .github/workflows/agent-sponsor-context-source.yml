name: Apply sponsor-context WIP

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-wip:
    if: >-
      github.event.pull_request.number == 1420 &&
      github.event.pull_request.head.ref == 'agent/group-funding-supporters' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Rebuild clean WIP branch on current main
        run: |
          set -euo pipefail
          git config user.name "murph-sponsor-context-wip"
          git config user.email "murph-sponsor-context-wip@users.noreply.github.com"
          git fetch --no-tags origin main
          git reset --hard origin/main
          printf '%s' '' | base64 -d > /tmp/sponsor-context.patch.gz
          echo "b9752170be735df8138a9602d17bfe507e75988cfd70aad18658af4c015985b5  /tmp/sponsor-context.patch.gz" | sha256sum -c -
          gzip -dc /tmp/sponsor-context.patch.gz > /tmp/sponsor-context.patch
          git apply --check /tmp/sponsor-context.patch
          git apply /tmp/sponsor-context.patch
          rm -f .github/workflows/agent-sponsor-context-source.yml
          git add --all
          git diff --cached --check
          git commit -m "WIP: add bounded group sponsor context"
          git push --force-with-lease=refs/heads/${HEAD_REF}:${EXPECTED_HEAD} origin HEAD:refs/heads/${HEAD_REF}
