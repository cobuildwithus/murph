name: Agent sponsor-context source export

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-source:
    if: >-
      github.event.pull_request.number == 1420 &&
      github.event.pull_request.head.ref == 'agent/group-funding-supporters' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: main

      - name: Package bounded current-main source set
        run: |
          set -euo pipefail
          mkdir -p /tmp/sponsor-context-source
          cat > /tmp/sponsor-context-source/paths.txt <<'EOF'
          ARCHITECTURE.md
          apps/web/app/design/sections-content.tsx
          apps/web/prisma/schema.prisma
          packages/assistant-engine/src/assistant-codex/dynamic-tools.ts
          EOF
          while IFS= read -r path; do
            mkdir -p "/tmp/sponsor-context-source/files/$(dirname "$path")"
            cp "$path" "/tmp/sponsor-context-source/files/$path"
          done < /tmp/sponsor-context-source/paths.txt
          git rev-parse HEAD > /tmp/sponsor-context-source/main-head.txt
          git rev-parse HEAD^{tree} > /tmp/sponsor-context-source/main-tree.txt
          tar -C /tmp/sponsor-context-source -czf /tmp/sponsor-context-source.tar.gz .

      - name: Upload source bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sponsor-context-source
          path: /tmp/sponsor-context-source.tar.gz
          if-no-files-found: error
          retention-days: 2
