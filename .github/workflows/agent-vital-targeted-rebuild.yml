name: Agent Vital Targeted Rebuild

on:
  push:
    branches:
      - agent/explain-vital-garmin-handoff
    paths:
      - .github/workflows/agent-vital-targeted-rebuild.yml

concurrency:
  group: agent-vital-targeted-rebuild
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Apply only the intended feature hunks to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one {label} match in {path}, found {count}")
              path.write_text(text.replace(old, new, 1))

          def replace_test(path: Path, name: str, replacement: str) -> None:
              text = path.read_text()
              start = text.index(f'test("{name}"')
              next_test = text.find('\n\ntest("', start + 1)
              if next_test < 0:
                  raise SystemExit(f"Could not find the end of test: {name}")
              path.write_text(text[:start] + replacement + text[next_test:])

          types_path = Path("apps/web/app/(dashboard)/connect/connect-page-types.ts")
          replace_once(
              types_path,
              "  requiresReconnect?: boolean;\n",
              "  requiresReconnect?: boolean;\n  requiresVitalDisclosure?: boolean;\n",
              "ConnectSource disclosure field",
          )

          content_path = Path("apps/web/app/(dashboard)/connect/connect-page-content.tsx")
          replace_once(
              content_path,
              '''  const connectTargetBySourceId = new Map(
                listConfiguredDeviceSyncConnectTargets(
                  readConfiguredDeviceSyncConnectTargetConfigs(process.env),
                ).map((target) => [target.connectSourceId, target.connectTarget] as const),
              );'''.replace("              ", ""),
              '''  const connectConfigBySourceId = new Map(
                listConfiguredDeviceSyncConnectTargets(
                  readConfiguredDeviceSyncConnectTargetConfigs(process.env),
                ).map((target) => [target.connectSourceId, target] as const),
              );'''.replace("              ", ""),
              "connect configuration map",
          )
          replace_once(
              content_path,
              "      const connectTarget = connectTargetBySourceId.get(source.id);",
              "      const connectConfig = connectConfigBySourceId.get(source.id);",
              "source connect configuration lookup",
          )
          replace_once(
              content_path,
              '''      const resolvedConnectTarget = connectionAvailable
                ? reconnectTarget ?? connectTarget
                : undefined;'''.replace("                ", "        "),
              '''      const resolvedConnectTarget = connectionAvailable
                ? reconnectTarget ?? connectConfig?.connectTarget
                : undefined;
              const requiresVitalDisclosure = connectionAvailable
                && (reconnectProvider ?? connectConfig?.provider) === "junction";'''.replace("              ", "      ").replace("                ", "        "),
              "resolved connect target",
          )
          replace_once(
              content_path,
              "        ...(requiresReconnect ? { requiresReconnect } : {}),\n",
              '''        ...(requiresReconnect ? { requiresReconnect } : {}),
              ...(requiresVitalDisclosure || source.id === "garmin"
                ? { requiresVitalDisclosure }
                : {}),
              '''.replace("              ", ""),
              "disclosure projection",
          )

          dialogs_path = Path("apps/web/app/(dashboard)/connect/connect-page-dialogs.tsx")
          dialogs = dialogs_path.read_text()
          pattern = re.compile(
              r'export function GarminHistoricalDataDialog\(\{.*?\n\}\n\nexport function ConnectDisconnectDialog',
              re.S,
          )
          replacement = '''export function VitalConnectionDialog({
            onContinue,
            onOpenChange,
            source,
            voiceMemoSrc,
          }: {
            onContinue: () => void;
            onOpenChange: (open: boolean) => void;
            source: Pick<ConnectSource, "id" | "name" | "requiresReconnect"> | null;
            voiceMemoSrc?: string | null;
          }) {
            const sourceName = source?.name ?? "your health source";
            const showGarminHistoricalData =
              source?.id === "garmin" && source.requiresReconnect !== true;

            return (
              <Dialog open={Boolean(source)} onOpenChange={onOpenChange}>
                <DialogContent className="gap-5 p-6 sm:max-w-md md:p-7">
                  <DialogHeader className="pr-10">
                    <span className="font-mono text-[10px] font-medium uppercase tracking-[0.11em] text-muted-foreground">
                      {sourceName}
                    </span>
                    <DialogTitle className="font-serif text-2xl font-semibold tracking-normal text-foreground">
                      Vital connects {sourceName} to Murph
                    </DialogTitle>
                    <DialogDescription className="leading-6">
                      The next authorization screen may show Vital instead of Murph. That is expected.
                    </DialogDescription>
                  </DialogHeader>

                  <div className="space-y-3 text-sm leading-6 text-muted-foreground">
                    <p>
                      Vital is Murph&apos;s health-sync provider. It processes the data you approve to
                      operate this connection and sync it to Murph; it is not a separate health
                      assistant using your data.
                    </p>
                    <p>
                      Murph does not authorize Vital to sell this data, use it for advertising,
                      train models on it, or use it for unrelated purposes. You can disconnect
                      {` ${sourceName}`} at any time.
                    </p>
                  </div>

                  {showGarminHistoricalData ? (
                    <>
                      <div className="border-t border-border pt-3 text-sm leading-6 text-muted-foreground">
                        <p className="font-medium text-foreground">Turn on Historical Data</p>
                        <p className="mt-1">
                          When Garmin opens, turn on Historical Data before approving.
                        </p>
                      </div>

                      <VoiceMemoPlayer
                        accessibleLabel="Garmin Historical Data reminder"
                        src={voiceMemoSrc ?? DEFAULT_GARMIN_HISTORICAL_DATA_VOICE_MEMO_SRC}
                        bars={24}
                        preload="metadata"
                        containerClassName="rounded-lg bg-background px-3 py-2 ring-1 ring-border"
                        accentClassName="bg-primary"
                        fillClassName="bg-primary"
                        trackClassName="bg-primary/20"
                      />
                    </>
                  ) : null}

                  <div className="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
                    <Button
                      type="button"
                      size="lg"
                      variant="ghost"
                      onClick={() => onOpenChange(false)}
                    >
                      Cancel
                    </Button>
                    <Button type="button" size="lg" onClick={onContinue}>
                      Continue to {sourceName}
                    </Button>
                  </div>
                </DialogContent>
              </Dialog>
            );
          }

          export function ConnectDisconnectDialog'''.replace("          ", "")
          dialogs, count = pattern.subn(replacement, dialogs, count=1)
          if count != 1:
              raise SystemExit("Could not replace the Garmin preflight dialog")
          dialogs_path.write_text(dialogs)

          client_path = Path("apps/web/app/(dashboard)/connect/connect-page-client.tsx")
          client = client_path.read_text()
          for old, new in [
              ("GarminHistoricalDataDialog", "VitalConnectionDialog"),
              ("garminHistoricalDataConfirmed", "vitalDisclosureConfirmed"),
              ("GarminHistoricalDataRequest", "VitalConnectionRequest"),
              ("garminHistoricalDataRequest", "vitalConnectionRequest"),
              ("setGarminHistoricalDataRequest", "setVitalConnectionRequest"),
              ("requiresGarminHistoricalDataPreflight", "requiresVitalConnectionPreflight"),
          ]:
              if old not in client:
                  raise SystemExit(f"Could not rename {old}")
              client = client.replace(old, new)
          if client.count('        open={Boolean(vitalConnectionRequest)}') != 1:
              raise SystemExit("Could not update the generalized dialog props")
          client = client.replace(
              '        open={Boolean(vitalConnectionRequest)}',
              '        source={vitalConnectionRequest?.source ?? null}',
              1,
          )
          old_predicate = '''export function requiresVitalConnectionPreflight(source: ConnectSource): boolean {
            return source.id === "garmin" && source.requiresReconnect !== true;
          }'''.replace("          ", "")
          new_predicate = '''export function requiresVitalConnectionPreflight(source: ConnectSource): boolean {
            return source.requiresVitalDisclosure
              ?? (source.id === "garmin" && source.requiresReconnect !== true);
          }'''.replace("          ", "")
          if client.count(old_predicate) != 1:
              raise SystemExit("Could not replace the disclosure predicate")
          client_path.write_text(client.replace(old_predicate, new_predicate, 1))

          design_path = Path("apps/web/app/design/components-content.tsx")
          design = design_path.read_text()
          design = design.replace(
              'import { GarminHistoricalDataDialog } from "../(dashboard)/connect/connect-page-dialogs";',
              'import { VitalConnectionDialog } from "../(dashboard)/connect/connect-page-dialogs";',
              1,
          )
          old_state = "  const [garminHistoricalDataDialogOpen, setGarminHistoricalDataDialogOpen] = useState(false);"
          new_state = '''  const [vitalConnectionDialogSource, setVitalConnectionDialogSource] =
            useState<Pick<ConnectSource, "id" | "name"> | null>(null);'''.replace("            ", "    ")
          if design.count(old_state) != 1:
              raise SystemExit("Could not replace the design-catalog state")
          design = design.replace(old_state, new_state, 1)
          section_pattern = re.compile(
              r'        <Section title="Garmin Historical Data Preflight">.*?        </Section>',
              re.S,
          )
          section = '''        <Section title="Vital-backed health source handoff">
            <div className="flex flex-col items-start gap-3">
              <p className="max-w-2xl text-sm leading-6 text-muted-foreground">
                Reusable trust handoff shown before every Vital-backed authorization. It explains
                Vital&apos;s limited health-sync role and keeps Garmin&apos;s Historical Data reminder
                inside the same dialog.
              </p>
              <div className="flex flex-wrap gap-2">
                <Button
                  onClick={() => setVitalConnectionDialogSource({ id: "fitbit", name: "Fitbit" })}
                >
                  Preview standard handoff
                </Button>
                <Button
                  variant="outline"
                  onClick={() => setVitalConnectionDialogSource({ id: "garmin", name: "Garmin" })}
                >
                  Preview Garmin handoff
                </Button>
              </div>
            </div>
            <VitalConnectionDialog
              source={vitalConnectionDialogSource}
              onContinue={() => setVitalConnectionDialogSource(null)}
              onOpenChange={(open) => {
                if (!open) {
                  setVitalConnectionDialogSource(null);
                }
              }}
            />
          </Section>'''
          design, count = section_pattern.subn(section, design, count=1)
          if count != 1:
              raise SystemExit("Could not replace the design-catalog section")
          design_path.write_text(design)

          test_path = Path("apps/web/test/connect-page.test.ts")
          mapped_test = '''test("ConnectSourcesGrid posts mapped Junction connect targets", async () => {
            vi.stubEnv("JUNCTION_API_KEY", "sk_us_junction-test");
            vi.stubEnv("JUNCTION_CLIENT_USER_ID_SECRET", "junction-client-user-id-secret");
            vi.stubEnv("JUNCTION_ENV", "sandbox");
            vi.stubEnv("JUNCTION_PROVIDER_FILTER", "dexcom_v3");
            vi.stubEnv("JUNCTION_REGION", "us");

            const fetch = vi.fn(async (
              _input: RequestInfo | URL,
              _init?: RequestInit,
            ) => {
              void _input;
              void _init;
              return Response.json({
                authorizationUrl: "https://junction.example.test/link/dexcom-v3",
              });
            });
            vi.stubGlobal("fetch", fetch);

            const { resolveConfiguredConnectSources } = await import(
              "../app/(dashboard)/connect/connect-page-content"
            );
            const { ConnectSourcesGrid } = await import(
              "../app/(dashboard)/connect/connect-page-client"
            );
            const logo = { className: "size-11 object-contain", height: 44, src: "/logo.png", width: 44 };
            const [source] = resolveConfiguredConnectSources([
              {
                id: "dexcom",
                name: "Dexcom",
                description: "Current Dexcom.",
                logo,
              },
            ]);
            assert.ok(source);
            assert.equal(source.connectTarget, "dexcom_v3");
            assert.equal(source.requiresVitalDisclosure, true);

            const rendered = await renderClientComponent(createElement(ConnectSourcesGrid, {
              sources: [source],
            }));

            await act(async () => {
              rendered.button.dispatchEvent(new rendered.window.Event("click", { bubbles: true }));
            });

            assert.equal(fetch.mock.calls.length, 0);
            assert.match(rendered.container.textContent ?? "", /Vital connects Dexcom to Murph/u);

            const continueButton = [...rendered.container.querySelectorAll("button")]
              .find((button) => button.textContent === "Continue to Dexcom");
            assert.ok(continueButton instanceof rendered.window.HTMLButtonElement);
            await act(async () => {
              continueButton.dispatchEvent(new rendered.window.Event("click", { bubbles: true }));
            });

            await vi.waitFor(() => {
              assert.equal(fetch.mock.calls.length, 1);
            });
            assert.equal(fetch.mock.calls[0]?.[0], "/api/connect-sources/dexcom/start");
            assert.deepEqual(fetch.mock.calls[0]?.[1], {
              body: JSON.stringify({ connectTarget: "dexcom_v3" }),
              cache: "no-store",
              credentials: "same-origin",
              headers: {
                "content-type": "application/json",
              },
              method: "POST",
              keepalive: false,
            });
            assert.equal(
              rendered.assign.mock.calls[0]?.[0],
              "https://junction.example.test/link/dexcom-v3",
            );

            await rendered.cleanup();
          });'''.replace("          ", "")
          replace_test(
              test_path,
              "ConnectSourcesGrid posts mapped Junction connect targets",
              mapped_test,
          )

          tests = test_path.read_text()
          helper_marker = "\nfunction readSupportMailto"
          if tests.count(helper_marker) != 1:
              raise SystemExit("Could not locate the connect-page test helper boundary")
          added_tests = '''

          test("resolveConfiguredConnectSources marks Vital-backed actions", async () => {
            vi.stubEnv("WHOOP_CLIENT_ID", "whoop-client-id");
            vi.stubEnv("WHOOP_CLIENT_SECRET", "whoop-client-secret");
            vi.stubEnv("JUNCTION_API_KEY", "sk_us_junction-test");
            vi.stubEnv("JUNCTION_CLIENT_USER_ID_SECRET", "junction-client-user-id-secret");
            vi.stubEnv("JUNCTION_ENV", "sandbox");
            vi.stubEnv("JUNCTION_PROVIDER_FILTER", "fitbit");
            vi.stubEnv("JUNCTION_REGION", "us");

            const { resolveConfiguredConnectSources } = await import(
              "../app/(dashboard)/connect/connect-page-content"
            );
            const logo = { className: "size-11 object-contain", height: 44, src: "/logo.png", width: 44 };
            const resolved = resolveConfiguredConnectSources([
              { id: "whoop", name: "Whoop", description: "Recovery.", logo },
              { id: "fitbit", name: "Fitbit", description: "Activity.", logo },
            ]);

            assert.deepEqual(
              Object.fromEntries(
                resolved.map((source) => [source.id, source.requiresVitalDisclosure === true]),
              ),
              { fitbit: true, whoop: false },
            );
          });

          test("ConnectSourcesGrid explains Vital before a Vital-backed authorization", async () => {
            const fetch = vi.fn(async (
              _input: RequestInfo | URL,
              _init?: RequestInit,
            ) => Response.json({
              authorizationUrl: "https://junction.example.test/link/fitbit",
            }));
            vi.stubGlobal("fetch", fetch);

            const { ConnectSourcesGrid } = await import(
              "../app/(dashboard)/connect/connect-page-client"
            );
            const rendered = await renderClientComponent(createElement(ConnectSourcesGrid, {
              sources: [
                {
                  connectTarget: "fitbit",
                  description: "Sleep, activity, heart rate, and daily readiness.",
                  id: "fitbit",
                  logo: {
                    className: "size-11 object-contain",
                    height: 44,
                    src: "/brand-logos/connect/fitbit.svg",
                    width: 44,
                  },
                  name: "Fitbit",
                  requiresVitalDisclosure: true,
                },
              ],
            }));

            const connectButton = rendered.container.querySelector(
              "button[aria-label='Connect Fitbit']",
            );
            assert.ok(connectButton instanceof rendered.window.HTMLButtonElement);
            await act(async () => {
              connectButton.dispatchEvent(new rendered.window.Event("click", { bubbles: true }));
            });

            assert.equal(fetch.mock.calls.length, 0);
            assert.match(rendered.container.textContent ?? "", /Vital connects Fitbit to Murph/u);
            assert.match(rendered.container.textContent ?? "", /health-sync provider/u);
            assert.match(rendered.container.textContent ?? "", /does not authorize Vital to sell/u);
            assert.match(rendered.container.textContent ?? "", /train models on it/u);
            assert.doesNotMatch(rendered.container.textContent ?? "", /Turn on Historical Data/u);
            assert.equal(rendered.container.querySelector("audio"), null);

            const continueButton = [...rendered.container.querySelectorAll("button")]
              .find((button) => button.textContent === "Continue to Fitbit");
            assert.ok(continueButton instanceof rendered.window.HTMLButtonElement);
            await act(async () => {
              continueButton.dispatchEvent(new rendered.window.Event("click", { bubbles: true }));
            });

            await vi.waitFor(() => {
              assert.equal(fetch.mock.calls.length, 1);
              assert.equal(
                rendered.assign.mock.calls[0]?.[0],
                "https://junction.example.test/link/fitbit",
              );
            });
            assert.equal(fetch.mock.calls[0]?.[0], "/api/connect-sources/fitbit/start");

            await rendered.cleanup();
          });

          test("ConnectSourcesGrid keeps a direct integration one-click", async () => {
            const fetch = vi.fn(async (
              _input: RequestInfo | URL,
              _init?: RequestInit,
            ) => Response.json({
              authorizationUrl: "https://whoop.example.test/oauth",
            }));
            vi.stubGlobal("fetch", fetch);

            const { ConnectSourcesGrid } = await import(
              "../app/(dashboard)/connect/connect-page-client"
            );
            const rendered = await renderClientComponent(createElement(ConnectSourcesGrid, {
              sources: [
                {
                  connectTarget: "whoop",
                  description: "Recovery, strain, sleep, and heart rate.",
                  id: "whoop",
                  logo: {
                    className: "size-11 object-contain",
                    height: 44,
                    src: "/brand-logos/connect/whoop.svg",
                    width: 44,
                  },
                  name: "Whoop",
                },
              ],
            }));

            const connectButton = rendered.container.querySelector(
              "button[aria-label='Connect Whoop']",
            );
            assert.ok(connectButton instanceof rendered.window.HTMLButtonElement);
            await act(async () => {
              connectButton.dispatchEvent(new rendered.window.Event("click", { bubbles: true }));
            });

            await vi.waitFor(() => {
              assert.equal(fetch.mock.calls.length, 1);
              assert.equal(rendered.assign.mock.calls[0]?.[0], "https://whoop.example.test/oauth");
            });
            assert.doesNotMatch(rendered.container.textContent ?? "", /Vital connects/u);

            await rendered.cleanup();
          });

          test("Vital disclosure honors an explicit direct-provider decision for Garmin", async () => {
            const { requiresVitalConnectionPreflight } = await import(
              "../app/(dashboard)/connect/connect-page-client"
            );
            const logo = { className: "size-11 object-contain", height: 44, src: "/logo.png", width: 44 };

            assert.equal(requiresVitalConnectionPreflight({
              description: "Garmin.",
              id: "garmin",
              logo,
              name: "Garmin",
              requiresVitalDisclosure: false,
            }), false);
            assert.equal(requiresVitalConnectionPreflight({
              description: "Garmin.",
              id: "garmin",
              logo,
              name: "Garmin",
            }), true);
          });
          '''.replace("          ", "")
          test_path.write_text(tests.replace(helper_marker, added_tests + helper_marker, 1))

          Path("apps/web/test/vital-connection-dialog.test.tsx").write_text('''import assert from "node:assert/strict";
          import type { HTMLAttributes, ReactNode } from "react";
          import { createElement } from "react";
          import { renderToStaticMarkup } from "react-dom/server";
          import { test, vi } from "vitest";

          vi.mock("@/src/components/ui/button", () => ({
            Button: ({ children }: { children?: ReactNode }) => createElement("button", null, children),
            buttonVariants: () => "",
          }));

          vi.mock("@/src/components/ui/dialog", () => ({
            Dialog: ({ children, open }: { children?: ReactNode; open: boolean }) =>
              open ? createElement("div", null, children) : null,
            DialogContent: ({ children, ...props }: HTMLAttributes<HTMLDivElement>) =>
              createElement("div", props, children),
            DialogDescription: ({ children, ...props }: HTMLAttributes<HTMLParagraphElement>) =>
              createElement("p", props, children),
            DialogHeader: ({ children, ...props }: HTMLAttributes<HTMLDivElement>) =>
              createElement("div", props, children),
            DialogTitle: ({ children, ...props }: HTMLAttributes<HTMLHeadingElement>) =>
              createElement("h2", props, children),
          }));

          vi.mock("@/src/components/ui/voice-memo-player", () => ({
            VoiceMemoPlayer: ({ accessibleLabel, src }: { accessibleLabel: string; src: string }) =>
              createElement("div", { "aria-label": accessibleLabel, "data-src": src }),
          }));

          test("Vital handoff explains the processor boundary for a standard source", async () => {
            const { VitalConnectionDialog } = await import(
              "../app/(dashboard)/connect/connect-page-dialogs"
            );
            const markup = renderToStaticMarkup(createElement(VitalConnectionDialog, {
              onContinue: vi.fn(),
              onOpenChange: vi.fn(),
              source: { id: "fitbit", name: "Fitbit" },
            }));

            assert.match(markup, /Vital connects Fitbit to Murph/u);
            assert.match(markup, /may show Vital instead of Murph/u);
            assert.match(markup, /health-sync provider/u);
            assert.match(markup, /does not authorize Vital to sell this data/u);
            assert.match(markup, /train models on it/u);
            assert.match(markup, /disconnect Fitbit at any time/u);
            assert.match(markup, />Continue to Fitbit<\\/button>/u);
            assert.doesNotMatch(markup, /Turn on Historical Data/u);
          });

          test("Vital handoff keeps Garmin's first-connect Historical Data reminder", async () => {
            const { VitalConnectionDialog } = await import(
              "../app/(dashboard)/connect/connect-page-dialogs"
            );
            const markup = renderToStaticMarkup(createElement(VitalConnectionDialog, {
              onContinue: vi.fn(),
              onOpenChange: vi.fn(),
              source: { id: "garmin", name: "Garmin" },
              voiceMemoSrc: "/test/garmin-history.mp3",
            }));

            assert.match(markup, /Vital connects Garmin to Murph/u);
            assert.match(markup, /Turn on Historical Data/u);
            assert.match(markup, /When Garmin opens, turn on Historical Data before approving/u);
            assert.match(markup, /data-src="\\/test\\/garmin-history\.mp3"/u);
            assert.match(markup, />Continue to Garmin<\\/button>/u);
          });

          test("Vital handoff omits Garmin's Historical Data reminder during reconnect", async () => {
            const { VitalConnectionDialog } = await import(
              "../app/(dashboard)/connect/connect-page-dialogs"
            );
            const markup = renderToStaticMarkup(createElement(VitalConnectionDialog, {
              onContinue: vi.fn(),
              onOpenChange: vi.fn(),
              source: { id: "garmin", name: "Garmin", requiresReconnect: true },
            }));

            assert.match(markup, /Vital connects Garmin to Murph/u);
            assert.doesNotMatch(markup, /Turn on Historical Data/u);
            assert.doesNotMatch(markup, /Garmin Historical Data reminder/u);
          });
          '''.replace("          ", ""))
          PY

          git diff --check
          python - <<'PY'
          import subprocess

          output = subprocess.check_output(
              ["git", "diff", "--numstat", "origin/main"],
              text=True,
          )
          added = deleted = 0
          for line in output.splitlines():
              left, right, _path = line.split("\t", 2)
              if left.isdigit():
                  added += int(left)
              if right.isdigit():
                  deleted += int(right)
          print(f"targeted diff: +{added} -{deleted}")
          if added + deleted > 700:
              raise SystemExit(f"Targeted diff is disproportionate: +{added} -{deleted}")
          PY
          git diff --stat origin/main

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate required artifacts
        run: |
          pnpm health-commons:generate
          pnpm --dir apps/web prisma:generate

      - name: Run focused Web tests
        run: >-
          pnpm exec vitest run
          --config apps/web/vitest.workspace.ts
          --no-coverage
          apps/web/test/connect-page.test.ts
          apps/web/test/vital-connection-dialog.test.tsx

      - name: Typecheck hosted Web
        run: pnpm --dir apps/web typecheck:prepared

      - name: Install Playwright Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Render the standard and Garmin variants
        shell: bash
        run: |
          mkdir -p apps/web/.agent-vital-targeted
          cat > apps/web/agent-vital-targeted.config.ts <<'TS'
          import { defineConfig, devices } from "@playwright/test";
          import baseConfig from "./playwright.config";

          export default defineConfig(baseConfig, {
            fullyParallel: false,
            projects: [
              {
                name: "desktop",
                use: {
                  ...devices["Desktop Chrome"],
                  deviceScaleFactor: 2,
                  viewport: { height: 1000, width: 1440 },
                },
              },
              {
                name: "mobile",
                use: {
                  ...devices["Desktop Chrome"],
                  deviceScaleFactor: 2,
                  isMobile: true,
                  viewport: { height: 780, width: 390 },
                },
              },
            ],
            reporter: [["list"]],
            retries: 0,
            testDir: "./.agent-vital-targeted",
            workers: 1,
          });
          TS
          cat > apps/web/.agent-vital-targeted/vital-handoff.spec.ts <<'TS'
          import { expect, test } from "@playwright/test";

          for (const variant of ["standard", "garmin"] as const) {
            test(`renders the ${variant} Vital handoff`, async ({ page }) => {
              await page.goto("/design?tab=components");
              const buttonName = variant === "standard"
                ? "Preview standard handoff"
                : "Preview Garmin handoff";
              const preview = page.getByRole("button", { name: buttonName });
              await preview.scrollIntoViewIfNeeded();
              await preview.click();

              const dialog = page.getByRole("dialog");
              await expect(dialog).toBeVisible();
              await expect(dialog).toContainText("Vital connects");
              await expect(dialog).toContainText("health-sync provider");
              await expect(dialog).toContainText("train models on it");
              if (variant === "garmin") {
                await expect(dialog).toContainText("Turn on Historical Data");
              } else {
                await expect(dialog).not.toContainText("Turn on Historical Data");
              }
            });
          }
          TS
          pnpm --dir apps/web exec playwright test --config agent-vital-targeted.config.ts

      - name: Commit and replace the branch with one clean commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            'apps/web/app/(dashboard)/connect/connect-page-client.tsx' \
            'apps/web/app/(dashboard)/connect/connect-page-content.tsx' \
            'apps/web/app/(dashboard)/connect/connect-page-dialogs.tsx' \
            'apps/web/app/(dashboard)/connect/connect-page-types.ts' \
            apps/web/app/design/components-content.tsx \
            apps/web/test/connect-page.test.ts \
            apps/web/test/vital-connection-dialog.test.tsx
          git commit -m "Explain Vital before health-source connections"
          git push \
            --force-with-lease=refs/heads/agent/explain-vital-garmin-handoff:${GITHUB_SHA} \
            origin HEAD:agent/explain-vital-garmin-handoff
