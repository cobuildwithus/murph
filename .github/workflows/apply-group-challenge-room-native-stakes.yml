name: Apply group challenge room-native stakes patch

on:
  push:
    branches:
      - agent/group-challenge-room-native-stakes

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/task-patches/group-challenge-room-native-stakes.part-* > /tmp/change.patch
          echo "0165e618dfb72b24731bc76d8554eeba75443db043f1f16953a0ff89ae44af43  /tmp/change.patch" | sha256sum -c -
          git apply --check /tmp/change.patch
          git apply /tmp/change.patch
          rm -rf .github/task-patches
          rm -f .github/workflows/apply-group-challenge-room-native-stakes.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No source changes were produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(assistant): make group challenge setup room-native"
          git push origin HEAD:agent/group-challenge-room-native-stakes
