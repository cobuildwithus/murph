name: Agent apply Linq unknown-group signup recovery

on:
  workflow_dispatch:
  push:
    branches:
      - agent/linq-unknown-group-signup-recovery
    paths:
      - scripts/agent-apply-linq-unknown-group-signup-recovery.mjs
      - .github/workflows/agent-apply-linq-unknown-group-signup-recovery.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/linq-unknown-group-signup-recovery
          fetch-depth: 0

      - name: Apply asserted patch
        run: node scripts/agent-apply-linq-unknown-group-signup-recovery.mjs

      - name: Remove one-shot patch machinery
        run: |
          rm scripts/agent-apply-linq-unknown-group-signup-recovery.mjs
          rm .github/workflows/agent-apply-linq-unknown-group-signup-recovery.yml
          git diff --check

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): recover unknown Linq groups through signup"
          git push origin HEAD:agent/linq-unknown-group-signup-recovery

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format touched files
        run: |
          pnpm exec prettier --write \
            apps/web/app/api/groups/start/recover/route.ts \
            apps/web/app/groups/start/page.tsx \
            apps/web/src/components/hosted-groups/group-start-client.tsx \
            apps/web/src/lib/hosted-onboarding/linq-group-setup.ts \
            apps/web/src/lib/hosted-onboarding/webhook-provider-linq-shared.ts \
            apps/web/src/lib/hosted-onboarding/webhook-provider-linq.ts \
            apps/web/src/lib/hosted-onboarding/webhook-transport.ts \
            apps/web/test/hosted-linq-group-setup.test.ts \
            apps/web/test/hosted-onboarding-linq-thread-route.test.ts \
            agent-docs/exec-plans/completed/2026-07-31-unknown-linq-group-setup-recovery.md
          git diff --check
          if ! git diff --quiet; then
            git add -A
            git commit -m "style(web): format Linq group recovery"
            git push origin HEAD:agent/linq-unknown-group-signup-recovery
          fi

      - name: Focused tests
        run: |
          pnpm --dir apps/web exec vitest run \
            --config vitest.workspace.ts \
            --no-coverage \
            test/hosted-linq-group-setup.test.ts \
            test/hosted-onboarding-linq-thread-route.test.ts

      - name: Typecheck
        run: pnpm --dir apps/web typecheck
