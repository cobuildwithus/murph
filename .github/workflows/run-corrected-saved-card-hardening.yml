name: Run corrected saved-card hardening

on:
  pull_request:
    branches:
      - agent/saved-card-funding-verify-runner

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reuse-saved-card-for-group-funding-v2
          fetch-depth: 0
      - name: Apply corrected hardening patch
        run: |
          git fetch origin agent/saved-card-funding-verify-runner
          git show origin/agent/saved-card-funding-verify-runner:agent-scripts/run-harden-saved-card.py > /tmp/run-harden-saved-card.py
          python /tmp/run-harden-saved-card.py
          git diff --check
      - name: Commit hardening
        run: |
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add apps/web/src/lib/hosted-onboarding/usage-credit-saved-card-payment.ts \
            apps/web/test/hosted-usage-credit-purchase-service.test.ts
          git commit -m "fix: bind saved-card intents before confirmation"
          git push origin HEAD:agent/reuse-saved-card-for-group-funding-v2
