name: Agent finalize Linq unknown-group recovery

on:
  workflow_dispatch:
  pull_request:
    types:
      - ready_for_review

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/linq-unknown-group-signup-recovery
          fetch-depth: 0

      - name: Apply asserted final implementation
        run: python scripts/agent-run-linq-unknown-group-finalization.py

      - name: Remove one-shot machinery
        run: |
          rm scripts/agent-refine-linq-unknown-group-recovery.mjs
          rm scripts/agent-finalize-linq-unknown-group-recovery.py
          rm scripts/agent-run-linq-unknown-group-finalization.py
          rm .github/workflows/agent-refine-linq-unknown-group-recovery.yml

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and validate the scoped diff
        run: |
          pnpm --dir apps/web exec eslint --fix \
            app/api/groups/start/recover/route.ts \
            app/design/group-start-study.tsx \
            app/design/sections-content.tsx \
            app/groups/start/page.tsx \
            src/components/hosted-groups/group-start-client.tsx \
            src/components/hosted-groups/group-start-frame.tsx \
            src/components/hosted-onboarding/join-invite-auto-trial-island.tsx \
            src/components/hosted-onboarding/join-invite-islands.tsx \
            src/components/hosted-onboarding/join-invite-success-client.tsx \
            src/lib/hosted-groups/group-start-handoff.ts \
            src/lib/hosted-onboarding/hosted-member-routing-store.ts \
            src/lib/hosted-onboarding/linq-group-setup.ts \
            src/lib/hosted-onboarding/webhook-provider-linq-shared.ts \
            src/lib/hosted-onboarding/webhook-provider-linq.ts \
            src/lib/hosted-onboarding/webhook-transport.ts \
            test/hosted-group-start-handoff.test.ts \
            test/hosted-group-start-recovery-route.test.ts \
            test/hosted-linq-group-setup.test.ts \
            test/hosted-member-routing-pending-group.test.ts \
            test/hosted-onboarding-linq-thread-route.test.ts \
            test/hosted-onboarding-linq-transport.test.ts
          git diff --check

      - name: Focused tests
        run: |
          pnpm --dir apps/web exec vitest run \
            --config vitest.workspace.ts \
            --no-coverage \
            test/hosted-group-start-handoff.test.ts \
            test/hosted-group-start-recovery-route.test.ts \
            test/hosted-linq-group-setup.test.ts \
            test/hosted-member-routing-pending-group.test.ts \
            test/hosted-onboarding-linq-thread-route.test.ts \
            test/hosted-onboarding-linq-transport.test.ts \
            test/join-invite-islands.test.ts \
            test/join-invite-success-client.test.ts

      - name: Typecheck
        run: pnpm --dir apps/web typecheck

      - name: Commit verified finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(web): finalize unknown-group signup recovery"
          git push origin HEAD:agent/linq-unknown-group-signup-recovery
