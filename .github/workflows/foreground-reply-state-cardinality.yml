name: Foreground Reply State Cardinality

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Durable contract: agent-docs/references/README.md#foreground-reply-state-cardinality
jobs:
  markdown-docs-scope:
    name: Classify cardinality documentation scope
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      markdown_only: ${{ steps.scope-result.outputs.markdown_only }}
    steps:
      - name: Check out trusted base classifier
        id: checkout-base
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci-markdown-docs-scope.mjs
          sparse-checkout-cone-mode: false

      - name: Run trusted exact-PR classifier
        id: classify
        if: ${{ steps.checkout-base.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          if [[ ! -f scripts/ci-markdown-docs-scope.mjs ]]; then
            echo "markdown_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/ci-markdown-docs-scope.mjs

      - name: Publish fail-closed scope result
        id: scope-result
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout-base.outcome }}
          CLASSIFIER_OUTCOME: ${{ steps.classify.outcome }}
          CLASSIFIER_MARKDOWN_ONLY: ${{ steps.classify.outputs.markdown_only }}
        shell: bash
        run: |
          set -euo pipefail
          markdown_only=false
          if [[ "$CHECKOUT_OUTCOME" == "success" && "$CLASSIFIER_OUTCOME" == "success" && "$CLASSIFIER_MARKDOWN_ONLY" == "true" ]]; then
            markdown_only=true
          fi
          echo "markdown_only=$markdown_only" >> "$GITHUB_OUTPUT"
          echo "Cardinality scope classified with trusted base policy: markdown_only=$markdown_only"

  bounded-work:
    name: Foreground reply state cardinality
    needs: markdown-docs-scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MURPH_TEST_STATE_CARDINALITY: "1"
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - name: Record Markdown documentation receipt
        if: ${{ github.event_name == 'pull_request' && needs.markdown-docs-scope.result == 'success' && needs.markdown-docs-scope.outputs.markdown_only == 'true' }}
        run: echo "Foreground reply state cardinality satisfied by exact-inventory Markdown documentation proof."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Require state-cardinality gate mode
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        run: test "$MURPH_TEST_STATE_CARDINALITY" = "1"

      - name: Verify state-cardinality meter
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        run: >-
          pnpm --dir packages/assistant-engine exec vitest run
          --config vitest.config.ts
          --no-coverage
          test/state-cardinality-harness.test.ts

      - name: Run foreground state-cardinality probes
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        shell: bash
        run: |
          set +e
          status=0
          mapfile -t package_dirs < <(
            find packages apps -type f -path '*/test/*-state-cardinality.test.ts' -print \
              | sed 's#/test/.*##' \
              | sort -u
          )
          if (( ${#package_dirs[@]} == 0 )); then
            echo "No production state-cardinality probes were discovered."
            exit 1
          fi

          for package_dir in "${package_dirs[@]}"; do
            mapfile -t probe_paths < <(
              find "$package_dir/test" -type f -name '*-state-cardinality.test.ts' -print \
                | sort
            )
            relative_probes=()
            for probe_path in "${probe_paths[@]}"; do
              relative_probes+=("${probe_path#"$package_dir/"}")
            done

            config_args=()
            if [[ -f "$package_dir/vitest.config.ts" ]]; then
              config_args=(--config vitest.config.ts)
            elif [[ -f "$package_dir/vitest.workspace.ts" ]]; then
              config_args=(--config vitest.workspace.ts)
            else
              echo "No supported Vitest config found for $package_dir."
              status=1
              continue
            fi

            echo "Running ${#relative_probes[@]} state-cardinality probe(s) in $package_dir."
            pnpm --dir "$package_dir" exec vitest run \
              "${config_args[@]}" \
              --no-coverage \
              "${relative_probes[@]}" \
              || status=$?
          done

          exit "$status"
