name: Agent Max final patch apply

on:
  push:
    branches:
      - agent/add-murph-max-plan

permissions:
  contents: write

concurrency:
  group: agent-max-final-patch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == 'rocketman-21'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified patch set
        shell: bash
        run: |
          set -euo pipefail
          patches=(
            .github/agent-max-final-01.patch
            .github/agent-max-final-02.patch
            .github/agent-max-final-03.patch
            .github/agent-max-final-04.patch
            .github/agent-max-final-05.patch
          )

          for patch in "${patches[@]}"; do
            test -f "$patch"
            git apply --check "$patch"
            git apply --index "$patch"
          done

          git rm "${patches[@]}" .github/workflows/agent-max-finalize.yml
          git diff --cached --check

      - name: Commit and push final fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "rocketman"
          git config user.email "20303031+rocketman-21@users.noreply.github.com"
          git commit -m "fix: harden Max plan integration"
          git push origin HEAD:agent/add-murph-max-plan
