name: Agent Max final integration

on:
  push:
    branches:
      - agent/add-murph-max-plan
    paths:
      - .github/workflows/agent-max-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: agent/add-murph-max-plan

      - name: Apply complete Max compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test -z "$(git diff --name-only --diff-filter=U)"

          git show 8cca1a7326904d7b4d3cb3b4471daeed8b3d0505:scripts/agent-max-final-audit.py > /tmp/max-base-audit.py
          python <<'PY'
          from pathlib import Path

          path = Path("/tmp/max-base-audit.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Base audit normalization expected one match, found {count}: {old[:120]!r}"
                  )
              text = text.replace(old, new, 1)

          replace_once(
              "buildHostedTrialExpiredPendingBillingNotice",
              "renderHostedAiUsageGateLimitNoticeMessage",
          )
          replace_once(
              '    "    HostedDirectBillingPlanCode;",\n    3,\n)',
              '    "    HostedDirectBillingPlanCode;",\n    4,\n)',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python /tmp/max-base-audit.py

          python <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"{path}: expected one match, found {count}: {old[:140]!r}"
                  )
              write(path, text.replace(old, new, 1))

          def insert_before(path: str, marker: str, addition: str) -> None:
              replace_once(path, marker, addition + marker)

          # Keep target-specific Stripe Portal configuration in the canonical
          # billing-plan catalog instead of a second service-local allowlist.
          plans = "apps/web/src/lib/hosted-onboarding/billing-plans.ts"
          replace_once(
              plans,
              "  readonly interval: HostedBillingPlanInterval;\n"
              "  readonly planCode: HostedPlanCode;\n",
              "  readonly interval: HostedBillingPlanInterval;\n"
              "  readonly planChangePortalConfigurationIdEnvKey: string | null;\n"
              "  readonly planCode: HostedPlanCode;\n",
          )
          replace_once(
              plans,
              "    interval: \"month\",\n"
              "    planCode: \"pulse\",\n"
              "    priceIdEnvKey:\n"
              "      \"HOSTED_ONBOARDING_STRIPE_PRICE_ID_LAUNCH_GROUP_MONTHLY\",\n",
              "    interval: \"month\",\n"
              "    planChangePortalConfigurationIdEnvKey: null,\n"
              "    planCode: \"pulse\",\n"
              "    priceIdEnvKey:\n"
              "      \"HOSTED_ONBOARDING_STRIPE_PRICE_ID_LAUNCH_GROUP_MONTHLY\",\n",
          )
          replace_once(
              plans,
              "    interval: \"month\",\n"
              "    planCode: \"pulse\",\n"
              "    priceIdEnvKey: \"HOSTED_ONBOARDING_STRIPE_PRICE_ID_LAUNCH_MONTHLY\",\n",
              "    interval: \"month\",\n"
              "    planChangePortalConfigurationIdEnvKey:\n"
              "      \"HOSTED_ONBOARDING_STRIPE_PLAN_CHANGE_PORTAL_CONFIGURATION_ID_LAUNCH_MONTHLY\",\n"
              "    planCode: \"pulse\",\n"
              "    priceIdEnvKey: \"HOSTED_ONBOARDING_STRIPE_PRICE_ID_LAUNCH_MONTHLY\",\n",
          )
          replace_once(
              plans,
              "    interval: \"month\",\n"
              "    planCode: \"edge\",\n"
              "    priceIdEnvKey: \"HOSTED_ONBOARDING_STRIPE_PRICE_ID_LAUNCH_EDGE_MONTHLY\",\n"
              "    recurringAmountUsdCents: 2_000,\n",
              "    interval: \"month\",\n"
              "    planChangePortalConfigurationIdEnvKey:\n"
              "      \"HOSTED_ONBOARDING_STRIPE_PLAN_CHANGE_PORTAL_CONFIGURATION_ID_LAUNCH_EDGE_MONTHLY\",\n"
              "    planCode: \"edge\",\n"
              "    priceIdEnvKey: \"HOSTED_ONBOARDING_STRIPE_PRICE_ID_LAUNCH_EDGE_MONTHLY\",\n"
              "    recurringAmountUsdCents: 2_000,\n",
          )
          replace_once(
              plans,
              "    interval: \"month\",\n"
              "    planCode: \"edge\",\n"
              "    priceIdEnvKey: \"HOSTED_ONBOARDING_STRIPE_PRICE_ID_LAUNCH_MAX_MONTHLY\",\n"
              "    recurringAmountUsdCents: 5_000,\n",
              "    interval: \"month\",\n"
              "    planChangePortalConfigurationIdEnvKey:\n"
              "      \"HOSTED_ONBOARDING_STRIPE_PLAN_CHANGE_PORTAL_CONFIGURATION_ID_LAUNCH_MAX_MONTHLY\",\n"
              "    planCode: \"edge\",\n"
              "    priceIdEnvKey: \"HOSTED_ONBOARDING_STRIPE_PRICE_ID_LAUNCH_MAX_MONTHLY\",\n"
              "    recurringAmountUsdCents: 5_000,\n",
          )
          insert_before(
              plans,
              "export function getHostedDefaultBillingPlanCode(): HostedBillingPlanCode {\n",
              "export function readHostedBillingPlanChangePortalConfigurationId(\n"
              "  code: HostedBillingPlanCode,\n"
              "  source: Readonly<Record<string, string | undefined>> = process.env,\n"
              "): string | null {\n"
              "  const environmentKey =\n"
              "    HOSTED_BILLING_PLAN_DEFINITIONS[code]\n"
              "      .planChangePortalConfigurationIdEnvKey;\n"
              "  const value = environmentKey ? source[environmentKey]?.trim() : undefined;\n"
              "  return value ? value : null;\n"
              "}\n\n"
              "export function isHostedBillingPlanChangePortalConfigured(\n"
              "  code: HostedBillingPlanCode,\n"
              "  source: Readonly<Record<string, string | undefined>> = process.env,\n"
              "): boolean {\n"
              "  return readHostedBillingPlanChangePortalConfigurationId(code, source) !== null;\n"
              "}\n\n",
          )

          service = "apps/web/src/lib/hosted-onboarding/billing-plan-change-service.ts"
          replace_once(
              service,
              "  parseHostedBillingPlanCode,\n  type HostedBillingPlanCode,\n",
              "  parseHostedBillingPlanCode,\n"
              "  readHostedBillingPlanChangePortalConfigurationId,\n"
              "  type HostedBillingPlanCode,\n",
          )
          service_text = read(service)
          mapping_start = service_text.index(
              "const HOSTED_BILLING_PLAN_CHANGE_PORTAL_CONFIGURATION_ENV_BY_TARGET = {"
          )
          mapping_end = service_text.index("\n\nexport type HostedBillingPlanUpgradeResult", mapping_start)
          service_text = service_text[:mapping_start] + service_text[mapping_end + 2:]
          write(service, service_text)
          replace_once(
              service,
              "  const environmentKey =\n"
              "    HOSTED_BILLING_PLAN_CHANGE_PORTAL_CONFIGURATION_ENV_BY_TARGET[\n"
              "      targetPlanCode\n"
              "    ];\n"
              "  const configurationId = normalizeNullableString(\n"
              "    environmentKey ? process.env[environmentKey] : undefined,\n"
              "  );\n",
              "  const configurationId =\n"
              "    readHostedBillingPlanChangePortalConfigurationId(targetPlanCode);\n",
          )

          # Settings presents Max only when both its validated recurring Price
          # and its exact target-specific Stripe Portal flow are ready. The two
          # independent Stripe checks overlap rather than adding serial latency.
          settings_page = "apps/web/app/(dashboard)/settings/page.tsx"
          replace_once(
              settings_page,
              "  canUpgradeHostedBillingPlan,\n"
              "  parseHostedBillingPhase,\n",
              "  canUpgradeHostedBillingPlan,\n"
              "  isHostedBillingPlanChangePortalConfigured,\n"
              "  parseHostedBillingPhase,\n",
          )
          replace_once(
              settings_page,
              "  const groupPlanAvailable =\n"
              "    hasConfirmedGroupMembership\n"
              "    && await isHostedBillingPlanSelectionAvailable({\n"
              "      billingPlanCode: \"launch_group_monthly\",\n"
              "    });\n"
              "  const maxPlanAvailable = await isHostedBillingPlanSelectionAvailable({\n"
              "    billingPlanCode: \"launch_max_monthly\",\n"
              "  });\n",
              "  const maxPlanPortalConfigured =\n"
              "    isHostedBillingPlanChangePortalConfigured(\"launch_max_monthly\");\n"
              "  const [groupPlanAvailable, maxPlanAvailable] = await Promise.all([\n"
              "    hasConfirmedGroupMembership\n"
              "      ? isHostedBillingPlanSelectionAvailable({\n"
              "          billingPlanCode: \"launch_group_monthly\",\n"
              "        })\n"
              "      : Promise.resolve(false),\n"
              "    maxPlanPortalConfigured\n"
              "      ? isHostedBillingPlanSelectionAvailable({\n"
              "          billingPlanCode: \"launch_max_monthly\",\n"
              "        })\n"
              "      : Promise.resolve(false),\n"
              "  ]);\n",
          )

          # Routine Edge depletion keeps the existing top-up recommendation.
          # Max is quoted only when the member explicitly names it as a lasting
          # alternative, and only while its target-specific Portal flow exists.
          usage = "apps/web/src/lib/hosted-execution/usage-status.ts"
          replace_once(
              usage,
              "  getHostedBillingPlanDefinition,\n"
              "  parseHostedBillingPlanCode,\n",
              "  getHostedBillingPlanDefinition,\n"
              "  isHostedBillingPlanChangePortalConfigured,\n"
              "  parseHostedBillingPlanCode,\n",
          )
          replace_once(
              usage,
              "        accessKind === \"trial\"\n"
              "        || (\n"
              "          accessKind === \"paid\"\n"
              "          && (\n"
              "            decision.billingPlanCode === \"launch_group_monthly\"\n"
              "            || decision.billingPlanCode === \"launch_edge_monthly\"\n"
              "          )\n"
              "        )\n",
              "        accessKind === \"trial\"\n"
              "        || (\n"
              "          accessKind === \"paid\"\n"
              "          && decision.billingPlanCode === \"launch_group_monthly\"\n"
              "        )\n",
          )
          replace_once(
              usage,
              "        : decision.billingPlanCode === \"launch_group_monthly\"\n"
              "          ? buildRecommendedAction({\n"
              "              action: availableSubscriptionOffer.quote,\n"
              "              actionUrl,\n"
              "            })\n"
              "          : availableSubscriptionOffer.quote\n"
              "            ? buildRecommendedAction({\n"
              "                action: availableSubscriptionOffer.quote,\n"
              "                actionUrl,\n"
              "              })\n"
              "            : personalUsageCreditOfferCodes.length > 0\n"
              "              ? buildAddUsageRecommendedAction()\n"
              "              : null\n",
              "        : decision.billingPlanCode === \"launch_group_monthly\"\n"
              "          ? buildRecommendedAction({\n"
              "              action: availableSubscriptionOffer.quote,\n"
              "              actionUrl,\n"
              "            })\n"
              "          : personalUsageCreditOfferCodes.length > 0\n"
              "            ? buildAddUsageRecommendedAction()\n"
              "            : null\n",
          )
          replace_once(
              usage,
              "        : input.planCode === \"launch_monthly\"\n"
              "          ? \"launch_edge_monthly\"\n"
              "          : input.planCode === \"launch_edge_monthly\"\n"
              "            ? \"launch_max_monthly\"\n"
              "            : null\n",
              "        : input.planCode === \"launch_monthly\"\n"
              "          ? \"launch_edge_monthly\"\n"
              "          : null\n",
          )
          insert_before(
              usage,
              "  const canSchedule = hasOwnActiveBilling\n",
              "  if (\n"
              "    canUpgrade\n"
              "    && targetPlanCode === \"launch_max_monthly\"\n"
              "    && !isHostedBillingPlanChangePortalConfigured(targetPlanCode)\n"
              "  ) {\n"
              "    return EMPTY_SUBSCRIPTION_OFFER;\n"
              "  }\n",
          )

          # Max uses the generic scheduled-change confirmation for downgrades;
          # the Edge-specific Pulse dialog must never show $20/Edge copy to a
          # $50 Max member. Unsupported actions render nothing rather than an
          # ambiguous generic Portal chooser.
          settings = "apps/web/src/components/settings/hosted-billing-settings.tsx"
          replace_once(
              settings,
              "            action: familyOwner\n"
              "              ? <FamilyBillingChangeButton block targetPlanName=\"Max\" />\n",
              "            action: familyOwner\n"
              "              ? null\n",
          )
          replace_once(
              settings,
              '  targetPlanName: "Edge" | "Max" | "Pulse";\n',
              '  targetPlanName: "Edge" | "Pulse";\n',
          )
          settings_text = read(settings)
          pulse_card = settings_text.index("    {\n      action: familyOwner")
          pulse_start = settings_text.index("        : hasPendingPulseSwitch", pulse_card)
          pulse_end_marker = (
              '            : <BillingPortalButton block variant="secondary" label="Choose Pulse" />,\n'
          )
          pulse_end = settings_text.index(pulse_end_marker, pulse_start) + len(pulse_end_marker)
          pulse_replacement = (
              "        : hasPendingPulseSwitch\n"
              "          ? null\n"
              "          : maxCurrent\n"
              "            ? props.canSwitchToPulse === true\n"
              "              ? (\n"
              "                  <HostedPlanChangeButton\n"
              "                    block\n"
              "                    currentPeriodEnd={currentPeriodEndIso}\n"
              "                    mode=\"schedule\"\n"
              "                    targetPlanCode=\"launch_monthly\"\n"
              "                  >\n"
              "                    Choose Pulse\n"
              "                  </HostedPlanChangeButton>\n"
              "                )\n"
              "              : null\n"
              "            : props.canSwitchToPulse === true\n"
              "              ? (\n"
              "                  <SwitchToPulseButton block currentPeriodEnd={currentPeriodEndIso}>\n"
              "                    Choose Pulse\n"
              "                  </SwitchToPulseButton>\n"
              "                )\n"
              "              : <BillingPortalButton block variant=\"secondary\" label=\"Choose Pulse\" />,\n"
          )
          settings_text = (
              settings_text[:pulse_start] + pulse_replacement + settings_text[pulse_end:]
          )
          edge_card = settings_text.index('      key: "launch_edge_monthly",')
          edge_action_start = settings_text.rfind("      action: familyOwner", 0, edge_card)
          max_branch_start = settings_text.index("        : maxCurrent", edge_action_start)
          max_branch_end = settings_text.index("        : props.canUpgradeToEdge", max_branch_start)
          edge_max_branch = (
              "        : maxCurrent\n"
              "          ? props.canSwitchToEdge === true\n"
              "            ? (\n"
              "                <HostedPlanChangeButton\n"
              "                  block\n"
              "                  currentPeriodEnd={currentPeriodEndIso}\n"
              "                  mode=\"schedule\"\n"
              "                  targetPlanCode=\"launch_edge_monthly\"\n"
              "                >\n"
              "                  Choose Edge\n"
              "                </HostedPlanChangeButton>\n"
              "              )\n"
              "            : null\n"
          )
          settings_text = (
              settings_text[:max_branch_start]
              + edge_max_branch
              + settings_text[max_branch_end:]
          )
          write(settings, settings_text)

          # Keep assistant selling behavior deliberate: low usage suggests a
          # top-up; Max enters only after an explicit lasting-alternative ask.
          skill = "packages/assistant-engine/skills/hosted-low-usage/SKILL.md"
          replace_once(
              skill,
              "- **Direct paid Pulse or Edge:** When `recommendedAction` is `add_usage`, say\n"
              "  that the member can add usage. When an Edge read instead returns a\n"
              "  `change_plan` action targeting `launch_max_monthly`, offer Max as the lasting\n"
              "  higher-capacity option and ask whether they want the exact terms. Do not\n"
              "  promise a particular unreleased model or imply that future model access is\n"
              "  already active. If a referral mission is available, the first question may\n"
              "  playfully offer the mission instead; otherwise ask whether they want the\n"
              "  quick path. Do not include the Settings link until they say yes or ask for\n"
              "  it.\n",
              "- **Direct paid Pulse or Edge:** When `recommendedAction` is `add_usage`, say\n"
              "  that the member can add usage. If a referral mission is available, the first\n"
              "  question may playfully offer the mission instead; otherwise ask whether they\n"
              "  want the quick path. Do not include the Settings link until they say yes or\n"
              "  ask for it. Max belongs only in an explicit lasting-alternative follow-up\n"
              "  backed by a matching current quote; do not turn the first low-usage heads-up\n"
              "  into an automatic Max upsell.\n",
          )

          # Tighten member-facing copy after neutralizing the deployed premium
          # notice template.
          replace_once(
              "apps/web/src/components/home/usage-limit-banner.tsx",
              "included monthly AI usage",
              "included AI usage",
          )
          replace_once(
              "apps/web/test/usage-limit-banner.test.tsx",
              "/included monthly AI usage/",
              "/included AI usage/",
          )

          # New plan definitions expose their target-specific Portal key and
          # the environment reader now projects a fail-closed Max slot.
          replace_once(
              "apps/web/test/hosted-max-plan.test.ts",
              "      interval: \"month\",\n"
              "      planCode: \"edge\",\n",
              "      interval: \"month\",\n"
              "      planChangePortalConfigurationIdEnvKey:\n"
              "        \"HOSTED_ONBOARDING_STRIPE_PLAN_CHANGE_PORTAL_CONFIGURATION_ID_LAUNCH_MAX_MONTHLY\",\n"
              "      planCode: \"edge\",\n",
          )
          replace_once(
              "apps/web/test/hosted-onboarding-env.test.ts",
              "        launch_group_monthly: \"price_group_monthly_123\",\n"
              "        launch_monthly: \"price_monthly_123\",\n",
              "        launch_group_monthly: \"price_group_monthly_123\",\n"
              "        launch_max_monthly: null,\n"
              "        launch_monthly: \"price_monthly_123\",\n",
          )
          insert_before(
              "apps/web/test/hosted-max-plan.test.ts",
              "  it(\"discovers Max only when its Stripe price is configured\", () => {\n",
              "  it(\"fails closed until the Max Portal flow is configured\", () => {\n"
              "    expect(isHostedBillingPlanChangePortalConfigured(\n"
              "      \"launch_max_monthly\",\n"
              "      {},\n"
              "    )).toBe(false);\n"
              "    expect(isHostedBillingPlanChangePortalConfigured(\n"
              "      \"launch_max_monthly\",\n"
              "      {\n"
              "        HOSTED_ONBOARDING_STRIPE_PLAN_CHANGE_PORTAL_CONFIGURATION_ID_LAUNCH_MAX_MONTHLY:\n"
              "          \"bpc_max\",\n"
              "      },\n"
              "    )).toBe(true);\n"
              "  });\n\n",
          )
          replace_once(
              "apps/web/test/hosted-max-plan.test.ts",
              "  getHostedBillingPlanDefinition,\n",
              "  getHostedBillingPlanDefinition,\n"
              "  isHostedBillingPlanChangePortalConfigured,\n",
          )

          insert_before(
              "apps/web/test/hosted-billing-settings.test.tsx",
              "  test(\"shows Max-to-Edge as a scheduled downgrade and keeps Max current until then\", async () => {\n",
              "  test(\"uses plan-neutral confirmation copy for a Max-to-Pulse downgrade\", async () => {\n"
              "    const { HostedBillingSettings } = await import(\n"
              "      \"@/src/components/settings/hosted-billing-settings\"\n"
              "    );\n"
              "    const rendered = await renderClientComponent(createElement(\n"
              "      HostedBillingSettings,\n"
              "      {\n"
              "        authenticated: true,\n"
              "        billingStatus: \"active\",\n"
              "        canSwitchToPulse: true,\n"
              "        currentBillingPhase: \"paid\",\n"
              "        currentBillingPlanCode: \"launch_max_monthly\",\n"
              "        currentPeriodEnd: new Date(\"2026-09-07T20:00:00.000Z\"),\n"
              "        showMaxPlan: true,\n"
              "      },\n"
              "    ));\n"
              "    const choosePulse = findLastButtonByText(\n"
              "      rendered.window.document,\n"
              "      \"Choose Pulse\",\n"
              "      rendered.window,\n"
              "    );\n"
              "    await act(async () => {\n"
              "      choosePulse.dispatchEvent(\n"
              "        new rendered.window.Event(\"click\", { bubbles: true }),\n"
              "      );\n"
              "    });\n"
              "    const text = rendered.window.document.body.textContent ?? \"\";\n"
              "    expect(text).toMatch(/Switch to Pulse/);\n"
              "    expect(text).toMatch(/Then Pulse starts at \\$8\\/month/);\n"
              "    expect(text).not.toMatch(/Switch from Edge/);\n"
              "    expect(text).not.toMatch(/Down from \\$20/);\n"
              "    expect(text).not.toMatch(/keep Edge through/);\n"
              "    await rendered.cleanup();\n"
              "  });\n\n",
          )
          replace_once(
              "packages/assistant-engine/test/assistant-hosted-max-plan-skill.test.ts",
              "    expect(skill).toContain(\n"
              "      'When an Edge read instead returns a `change_plan` action targeting `launch_max_monthly`, offer Max as the lasting higher-capacity option',\n"
              "    )\n",
              "    expect(skill).not.toContain(\n"
              "      'When an Edge read instead returns a `change_plan` action targeting `launch_max_monthly`',\n"
              "    )\n"
              "    expect(skill).toContain(\n"
              "      'Max belongs only in an explicit lasting-alternative follow-up backed by a matching current quote',\n"
              "    )\n",
          )

          # Ensure all changed text files end with a newline.
          for relative in __import__("subprocess").check_output(
              ["git", "diff", "--name-only", "origin/main"],
              text=True,
          ).splitlines():
              path = ROOT / relative
              if path.is_file() and path.suffix in {
                  ".css", ".json", ".md", ".prisma", ".sql", ".ts", ".tsx", ".yml", ".yaml"
              }:
                  data = path.read_bytes()
                  if data and not data.endswith(b"\n"):
                      path.write_bytes(data + b"\n")
          PY

          git add -A
          git diff --cached --check

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/web prisma:generate

      - name: Run focused web tests
        run: >-
          pnpm exec vitest run --config apps/web/vitest.workspace.ts --no-coverage
          apps/web/test/hosted-max-plan.test.ts
          apps/web/test/hosted-max-plan-transition-migration.test.ts
          apps/web/test/hosted-billing-settings.test.tsx
          apps/web/test/settings-billing-upgrade-plan-route.test.ts
          apps/web/test/settings-billing-switch-plan-route.test.ts
          apps/web/test/hosted-usage-status.test.ts
          apps/web/test/hosted-execution-usage-allowance.test.ts
          apps/web/test/usage-limit-banner.test.tsx
          apps/web/test/user-facing-messages.test.ts
          apps/web/test/hosted-ops-growth.test.ts
          apps/web/test/hosted-onboarding-env.test.ts
          apps/web/test/settings-page.test.ts
          apps/web/test/hosted-billing-plan-quote.test.ts
          apps/web/test/hosted-onboarding-billing-plan-change-service.test.ts
          apps/web/test/hosted-onboarding-billing-plan-switch-to-pulse-service.test.ts
          apps/web/test/hosted-personal-usage-credit-eligibility.test.ts

      - name: Run focused assistant and contract tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/assistant-engine exec vitest run --config vitest.config.ts --no-coverage \
            test/assistant-hosted-low-usage-skill.test.ts \
            test/assistant-hosted-max-plan-skill.test.ts \
            test/assistant-plan-usage.test.ts \
            test/assistant-subscription-tool.test.ts
          pnpm --dir packages/hosted-execution exec vitest run --config vitest.config.ts --no-coverage \
            test/plan-usage.test.ts \
            test/subscription.test.ts
          pnpm --dir packages/hosted-local-harness exec vitest run --config vitest.config.ts --no-coverage \
            test/dev-hosted-local/stripe.test.ts

      - name: Typecheck and verify repository diff
        shell: bash
        run: |
          set -euo pipefail
          pnpm typecheck
          pnpm test:diff:local

      - name: Publish verified fixes and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-max-finalize.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: finalize Max plan integration"
          git push origin HEAD:agent/add-murph-max-plan
