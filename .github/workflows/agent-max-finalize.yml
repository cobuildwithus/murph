name: Agent Max source export

on:
  push:
    branches:
      - agent/add-murph-max-plan

permissions:
  contents: read

concurrency:
  group: agent-max-source-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive exact source tree
        run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/agent-max-source.tar.gz"

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: agent-max-source-${{ github.sha }}
          path: ${{ runner.temp }}/agent-max-source.tar.gz
          if-no-files-found: error
          retention-days: 1
