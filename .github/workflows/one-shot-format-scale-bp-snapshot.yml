name: Normalize scale and BP snapshot formatting

on:
  push:
    branches:
      - codex/junction-scale-bp-vault-awareness
    paths:
      - .github/workflows/one-shot-format-scale-bp-snapshot.yml

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-scale-bp-snapshot]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/junction-scale-bp-vault-awareness

      - name: Normalize the Promise.all block
        shell: python
        run: |
          from pathlib import Path

          target = Path(
              "packages/assistant-engine/src/assistant/context-snapshot.ts",
          )
          text = target.read_text()
          old = """  const [
            bloodTestCoverage,
            deviceMeasurementCoverage,
            goalRead,
            conditionRead,
            allergyRead,
            regimenRead,
            habitatRead,
          ] = await Promise.all([
            collectAssistantSnapshotBloodTestCoverage(input),
            collectAssistantSnapshotDeviceMeasurementCoverage(input),
          """.replace("\n          ", "\n")
          new = """  const [
              bloodTestCoverage,
              deviceMeasurementCoverage,
              goalRead,
              conditionRead,
              allergyRead,
              regimenRead,
              habitatRead,
            ] = await Promise.all([
              collectAssistantSnapshotBloodTestCoverage(input),
              collectAssistantSnapshotDeviceMeasurementCoverage(input),
          """.replace("\n          ", "\n")
          if text.count(old) != 1:
              raise RuntimeError(
                  f"expected one malformed block, found {text.count(old)}",
              )
          target.write_text(text.replace(old, new, 1))
          Path(
              ".github/workflows/one-shot-format-scale-bp-snapshot.yml",
          ).unlink()

      - name: Commit normalized source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize context snapshot coverage block"
          git push origin HEAD:codex/junction-scale-bp-vault-awareness
