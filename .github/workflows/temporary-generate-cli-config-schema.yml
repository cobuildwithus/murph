name: Temporary Generate CLI Config Schema

on:
  push:
    branches:
      - codex/proactive-address-resolution

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/proactive-address-resolution
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Health Commons catalog
        run: pnpm health-commons:generate
      - name: Prepare built CLI runtime artifacts
        run: pnpm build:test-runtime:prepared
      - name: Generate CLI artifacts
        run: pnpm --dir packages/cli gen:config-schema
      - name: Commit generated artifacts and retire this workflow
        run: |
          rm .github/workflows/temporary-generate-cli-config-schema.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            packages/cli/config.schema.json \
            packages/cli/src/incur.generated.ts \
            packages/cli/src/vault-cli-skill-hash.generated.ts \
            .github/workflows/temporary-generate-cli-config-schema.yml
          git commit -m "chore(cli): regenerate command artifacts"
          git push origin HEAD:codex/proactive-address-resolution
