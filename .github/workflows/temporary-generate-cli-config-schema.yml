name: Temporary Generate CLI Config Schema

on:
  push:
    branches:
      - codex/proactive-address-resolution
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Health Commons catalog
        run: pnpm health-commons:generate
      - name: Prepare built CLI runtime artifacts
        run: pnpm build:test-runtime:prepared
      - name: Generate CLI artifacts
        run: pnpm --dir packages/cli gen:config-schema
      - name: Upload generated CLI artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generated-cli-artifacts
          path: |
            packages/cli/config.schema.json
            packages/cli/src/incur.generated.ts
            packages/cli/src/vault-cli-skill-hash.generated.ts
          if-no-files-found: error
          retention-days: 1
