name: PR 1405 checkout snapshot

on:
  push:
    branches:
      - codex/health-commons-agent-knowledge

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.head_commit.message == 'chore: export PR checkout for local validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Archive checkout and git metadata
        run: tar --exclude='./node_modules' --exclude='./.pnpm-store' -czf /tmp/murph-pr1405-checkout.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: murph-pr1405-checkout
          path: /tmp/murph-pr1405-checkout.tgz
          if-no-files-found: error
          retention-days: 1
