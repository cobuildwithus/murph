name: Refresh clinical provider directory

on:
  workflow_dispatch:
    inputs:
      allow_count_drop:
        description: Publish even though brands, facilities or mapped facilities fell by more than 10 percent. Use only after confirming the drop upstream.
        type: boolean
        default: false
  schedule:
    - cron: '17 9 * * 1'

permissions:
  contents: read

concurrency:
  group: clinical-provider-directory-refresh
  cancel-in-progress: false

env:
  DIRECTORY: apps/web/src/lib/clinical-records/provider-directory.v2.json
  # Scheduled runs have no inputs, so the count floor applies.
  MURPH_DIRECTORY_ALLOW_COUNT_DROP: ${{ inputs.allow_count_drop == true }}

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.build.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @murphai/clinical-records... run build
      - name: Build and validate the public directory
        id: build
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- "$DIRECTORY"
          test -s "$DIRECTORY" || { echo "::error::Tracked directory output is missing or empty: $DIRECTORY"; exit 1; }
          input="$RUNNER_TEMP/epic-brands.json"
          candidate="$RUNNER_TEMP/candidate"
          mkdir "$candidate"
          curl --proto '=https' --proto-redir '=https' --fail --location --silent --show-error \
            --max-time 300 --max-filesize 268435456 https://open.epic.com/Endpoints/Brands -o "$input"
          test -s "$input" || { echo "::error::Downloaded Epic source is missing or empty"; exit 1; }
          count_drop=()
          if [[ "$MURPH_DIRECTORY_ALLOW_COUNT_DROP" == true ]]; then count_drop=(--allow-count-drop); fi
          pnpm --dir apps/web clinical-records:providers:import -- --input "$input" --output "$GITHUB_WORKSPACE/$DIRECTORY" \
            --held-output "$candidate/held-changes.json" "${count_drop[@]}"
          test -s "$DIRECTORY" || { echo "::error::Tracked directory output is missing or empty: $DIRECTORY"; exit 1; }
          cp "$DIRECTORY" "$candidate/provider-directory.v2.json"
          if ! git diff --quiet -- "$DIRECTORY"; then echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      # Uploaded on every run: held changes are reported even when nothing publishes.
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: clinical-directory
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 1

  # The report and publish jobs install no dependencies and never see the Epic
  # download: Node and the committed checkout re-check the candidate before
  # anything is reported or published.
  report:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: clinical-directory
          path: ${{ runner.temp }}/validated
      - name: Re-check the parser, count floor and hold rules
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- "$DIRECTORY"
          node scripts/check-clinical-provider-directory.mjs publish "$RUNNER_TEMP/validated/provider-directory.v2.json" \
            "$RUNNER_TEMP/validated/held-changes.json" "$RUNNER_TEMP/held-changes.md"
      # The checker proves each listed row but not that the list is complete, so an
      # empty report never closes the issue: it leaves a note and a person closes it.
      - name: Report held directory changes
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Clinical directory changes need review
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/held-changes.md"
          note="reported no held changes. Check and close this issue by hand."
          # Every open bot issue with this title, oldest first, as "<number> <comment count>".
          issues=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues?state=open&creator=github-actions%5Bbot%5D&sort=created&direction=asc&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == env.TITLE) | "\(.number) \(.comments)"')
          if [[ ! -s "$report" ]]; then
            while read -r issue comments; do
              [[ -n "$issue" ]] || continue
              last=""
              if (( comments > 0 )); then
                last=$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=1&page=$comments" --jq '.[0].body // ""')
              fi
              [[ "$last" == *"$note"* ]] || gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
                --body "The latest refresh ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) $note"
            done <<< "$issues"
            exit 0
          fi
          read -r oldest _ <<< "$issues"
          if [[ -z "$oldest" ]]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file "$report"
          else
            gh issue edit "$oldest" --repo "$GITHUB_REPOSITORY" --body-file "$report"
            # Closing a duplicate is safe: the oldest stays open with the full report.
            while read -r issue _; do
              [[ "$issue" == "$oldest" ]] || gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
                --comment "Superseded by #$oldest, which lists the current held changes."
            done <<< "$issues"
          fi
          echo "::warning::Held directory changes for review; see the open issue \"$TITLE\"."

  publish:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment:
      name: frog-reconciliation
      deployment: false
    outputs:
      pr: ${{ steps.publish.outputs.pr }}
      head: ${{ steps.publish.outputs.head }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: clinical-directory
          path: ${{ runner.temp }}/validated
      - name: Re-check the parser, count floor and hold rules
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- "$DIRECTORY"
          node scripts/check-clinical-provider-directory.mjs publish "$RUNNER_TEMP/validated/provider-directory.v2.json" \
            "$RUNNER_TEMP/validated/held-changes.json" "$RUNNER_TEMP/held-changes.md"
      - name: Copy validated snapshot to its tracked destination
        run: cp "$RUNNER_TEMP/validated/provider-directory.v2.json" "$DIRECTORY"
      - name: Mint directory publication token
        id: app
        uses: ./.github/actions/github-app-token
        with:
          app-id: ${{ vars.FROG_APP_CLIENT_ID }}
          key-version: projects/murph-495013/locations/global/keyRings/github-apps/cryptoKeys/frog-app/cryptoKeyVersions/1
          owner: ${{ github.repository_owner }}
          repositories: murph
          permissions: '{"contents":"write","pull_requests":"write"}'
      - name: Open the exact directory change for required CI
        id: publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.hooksPath
          GIT_CONFIG_VALUE_0: /dev/null
        run: |
          set -euo pipefail
          branch="records/directory-${GITHUB_SHA:0:12}-$(git hash-object "$DIRECTORY")"
          gh auth setup-git --hostname github.com
          git add -- "$DIRECTORY"
          tree=$(git write-tree)
          if [[ -n "$(git ls-remote --heads origin "refs/heads/$branch")" ]]; then
            git fetch --depth=2 origin "refs/heads/$branch"
            head=$(git rev-parse FETCH_HEAD)
            test "$(git rev-parse "$head^{tree}")" = "$tree"
            test "$(git rev-parse "$head^")" = "$GITHUB_SHA"
          else
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Refresh the clinical provider directory'
            head=$(git rev-parse HEAD)
            git push origin "HEAD:refs/heads/$branch"
          fi
          # Owner-qualified, so a fork's branch with the same name never matches.
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&head=$GITHUB_REPOSITORY_OWNER:$branch" \
            --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            url=$(gh pr create --base main --head "$branch" --title 'Refresh the clinical provider directory' \
              --body-file .github/clinical-provider-refresh-pr.md)
            pr=${url##*/}
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

  merge:
    needs: publish
    if: needs.publish.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: frog-reconciliation
      deployment: false
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    env:
      PR: ${{ needs.publish.outputs.pr }}
      HEAD_SHA: ${{ needs.publish.outputs.head }}
    steps:
      - name: Wait for branch protection on the published head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while true; do
            state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid,baseRefName,state,mergeStateStatus)
            jq -e --arg head "$HEAD_SHA" '.headRefOid == $head and .baseRefName == "main" and .state == "OPEN"' <<< "$state" >/dev/null
            case $(jq -r '.mergeStateStatus' <<< "$state") in
              CLEAN) break ;;
              BLOCKED|UNSTABLE|UNKNOWN) sleep 30 ;;
              *) echo "::error::Directory PR cannot merge at this head"; exit 1 ;;
            esac
          done
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mint exact-head merge token
        id: app
        uses: ./.github/actions/github-app-token
        with:
          app-id: ${{ vars.FROG_APP_CLIENT_ID }}
          key-version: projects/murph-495013/locations/global/keyRings/github-apps/cryptoKeys/frog-app/cryptoKeyVersions/1
          owner: ${{ github.repository_owner }}
          repositories: murph
          permissions: '{"contents":"write","pull_requests":"write"}'
      - name: Merge through repository protections
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --match-head-commit "$HEAD_SHA" --squash
