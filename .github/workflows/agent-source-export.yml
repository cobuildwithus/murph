name: Agent source export

on:
  pull_request:
    paths:
      - .github/workflows/agent-source-export.yml

permissions:
  contents: write

jobs:
  export:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply staged patch and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail

          cat .github/agent-patch/part-*.patch > /tmp/agent.patch
          git apply --check /tmp/agent.patch
          git apply /tmp/agent.patch

          git rm -r .github/agent-patch
          git rm --ignore-unmatch \
            .github/workflows/agent-source-export.yml \
            .github/workflows/agent-full-source-export.yml

          git fetch origin main
          git checkout origin/main -- .github/workflows/repo-hygiene.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Implement Linq chat health preflight"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
