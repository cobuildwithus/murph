name: Diagnose PR 1405 CLI candidate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pr1405-cli-diagnostic-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'codex/health-commons-agent-knowledge'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: agent/pr1405-result
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Diagnose CLI stages
        shell: bash
        run: |
          set +e
          mkdir -p .github/pr1405-cli-diagnostic
          run_check() {
            name="$1"
            shift
            "$@" > ".github/pr1405-cli-diagnostic/${name}.log" 2>&1
            rc=$?
            echo "$rc" > ".github/pr1405-cli-diagnostic/${name}.status"
            if [[ $rc -ne 0 ]]; then
              touch ".github/pr1405-cli-diagnostic/FAIL-${name}"
            else
              touch ".github/pr1405-cli-diagnostic/PASS-${name}"
            fi
          }

          run_check typecheck pnpm --dir packages/cli typecheck
          run_check commons-command pnpm --dir packages/cli exec vitest run --config vitest.workspace.ts --no-coverage test/commons-command-coverage.test.ts
          run_check incur-smoke pnpm --dir packages/cli exec vitest run --config vitest.workspace.ts --no-coverage test/incur-smoke.test.ts
          run_check incur-skill-hash pnpm --dir packages/cli exec vitest run --config vitest.workspace.ts --no-coverage test/incur-skill-hash.test.ts
          run_check typed-agent-schema pnpm --dir packages/cli exec vitest run --config vitest.workspace.ts --no-coverage test/cli-typed-agent-inputs-schema.test.ts

          git add .github/pr1405-cli-diagnostic
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: capture PR 1405 CLI diagnostics'
          git push --force origin HEAD:refs/heads/agent/pr1405-cli-diagnostic
