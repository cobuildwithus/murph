name: Apply PR 1405 Health Commons simplification

on:
  push:
    branches:
      - codex/health-commons-agent-knowledge

permissions:
  contents: write

jobs:
  apply-validate-publish:
    if: github.event.head_commit.message == 'chore: execute health commons simplification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Apply and validate simplification
        id: work
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -eux
            cat \
              .github/pr1405-apply.py.gz.chunk00 \
              .github/pr1405-apply.py.gz.chunk01 \
              .github/pr1405-apply.py.gz.chunk02 \
              .github/pr1405-apply.py.gz.chunk03 \
              .github/pr1405-apply.py.gz.chunk04 \
              > /tmp/pr1405-apply.py.gz
            echo '7251b833e03ab5a305c2a5c751ebf7c396f4e16ae157ebee1fb6447bf2e099a1  /tmp/pr1405-apply.py.gz' | sha256sum -c -
            gzip -t /tmp/pr1405-apply.py.gz
            gzip -dc /tmp/pr1405-apply.py.gz > /tmp/pr1405-apply.py
            echo 'd5e058990433b6df03ae8de60c27d8585dcf0d865f211912c62b79d142e27a51  /tmp/pr1405-apply.py' | sha256sum -c -
            python3 -m py_compile /tmp/pr1405-apply.py
            python3 /tmp/pr1405-apply.py
            corepack enable
            pnpm install --frozen-lockfile
            pnpm --dir packages/health-commons verify
            pnpm --dir packages/cli gen:config-schema
            pnpm --dir packages/cli typecheck
            pnpm --dir packages/cli test:source -- test/commons-command-coverage.test.ts
            pnpm --dir packages/assistant-engine typecheck
            pnpm --dir packages/assistant-engine test -- test/model-behavior.test.ts test/assistant-skill-assets.test.ts
            pnpm --dir apps/cloudflare typecheck
            pnpm --dir . exec vitest run --config apps/cloudflare/vitest.node.workspace.ts --no-coverage \
              apps/cloudflare/test/deploy-artifacts.test.ts \
              apps/cloudflare/test/runner-bundle-workspace-artifacts.test.ts
            git diff --check
            test -f packages/health-commons/src/knowledge-question.ts
            ! grep -R "commons knowledge search" \
              packages/assistant-engine/src/assistant/system-prompt.ts \
              packages/assistant-engine/test/model-behavior.test.ts \
              packages/assistant-engine/test/assistant-codex-real-e2e.test.ts \
              packages/cli/src/commands/commons.ts \
              packages/cli/test/commons-command-coverage.test.ts
          ) 2>&1 | tee /tmp/pr1405-validation.log

      - name: Publish validated implementation
        id: publish
        if: steps.work.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -eux
            rm -f \
              .github/workflows/pr1405-apply.yml \
              .github/pr1405-apply.py.gz.chunk00 \
              .github/pr1405-apply.py.gz.chunk01 \
              .github/pr1405-apply.py.gz.chunk02 \
              .github/pr1405-apply.py.gz.chunk03 \
              .github/pr1405-apply.py.gz.chunk04 \
              .github/pr1405-run \
              .github/pr1405-validation-failure.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git diff --cached --check
            git diff --cached --stat
            git commit -m 'refactor(health-commons): simplify agent knowledge access'
            git push origin HEAD:codex/health-commons-agent-knowledge
          ) 2>&1 | tee /tmp/pr1405-publish.log

      - name: Record validation failure
        if: always() && (steps.work.outcome != 'success' || steps.publish.outcome == 'failure')
        shell: bash
        run: |
          set -eux
          git reset --hard "$GITHUB_SHA"
          git clean -fd
          {
            echo 'PR 1405 simplification validation failed.'
            echo
            echo '## Validation'
            tail -c 180000 /tmp/pr1405-validation.log 2>/dev/null || true
            echo
            echo '## Publish'
            tail -c 30000 /tmp/pr1405-publish.log 2>/dev/null || true
          } > .github/pr1405-validation-failure.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr1405-validation-failure.txt
          git commit -m 'chore: record PR 1405 validation failure'
          git push origin HEAD:codex/health-commons-agent-knowledge
