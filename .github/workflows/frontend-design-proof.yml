name: Frontend Design Proof

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend-design-proof:
    name: Frontend design proof
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Test pull-request body guards
        run: >-
          node --test
          scripts/check-frontend-design-proof.test.mjs
          scripts/check-pr-architecture-summary.test.mjs

      - name: Require architecture and reuse summary
        run: node scripts/check-pr-architecture-summary.mjs
        env:
          MURPH_GITHUB_TOKEN: ${{ github.token }}
          MURPH_PR_BODY: ${{ github.event.pull_request.body }}

      - name: Require design-page coverage and screenshots
        run: node scripts/check-frontend-design-proof.mjs
        env:
          MURPH_GITHUB_TOKEN: ${{ github.token }}
          MURPH_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MURPH_PR_BODY: ${{ github.event.pull_request.body }}
          MURPH_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  byoi-integration:
    name: BYOI integration
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/bring-your-own-inference'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: agent/bring-your-own-inference

      - name: Apply asserted BYOI edits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          python3 scripts/apply-byoi-branch-patch.py
          python3 - <<'PY'
          from pathlib import Path

          def patch_section(
              path: str,
              start_marker: str,
              end_marker: str,
              old: str,
              new: str,
          ) -> None:
              target = Path(path)
              text = target.read_text()
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              if new in section:
                  return
              if section.count(old) != 1:
                  raise RuntimeError(
                      f"{path}: expected one scoped BYOI anchor, found {section.count(old)}"
                  )
              target.write_text(
                  text[:start] + section.replace(old, new, 1) + text[end:]
              )

          token_result = """      attemptId: string;
                leaseGeneration: string;
                owns: true;"""
          token_result_with_envelope = """      attemptId: string;
                customInferenceEnvelope?: string;
                leaseGeneration: string;
                owns: true;"""
          patch_section(
              "apps/cloudflare/src/user-runner/runner-state-store.ts",
              "export type RunnerProviderEgressTokenValidationResult =",
              "export type RunnerProviderEgressCredentialValidationResult =",
              token_result,
              token_result_with_envelope,
          )
          patch_section(
              "apps/cloudflare/src/worker-contracts.ts",
              "export type WorkerProviderEgressTokenValidationResult =",
              "export type WorkerProviderEgressCredentialValidationRejectReason =",
              token_result,
              token_result_with_envelope,
          )

          token_success = """    return {
                attemptId: token.attemptId,
                leaseGeneration: token.leaseGeneration,
                owns: true,
                record: this.readStateFromMetaSync(meta),
                userId: token.userId,
                workspaceVersion: token.workspaceVersion,
              };
          """
          token_success_with_envelope = """    return {
                attemptId: token.attemptId,
                ...(meta.active_custom_inference_envelope
                  ? { customInferenceEnvelope: meta.active_custom_inference_envelope }
                  : {}),
                leaseGeneration: token.leaseGeneration,
                owns: true,
                record: this.readStateFromMetaSync(meta),
                userId: token.userId,
                workspaceVersion: token.workspaceVersion,
              };
          """
          patch_section(
              "apps/cloudflare/src/user-runner/runner-state-store.ts",
              "  async validateProviderEgressToken(input: {",
              "  async validateProviderEgressCredential(input: {",
              token_success,
              token_success_with_envelope,
          )

          selected_columns = """        active_provider_egress_token_hash,
                active_runner_container_name,"""
          selected_columns_with_envelope = """        active_provider_egress_token_hash,
                active_custom_inference_envelope,
                active_runner_container_name,"""
          patch_section(
              "apps/cloudflare/src/user-runner/runner-state-store.ts",
              "  private selectMetaRowSync(): RunnerMetaRow | null {",
              "  private insertMetaRowSync(meta: RunnerMetaRow): void {",
              selected_columns,
              selected_columns_with_envelope,
          )

          projected_success = """    return {
                attemptId: validation.attemptId,
                leaseGeneration: validation.leaseGeneration,
                owns: true,
                userId: validation.userId,
                workspaceVersion: validation.workspaceVersion,
              };
          """
          projected_success_with_envelope = """    return {
                attemptId: validation.attemptId,
                ...(validation.customInferenceEnvelope
                  ? { customInferenceEnvelope: validation.customInferenceEnvelope }
                  : {}),
                leaseGeneration: validation.leaseGeneration,
                owns: true,
                userId: validation.userId,
                workspaceVersion: validation.workspaceVersion,
              };
          """
          patch_section(
              "apps/cloudflare/src/user-runner/hosted-user-runner.ts",
              "  async validateRuntimeProviderEgressToken(input: {",
              "  async validateRuntimeProviderEgressCredential(input: {",
              projected_success,
              projected_success_with_envelope,
          )
          PY
          python3 scripts/apply-byoi-runtime-pinning.py
          python3 scripts/apply-byoi-custom-provider.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path("agent-docs/index.md")
          text = path.read_text()
          row = (
              "| `agent-docs/product-specs/bring-your-own-inference.md` | "
              "One encrypted personal custom-inference connection with native "
              "Responses, a bounded Chat adapter seam, invocation-fenced egress, "
              "Codex-only execution, and no silent managed fallback. | "
              "Custom inference product spec | High | 2026-07-31 |\n"
          )
          if row not in text:
              anchor = (
                  "| `agent-docs/product-specs/index.md` | Index for product-spec docs. "
                  "| Product-spec inventory | High | 2026-07-16 |\n"
              )
              if text.count(anchor) != 1:
                  raise RuntimeError("agent-docs/index.md: product-spec index anchor drifted")
              path.write_text(text.replace(anchor, anchor + row, 1))
          PY
          git diff --check
          if ! git diff --quiet --exit-code; then
            git add --all
            git commit -m "feat(runtime): pin and proxy custom inference"
          fi
          git push origin HEAD:agent/bring-your-own-inference

      - name: Archive exact BYOI worktree
        if: always()
        shell: bash
        run: tar --exclude=.git -czf /tmp/byoi-worktree.tgz .

      - name: Upload exact BYOI worktree
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: byoi-worktree-${{ github.run_id }}
          path: /tmp/byoi-worktree.tgz
          retention-days: 1
          if-no-files-found: error
