name: Apply private-to-group context handoff patch

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/handoff-codemod-trigger
      - .github/workflows/apply-private-to-group-context-handoff.yml
      - scripts/apply-private-to-group-context-handoff.mjs
      - scripts/apply-private-to-group-context-handoff.py.gz.b64

permissions:
  contents: write

concurrency:
  group: apply-private-to-group-context-handoff
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feat/private-to-group-context-handoff'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/private-to-group-context-handoff

      - name: Configure commit identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge the current target branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply the bounded codemod
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode scripts/apply-private-to-group-context-handoff.py.gz.b64 \
            | gzip --decompress \
            > "$RUNNER_TEMP/apply-private-to-group-context-handoff.py"
          python -m py_compile "$RUNNER_TEMP/apply-private-to-group-context-handoff.py"
          python "$RUNNER_TEMP/apply-private-to-group-context-handoff.py" .
          git diff --check
          test -s packages/hosted-execution/test/group-context-handoff.test.ts
          test -s apps/web/changelog/entries/2026-08-21/murph-can-share-context-with-your-group.json
          git status --short

      - name: Commit the implementation and remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/handoff-codemod-trigger \
            .github/workflows/apply-private-to-group-context-handoff.yml \
            scripts/apply-private-to-group-context-handoff.mjs \
            scripts/apply-private-to-group-context-handoff.py.gz.b64
          git add --all
          git diff --cached --check
          git commit -m "Add private-to-group context handoff"
          git push origin HEAD:feat/private-to-group-context-handoff
