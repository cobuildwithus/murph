name: Deploy Cloudflare Hosted Execution

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy from
        required: true
        default: production
        type: choice
        options:
          - production
      sync_worker_secrets:
        description: Include the rendered Worker secrets file during deploy
        required: true
        default: true
        type: boolean
      deploy_worker:
        description: Deploy the Cloudflare Worker after rendering config
        required: true
        default: true
        type: boolean
      container_rollout:
        description: Container rollout behavior for Worker deploys
        required: true
        default: gradual
        type: choice
        options:
          - gradual
          - immediate
      runner_idle_ttl_ms:
        description: Optional runner container idle TTL override in milliseconds
        required: false
        default: ""
        type: string
      hosted_email_send_binding:
        description: Render the optional native hosted-email send binding
        required: true
        default: true
        type: boolean
      smoke_user_id:
        description: Optional hosted user id for a manual /run smoke test
        required: false
        default: ""
        type: string
      skip_predeploy_e2e:
        description: Skip predeploy hosted-local E2E gates
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

jobs:
  codex-cache-prefix-gate:
    name: Codex cache-prefix E2E gate
    if: ${{ !inputs.skip_predeploy_e2e && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/murph_test
      HOSTED_DEVICE_ROUTING_INDEX_KEY: 0101010101010101010101010101010101010101010101010101010101010101
      HOSTED_CONTACT_PRIVACY_KEYS: v1:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
      HOSTED_MAILBOX_FINGERPRINT_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.HOSTED_WEB_VERIFY_PRIVY_APP_ID }}
      PRIVY_VERIFICATION_KEY: ci-hosted-web-verification-key
      MURPH_E2E_STREAM_DEV_LOGS: "0"
      MURPH_HOSTED_LOCAL_E2E_FAST_GATE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Start Postgres
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="murph-hosted-e2e-postgres-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          docker rm -f "${postgres_container}" >/dev/null 2>&1 || true
          docker run \
            --detach \
            --rm \
            --name "${postgres_container}" \
            --env POSTGRES_DB=murph_test \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_USER=postgres \
            --publish 5432:5432 \
            postgres

          for _attempt in {1..30}; do
            if docker exec "${postgres_container}" pg_isready -U postgres -d murph_test; then
              exit 0
            fi
            sleep 2
          done

          docker logs "${postgres_container}"
          exit 1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install/check Temporal CLI
        run: pnpm temporal:cli:setup

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "GHCR login unavailable; continuing with anonymous pulls and local rebuild fallback."

      - name: Run Codex cache-prefix hosted-local E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/cloudflare-hosted-deploy
          pnpm hosted-local e2e codex-gateway-prefix --profile e2e:live 2>&1 \
            | tee .artifacts/cloudflare-hosted-deploy/codex-gateway-prefix.log

      - name: Upload Codex cache-prefix E2E logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cloudflare-hosted-deploy-codex-cache-prefix-logs
          path: |
            .artifacts/cloudflare-hosted-deploy/codex-gateway-prefix.log
            .artifacts/hosted-local/**/state.json
          if-no-files-found: warn

      - name: Stop Postgres
        if: always()
        shell: bash
        run: |
          docker rm -f "murph-hosted-e2e-postgres-${GITHUB_RUN_ID}-${GITHUB_JOB}" >/dev/null 2>&1 || true

  linq-delivery-gate:
    name: Linq delivery E2E gate
    if: ${{ !inputs.skip_predeploy_e2e && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/murph_test
      HOSTED_DEVICE_ROUTING_INDEX_KEY: 0101010101010101010101010101010101010101010101010101010101010101
      HOSTED_CONTACT_PRIVACY_KEYS: v1:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
      HOSTED_MAILBOX_FINGERPRINT_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.HOSTED_WEB_VERIFY_PRIVY_APP_ID }}
      PRIVY_VERIFICATION_KEY: ci-hosted-web-verification-key
      MURPH_E2E_STREAM_DEV_LOGS: "0"
      MURPH_HOSTED_LOCAL_E2E_FAST_GATE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Start Postgres
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="murph-hosted-e2e-postgres-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          docker rm -f "${postgres_container}" >/dev/null 2>&1 || true
          docker run \
            --detach \
            --rm \
            --name "${postgres_container}" \
            --env POSTGRES_DB=murph_test \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_USER=postgres \
            --publish 5432:5432 \
            postgres

          for _attempt in {1..30}; do
            if docker exec "${postgres_container}" pg_isready -U postgres -d murph_test; then
              exit 0
            fi
            sleep 2
          done

          docker logs "${postgres_container}"
          exit 1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install/check Temporal CLI
        run: pnpm temporal:cli:setup

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "GHCR login unavailable; continuing with anonymous pulls and local rebuild fallback."

      - name: Run Linq delivery hosted-local E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/cloudflare-hosted-deploy
          pnpm hosted-local e2e linq-delivery 2>&1 \
            | tee .artifacts/cloudflare-hosted-deploy/linq-delivery.log

      - name: Upload Linq delivery E2E logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cloudflare-hosted-deploy-linq-delivery-logs
          path: |
            .artifacts/cloudflare-hosted-deploy/linq-delivery.log
            .artifacts/hosted-local/**/state.json
          if-no-files-found: warn

      - name: Stop Postgres
        if: always()
        shell: bash
        run: |
          docker rm -f "murph-hosted-e2e-postgres-${GITHUB_RUN_ID}-${GITHUB_JOB}" >/dev/null 2>&1 || true

  linq-scheduled-reminder-gate:
    name: Linq scheduled reminder E2E gate
    if: ${{ !inputs.skip_predeploy_e2e && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/murph_test
      HOSTED_DEVICE_ROUTING_INDEX_KEY: 0101010101010101010101010101010101010101010101010101010101010101
      HOSTED_CONTACT_PRIVACY_KEYS: v1:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
      HOSTED_MAILBOX_FINGERPRINT_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
      NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.HOSTED_WEB_VERIFY_PRIVY_APP_ID }}
      PRIVY_VERIFICATION_KEY: ci-hosted-web-verification-key
      MURPH_E2E_STREAM_DEV_LOGS: "0"
      MURPH_HOSTED_LOCAL_E2E_FAST_GATE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Start Postgres
        shell: bash
        run: |
          set -euo pipefail
          postgres_container="murph-hosted-e2e-postgres-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          docker rm -f "${postgres_container}" >/dev/null 2>&1 || true
          docker run \
            --detach \
            --rm \
            --name "${postgres_container}" \
            --env POSTGRES_DB=murph_test \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_USER=postgres \
            --publish 5432:5432 \
            postgres

          for _attempt in {1..30}; do
            if docker exec "${postgres_container}" pg_isready -U postgres -d murph_test; then
              exit 0
            fi
            sleep 2
          done

          docker logs "${postgres_container}"
          exit 1

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install/check Temporal CLI
        run: pnpm temporal:cli:setup

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin \
            || echo "GHCR login unavailable; continuing with anonymous pulls and local rebuild fallback."

      - name: Run Linq scheduled reminder hosted-local E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/cloudflare-hosted-deploy
          pnpm hosted-local e2e linq-scheduled-reminder 2>&1 \
            | tee .artifacts/cloudflare-hosted-deploy/linq-scheduled-reminder.log

      - name: Upload Linq scheduled reminder E2E logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cloudflare-hosted-deploy-linq-scheduled-reminder-logs
          path: |
            .artifacts/cloudflare-hosted-deploy/linq-scheduled-reminder.log
            .artifacts/hosted-local/**/state.json
          if-no-files-found: warn

      - name: Stop Postgres
        if: always()
        shell: bash
        run: |
          docker rm -f "murph-hosted-e2e-postgres-${GITHUB_RUN_ID}-${GITHUB_JOB}" >/dev/null 2>&1 || true

  cloudflare-runner-smoke-gate:
    name: Cloudflare verify and runner smoke gate
    if: ${{ inputs.deploy_worker && !inputs.skip_predeploy_e2e && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      MURPH_RUNNER_BUNDLE_BUILD_CONCURRENCY: 1
      MURPH_RUNNER_BUNDLE_PACK_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Login to GHCR for runner model image
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare runner bundle and base image
        run: pnpm --dir apps/cloudflare runner:bundle && pnpm --dir apps/cloudflare runner:docker:base -- --force

      - name: Run focused Cloudflare checks and smoke runner container image
        shell: bash
        run: |
          set -euo pipefail

          pids=()
          cleanup() {
            local pid
            for pid in "${pids[@]}"; do
              if kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
              fi
            done
          }
          trap 'cleanup; exit 130' INT TERM

          pnpm --dir apps/cloudflare verify:parallel &
          pids+=("$!")
          pnpm --dir apps/cloudflare runner:docker:smoke:prepared-base &
          pids+=("$!")

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=$?
          done
          trap - INT TERM
          exit "$status"

  immediate-build-prep-gate:
    name: Immediate deploy build prep
    if: ${{ inputs.deploy_worker && inputs.skip_predeploy_e2e && inputs.container_rollout == 'immediate' && github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      MURPH_RUNNER_BUNDLE_BUILD_CONCURRENCY: 1
      MURPH_RUNNER_BUNDLE_PACK_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Login to GHCR for runner model image
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run hosted Codex auth deploy guard
        shell: bash
        env:
          MURPH_RUN_HOSTED_CODEX_AUTH_E2E: "1"
        run: |
          set -euo pipefail

          codex_cli_version="$(
            sed -n 's/^ARG CODEX_CLI_VERSION=//p' Dockerfile.cloudflare-hosted-runner-base | tail -n 1
          )"
          if [[ -z "${codex_cli_version}" ]]; then
            echo "Missing CODEX_CLI_VERSION in Dockerfile.cloudflare-hosted-runner-base" >&2
            exit 1
          fi

          npm_prefix="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/hosted-codex-auth-guard-npm"
          mkdir -p "${npm_prefix}"
          npm install --prefix "${npm_prefix}" --global --omit=dev --no-audit --no-fund --ignore-scripts "@openai/codex@${codex_cli_version}"
          export PATH="${npm_prefix}/bin:${PATH}"
          codex --version
          pnpm --dir packages/assistant-runtime exec vitest run --config vitest.config.ts --no-coverage test/hosted-runtime-codex-config.test.ts

      - name: Prepare immediate runner bundle and base image
        run: pnpm --dir apps/cloudflare runner:bundle && pnpm --dir apps/cloudflare runner:docker:base -- --force

      - name: Save immediate build artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/cloudflare-hosted-deploy
          tar --hard-dereference -czf .artifacts/cloudflare-hosted-deploy/runner-bundle.tar.gz \
            -C apps/cloudflare/.deploy \
            runner-bundle
          docker save murph-cloudflare-runner-base:node24.14.1-whisper1.8.1-codex0.135.0-base-en \
            | gzip -1 > .artifacts/cloudflare-hosted-deploy/runner-base-image.tar.gz

      - name: Upload immediate build handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cloudflare-hosted-immediate-build-${{ github.sha }}
          path: |
            .artifacts/cloudflare-hosted-deploy/runner-bundle.tar.gz
            .artifacts/cloudflare-hosted-deploy/runner-base-image.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  codex-auth-deploy-guard:
    name: Hosted Codex auth deploy guard
    if: ${{ !(inputs.deploy_worker && inputs.skip_predeploy_e2e && inputs.container_rollout == 'immediate') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run hosted Codex auth deploy guard
        shell: bash
        env:
          MURPH_RUN_HOSTED_CODEX_AUTH_E2E: "1"
        run: |
          set -euo pipefail

          codex_cli_version="$(
            sed -n 's/^ARG CODEX_CLI_VERSION=//p' Dockerfile.cloudflare-hosted-runner-base | tail -n 1
          )"
          if [[ -z "${codex_cli_version}" ]]; then
            echo "Missing CODEX_CLI_VERSION in Dockerfile.cloudflare-hosted-runner-base" >&2
            exit 1
          fi

          npm_prefix="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/hosted-codex-auth-guard-npm"
          mkdir -p "${npm_prefix}"
          npm install --prefix "${npm_prefix}" --global --omit=dev --no-audit --no-fund --ignore-scripts "@openai/codex@${codex_cli_version}"
          export PATH="${npm_prefix}/bin:${PATH}"
          codex --version
          pnpm --dir packages/assistant-runtime exec vitest run --config vitest.config.ts --no-coverage test/hosted-runtime-codex-config.test.ts

  deploy:
    name: Deploy hosted execution (${{ inputs.environment }})
    needs:
      - codex-cache-prefix-gate
      - linq-delivery-gate
      - linq-scheduled-reminder-gate
      - cloudflare-runner-smoke-gate
      - immediate-build-prep-gate
      - codex-auth-deploy-guard
    if: ${{ !cancelled() && ((inputs.skip_predeploy_e2e && !inputs.deploy_worker && needs.codex-auth-deploy-guard.result == 'success') || (inputs.skip_predeploy_e2e && inputs.deploy_worker && inputs.container_rollout == 'immediate' && needs.immediate-build-prep-gate.result == 'success') || (!inputs.skip_predeploy_e2e && needs.codex-auth-deploy-guard.result == 'success' && needs.codex-cache-prefix-gate.result == 'success' && needs.linq-delivery-gate.result == 'success' && needs.linq-scheduled-reminder-gate.result == 'success' && (!inputs.deploy_worker || needs.cloudflare-runner-smoke-gate.result == 'success'))) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    concurrency:
      group: cloudflare-hosted-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CF_ALLOWED_RUNNER_SECRET_KEYS: ${{ vars.CF_ALLOWED_RUNNER_SECRET_KEYS }}
      CF_BUNDLES_BUCKET: ${{ vars.CF_BUNDLES_BUCKET }}
      CF_BUNDLES_PREVIEW_BUCKET: ${{ vars.CF_BUNDLES_PREVIEW_BUCKET }}
      CF_COMPATIBILITY_DATE: ${{ vars.CF_COMPATIBILITY_DATE }}
      CF_CONTAINER_INSTANCE_TYPE: ${{ vars.CF_CONTAINER_INSTANCE_TYPE || '{"vcpu":1,"memory_mib":3072,"disk_mb":6000}' }}
      CF_CONTAINER_MAX_INSTANCES: ${{ vars.CF_CONTAINER_MAX_INSTANCES || '1000' }}
      CF_CONTAINER_SSH_KEY_NAME: ${{ vars.CF_CONTAINER_SSH_KEY_NAME }}
      CF_CONTAINER_SSH_PUBLIC_KEY: ${{ vars.CF_CONTAINER_SSH_PUBLIC_KEY }}
      CF_DEFAULT_ALARM_DELAY_MS: ${{ vars.CF_DEFAULT_ALARM_DELAY_MS }}
      CF_LOG_HEAD_SAMPLING_RATE: ${{ vars.CF_LOG_HEAD_SAMPLING_RATE }}
      CF_MAX_EVENT_ATTEMPTS: ${{ vars.CF_MAX_EVENT_ATTEMPTS }}
      CF_HOSTED_EMAIL_SEND_BINDING_ENABLED: ${{ inputs.hosted_email_send_binding }}
      CF_PUBLIC_BASE_URL: ${{ vars.CF_PUBLIC_BASE_URL }}
      CF_RETRY_DELAY_MS: ${{ vars.CF_RETRY_DELAY_MS }}
      CF_RUNNER_COMMIT_TIMEOUT_MS: ${{ vars.CF_RUNNER_COMMIT_TIMEOUT_MS }}
      CF_RUNNER_READY_TIMEOUT_MS: ${{ vars.CF_RUNNER_READY_TIMEOUT_MS }}
      CF_RUNNER_TIMEOUT_MS: ${{ vars.CF_RUNNER_TIMEOUT_MS }}
      CF_WEB_CONTROL_TIMEOUT_MS: ${{ vars.CF_WEB_CONTROL_TIMEOUT_MS }}
      CF_TRACE_HEAD_SAMPLING_RATE: ${{ vars.CF_TRACE_HEAD_SAMPLING_RATE }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      HOSTED_CRYPTO_AUTHORITY_SIGN_KEY_VERSION: ${{ vars.HOSTED_CRYPTO_AUTHORITY_SIGN_KEY_VERSION }}
      HOSTED_CRYPTO_AUTHORITY_SIGN_PUBLIC_KEY_PEM: ${{ vars.HOSTED_CRYPTO_AUTHORITY_SIGN_PUBLIC_KEY_PEM }}
      HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_KEY_ID: ${{ vars.HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_KEY_ID }}
      HOSTED_CRYPTO_ENV: ${{ vars.HOSTED_CRYPTO_ENV }}
      HOSTED_EXECUTION_RUNNER_ENV_PROFILES: ${{ vars.HOSTED_EXECUTION_RUNNER_ENV_PROFILES || 'hosted-email,linq,mapbox,telegram,whatsapp' }}
      HOSTED_EXECUTION_RUNNER_IDLE_TTL_MS: ${{ inputs.runner_idle_ttl_ms || vars.HOSTED_EXECUTION_RUNNER_IDLE_TTL_MS }}
      HOSTED_EXECUTION_VERCEL_OIDC_ENVIRONMENT: ${{ vars.HOSTED_EXECUTION_VERCEL_OIDC_ENVIRONMENT || 'production' }}
      HOSTED_EXECUTION_VERCEL_OIDC_PROJECT_NAME: ${{ vars.HOSTED_EXECUTION_VERCEL_OIDC_PROJECT_NAME }}
      HOSTED_EXECUTION_VERCEL_OIDC_TEAM_SLUG: ${{ vars.HOSTED_EXECUTION_VERCEL_OIDC_TEAM_SLUG }}
      HOSTED_R2_PRESIGN_ACCOUNT_ID: ${{ vars.HOSTED_R2_PRESIGN_ACCOUNT_ID }}
      HOSTED_R2_PRESIGN_BUCKET_NAME: ${{ vars.HOSTED_R2_PRESIGN_BUCKET_NAME || vars.CF_BUNDLES_BUCKET }}
      HOSTED_R2_PRESIGN_ENDPOINT: ${{ vars.HOSTED_R2_PRESIGN_ENDPOINT }}
      HOSTED_EMAIL_DEFAULT_SUBJECT: ${{ vars.HOSTED_EMAIL_DEFAULT_SUBJECT }}
      HOSTED_EMAIL_DOMAIN: ${{ vars.HOSTED_EMAIL_DOMAIN }}
      HOSTED_EMAIL_FROM_ADDRESS: ${{ vars.HOSTED_EMAIL_FROM_ADDRESS }}
      HOSTED_EMAIL_LOCAL_PART: ${{ vars.HOSTED_EMAIL_LOCAL_PART }}
      HOSTED_AI_USAGE_BILLING_MODE: ${{ vars.HOSTED_AI_USAGE_BILLING_MODE }}
      HOSTED_AI_USAGE_VERCEL_STRIPE_BILLING_ENABLED: ${{ vars.HOSTED_AI_USAGE_VERCEL_STRIPE_BILLING_ENABLED }}
      HOSTED_ASSISTANT_APPROVAL_POLICY: ${{ vars.HOSTED_ASSISTANT_APPROVAL_POLICY }}
      HOSTED_ASSISTANT_MODEL: ${{ vars.HOSTED_ASSISTANT_MODEL }}
      HOSTED_ASSISTANT_PROVIDER: ${{ vars.HOSTED_ASSISTANT_PROVIDER }}
      HOSTED_ASSISTANT_REASONING_EFFORT: ${{ vars.HOSTED_ASSISTANT_REASONING_EFFORT }}
      HOSTED_ASSISTANT_SANDBOX: ${{ vars.HOSTED_ASSISTANT_SANDBOX }}
      HOSTED_WEB_BASE_URL: ${{ vars.HOSTED_WEB_BASE_URL }}
      HOSTED_WEB_PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
      HOSTED_WEB_CALLBACK_SIGNING_KEY_ID: ${{ vars.HOSTED_WEB_CALLBACK_SIGNING_KEY_ID }}
      MURPH_HOSTED_CHECKPOINT_DEBUG_PATHS: ${{ vars.MURPH_HOSTED_CHECKPOINT_DEBUG_PATHS }}
      MURPH_HOSTED_CHECKPOINT_DEBUG_PATHS_FILE: ${{ vars.MURPH_HOSTED_CHECKPOINT_DEBUG_PATHS_FILE }}
      MURPH_HOSTED_CHECKPOINT_DEBUG_PATHS_LOG: ${{ vars.MURPH_HOSTED_CHECKPOINT_DEBUG_PATHS_LOG }}
      MURPH_HOSTED_CHECKPOINT_DEBUG_PATHS_LOG_LIMIT: ${{ vars.MURPH_HOSTED_CHECKPOINT_DEBUG_PATHS_LOG_LIMIT }}
      MURPH_HOSTED_CHECKPOINT_DEBUG_PATHS_LOG_RAW: ${{ vars.MURPH_HOSTED_CHECKPOINT_DEBUG_PATHS_LOG_RAW }}
      DEVICE_SYNC_PUBLIC_BASE_URL: ${{ vars.DEVICE_SYNC_PUBLIC_BASE_URL }}
      JUNCTION_ENV: ${{ vars.JUNCTION_ENV }}
      JUNCTION_REGION: ${{ vars.JUNCTION_REGION }}
      JUNCTION_ALLOW_CUSTOM_BASE_URL: ${{ vars.JUNCTION_ALLOW_CUSTOM_BASE_URL }}
      JUNCTION_BASE_URL: ${{ vars.JUNCTION_BASE_URL }}
      JUNCTION_PROVIDER_FILTER: ${{ vars.JUNCTION_PROVIDER_FILTER }}
      JUNCTION_SUMMARY_RESOURCES: ${{ vars.JUNCTION_SUMMARY_RESOURCES }}
      JUNCTION_TIMESERIES_RESOURCES: ${{ vars.JUNCTION_TIMESERIES_RESOURCES }}
      JUNCTION_SUMMARY_BACKFILL_DAYS: ${{ vars.JUNCTION_SUMMARY_BACKFILL_DAYS }}
      JUNCTION_TIMESERIES_BACKFILL_DAYS: ${{ vars.JUNCTION_TIMESERIES_BACKFILL_DAYS }}
      JUNCTION_RESOURCE_OVERRIDES: ${{ vars.JUNCTION_RESOURCE_OVERRIDES }}
      JUNCTION_RECONCILE_DAYS: ${{ vars.JUNCTION_RECONCILE_DAYS }}
      JUNCTION_RECONCILE_INTERVAL_MS: ${{ vars.JUNCTION_RECONCILE_INTERVAL_MS }}
      JUNCTION_REQUEST_TIMEOUT_MS: ${{ vars.JUNCTION_REQUEST_TIMEOUT_MS }}
      JUNCTION_WEBHOOK_TIMESTAMP_TOLERANCE_MS: ${{ vars.JUNCTION_WEBHOOK_TIMESTAMP_TOLERANCE_MS }}
      JUNCTION_PER_ACCOUNT_CONCURRENCY: ${{ vars.JUNCTION_PER_ACCOUNT_CONCURRENCY }}
      JUNCTION_GLOBAL_CONCURRENCY: ${{ vars.JUNCTION_GLOBAL_CONCURRENCY }}
      GARMIN_API_BASE_URL: ${{ vars.GARMIN_API_BASE_URL }}
      GARMIN_AUTH_BASE_URL: ${{ vars.GARMIN_AUTH_BASE_URL }}
      GARMIN_BACKFILL_DAYS: ${{ vars.GARMIN_BACKFILL_DAYS }}
      GARMIN_RECONCILE_DAYS: ${{ vars.GARMIN_RECONCILE_DAYS }}
      GARMIN_RECONCILE_INTERVAL_MS: ${{ vars.GARMIN_RECONCILE_INTERVAL_MS }}
      GARMIN_REQUEST_TIMEOUT_MS: ${{ vars.GARMIN_REQUEST_TIMEOUT_MS }}
      GARMIN_TOKEN_BASE_URL: ${{ vars.GARMIN_TOKEN_BASE_URL }}
      OURA_API_BASE_URL: ${{ vars.OURA_API_BASE_URL }}
      OURA_AUTH_BASE_URL: ${{ vars.OURA_AUTH_BASE_URL }}
      OURA_BACKFILL_DAYS: ${{ vars.OURA_BACKFILL_DAYS }}
      OURA_RECONCILE_DAYS: ${{ vars.OURA_RECONCILE_DAYS }}
      OURA_RECONCILE_INTERVAL_MS: ${{ vars.OURA_RECONCILE_INTERVAL_MS }}
      OURA_REQUEST_TIMEOUT_MS: ${{ vars.OURA_REQUEST_TIMEOUT_MS }}
      OURA_SCOPES: ${{ vars.OURA_SCOPES }}
      OURA_WEBHOOK_TIMESTAMP_TOLERANCE_MS: ${{ vars.OURA_WEBHOOK_TIMESTAMP_TOLERANCE_MS }}
      STRAVA_API_BASE_URL: ${{ vars.STRAVA_API_BASE_URL }}
      STRAVA_AUTH_BASE_URL: ${{ vars.STRAVA_AUTH_BASE_URL }}
      STRAVA_BACKFILL_DAYS: ${{ vars.STRAVA_BACKFILL_DAYS }}
      STRAVA_RECONCILE_DAYS: ${{ vars.STRAVA_RECONCILE_DAYS }}
      STRAVA_RECONCILE_INTERVAL_MS: ${{ vars.STRAVA_RECONCILE_INTERVAL_MS }}
      STRAVA_REQUEST_TIMEOUT_MS: ${{ vars.STRAVA_REQUEST_TIMEOUT_MS }}
      STRAVA_SCOPES: ${{ vars.STRAVA_SCOPES }}
      STRAVA_WEBHOOK_TIMESTAMP_TOLERANCE_MS: ${{ vars.STRAVA_WEBHOOK_TIMESTAMP_TOLERANCE_MS }}
      WHOOP_BACKFILL_DAYS: ${{ vars.WHOOP_BACKFILL_DAYS }}
      WHOOP_BASE_URL: ${{ vars.WHOOP_BASE_URL }}
      WHOOP_RECONCILE_DAYS: ${{ vars.WHOOP_RECONCILE_DAYS }}
      WHOOP_RECONCILE_INTERVAL_MS: ${{ vars.WHOOP_RECONCILE_INTERVAL_MS }}
      WHOOP_REQUEST_TIMEOUT_MS: ${{ vars.WHOOP_REQUEST_TIMEOUT_MS }}
      WHOOP_SCOPES: ${{ vars.WHOOP_SCOPES }}
      WHOOP_WEBHOOK_TIMESTAMP_TOLERANCE_MS: ${{ vars.WHOOP_WEBHOOK_TIMESTAMP_TOLERANCE_MS }}
      LINQ_API_BASE_URL: ${{ vars.LINQ_API_BASE_URL }}
      TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
      TELEGRAM_API_BASE_URL: ${{ vars.TELEGRAM_API_BASE_URL }}
      TELEGRAM_FILE_BASE_URL: ${{ vars.TELEGRAM_FILE_BASE_URL }}
      WHATSAPP_API_BASE_URL: ${{ vars.WHATSAPP_API_BASE_URL }}
      WHATSAPP_GRAPH_VERSION: ${{ vars.WHATSAPP_GRAPH_VERSION }}
      WHISPER_MODEL_PATH: ${{ vars.WHISPER_MODEL_PATH }}
      WHISPER_COMMAND: ${{ vars.WHISPER_COMMAND }}
      FFMPEG_COMMAND: ${{ vars.FFMPEG_COMMAND }}
      HOSTED_EXECUTION_SMOKE_WORKER_BASE_URL: ${{ vars.CF_PUBLIC_BASE_URL }}
      HOSTED_EXECUTION_SMOKE_DIRECT_R2_PRESIGNED_PUT: ${{ inputs.container_rollout == 'immediate' && 'true' || 'false' }}
      HOSTED_EXECUTION_SMOKE_RUNNER_CONTAINER: ${{ inputs.container_rollout == 'immediate' && 'true' || 'false' }}
      HOSTED_EXECUTION_SMOKE_RUNNER_RETRY_DELAY_MS: "3000"
      HOSTED_EXECUTION_SMOKE_USER_ID: ${{ inputs.smoke_user_id }}
      MURPH_RUNNER_BUNDLE_BUILD_CONCURRENCY: 1
      MURPH_RUNNER_BUNDLE_PACK_CONCURRENCY: 4
    steps:
      - name: Validate trusted deploy ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production deploys must be dispatched from main." >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_PROTECTED}" != "true" ]]; then
            echo "Production deploys require a protected main ref." >&2
            exit 1
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checked-out deploy commit
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Deploy commit SHA: ${checked_out_sha}"
          echo "Expected GitHub SHA: ${GITHUB_SHA}"
          if [[ "${checked_out_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Checked-out commit does not match the validated deploy commit." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Download immediate build handoff
        if: ${{ inputs.deploy_worker && inputs.skip_predeploy_e2e && inputs.container_rollout == 'immediate' }}
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: cloudflare-hosted-immediate-build-${{ github.sha }}
          path: .

      - name: Restore immediate build handoff
        if: ${{ inputs.deploy_worker && inputs.skip_predeploy_e2e && inputs.container_rollout == 'immediate' }}
        run: |
          set -euo pipefail
          resolve_handoff_archive() {
            local expected_path="$1"
            local archive_name="$2"
            if [[ -f "${expected_path}" ]]; then
              printf '%s\n' "${expected_path}"
              return
            fi

            mapfile -t matches < <(find . -type f -name "${archive_name}" | sort)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one downloaded ${archive_name}; found ${#matches[@]}." >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          bundle_archive="$(
            resolve_handoff_archive \
              ".artifacts/cloudflare-hosted-deploy/runner-bundle.tar.gz" \
              "runner-bundle.tar.gz"
          )"
          runner_base_archive="$(
            resolve_handoff_archive \
              ".artifacts/cloudflare-hosted-deploy/runner-base-image.tar.gz" \
              "runner-base-image.tar.gz"
          )"
          restore_staging="$(mktemp -d)"
          cleanup_restore_staging() {
            rm -rf "${restore_staging}"
          }
          trap cleanup_restore_staging EXIT

          BUNDLE_ARCHIVE="${bundle_archive}" python3 <<'PY'
          import os
          import posixpath
          import sys
          import tarfile

          archive_path = os.environ["BUNDLE_ARCHIVE"]

          def fail(message: str) -> None:
              print(message, file=sys.stderr)
              raise SystemExit(1)

          def normalize_bundle_path(path: str, label: str) -> str:
              if not path or path.startswith("/"):
                  fail(f"Unsafe runner bundle {label}.")
              parts = path.split("/")
              if any(part == ".." for part in parts):
                  fail(f"Unsafe runner bundle {label}.")
              normalized = posixpath.normpath(path)
              if normalized == ".":
                  fail(f"Unsafe runner bundle {label}.")
              if normalized != "runner-bundle" and not normalized.startswith("runner-bundle/"):
                  fail(f"Unexpected runner bundle {label}.")
              return normalized

          with tarfile.open(archive_path, "r:gz") as archive:
              for member in archive.getmembers():
                  member_path = normalize_bundle_path(member.name, "archive entry")
                  if not (member.isfile() or member.isdir() or member.issym() or member.islnk()):
                      fail("Unsupported runner bundle archive entry type.")
                  if member.islnk():
                      normalize_bundle_path(member.linkname, "hardlink target")
                  if member.issym():
                      link_target = member.linkname
                      if not link_target or link_target.startswith("/"):
                          fail("Unsafe runner bundle symlink target.")
                      resolved_target = posixpath.normpath(
                          posixpath.join(posixpath.dirname(member_path), link_target),
                      )
                      normalize_bundle_path(resolved_target, "symlink target")
          PY

          mkdir -p apps/cloudflare/.deploy
          tar --no-same-owner --no-same-permissions -xzf "${bundle_archive}" \
            -C "${restore_staging}"
          if [[ ! -d "${restore_staging}/runner-bundle" ]]; then
            echo "Runner bundle archive did not contain runner-bundle." >&2
            exit 1
          fi
          bundle_root="$(realpath -m "${restore_staging}/runner-bundle")"
          while IFS= read -r -d '' link_path; do
            link_target="$(readlink "${link_path}")"
            if [[ "${link_target}" == /* ]]; then
              echo "Unsafe absolute runner bundle symlink target." >&2
              exit 1
            fi
            link_dir="$(dirname "${link_path}")"
            resolved_target="$(realpath -m "${link_dir}/${link_target}")"
            if [[ "${resolved_target}" != "${bundle_root}" && "${resolved_target}" != "${bundle_root}/"* ]]; then
              echo "Unsafe runner bundle symlink target." >&2
              exit 1
            fi
          done < <(find "${restore_staging}/runner-bundle" -type l -print0)
          rm -rf apps/cloudflare/.deploy/runner-bundle
          mv "${restore_staging}/runner-bundle" apps/cloudflare/.deploy/runner-bundle
          gzip -dc "${runner_base_archive}" | docker load

      - name: Validate immediate runner bundle manifest
        if: ${{ inputs.deploy_worker && inputs.skip_predeploy_e2e && inputs.container_rollout == 'immediate' }}
        run: pnpm --dir apps/cloudflare runner:bundle:manifest:validate

      - name: Validate required deploy environment
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HOSTED_EXECUTION_DEPLOY_CONTEXT: ${{ inputs.environment }}
          HOSTED_EXECUTION_DEPLOY_WORKER: ${{ inputs.deploy_worker }}
          HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_PRIVATE_JWK: ${{ secrets.HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_PRIVATE_JWK }}
          HOSTED_LOG_FINGERPRINT_SECRET: ${{ secrets.HOSTED_LOG_FINGERPRINT_SECRET }}
          HOSTED_R2_PRESIGN_ACCESS_KEY_ID: ${{ secrets.HOSTED_R2_PRESIGN_ACCESS_KEY_ID }}
          HOSTED_R2_PRESIGN_SECRET_ACCESS_KEY: ${{ secrets.HOSTED_R2_PRESIGN_SECRET_ACCESS_KEY }}
          HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK: ${{ secrets.HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK }}
          JUNCTION_API_KEY: ${{ secrets.JUNCTION_API_KEY }}
          JUNCTION_CLIENT_USER_ID_SECRET: ${{ secrets.JUNCTION_CLIENT_USER_ID_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: pnpm --dir apps/cloudflare deploy:preflight

      - name: Prepare deploy artifacts
        if: ${{ inputs.deploy_worker && !(inputs.skip_predeploy_e2e && inputs.container_rollout == 'immediate') }}
        run: pnpm --dir apps/cloudflare deploy:config:render && pnpm --dir apps/cloudflare runner:bundle

      - name: Render deploy config for immediate handoff
        if: ${{ inputs.deploy_worker && inputs.skip_predeploy_e2e && inputs.container_rollout == 'immediate' }}
        run: pnpm --dir apps/cloudflare deploy:config:render && pnpm --dir apps/cloudflare runner:bundle:manifest:refresh

      - name: Login to GHCR for runner model image
        if: ${{ inputs.deploy_worker && !(inputs.skip_predeploy_e2e && inputs.container_rollout == 'immediate') }}
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare runner base image
        if: ${{ inputs.deploy_worker && !(inputs.skip_predeploy_e2e && inputs.container_rollout == 'immediate') }}
        run: pnpm --dir apps/cloudflare runner:docker:base -- --force

      - name: Render Worker secrets
        if: ${{ inputs.deploy_worker && inputs.sync_worker_secrets }}
        env:
          DEVICE_SYNC_SECRET: ${{ secrets.DEVICE_SYNC_SECRET }}
          GARMIN_CLIENT_ID: ${{ secrets.GARMIN_CLIENT_ID }}
          GARMIN_CLIENT_SECRET: ${{ secrets.GARMIN_CLIENT_SECRET }}
          HOSTED_AI_USAGE_GATE_ALLOW_SIGNING_KEY_ID: ${{ secrets.HOSTED_AI_USAGE_GATE_ALLOW_SIGNING_KEY_ID }}
          HOSTED_AI_USAGE_GATE_ALLOW_SIGNING_SECRET: ${{ secrets.HOSTED_AI_USAGE_GATE_ALLOW_SIGNING_SECRET }}
          HOSTED_AI_USAGE_REPORTING_SECRET: ${{ secrets.HOSTED_AI_USAGE_REPORTING_SECRET }}
          HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_PRIVATE_JWK: ${{ secrets.HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_PRIVATE_JWK }}
          HOSTED_EMAIL_SIGNING_SECRET: ${{ secrets.HOSTED_EMAIL_SIGNING_SECRET }}
          HOSTED_LOG_FINGERPRINT_SECRET: ${{ secrets.HOSTED_LOG_FINGERPRINT_SECRET }}
          HOSTED_R2_PRESIGN_ACCESS_KEY_ID: ${{ secrets.HOSTED_R2_PRESIGN_ACCESS_KEY_ID }}
          HOSTED_R2_PRESIGN_SECRET_ACCESS_KEY: ${{ secrets.HOSTED_R2_PRESIGN_SECRET_ACCESS_KEY }}
          HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK: ${{ secrets.HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK }}
          JUNCTION_API_KEY: ${{ secrets.JUNCTION_API_KEY }}
          JUNCTION_CLIENT_USER_ID_SECRET: ${{ secrets.JUNCTION_CLIENT_USER_ID_SECRET }}
          JUNCTION_WEBHOOK_SECRET: ${{ secrets.JUNCTION_WEBHOOK_SECRET }}
          LINQ_API_TOKEN: ${{ secrets.LINQ_API_TOKEN }}
          LINQ_WEBHOOK_SECRET: ${{ secrets.LINQ_WEBHOOK_SECRET }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_WEBHOOK_SIGNING_SECRET: ${{ secrets.STRAVA_WEBHOOK_SIGNING_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: pnpm --dir apps/cloudflare deploy:secrets:render

      - name: Validate generated Worker deploy bundle
        if: ${{ inputs.deploy_worker }}
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HOSTED_EXECUTION_CONTAINER_ROLLOUT: ${{ inputs.container_rollout }}
          HOSTED_EXECUTION_INCLUDE_SECRETS: ${{ inputs.sync_worker_secrets }}
        run: |
          set -euo pipefail

          deploy_args=(
            deploy
            --config
            ./.deploy/wrangler.generated.jsonc
            --dry-run
            --message
            "predeploy dry run ${GITHUB_SHA}"
            --name
            "${CF_WORKER_NAME}"
            --tag
            "predeploy-${GITHUB_SHA::12}"
          )

          if [[ "${HOSTED_EXECUTION_CONTAINER_ROLLOUT}" == "immediate" ]]; then
            deploy_args+=(--containers-rollout=immediate)
          fi

          if [[ "${HOSTED_EXECUTION_INCLUDE_SECRETS}" == "true" ]]; then
            deploy_args+=(--secrets-file ./.deploy/worker-secrets.json)
          fi

          pnpm --dir apps/cloudflare exec wrangler "${deploy_args[@]}"

      - name: Run focused Cloudflare checks
        if: ${{ !inputs.deploy_worker }}
        run: pnpm --dir apps/cloudflare verify:parallel

      - name: Show generated artifact paths
        if: ${{ inputs.deploy_worker }}
        run: ls -lah apps/cloudflare/.deploy

      - name: Deploy Worker
        id: deploy
        if: ${{ inputs.deploy_worker }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEVICE_SYNC_SECRET: ${{ secrets.DEVICE_SYNC_SECRET }}
          GARMIN_CLIENT_ID: ${{ secrets.GARMIN_CLIENT_ID }}
          GARMIN_CLIENT_SECRET: ${{ secrets.GARMIN_CLIENT_SECRET }}
          HOSTED_EXECUTION_CONTAINER_ROLLOUT: ${{ inputs.container_rollout }}
          HOSTED_EXECUTION_DEPLOY_CONTEXT: ${{ inputs.environment }}
          HOSTED_EXECUTION_INCLUDE_SECRETS: ${{ inputs.sync_worker_secrets }}
          HOSTED_AI_USAGE_GATE_ALLOW_SIGNING_KEY_ID: ${{ secrets.HOSTED_AI_USAGE_GATE_ALLOW_SIGNING_KEY_ID }}
          HOSTED_AI_USAGE_GATE_ALLOW_SIGNING_SECRET: ${{ secrets.HOSTED_AI_USAGE_GATE_ALLOW_SIGNING_SECRET }}
          HOSTED_AI_USAGE_REPORTING_SECRET: ${{ secrets.HOSTED_AI_USAGE_REPORTING_SECRET }}
          HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_PRIVATE_JWK: ${{ secrets.HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_PRIVATE_JWK }}
          HOSTED_EMAIL_SIGNING_SECRET: ${{ secrets.HOSTED_EMAIL_SIGNING_SECRET }}
          HOSTED_LOG_FINGERPRINT_SECRET: ${{ secrets.HOSTED_LOG_FINGERPRINT_SECRET }}
          HOSTED_R2_PRESIGN_ACCESS_KEY_ID: ${{ secrets.HOSTED_R2_PRESIGN_ACCESS_KEY_ID }}
          HOSTED_R2_PRESIGN_SECRET_ACCESS_KEY: ${{ secrets.HOSTED_R2_PRESIGN_SECRET_ACCESS_KEY }}
          HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK: ${{ secrets.HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK }}
          JUNCTION_API_KEY: ${{ secrets.JUNCTION_API_KEY }}
          JUNCTION_CLIENT_USER_ID_SECRET: ${{ secrets.JUNCTION_CLIENT_USER_ID_SECRET }}
          JUNCTION_WEBHOOK_SECRET: ${{ secrets.JUNCTION_WEBHOOK_SECRET }}
          LINQ_API_TOKEN: ${{ secrets.LINQ_API_TOKEN }}
          LINQ_WEBHOOK_SECRET: ${{ secrets.LINQ_WEBHOOK_SECRET }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_WEBHOOK_SIGNING_SECRET: ${{ secrets.STRAVA_WEBHOOK_SIGNING_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
        run: pnpm --dir apps/cloudflare deploy:worker:apply -- --config ./.deploy/wrangler.generated.jsonc

      - name: Print Wrangler failure log
        if: ${{ failure() && inputs.deploy_worker }}
        shell: bash
        run: |
          set -euo pipefail

          log_dir="${HOME}/.config/.wrangler/logs"
          if [[ ! -d "${log_dir}" ]]; then
            echo "No Wrangler log directory found."
            exit 0
          fi

          latest_log="$(
            find "${log_dir}" -maxdepth 1 -type f -name 'wrangler-*.log' -print 2>/dev/null \
              | sort \
              | tail -n 1
          )"
          if [[ -z "${latest_log}" ]]; then
            echo "No Wrangler log files found."
            exit 0
          fi

          echo "::group::Latest Wrangler log ($(basename "${latest_log}"))"
          stop_marker="wrangler-log-${RANDOM}-${RANDOM}"
          echo "::stop-commands::${stop_marker}"
          LOG_PATH="${latest_log}" node <<'NODE' || true
          const fs = require("node:fs");

          const logPath = process.env.LOG_PATH;
          const text = fs.readFileSync(logPath, "utf8");
          const tail = text.split(/\r?\n/).slice(-400).join("\n");
          const redacted = tail
            .replace(/(Authorization:\s*(?:Bearer|Basic)\s+)[^\s"']+/gi, "$1<REDACTED>")
            .replace(/(X-Amz-(?:Credential|Signature|Security-Token)=)[^&\s"']+/gi, "$1<REDACTED>")
            .replace(
              /((?:api|auth|access|refresh|id)?[_-]?(?:token|secret|password|private[_-]?jwk|key)\s*[:=]\s*["']?)[^"',\s}]+/gi,
              "$1<REDACTED>",
            );

          process.stdout.write(redacted);
          if (!redacted.endsWith("\n")) {
            process.stdout.write("\n");
          }
          NODE
          echo "::${stop_marker}::"
          echo "::endgroup::"

      - name: Smoke test deployed endpoints
        if: ${{ inputs.deploy_worker }}
        env:
          HOSTED_EXECUTION_SMOKE_VERSION_ID: ${{ steps.deploy.outputs.smoke_version_id }}
          HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK: ${{ secrets.HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK }}
        run: pnpm --dir apps/cloudflare deploy:smoke

      - name: Publish deployment summary
        shell: bash
        env:
          DEPLOY_SUMMARY_CONTAINER_ROLLOUT: ${{ inputs.container_rollout }}
          DEPLOY_SUMMARY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_SUMMARY_FINAL_VERSION_TRAFFIC: ${{ steps.deploy.outputs.final_version_traffic || 'not-deployed' }}
          DEPLOY_SUMMARY_RUNNER_IDLE_TTL_MS: ${{ inputs.runner_idle_ttl_ms || 'environment default' }}
          DEPLOY_SUMMARY_SMOKE_USER_ID: ${{ inputs.smoke_user_id || 'not-set' }}
        run: |
          {
            printf '%s\n' "## Cloudflare hosted execution deploy"
            printf '\n'
            printf -- '- Environment: `%s`\n' "${DEPLOY_SUMMARY_ENVIRONMENT}"
            printf -- '- Deploy strategy: `%s`\n' "direct"
            printf -- '- Container rollout: `%s`\n' "${DEPLOY_SUMMARY_CONTAINER_ROLLOUT}"
            printf -- '- Runner idle TTL override: `%s`\n' "${DEPLOY_SUMMARY_RUNNER_IDLE_TTL_MS}"
            printf -- '- Worker name: `%s`\n' "${CF_WORKER_NAME}"
            printf -- '- Worker URL: `%s`\n' "${CF_PUBLIC_BASE_URL:-not-set}"
            printf -- '- Container instance type: `%s`\n' "${CF_CONTAINER_INSTANCE_TYPE}"
            printf -- '- Container max instances: `%s`\n' "${CF_CONTAINER_MAX_INSTANCES}"
            printf '%s\n' "- Native container image: base prepared from \`Dockerfile.cloudflare-hosted-runner-base\`; app layer built from \`Dockerfile.cloudflare-hosted-runner\` during deploy"
            printf -- '- Deployed versions: `%s`\n' "${DEPLOY_SUMMARY_FINAL_VERSION_TRAFFIC}"
            printf -- '- Smoke user id: `%s`\n' "${DEPLOY_SUMMARY_SMOKE_USER_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
