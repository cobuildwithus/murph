name: Deploy Cloudflare Hosted Execution

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment to deploy from
        required: true
        default: production
        type: choice
        options:
          - production
      sync_worker_secrets:
        description: Include the rendered Worker secrets file during deploy
        required: true
        default: true
        type: boolean
      deploy_worker:
        description: Deploy the Cloudflare Worker after rendering config
        required: true
        default: true
        type: boolean
      container_rollout:
        description: Container rollout behavior for Worker deploys
        required: true
        default: gradual
        type: choice
        options:
          - gradual
          - immediate
      smoke_user_id:
        description: Optional hosted user id for a manual /run smoke test
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy hosted execution (${{ inputs.environment }})
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    concurrency:
      group: cloudflare-hosted-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ALLOWED_RUNNER_SECRET_KEYS: ${{ vars.CF_ALLOWED_RUNNER_SECRET_KEYS }}
      CF_BUNDLES_BUCKET: ${{ vars.CF_BUNDLES_BUCKET }}
      CF_BUNDLES_PREVIEW_BUCKET: ${{ vars.CF_BUNDLES_PREVIEW_BUCKET }}
      CF_PLATFORM_ENVELOPE_KEY_ID: ${{ vars.CF_PLATFORM_ENVELOPE_KEY_ID }}
      CF_COMPATIBILITY_DATE: ${{ vars.CF_COMPATIBILITY_DATE }}
      CF_CONTAINER_INSTANCE_TYPE: ${{ vars.CF_CONTAINER_INSTANCE_TYPE || '{"vcpu":1,"memory_mib":3072,"disk_mb":6000}' }}
      CF_CONTAINER_MAX_INSTANCES: ${{ vars.CF_CONTAINER_MAX_INSTANCES || '1000' }}
      CF_DEFAULT_ALARM_DELAY_MS: ${{ vars.CF_DEFAULT_ALARM_DELAY_MS }}
      CF_LOG_HEAD_SAMPLING_RATE: ${{ vars.CF_LOG_HEAD_SAMPLING_RATE }}
      CF_MAX_EVENT_ATTEMPTS: ${{ vars.CF_MAX_EVENT_ATTEMPTS }}
      CF_PUBLIC_BASE_URL: ${{ vars.CF_PUBLIC_BASE_URL }}
      CF_RETRY_DELAY_MS: ${{ vars.CF_RETRY_DELAY_MS }}
      CF_RUNNER_COMMIT_TIMEOUT_MS: ${{ vars.CF_RUNNER_COMMIT_TIMEOUT_MS }}
      CF_RUNNER_READY_TIMEOUT_MS: ${{ vars.CF_RUNNER_READY_TIMEOUT_MS }}
      CF_RUNNER_TIMEOUT_MS: ${{ vars.CF_RUNNER_TIMEOUT_MS }}
      CF_RUNNER_WAKE_QUEUE: ${{ vars.CF_RUNNER_WAKE_QUEUE }}
      CF_WEB_CONTROL_TIMEOUT_MS: ${{ vars.CF_WEB_CONTROL_TIMEOUT_MS }}
      CF_TRACE_HEAD_SAMPLING_RATE: ${{ vars.CF_TRACE_HEAD_SAMPLING_RATE }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
      HOSTED_EXECUTION_AUTOMATION_RECIPIENT_KEY_ID: ${{ vars.HOSTED_EXECUTION_AUTOMATION_RECIPIENT_KEY_ID }}
      HOSTED_EXECUTION_AUTOMATION_RECIPIENT_PRIVATE_JWK: ${{ secrets.HOSTED_EXECUTION_AUTOMATION_RECIPIENT_PRIVATE_JWK }}
      HOSTED_EXECUTION_AUTOMATION_RECIPIENT_PRIVATE_KEYRING_JSON: ${{ secrets.HOSTED_EXECUTION_AUTOMATION_RECIPIENT_PRIVATE_KEYRING_JSON }}
      HOSTED_EXECUTION_AUTOMATION_RECIPIENT_PUBLIC_JWK: ${{ secrets.HOSTED_EXECUTION_AUTOMATION_RECIPIENT_PUBLIC_JWK }}
      HOSTED_EXECUTION_TEE_AUTOMATION_RECIPIENT_KEY_ID: ${{ vars.HOSTED_EXECUTION_TEE_AUTOMATION_RECIPIENT_KEY_ID }}
      HOSTED_EXECUTION_PLATFORM_ENVELOPE_KEY: ${{ secrets.HOSTED_EXECUTION_PLATFORM_ENVELOPE_KEY }}
      HOSTED_EXECUTION_PLATFORM_ENVELOPE_KEYRING_JSON: ${{ secrets.HOSTED_EXECUTION_PLATFORM_ENVELOPE_KEYRING_JSON }}
      HOSTED_EXECUTION_RECOVERY_RECIPIENT_PUBLIC_JWK: ${{ secrets.HOSTED_EXECUTION_RECOVERY_RECIPIENT_PUBLIC_JWK }}
      HOSTED_EXECUTION_TEE_AUTOMATION_RECIPIENT_PUBLIC_JWK: ${{ secrets.HOSTED_EXECUTION_TEE_AUTOMATION_RECIPIENT_PUBLIC_JWK }}
      HOSTED_WAKE_ENCRYPTION_KEY: ${{ secrets.HOSTED_WAKE_ENCRYPTION_KEY }}
      HOSTED_WAKE_ENCRYPTION_KEYRING_JSON: ${{ secrets.HOSTED_WAKE_ENCRYPTION_KEYRING_JSON }}
      HOSTED_WAKE_ENCRYPTION_KEY_VERSION: ${{ vars.HOSTED_WAKE_ENCRYPTION_KEY_VERSION }}
      HOSTED_EXECUTION_RUNNER_ENV_PROFILES: ${{ vars.HOSTED_EXECUTION_RUNNER_ENV_PROFILES || 'hosted-email,linq,mapbox,telegram' }}
      HOSTED_EXECUTION_RUNNER_IDLE_TTL_MS: ${{ vars.HOSTED_EXECUTION_RUNNER_IDLE_TTL_MS }}
      HOSTED_EXECUTION_VERCEL_OIDC_ENVIRONMENT: ${{ vars.HOSTED_EXECUTION_VERCEL_OIDC_ENVIRONMENT || 'production' }}
      HOSTED_EXECUTION_VERCEL_OIDC_PROJECT_NAME: ${{ vars.HOSTED_EXECUTION_VERCEL_OIDC_PROJECT_NAME }}
      HOSTED_EXECUTION_VERCEL_OIDC_TEAM_SLUG: ${{ vars.HOSTED_EXECUTION_VERCEL_OIDC_TEAM_SLUG }}
      HOSTED_EMAIL_DEFAULT_SUBJECT: ${{ vars.HOSTED_EMAIL_DEFAULT_SUBJECT }}
      HOSTED_EMAIL_DOMAIN: ${{ vars.HOSTED_EMAIL_DOMAIN }}
      HOSTED_EMAIL_FROM_ADDRESS: ${{ vars.HOSTED_EMAIL_FROM_ADDRESS }}
      HOSTED_EMAIL_LOCAL_PART: ${{ vars.HOSTED_EMAIL_LOCAL_PART }}
      HOSTED_EMAIL_SIGNING_SECRET: ${{ secrets.HOSTED_EMAIL_SIGNING_SECRET }}
      HOSTED_AI_USAGE_REPORTING_SECRET: ${{ secrets.HOSTED_AI_USAGE_REPORTING_SECRET }}
      HOSTED_LOG_FINGERPRINT_SECRET: ${{ secrets.HOSTED_LOG_FINGERPRINT_SECRET }}
      HOSTED_AI_USAGE_STRIPE_RESTRICTED_ACCESS_KEY: ${{ secrets.HOSTED_AI_USAGE_STRIPE_RESTRICTED_ACCESS_KEY }}
      HOSTED_AI_USAGE_BILLING_MODE: ${{ vars.HOSTED_AI_USAGE_BILLING_MODE }}
      HOSTED_AI_USAGE_VERCEL_STRIPE_BILLING_ENABLED: ${{ vars.HOSTED_AI_USAGE_VERCEL_STRIPE_BILLING_ENABLED }}
      HOSTED_ASSISTANT_APPROVAL_POLICY: ${{ vars.HOSTED_ASSISTANT_APPROVAL_POLICY }}
      HOSTED_ASSISTANT_MODEL: ${{ vars.HOSTED_ASSISTANT_MODEL }}
      HOSTED_ASSISTANT_PROVIDER: ${{ vars.HOSTED_ASSISTANT_PROVIDER }}
      HOSTED_ASSISTANT_REASONING_EFFORT: ${{ vars.HOSTED_ASSISTANT_REASONING_EFFORT }}
      HOSTED_ASSISTANT_SANDBOX: ${{ vars.HOSTED_ASSISTANT_SANDBOX }}
      HOSTED_WEB_BASE_URL: ${{ vars.HOSTED_WEB_BASE_URL }}
      HOSTED_WEB_PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
      HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK: ${{ secrets.HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK }}
      HOSTED_WEB_CALLBACK_SIGNING_KEY_ID: ${{ vars.HOSTED_WEB_CALLBACK_SIGNING_KEY_ID }}
      DEVICE_SYNC_PUBLIC_BASE_URL: ${{ vars.DEVICE_SYNC_PUBLIC_BASE_URL }}
      DEVICE_SYNC_SECRET: ${{ secrets.DEVICE_SYNC_SECRET }}
      JUNCTION_API_KEY: ${{ secrets.JUNCTION_API_KEY }}
      JUNCTION_CLIENT_USER_ID_SECRET: ${{ secrets.JUNCTION_CLIENT_USER_ID_SECRET }}
      JUNCTION_WEBHOOK_SECRET: ${{ secrets.JUNCTION_WEBHOOK_SECRET }}
      JUNCTION_ENV: ${{ vars.JUNCTION_ENV }}
      JUNCTION_REGION: ${{ vars.JUNCTION_REGION }}
      JUNCTION_BASE_URL: ${{ vars.JUNCTION_BASE_URL }}
      JUNCTION_PROVIDER_FILTER: ${{ vars.JUNCTION_PROVIDER_FILTER }}
      JUNCTION_SUMMARY_RESOURCES: ${{ vars.JUNCTION_SUMMARY_RESOURCES }}
      JUNCTION_TIMESERIES_RESOURCES: ${{ vars.JUNCTION_TIMESERIES_RESOURCES }}
      JUNCTION_SUMMARY_BACKFILL_DAYS: ${{ vars.JUNCTION_SUMMARY_BACKFILL_DAYS }}
      JUNCTION_TIMESERIES_BACKFILL_DAYS: ${{ vars.JUNCTION_TIMESERIES_BACKFILL_DAYS }}
      JUNCTION_RESOURCE_OVERRIDES: ${{ vars.JUNCTION_RESOURCE_OVERRIDES }}
      JUNCTION_RECONCILE_DAYS: ${{ vars.JUNCTION_RECONCILE_DAYS }}
      JUNCTION_RECONCILE_INTERVAL_MS: ${{ vars.JUNCTION_RECONCILE_INTERVAL_MS }}
      JUNCTION_REQUEST_TIMEOUT_MS: ${{ vars.JUNCTION_REQUEST_TIMEOUT_MS }}
      JUNCTION_WEBHOOK_TIMESTAMP_TOLERANCE_MS: ${{ vars.JUNCTION_WEBHOOK_TIMESTAMP_TOLERANCE_MS }}
      JUNCTION_PER_ACCOUNT_CONCURRENCY: ${{ vars.JUNCTION_PER_ACCOUNT_CONCURRENCY }}
      JUNCTION_GLOBAL_CONCURRENCY: ${{ vars.JUNCTION_GLOBAL_CONCURRENCY }}
      GARMIN_API_BASE_URL: ${{ vars.GARMIN_API_BASE_URL }}
      GARMIN_AUTH_BASE_URL: ${{ vars.GARMIN_AUTH_BASE_URL }}
      GARMIN_BACKFILL_DAYS: ${{ vars.GARMIN_BACKFILL_DAYS }}
      GARMIN_CLIENT_ID: ${{ secrets.GARMIN_CLIENT_ID }}
      GARMIN_CLIENT_SECRET: ${{ secrets.GARMIN_CLIENT_SECRET }}
      GARMIN_RECONCILE_DAYS: ${{ vars.GARMIN_RECONCILE_DAYS }}
      GARMIN_RECONCILE_INTERVAL_MS: ${{ vars.GARMIN_RECONCILE_INTERVAL_MS }}
      GARMIN_REQUEST_TIMEOUT_MS: ${{ vars.GARMIN_REQUEST_TIMEOUT_MS }}
      GARMIN_TOKEN_BASE_URL: ${{ vars.GARMIN_TOKEN_BASE_URL }}
      OURA_API_BASE_URL: ${{ vars.OURA_API_BASE_URL }}
      OURA_AUTH_BASE_URL: ${{ vars.OURA_AUTH_BASE_URL }}
      OURA_BACKFILL_DAYS: ${{ vars.OURA_BACKFILL_DAYS }}
      WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
      WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
      OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
      OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
      OURA_RECONCILE_DAYS: ${{ vars.OURA_RECONCILE_DAYS }}
      OURA_RECONCILE_INTERVAL_MS: ${{ vars.OURA_RECONCILE_INTERVAL_MS }}
      OURA_REQUEST_TIMEOUT_MS: ${{ vars.OURA_REQUEST_TIMEOUT_MS }}
      OURA_SCOPES: ${{ vars.OURA_SCOPES }}
      OURA_WEBHOOK_TIMESTAMP_TOLERANCE_MS: ${{ vars.OURA_WEBHOOK_TIMESTAMP_TOLERANCE_MS }}
      STRAVA_API_BASE_URL: ${{ vars.STRAVA_API_BASE_URL }}
      STRAVA_AUTH_BASE_URL: ${{ vars.STRAVA_AUTH_BASE_URL }}
      STRAVA_BACKFILL_DAYS: ${{ vars.STRAVA_BACKFILL_DAYS }}
      STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
      STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
      STRAVA_RECONCILE_DAYS: ${{ vars.STRAVA_RECONCILE_DAYS }}
      STRAVA_RECONCILE_INTERVAL_MS: ${{ vars.STRAVA_RECONCILE_INTERVAL_MS }}
      STRAVA_REQUEST_TIMEOUT_MS: ${{ vars.STRAVA_REQUEST_TIMEOUT_MS }}
      STRAVA_SCOPES: ${{ vars.STRAVA_SCOPES }}
      WHOOP_BACKFILL_DAYS: ${{ vars.WHOOP_BACKFILL_DAYS }}
      WHOOP_BASE_URL: ${{ vars.WHOOP_BASE_URL }}
      WHOOP_RECONCILE_DAYS: ${{ vars.WHOOP_RECONCILE_DAYS }}
      WHOOP_RECONCILE_INTERVAL_MS: ${{ vars.WHOOP_RECONCILE_INTERVAL_MS }}
      WHOOP_REQUEST_TIMEOUT_MS: ${{ vars.WHOOP_REQUEST_TIMEOUT_MS }}
      WHOOP_SCOPES: ${{ vars.WHOOP_SCOPES }}
      WHOOP_WEBHOOK_TIMESTAMP_TOLERANCE_MS: ${{ vars.WHOOP_WEBHOOK_TIMESTAMP_TOLERANCE_MS }}
      LINQ_API_BASE_URL: ${{ vars.LINQ_API_BASE_URL }}
      LINQ_API_TOKEN: ${{ secrets.LINQ_API_TOKEN }}
      LINQ_WEBHOOK_SECRET: ${{ secrets.LINQ_WEBHOOK_SECRET }}
      MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME }}
      TELEGRAM_API_BASE_URL: ${{ vars.TELEGRAM_API_BASE_URL }}
      TELEGRAM_FILE_BASE_URL: ${{ vars.TELEGRAM_FILE_BASE_URL }}
      VERCEL_AI_API_KEY: ${{ secrets.VERCEL_AI_API_KEY }}
      WHISPER_MODEL_PATH: ${{ vars.WHISPER_MODEL_PATH }}
      WHISPER_COMMAND: ${{ vars.WHISPER_COMMAND }}
      FFMPEG_COMMAND: ${{ vars.FFMPEG_COMMAND }}
      HOSTED_EXECUTION_SMOKE_WORKER_BASE_URL: ${{ vars.CF_PUBLIC_BASE_URL }}
      HOSTED_EXECUTION_SMOKE_RUNNER_CONTAINER: "true"
      HOSTED_EXECUTION_SMOKE_RUNNER_RETRY_DELAY_MS: "3000"
      HOSTED_EXECUTION_SMOKE_USER_ID: ${{ inputs.smoke_user_id }}
      MURPH_RUNNER_BUNDLE_BUILD_CONCURRENCY: 4
      MURPH_RUNNER_BUNDLE_PACK_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate required deploy environment
        env:
          HOSTED_EXECUTION_DEPLOY_CONTEXT: ${{ inputs.environment }}
          HOSTED_EXECUTION_DEPLOY_WORKER: ${{ inputs.deploy_worker }}
        run: pnpm --dir apps/cloudflare deploy:preflight

      - name: Prepare deploy artifacts
        run: pnpm --dir apps/cloudflare deploy:artifacts

        if: ${{ inputs.deploy_worker }}
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Prepare runner base image
        if: ${{ inputs.deploy_worker }}
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: Dockerfile.cloudflare-hosted-runner-base
          load: true
          tags: murph-cloudflare-runner-base:node24.14.1-whisper1.8.1-base-en

      - name: Run focused Cloudflare checks and smoke runner container image
        if: ${{ inputs.deploy_worker }}
        shell: bash
        run: |
          set -euo pipefail

          pids=()
          cleanup() {
            local pid
            for pid in "${pids[@]}"; do
              if kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
              fi
            done
          }
          trap 'cleanup; exit 130' INT TERM

          pnpm --dir apps/cloudflare verify:parallel &
          pids+=("$!")
          pnpm --dir apps/cloudflare runner:docker:smoke:prepared-base &
          pids+=("$!")

          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=$?
          done
          trap - INT TERM
          exit "$status"

      - name: Run focused Cloudflare checks
        if: ${{ !inputs.deploy_worker }}
        run: pnpm --dir apps/cloudflare verify:parallel

      - name: Show generated artifact paths
        run: ls -lah apps/cloudflare/.deploy

      - name: Deploy Worker
        id: deploy
        if: ${{ inputs.deploy_worker }}
        env:
          HOSTED_EXECUTION_DEPLOYMENT_MODE: direct
          HOSTED_EXECUTION_CONTAINER_ROLLOUT: ${{ inputs.container_rollout }}
          HOSTED_EXECUTION_DEPLOY_CONTEXT: ${{ inputs.environment }}
          HOSTED_EXECUTION_INCLUDE_SECRETS: ${{ inputs.sync_worker_secrets }}
        run: pnpm --dir apps/cloudflare deploy:worker:apply -- --config ./.deploy/wrangler.generated.jsonc

      - name: Smoke test deployed endpoints
        if: ${{ inputs.deploy_worker }}
        env:
          HOSTED_EXECUTION_SMOKE_VERSION_ID: ${{ steps.deploy.outputs.smoke_version_id }}
        run: pnpm --dir apps/cloudflare deploy:smoke

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Cloudflare hosted execution deploy"
            echo
            echo "- Environment: \`${{ inputs.environment }}\`"
            echo "- Deploy strategy: \`direct\`"
            echo "- Container rollout: \`${{ inputs.container_rollout }}\`"
            echo "- Worker name: \`${CF_WORKER_NAME}\`"
            echo "- Worker URL: \`${CF_PUBLIC_BASE_URL:-not-set}\`"
            echo "- Container instance type: \`${CF_CONTAINER_INSTANCE_TYPE}\`"
            echo "- Container max instances: \`${CF_CONTAINER_MAX_INSTANCES}\`"
            echo "- Runner wake queue: \`${CF_RUNNER_WAKE_QUEUE:-${CF_WORKER_NAME}-runner-wake}\`"
            echo "- Native container image: base prepared from \`Dockerfile.cloudflare-hosted-runner-base\`; app layer built from \`Dockerfile.cloudflare-hosted-runner\` during deploy"
            echo "- Deployed versions: \`${{ steps.deploy.outputs.final_version_traffic || 'not-deployed' }}\`"
            echo "- Smoke user id: \`${{ inputs.smoke_user_id || 'not-set' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
