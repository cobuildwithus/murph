name: Fix PR 1464 exact-head typecheck

on:
  push:
    branches:
      - codex/starter-usage-export-final
    paths:
      - .github/workflows/codex-fix-pr1464-typecheck.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/non-expiring-starter-usage
          fetch-depth: 0

      - name: Apply exact-head fixture typing fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/non-expiring-starter-usage
          expected_head="ad015abc7b7474f6fb6686117873b7929cf73745"
          actual_head="$(git rev-parse origin/agent/non-expiring-starter-usage)"
          test "$actual_head" = "$expected_head"
          git checkout -B agent/non-expiring-starter-usage "$actual_head"
          printf '%s' '' | base64 --decode > /tmp/pr1464-typefix.patch
          git apply --index /tmp/pr1464-typefix.patch
          git diff --cached --check
          git commit -m "Fix Starter usage test fixture types"
          git push origin HEAD:refs/heads/agent/non-expiring-starter-usage
