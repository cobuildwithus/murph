name: Agent Apply Linq Egress Patch

on:
  push:
    branches:
      - agent/linq-egress-route-contract
    paths:
      - .github/agent/apply-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: true

      - name: Reconstruct and verify patch
        run: |
          base64 --decode .github/agent/linq-egress-route-contract.patch.gz.b64 \
            > /tmp/linq-egress-route-contract.patch.gz
          echo "5e9f71285104d4dd44ed75d09558b71ebc06507173549be0cef3f195d4236698  /tmp/linq-egress-route-contract.patch.gz" \
            | sha256sum --check --strict
          gzip --decompress --stdout /tmp/linq-egress-route-contract.patch.gz \
            > /tmp/linq-egress-route-contract.patch
          echo "4b8a108e3a0b7b915643f19c11d43ef039e6e5f6685855b7e5f86dd50fd5c613  /tmp/linq-egress-route-contract.patch" \
            | sha256sum --check --strict
          git apply --check /tmp/linq-egress-route-contract.patch

      - name: Apply clean candidate commit
        run: |
          git apply /tmp/linq-egress-route-contract.patch
          rm -rf .github/agent .github/workflows/agent-snapshot-export.yml
          git diff --check
          git config user.name "rocketman"
          git config user.email "20303031+rocketman-21@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep Linq runtime routes aligned with egress"
          git push origin "HEAD:${GITHUB_REF_NAME}"
