name: Finalize Apple Health relay wearables

on:
  push:
    branches:
      - agent/apple-health-relay-wearables

permissions:
  contents: write

concurrency:
  group: agent-apple-health-relay-wearables-final
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/apple-health-relay-wearables

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply final relay refinements
        env:
          PATCH_GZIP_BASE64: 
        run: |
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/apply.py
          python3 /tmp/apply.py

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web focused tests
        id: web_tests
        continue-on-error: true
        run: pnpm --dir apps/web test:prepared -- connect-page.test.ts connect-source-and-experiment-card-routes.test.tsx

      - name: Assistant behavior tests
        id: assistant_tests
        continue-on-error: true
        run: pnpm --dir packages/assistant-engine test -- model-behavior.test.ts

      - name: Device sync tests
        id: device_sync_tests
        continue-on-error: true
        run: pnpm --dir packages/device-syncd test

      - name: Assistant typecheck
        id: assistant_typecheck
        continue-on-error: true
        run: pnpm --dir packages/assistant-engine typecheck

      - name: Web typecheck
        id: web_typecheck
        continue-on-error: true
        run: |
          pnpm --dir apps/web prisma:generate
          pnpm --dir apps/web typecheck:prepared

      - name: Scoped Web lint
        id: web_lint
        continue-on-error: true
        run: |
          pnpm --dir apps/web exec eslint             "app/(dashboard)/connect/connect-page-client.tsx"             "app/(dashboard)/connect/connect-page-content.tsx"             "app/(dashboard)/connect/connect-page-types.ts"             "app/design/connect-source-card-study.tsx"             "app/design/sections-content.tsx"             "src/lib/device-sync/apple-health-relay-setup-guide.ts"             "test/connect-page.test.ts"             "test/connect-source-and-experiment-card-routes.test.tsx"

      - name: Commit final relay refinements
        if: always()
        run: |
          rm .github/workflows/agent-apple-health-relays-finalize.yml
          git add             apps/web/app/'(dashboard)'/connect/connect-page-client.tsx             apps/web/app/'(dashboard)'/connect/connect-page-content.tsx             apps/web/app/'(dashboard)'/connect/connect-page-types.ts             apps/web/app/design/connect-source-card-study.tsx             apps/web/app/design/sections-content.tsx             apps/web/src/lib/device-sync/apple-health-relay-setup-guide.ts             apps/web/test/connect-page.test.ts             .github/workflows/agent-apple-health-relays-finalize.yml
          if ! git diff --cached --quiet; then
            git commit -m "feat: preserve Apple Health relay setup context"
          fi
          git push origin HEAD:agent/apple-health-relay-wearables

      - name: Surface final validation failures
        if: always()
        run: |
          test "${{ steps.web_tests.outcome }}" = success
          test "${{ steps.assistant_tests.outcome }}" = success
          test "${{ steps.device_sync_tests.outcome }}" = success
          test "${{ steps.assistant_typecheck.outcome }}" = success
          test "${{ steps.web_typecheck.outcome }}" = success
          test "${{ steps.web_lint.outcome }}" = success
