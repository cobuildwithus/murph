name: Finalize challenge standings integration

on:
  push:
    branches:
      - agent/challenge-standings-card

permissions:
  contents: write

concurrency:
  group: finalize-challenge-standings-card
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: agent/challenge-standings-card
          fetch-depth: 0

      - name: Merge current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge --no-commit --no-ff origin/main; then
            if git ls-files -u -- packages/operator-config/src/assistant-response-cards.ts | grep -q .; then
              git checkout --ours packages/operator-config/src/assistant-response-cards.ts
              git add packages/operator-config/src/assistant-response-cards.ts
            fi
            if git ls-files -u -- packages/operator-config/test/assistant-response-cards.test.ts | grep -q .; then
              git checkout --theirs packages/operator-config/test/assistant-response-cards.test.ts
              git add packages/operator-config/test/assistant-response-cards.test.ts
            fi
          fi
          if git ls-files -u | grep -q .; then
            echo "Unresolved merge conflicts remain:" >&2
            git ls-files -u >&2
            exit 1
          fi

