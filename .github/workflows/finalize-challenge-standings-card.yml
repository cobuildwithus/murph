name: Finalize challenge standings card

on:
  push:
    branches:
      - agent/challenge-standings-card

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: agent/challenge-standings-card
          fetch-depth: 0

      - name: Apply final source and regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text()

          def write(path: str, value: str) -> None:
              Path(path).write_text(value)

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def replace_between(
              text: str,
              start_marker: str,
              end_marker: str,
              replacement: str,
              label: str,
          ) -> str:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              if end <= start:
                  raise RuntimeError(f"{label}: invalid marker order")
              return text[:start] + replacement + text[end:]

          planning_path = "packages/assistant-engine/src/assistant/codex-turn/planning.ts"
          planning = read(planning_path)
          planning = replace_between(
              planning,
              "  const responseCardsAvailable =",
              "  const shouldUseCommittedTranscriptHistory =",
              """  const groupChallengeResponseCardsAvailable =
            authenticatedGroupChatRuntime &&
            resolvedChannel?.trim().toLowerCase() === 'linq' &&
            input.profile.promptProfile === 'conversation' &&
            input.profile.toolProfile === 'provider-turn' &&
            (scheduledInvocationScope !== null ||
              (ordinaryInboundTurn &&
                input.input.scheduledInvocationAuthority == null))
          const responseCardsAvailable =
            (privateInteractiveProviderTurn &&
              (scheduledInvocationScope !== null ||
                (ordinaryInboundTurn &&
                  input.input.scheduledInvocationAuthority == null) ||
                input.input.scheduledInvocationAuthority?.automationId ===
                  MURPH_AUTOMATIC_MEAL_CLOSEOUT_AUTOMATION_ID)) ||
            groupChallengeResponseCardsAvailable
          """,
              "planning response-card availability",
          )
          write(planning_path, planning)

          catalog_path = "packages/assistant-engine/src/assistant-codex/dynamic-tool-catalog.ts"
          catalog = read(catalog_path)
          tool_start = catalog.index("export const MURPH_ATTACH_RESPONSE_CARD_TOOL = {")
          description_start = catalog.index("  description:\n", tool_start)
          input_schema_start = catalog.index("  inputSchema:", description_start)
          description = """  description:
            `Attach one response card only when the current accepted member message or the saved instructions for the exact scheduled automation occurrence explicitly request it, during managed meal closeout, or for an unambiguous update to the single active tracked workout whose table was explicitly established earlier. Occurrence authority alone is not card intent. Runtime scopes card kinds by audience. In a private direct conversation, use only daily_nutrition or compact_table and follow the canonical-read rules below. In an authenticated Linq group conversation, use only challenge_standings for the current shared challenge after reading its canonical challenge page and running the deterministic score-challenge command. Copy only room-facing labels already authorized in that group and exact scorer-owned points, target, order, and coverage. Never expose private health details, recalculate points, treat missing data as zero, or attach nutrition or workout cards in a group. Map scorer output exactly: individual entries use verifiedPoints and coverage; team entries use verifiedPoints only when non-null, so a withheld incomplete average stays unscored even when a verified subtotal exists; collective coverage is complete only when every participant is complete, unscored only when every participant is unscored, and partial otherwise, while an all-unscored collective keeps collectivePoints null rather than 0. Partial scores are verified lower bounds and unscored scores stay null. The card replaces the entire final response: attach it only when the card alone completely satisfies the current request; answer compound requests with complete ordinary text and no card. For daily_nutrition, immediately beforehand run vault-cli meal totals --from <date> --to <same-date> and copy its exact canonical metric { total, mealCount } values; never calculate or reuse totals. V2 adds fiber and nullable goal snapshots. Keep a goal null unless current active canonical goals prove exactly one daily target for that metric and unit; otherwise freeze the exact target and Murph's context-aware status without a universal threshold. Use compact_table only for an explicit table or structured-tracker request, or for that unambiguous active tracked-workout update; with no active table or multiple plausible workouts, do not infer authority and ask one narrow question. Never invent or silently truncate values. For tracked workouts, first update the canonical workout, re-read it successfully, and copy only that verified snapshot with its exact evt_<ULID> reference and canonical UTC snapshot instant. Use only when numerical output is permitted. Runtime renders durable text and fallbacks, so do not repeat card values in final send_message. This tool does not send and cannot combine with response media.`,
          """
          catalog = catalog[:description_start] + description + catalog[input_schema_start:]
          write(catalog_path, catalog)

          dynamic_tools_path = "packages/assistant-engine/src/assistant-codex/dynamic-tools.ts"
          dynamic_tools = read(dynamic_tools_path)
          dynamic_tools = replace_once(
              dynamic_tools,
              """  currentResponseCard?: AssistantResponseCard | null
            privateDirectResponseCardAllowed?: boolean | null
          """,
              """  currentResponseCard?: AssistantResponseCard | null
            groupChallengeResponseCardAllowed?: boolean | null
            privateDirectResponseCardAllowed?: boolean | null
          """,
              "dynamic-tool audience input",
          )
          dynamic_tools = replace_between(
              dynamic_tools,
              "    case 'attach-response-card': {",
              "    case 'attach-response-media': {",
              """    case 'attach-response-card': {
                if (input.request.card.kind === 'challenge_standings') {
                  if (input.groupChallengeResponseCardAllowed !== true) {
                    return toolTextResult(
                      false,
                      'challenge standings response cards require an authenticated Linq group conversation',
                    )
                  }
                } else if (input.privateDirectResponseCardAllowed !== true) {
                  return toolTextResult(
                    false,
                    'response cards require a private direct conversation',
                  )
                }
                if (input.currentResponseCard !== null && input.currentResponseCard !== undefined) {
                  return toolTextResult(false, 'a response card is already attached')
                }
                if ((input.currentResponseMedia ?? []).length > 0) {
                  return toolTextResult(
                    false,
                    'response cards cannot be combined with response media',
                  )
                }
                return {
                  ...toolTextResult(true, 'response card attached'),
                  responseCardPatch: { card: input.request.card },
                }
              }
          """,
              "dynamic-tool response-card authorization",
          )
          write(dynamic_tools_path, dynamic_tools)

          codex_path = "packages/assistant-engine/src/assistant-codex.ts"
          codex = read(codex_path)
          codex = replace_once(
              codex,
              """import {
            MURPH_ASSISTANT_STYLE_TOOL,
            MURPH_GROUP_ROOM_MODEL_TOOL,
            type AssistantStyleTurnSettingsOverlay,
          } from './assistant-codex/dynamic-tool-catalog.js'
          """,
              """import {
            MURPH_ASSISTANT_STYLE_TOOL,
            MURPH_ATTACH_RESPONSE_CARD_TOOL,
            MURPH_GROUP_ROOM_MODEL_TOOL,
            type AssistantStyleTurnSettingsOverlay,
          } from './assistant-codex/dynamic-tool-catalog.js'
          """,
              "assistant-codex card tool import",
          )
          codex = replace_once(
              codex,
              """          privateDirectResponseCardAllowed: input.groupConversation === false,
          """,
              """          groupChallengeResponseCardAllowed:
                    input.groupConversation === true &&
                    input.dynamicTools.some((tool) =>
                      tool.namespace === MURPH_ATTACH_RESPONSE_CARD_TOOL.namespace &&
                      tool.name === MURPH_ATTACH_RESPONSE_CARD_TOOL.name
                    ),
                  privateDirectResponseCardAllowed: input.groupConversation === false,
          """,
              "assistant-codex group card authority propagation",
          )
          write(codex_path, codex)

          outbox_path = "packages/operator-config/src/assistant-cli-contracts.ts"
          outbox = read(outbox_path)
          old_outbox = """    if (intent.card !== null && intent.threadIsDirect !== true) {
              context.addIssue({
                code: 'custom',
                message: 'Assistant response cards require a private direct conversation.',
                path: ['card'],
              })
            }
          """
          new_outbox = """    if (
              intent.card?.kind === 'challenge_standings' &&
              !(
                intent.threadIsDirect === false &&
                intent.channel?.trim().toLowerCase() === 'linq'
              )
            ) {
              context.addIssue({
                code: 'custom',
                message:
                  'Challenge standings response cards require an authenticated Linq group conversation.',
                path: ['card'],
              })
            }
            if (
              intent.card !== null &&
              intent.card.kind !== 'challenge_standings' &&
              intent.threadIsDirect !== true
            ) {
              context.addIssue({
                code: 'custom',
                message: 'Assistant response cards require a private direct conversation.',
                path: ['card'],
              })
            }
          """
          outbox = replace_once(outbox, old_outbox, new_outbox, "outbox card audience gate")
          write(outbox_path, outbox)

          channel_runtime_path = "packages/assistant-engine/src/assistant/channels/runtime.ts"
          channel_runtime = read(channel_runtime_path)
          channel_runtime = replace_between(
              channel_runtime,
              "  const shouldAttemptNativeCard =",
              "  let appCardFallbackIdempotencyKey: string | null = null",
              """  const shouldAttemptDirectNativeCard =
                card !== null &&
                input.targetKind === 'thread' &&
                input.threadIsDirect === true &&
                input.nativeReplyRequested !== true &&
                directRecipientPhoneNumber !== null &&
                idempotencyKey !== null
              const shouldAttemptGroupChallengeCard =
                card?.kind === 'challenge_standings' &&
                input.targetKind === 'thread' &&
                input.threadIsDirect === false &&
                input.nativeReplyRequested !== true &&
                idempotencyKey !== null
              const shouldAttemptNativeCard =
                shouldAttemptDirectNativeCard || shouldAttemptGroupChallengeCard
          """,
              "Linq native-card route selection",
          )
          old_capability = """  if (shouldAttemptNativeCard) {
              let capabilityAvailable = false
              try {
                capabilityAvailable = await checkLinqIMessageCapability(
                  {
                    address: directRecipientPhoneNumber,
                    from: normalizeOptionalText(input.fromPhoneNumber),
                  },
                  {
                    env,
                    fetchImplementation:
                      dependencies.appCardCapabilityFetchImplementation
                      ?? dependencies.fetchImplementation,
                    ...(dependencies.signal ? { signal: dependencies.signal } : {}),
                  },
                )
              } catch (error) {
                if (
                  dependencies.signal?.aborted
                  || providerRequestWasSkipped(error)
                ) {
                  throw error
                }
                dependencies.onAppCardFallbackError?.({
                  error,
                  reason: 'capability_check_failed',
                })
              }
              if (capabilityAvailable) {
          """
          new_capability = """  if (shouldAttemptNativeCard) {
              let capabilityAvailable = shouldAttemptGroupChallengeCard
              if (shouldAttemptDirectNativeCard) {
                try {
                  capabilityAvailable = await checkLinqIMessageCapability(
                    {
                      address: directRecipientPhoneNumber,
                      from: normalizeOptionalText(input.fromPhoneNumber),
                    },
                    {
                      env,
                      fetchImplementation:
                        dependencies.appCardCapabilityFetchImplementation
                        ?? dependencies.fetchImplementation,
                      ...(dependencies.signal ? { signal: dependencies.signal } : {}),
                    },
                  )
                } catch (error) {
                  if (
                    dependencies.signal?.aborted
                    || providerRequestWasSkipped(error)
                  ) {
                    throw error
                  }
                  dependencies.onAppCardFallbackError?.({
                    error,
                    reason: 'capability_check_failed',
                  })
                }
              }
              if (capabilityAvailable) {
          """
          channel_runtime = replace_once(
              channel_runtime,
              old_capability,
              new_capability,
              "Linq group app-card capability bypass",
          )
          write(channel_runtime_path, channel_runtime)

          response_tool_test_path = "packages/assistant-engine/test/assistant-response-card-tool.test.ts"
          write(response_tool_test_path, """import { describe, expect, it } from 'vitest'

          import type { AssistantResponseMedia } from '@murphai/operator-config/assistant-cli-contracts'
          import type { AssistantResponseCard } from '@murphai/operator-config/assistant-response-cards'

          import {
            executeMurphDynamicToolRequest,
            MURPH_ATTACH_RESPONSE_CARD_TOOL,
            readMurphDynamicToolRequest,
          } from '../src/assistant-codex/dynamic-tools.ts'

          const CARD: AssistantResponseCard = {
            kind: 'daily_nutrition',
            localDate: '2026-07-28',
            mealCount: 3,
            totals: {
              calories: { total: 1_490.25, mealCount: 3 },
              proteinGrams: { total: 94.5, mealCount: 3 },
              carbsGrams: { total: 193.125, mealCount: 3 },
              fatGrams: { total: 34.75, mealCount: 3 },
            },
          }

          const CARD_V2: AssistantResponseCard = {
            kind: 'daily_nutrition',
            version: 2,
            localDate: '2026-07-28',
            mealCount: 3,
            totals: {
              calories: { total: 1_490.25, mealCount: 3 },
              proteinGrams: { total: 94.5, mealCount: 3 },
              carbsGrams: { total: 193.125, mealCount: 3 },
              fatGrams: { total: 34.75, mealCount: 3 },
              fiberGrams: { total: 26.5, mealCount: 3 },
            },
            goals: {
              calories: { target: 2_100, status: 'under_target' },
              proteinGrams: { target: 100, status: 'on_target' },
              carbsGrams: null,
              fatGrams: { target: 40, status: 'on_target' },
              fiberGrams: { target: 30, status: 'under_target' },
            },
          }

          const CHALLENGE_CARD: AssistantResponseCard = {
            kind: 'challenge_standings',
            version: 1,
            format: 'individual',
            title: 'Weird Health Week',
            subtitle: 'Day 4 of 7',
            objective: { kind: 'ranking' },
            entries: [
              {
                label: 'Maya',
                points: 120,
                coverage: 'complete',
                detail: 'Run selfie + 10k steps',
              },
              {
                label: 'Jon',
                points: 90,
                coverage: 'partial',
                detail: 'Verified through yesterday',
              },
            ],
            footer: null,
          }

          const IMAGE: AssistantResponseMedia = {
            alt: null,
            kind: 'image',
            source: null,
            url: 'https://cdn.example.test/nutrition.png',
          }

          function executeCardTool(input: {
            currentResponseCard?: AssistantResponseCard | null
            currentResponseMedia?: readonly AssistantResponseMedia[] | null
            groupChallengeResponseCardAllowed?: boolean | null
            privateDirectResponseCardAllowed?: boolean | null
            request?: Parameters<typeof executeMurphDynamicToolRequest>[0]['request']
          }) {
            return executeMurphDynamicToolRequest({
              currentResponseCard: input.currentResponseCard ?? null,
              currentResponseMedia: input.currentResponseMedia ?? [],
              env: {},
              fetchImpl: fetch,
              groupChallengeResponseCardAllowed:
                input.groupChallengeResponseCardAllowed ?? false,
              nextUsageOrdinal: () => 0,
              privateDirectResponseCardAllowed:
                input.privateDirectResponseCardAllowed ?? true,
              progressDelivery: null,
              request: input.request ?? {
                card: CARD,
                kind: 'attach-response-card',
              },
            })
          }

          function readCardToolRequest(argumentsValue: unknown) {
            return readMurphDynamicToolRequest({
              id: 1,
              method: 'item/tool/call',
              params: {
                arguments: argumentsValue,
                namespace: 'murph',
                tool: 'attach_response_card',
              },
            })
          }

          describe('murph.attach_response_card', () => {
            it('describes private canonical reads and shared challenge truth boundaries', () => {
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'saved instructions for the exact scheduled automation occurrence explicitly request it',
              )
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'Occurrence authority alone is not card intent',
              )
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'In an authenticated Linq group conversation, use only challenge_standings',
              )
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'Never expose private health details, recalculate points, treat missing data as zero',
              )
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'a withheld incomplete average stays unscored',
              )
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'an all-unscored collective keeps collectivePoints null rather than 0',
              )
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'single active tracked workout whose table was explicitly established earlier',
              )
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'with no active table or multiple plausible workouts, do not infer authority',
              )
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'card replaces the entire final response',
              )
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'vault-cli meal totals --from <date> --to <same-date>',
              )
              expect(MURPH_ATTACH_RESPONSE_CARD_TOOL.description).toContain(
                'never calculate or reuse totals',
              )
            })

            it('uses the strict closed card contract at the model boundary', () => {
              expect(readCardToolRequest({ card: CARD })).toEqual({
                card: CARD,
                kind: 'attach-response-card',
              })
              expect(readCardToolRequest({ card: CARD_V2 })).toEqual({
                card: CARD_V2,
                kind: 'attach-response-card',
              })
              expect(readCardToolRequest({ card: CHALLENGE_CARD })).toEqual({
                card: CHALLENGE_CARD,
                kind: 'attach-response-card',
              })
              expect(readCardToolRequest({ card: CARD, extra: true })).toMatchObject({
                kind: 'invalid-response-card-arguments',
              })
              expect(readCardToolRequest({
                card: {
                  ...CARD,
                  kind: 'unknown_card',
                },
              })).toMatchObject({
                kind: 'invalid-response-card-arguments',
              })

              const contradictoryCard = {
                ...CARD_V2,
                totals: {
                  ...CARD_V2.totals,
                  calories: { total: 2_300, mealCount: 3 },
                },
                goals: {
                  ...CARD_V2.goals,
                  calories: { target: 2_000, status: 'under_target' },
                },
              }
              expect(readCardToolRequest({ card: contradictoryCard })).toMatchObject({
                kind: 'invalid-response-card-arguments',
              })
            })

            it('enforces audience-specific card kinds without weakening duplicate checks', async () => {
              const groupNutrition = await executeCardTool({
                privateDirectResponseCardAllowed: false,
              })
              expect(groupNutrition.rpcResult).toEqual({
                contentItems: [{
                  text: 'response cards require a private direct conversation',
                  type: 'inputText',
                }],
                success: false,
              })

              const privateChallenge = await executeCardTool({
                request: {
                  card: CHALLENGE_CARD,
                  kind: 'attach-response-card',
                },
              })
              expect(privateChallenge.rpcResult).toEqual({
                contentItems: [{
                  text: 'challenge standings response cards require an authenticated Linq group conversation',
                  type: 'inputText',
                }],
                success: false,
              })

              const unauthorizedGroupChallenge = await executeCardTool({
                privateDirectResponseCardAllowed: false,
                request: {
                  card: CHALLENGE_CARD,
                  kind: 'attach-response-card',
                },
              })
              expect(unauthorizedGroupChallenge.rpcResult.success).toBe(false)

              const groupChallenge = await executeCardTool({
                groupChallengeResponseCardAllowed: true,
                privateDirectResponseCardAllowed: false,
                request: {
                  card: CHALLENGE_CARD,
                  kind: 'attach-response-card',
                },
              })
              expect(groupChallenge).toMatchObject({
                responseCardPatch: { card: CHALLENGE_CARD },
                rpcResult: {
                  contentItems: [{ text: 'response card attached', type: 'inputText' }],
                  success: true,
                },
              })

              const first = await executeCardTool({})
              expect(first).toMatchObject({
                responseCardPatch: { card: CARD },
                rpcResult: {
                  contentItems: [{ text: 'response card attached', type: 'inputText' }],
                  success: true,
                },
              })
              expect(JSON.stringify(first.rpcResult)).not.toContain('1490.25')

              const second = await executeCardTool({ currentResponseCard: CARD })
              expect(second.rpcResult).toEqual({
                contentItems: [{
                  text: 'a response card is already attached',
                  type: 'inputText',
                }],
                success: false,
              })
            })

            it('rejects card and response media in either attachment order', async () => {
              const cardAfterMedia = await executeCardTool({ currentResponseMedia: [IMAGE] })
              expect(cardAfterMedia.rpcResult).toEqual({
                contentItems: [{
                  text: 'response cards cannot be combined with response media',
                  type: 'inputText',
                }],
                success: false,
              })

              const mediaAfterCard = await executeCardTool({
                currentResponseCard: CARD,
                request: {
                  kind: 'attach-response-media',
                  media: [IMAGE],
                },
              })
              expect(mediaAfterCard.rpcResult).toEqual({
                contentItems: [{
                  text: 'response media cannot be combined with a response card',
                  type: 'inputText',
                }],
                success: false,
              })
            })
          })
          """)

          planning_test_path = "packages/assistant-engine/test/assistant-codex-turn-planning.test.ts"
          planning_test = read(planning_test_path)
          planning_start = planning_test.index(
              "  it('offers response cards to current private requests and exact scheduled occurrences'"
          )
          planning_end = planning_test.index(
              "\n  it('offers scheduled image generation only on routes that can deliver vault images'",
              planning_start,
          )
          planning_replacement = """  it('offers private cards and authenticated Linq group challenge cards only', async () => {
            planningMocks.readAssistantCliSurfaceBootstrapContext.mockResolvedValue(
              'bootstrap contract',
            )
            planningMocks.readAssistantContextSnapshotPrompt.mockResolvedValue(null)
            const common = {
              profile: {
                promptProfile: 'conversation',
                threadScope: 'session-thread',
                toolProfile: 'provider-turn',
              },
              promptTimeContext: {
                currentLocalDate: '2026-07-28',
                currentTimeZone: 'America/New_York',
              },
              route: createRoute(),
              session: createSession(),
            } satisfies Omit<
              Parameters<typeof resolveAssistantRouteTurnPlan>[0],
              'executionContext' | 'input' | 'sharedPlan'
            >
            const toolNames = async (
              input: AssistantMessageInput,
              sharedPlan = createSharedPlan(),
              executionContext:
                Parameters<typeof resolveAssistantRouteTurnPlan>[0]['executionContext'] = null,
            ) => (await resolveAssistantRouteTurnPlan({
              ...common,
              executionContext,
              input,
              sharedPlan,
            })).dynamicTools.map((tool) => tool.name)

            await expect(toolNames({
              ...createMessageInput(),
              scheduledInvocationAuthority: {
                automationId: MURPH_AUTOMATIC_MEAL_CLOSEOUT_AUTOMATION_ID,
                occurrenceAt: '2026-07-28T21:00:00.000-04:00',
              },
              scheduledOccurrenceAt: '2026-07-28T21:00:00.000-04:00',
              turnTrigger: 'automation-cron',
            })).resolves.toContain('attach_response_card')
            await expect(toolNames(createMessageInput())).resolves.toContain(
              'attach_response_card',
            )
            await expect(toolNames({
              ...createMessageInput(),
              scheduledInvocationAuthority: {
                automationId: 'automation_other',
                occurrenceAt: '2026-07-28T21:00:00.000-04:00',
              },
              scheduledOccurrenceAt: '2026-07-28T21:00:00.000-04:00',
              turnTrigger: 'automation-cron',
            })).resolves.toContain('attach_response_card')

            const hostedExecutionContext = {
              hosted: {
                dynamicContextPrompts: [],
                memberId: 'member-group-challenge-card',
                userEnvKeys: [],
              },
            }
            const linqGroupPlan = createSharedPlan({}, {
              channel: 'linq',
              effectiveThreadIsDirect: false,
              threadId: 'linq-group-challenge-card',
              threadIsDirect: false,
            })
            await expect(toolNames({
              ...createMessageInput(),
              channel: 'linq',
              threadId: 'linq-group-challenge-card',
              threadIsDirect: false,
            }, linqGroupPlan, hostedExecutionContext)).resolves.toContain(
              'attach_response_card',
            )
            await expect(toolNames({
              ...createMessageInput(),
              channel: 'linq',
              scheduledInvocationAuthority: {
                automationId: 'automation_group_challenge_update',
                occurrenceAt: '2026-07-28T21:00:00.000-04:00',
              },
              scheduledOccurrenceAt: '2026-07-28T21:00:00.000-04:00',
              threadId: 'linq-group-challenge-card',
              threadIsDirect: false,
              turnTrigger: 'automation-cron',
            }, linqGroupPlan, hostedExecutionContext)).resolves.toContain(
              'attach_response_card',
            )

            await expect(toolNames({
              ...createMessageInput(),
              channel: 'linq',
              threadId: 'linq-group-challenge-card',
              threadIsDirect: false,
            }, linqGroupPlan, null)).resolves.not.toContain(
              'attach_response_card',
            )
            await expect(toolNames(
              {
                ...createMessageInput(),
                channel: 'telegram',
                threadId: 'telegram-group-challenge-card',
                threadIsDirect: false,
              },
              createSharedPlan({}, {
                channel: 'telegram',
                effectiveThreadIsDirect: false,
                threadId: 'telegram-group-challenge-card',
                threadIsDirect: false,
