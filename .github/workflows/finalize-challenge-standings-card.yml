      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify affected packages
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @murphai/contracts test:vitest
          pnpm --filter @murphai/operator-config test
          pnpm --filter @murphai/assistant-engine test
          pnpm --filter @murphai/contracts typecheck
          pnpm --filter @murphai/operator-config typecheck
          pnpm --filter @murphai/assistant-engine typecheck
          git diff --check

      - name: Commit verified merge and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/finalize-challenge-standings-card.yml \
            .github/workflows/retry-finalize-challenge-standings-card.yml \
            .github/workflows/retry2-finalize-challenge-standings-card.yml \
            .github/workflows/retry3-finalize-challenge-standings-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Merge main and finish challenge standings integration"
          git push origin HEAD:agent/challenge-standings-card
