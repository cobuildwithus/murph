name: Apply Linq instant-start implementation

on:
  push:
    branches:
      - codex/linq-instant-start-security-foundation
    paths:
      - .github/pr1030/instant-start-retry-fix.patch
      - .github/workflows/linq-instant-start-apply.yml

permissions:
  contents: write

concurrency:
  group: pr1030-instant-start-retry-fix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: codex/linq-instant-start-security-foundation

      - name: Apply audited retry fix
        shell: bash
        run: |
          set -euo pipefail
          echo '26621a94297e01065a0a12b1101365369caa150ab5a8a265e5a70afeb575ed66  .github/pr1030/instant-start-retry-fix.patch' \
            | sha256sum --check --strict
          git apply --check --whitespace=error-all \
            .github/pr1030/instant-start-retry-fix.patch
          git apply .github/pr1030/instant-start-retry-fix.patch
          git diff --check

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/web prisma:generate

      - name: Run focused tests
        run: |
          pnpm --dir apps/web exec vitest run \
            --config vitest.workspace.ts \
            --no-coverage \
            test/hosted-onboarding-linq-instant-start.test.ts \
            test/hosted-onboarding-linq-dispatch.test.ts \
            test/hosted-onboarding-linq-first-contact-admission.test.ts

      - name: Typecheck Web
        run: pnpm --dir apps/web typecheck

      - name: Commit verified fix
        shell: bash
        env:
          EXPECTED_REMOTE_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git rm .github/pr1030/instant-start-retry-fix.patch
          git rm .github/workflows/linq-instant-start-apply.yml
          git rm .github/workflows/pr1030-instant-start-retry-fix.yml
          git config user.name 'Codex'
          git config user.email 'codex@local'
          git add -A
          git diff --cached --check
          git commit -m 'fix(hosted): resume admitted Linq instant-start retries'
          git push \
            --force-with-lease=refs/heads/codex/linq-instant-start-security-foundation:${EXPECTED_REMOTE_HEAD} \
            origin HEAD:codex/linq-instant-start-security-foundation
