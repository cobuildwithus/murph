            const environmentKey =
              HOSTED_BILLING_PLAN_CHANGE_PORTAL_CONFIGURATION_ENV_BY_TARGET[
                targetPlanCode
              ];
            const configurationId = normalizeNullableString(
              environmentKey ? process.env[environmentKey] : undefined,
            );
            if (configurationId) {
              return configurationId;
            }
            throw hostedOnboardingError({
              code: "HOSTED_BILLING_PLAN_CHANGE_PORTAL_CONFIGURATION_REQUIRED",
              httpStatus: 503,
              message: "Plan changes are temporarily unavailable. Try again shortly.",
              retryable: true,
            });
          }
          ''',
