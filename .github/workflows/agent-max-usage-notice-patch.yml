name: Agent Max sync main

on:
  push:
    branches:
      - agent/add-murph-max-plan
    paths:
      - .github/workflows/agent-max-usage-notice-patch.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: agent/add-murph-max-plan

      - name: Merge latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              "apps/web/app/design/sections-content.tsx"
              "apps/web/src/components/settings/hosted-billing-settings.tsx"
            )
            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            git checkout --theirs -- "${expected[@]}"
            git add -- "${expected[@]}"
          fi

          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge conflicts remain." >&2
            exit 1
          fi

          if git diff --cached --quiet && git diff --quiet; then
            echo "Branch is already current with main."
            exit 0
          fi

          git commit -m "chore: sync Max plan with main"
          git push origin HEAD:agent/add-murph-max-plan
