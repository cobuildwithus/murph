name: Agent Max final audit
# One-shot final audit; the successful job removes this workflow and its patch script.

on:
  push:
    branches:
      - agent/add-murph-max-plan
    paths:
      - .github/workflows/agent-max-usage-notice-patch.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: agent/add-murph-max-plan

      - name: Merge latest main and resolve known UI conflicts from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U | sort)
            expected=(
              "apps/web/app/design/sections-content.tsx"
              "apps/web/src/components/settings/hosted-billing-settings.tsx"
            )
            if [[ "${conflicts[*]}" != "${expected[*]}" ]]; then
              printf 'Unexpected merge conflicts:\n%s\n' "${conflicts[*]}" >&2
              exit 1
            fi
            git checkout --theirs -- "${expected[@]}"
            git add -- "${expected[@]}"
          fi
          if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
            echo "Unresolved merge conflicts remain." >&2
            exit 1
          fi

      - name: Normalize audit script for current main
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("scripts/agent-max-final-audit.py")
          text = path.read_text(encoding="utf-8")

          def replace_exact(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"Expected one audit-script pattern, found {count}: {old[:120]!r}"
                  )
              text = text.replace(old, new, 1)

          replace_exact(
              "\\nfunction buildHostedTrialExpiredPendingBillingNotice(",
              "\\nfunction renderHostedAiUsageGateLimitNoticeMessage(",
          )
          replace_exact(
              '''    "    HostedDirectBillingPlanCode;",
              3,
          )''',
              '''    "    HostedDirectBillingPlanCode;",
              4,
          )''',
          )
          replace_exact(
              '''replace_once(
              usage_status,
              "  recommendedPlanCode?:\\n"
              "    | \\\"launch_group_monthly\\\"\\n"
              "    | \\\"launch_monthly\\\"\\n"
              "    | \\\"launch_edge_monthly\\\"\\n"
              "    | \\\"launch_max_monthly\\\";\\n",
              "  recommendedPlanCode?: HostedDirectBillingPlanCode;\\n",
          )''',
              '''replace_once(
              usage_status,
              "  recommendedPlanCode?:\\n"
              "    HostedDirectBillingPlanCode;\\n",
              "  recommendedPlanCode?: HostedDirectBillingPlanCode;\\n",
          )''',
          )
          replace_exact(
              '    "              ? <FamilyBillingChangeButton block targetPlanName=\\"Max\\" />\\n"',
              '    "              ? null\\n"',
          )
          replace_exact(
              '''replace_once(
              settings,
              '  targetPlanName: "Edge" | "Pulse";\\n',
              '  targetPlanName: "Edge" | "Max" | "Pulse";\\n',
          )
          ''',
              '',
          )
          replace_exact(
              '''def neutralize_premium_templates(block: str) -> str:
              block = block.replace("Edge's included usage", "Your included AI usage")
              block = block.replace("Edge", "AI")
              return block
          ''',
              '''def neutralize_premium_templates(block: str) -> str:
              replacements = (
                  ("Edge's included usage", "Your included AI usage"),
                  ("Edge's included allowance", "your included AI allowance"),
                  ("included Edge allowance", "included AI allowance"),
                  ("included Edge usage", "included AI usage"),
                  ("monthly Edge allowance", "monthly AI allowance"),
                  ("monthly Edge usage", "monthly AI usage"),
                  ("Edge allowance", "AI allowance"),
                  ("Edge usage", "AI usage"),
              )
              for old, new in replacements:
                  block = block.replace(old, new)
              if "Edge" in block:
                  raise RuntimeError("premium usage templates retained an Edge-specific label")
              return block
          ''',
          )
          replace_exact(
              '''    '    title: "You\\'ve used 100% of this month\\'s included monthly AI usage",\\n',''',
              '''    '    title: "You\\'ve used 100% of this month\\'s included AI usage",\\n',''',
