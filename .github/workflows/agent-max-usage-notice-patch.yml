name: Agent Max final audit

on:
  push:
    branches:
      - agent/add-murph-max-plan
    paths:
      - .github/workflows/agent-max-usage-notice-patch.yml

permissions:
  contents: write

jobs:
  inspect-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: agent/add-murph-max-plan

      - name: Inspect latest-main merge
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main > /tmp/max-merge.log 2>&1
          merge_status=$?
          set -e
          cat /tmp/max-merge.log
          echo "merge_status=$merge_status"
          echo "conflicts:"
          git diff --name-only --diff-filter=U || true
          echo "branch-owned files:"
          git diff --name-only origin/main...HEAD
          if [[ -f .git/MERGE_HEAD ]]; then
            git merge --abort
          fi
