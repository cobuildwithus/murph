name: Agent Max usage notice patch

on:
  push:
    branches:
      - agent/add-murph-max-plan
    paths:
      - .github/workflows/agent-max-usage-notice-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe000f5447ce83dd # v6
        with:
          ref: agent/add-murph-max-plan

      - name: Treat Max exhaustion as a paid-plan usage limit
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/lib/hosted-execution/usage-allowance.ts")
          text = path.read_text(encoding="utf-8")
          start = text.index("function buildHostedPaidUsageLimitNotice(")
          end = text.index("\nfunction ", start + 1)
          block = text[start:end]
          needle = 'input.billingPlanCode === "launch_edge_monthly"'
          replacement = '''(
                input.billingPlanCode === "launch_edge_monthly"
                || input.billingPlanCode === "launch_max_monthly"
              )'''
          if block.count(needle) != 2:
              raise SystemExit(
                  f"Expected exactly two Edge plan checks in paid usage notice; found {block.count(needle)}"
              )
          updated_block = block.replace(needle, replacement)
          path.write_text(
              text[:start] + updated_block + text[end:],
              encoding="utf-8",
          )
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/lib/hosted-execution/usage-allowance.ts
          git commit -m "usage: treat Max exhaustion as paid usage"
          git push origin HEAD:agent/add-murph-max-plan
