name: Capture PR 1464 design proof

on:
  push:
    branches:
      - codex/starter-usage-export-final
    paths:
      - .github/workflows/codex-capture-pr1464-design-proof.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/non-expiring-starter-usage
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Capture Starter usage design states
        shell: bash
        run: |
          set -euo pipefail
          cat > apps/web/e2e/capture-pr1464-design-proof.spec.ts <<'SCRIPT'
          import { expect, test } from "@playwright/test";

          test("captures the exhausted Starter usage state", async ({ browser }) => {
            test.setTimeout(120_000);
            const url = "/design?tab=sections#personal-usage-credit-owner";
            for (const capture of [
              {
                deviceScaleFactor: 1,
                path: "/tmp/pr1464-starter-desktop.png",
                viewport: { height: 1000, width: 1440 },
              },
              {
                deviceScaleFactor: 2,
                path: "/tmp/pr1464-starter-mobile.png",
                viewport: { height: 820, width: 390 },
              },
            ]) {
              const context = await browser.newContext({
                deviceScaleFactor: capture.deviceScaleFactor,
                reducedMotion: "reduce",
                viewport: capture.viewport,
              });
              const page = await context.newPage();
              await page.route("**/*", async (route) => {
                const requestUrl = new URL(route.request().url());
                if (requestUrl.hostname === "127.0.0.1") {
                  await route.continue();
                } else {
                  await route.abort();
                }
              });
              await page.goto(url, { waitUntil: "load" });
              const state = page.locator('[data-design-state="starter-exhausted"]');
              await expect(state).toBeVisible();
              await state.scrollIntoViewIfNeeded();
              await state.screenshot({ path: capture.path });
              await context.close();
            }
          });
          SCRIPT

          if ! pnpm --dir apps/web exec playwright test \
            e2e/capture-pr1464-design-proof.spec.ts \
            --workers=1 > /tmp/pr1464-playwright.log 2>&1; then
            cat /tmp/pr1464-playwright.log
            exit 1
          fi
          rm apps/web/e2e/capture-pr1464-design-proof.spec.ts

      - name: Publish verified screenshots on the helper branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin codex/starter-usage-export-final
          git checkout -B codex/starter-usage-export-final \
            origin/codex/starter-usage-export-final
          proof_dir="agent-docs/design-proofs/pr1464-starter-usage"
          mkdir -p "$proof_dir"
          cp /tmp/pr1464-starter-desktop.png "$proof_dir/desktop.png"
          cp /tmp/pr1464-starter-mobile.png "$proof_dir/mobile.png"
          git add "$proof_dir/desktop.png" "$proof_dir/mobile.png"
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish PR 1464 design proof"
            git push origin HEAD:refs/heads/codex/starter-usage-export-final
          fi
          proof_sha="$(git rev-parse HEAD)"
          {
            echo "https://raw.githubusercontent.com/cobuildwithus/murph/${proof_sha}/${proof_dir}/desktop.png"
            echo "https://raw.githubusercontent.com/cobuildwithus/murph/${proof_sha}/${proof_dir}/mobile.png"
          } | tee /tmp/pr1464-design-urls.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1464-design-proof
          path: |
            /tmp/pr1464-starter-desktop.png
            /tmp/pr1464-starter-mobile.png
            /tmp/pr1464-design-urls.txt
            /tmp/pr1464-playwright.log
          retention-days: 1
