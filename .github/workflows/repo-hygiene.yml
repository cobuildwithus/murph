name: Repo Hygiene

on:
  pull_request:
  push:
    branches:
      - main

# One CI run per ref per workflow: a new push to a PR or main cancels the
# superseded run immediately, freeing org-level concurrency slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tracked-artifacts:
    name: Tracked private/build artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Pack agent source files
        run: |
          tar --zstd -cf agent-source.tar.zst \
            packages/hosted-execution/src/routes.ts \
            packages/hosted-execution/src/contracts.ts \
            packages/hosted-execution/package.json \
            packages/assistant-runtime/src/hosted-runtime/platform.ts \
            packages/assistant-runtime/src/hosted-runtime/callbacks.ts \
            packages/assistant-runtime/src/hosted-runtime/workspace-assistant-phase.ts \
            packages/assistant-engine/src/assistant/execution-context.ts \
            packages/assistant-engine/src/assistant/cron/execution.ts \
            packages/assistant-engine/src/assistant/automation/run-loop.ts \
            packages/assistant-engine/src/assistant/notification-turn.ts \
            packages/assistant-engine/test/assistant-cron-runtime.test.ts \
            apps/cloudflare/src/runtime-platform/effects-port.ts \
            apps/cloudflare/test/runner-platform.test.ts \
            apps/web/prisma.config.ts \
            apps/web/prisma/schema.prisma \
            apps/web/prisma/linq-health.prisma \
            apps/web/prisma/migrations/20260729180000_linq_provider_health_projection/migration.sql \
            apps/web/vercel.json \
            apps/web/app/api/internal/hosted-runtime/linq-egress/engagement/route.ts \
            apps/web/app/api/internal/hosted-onboarding/linq/health/cron/route.ts \
            apps/web/src/lib/hosted-onboarding/linq-chat-health-inventory.ts \
            apps/web/src/lib/hosted-onboarding/linq-contact-card.ts \
            apps/web/src/lib/hosted-onboarding/linq-egress-engagement.ts \
            apps/web/src/lib/hosted-onboarding/linq-egress-policy.ts \
            apps/web/src/lib/hosted-onboarding/linq-line-store.ts \
            apps/web/src/lib/hosted-onboarding/linq-phone-number-inventory.ts \
            apps/web/src/lib/hosted-onboarding/linq-provider-event-store.ts \
            apps/web/src/lib/hosted-onboarding/linq-provider-events.ts \
            apps/web/src/lib/hosted-onboarding/linq-provider-health-event.ts \
            apps/web/src/lib/hosted-onboarding/linq-provider-health-store.ts \
            apps/web/src/lib/hosted-onboarding/linq-provider-status.ts \
            apps/web/test/hosted-onboarding-linq-contact-card.test.ts \
            apps/web/test/hosted-onboarding-linq-egress-engagement.test.ts \
            apps/web/test/hosted-onboarding-linq-line-store.test.ts \
            apps/web/test/hosted-onboarding-linq-phone-number-inventory.test.ts \
            apps/web/test/hosted-onboarding-linq-observability-store.test.ts \
            agent-docs/operations/imessage-deliverability.md

      - name: Upload agent source files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: agent-source-1118-expanded
          path: agent-source.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check tracked private/build artifacts
        run: pnpm no-js
