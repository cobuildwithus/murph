name: Repo Hygiene

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair-pr1117-sender:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 1117 }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply focused sender repair
        run: python .github/scripts/repair-pr1117-sender.py

      - name: Commit clean repair
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          git checkout "origin/${{ github.event.pull_request.base.ref }}" -- .github/workflows/repo-hygiene.yml
          git rm .github/scripts/repair-pr1117-sender.py
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git add apps/web/src/lib/hosted-onboarding/webhook-provider-linq.ts \
            apps/web/test/hosted-onboarding-linq-thread-route.test.ts \
            .github/workflows/repo-hygiene.yml
          git diff --check
          git commit -m "fix(linq): keep sender setup eligible without roster"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

  tracked-artifacts:
    name: Tracked private/build artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check tracked private/build artifacts
        run: pnpm no-js
