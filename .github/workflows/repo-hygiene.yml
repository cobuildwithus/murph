name: Repo Hygiene

on:
  pull_request:
  push:
    branches:
      - main

# One CI run per ref per workflow: a new push to a PR cancels the superseded
# run immediately, freeing org-level concurrency slots. Pushes to main never
# cancel an in-progress run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tracked-artifacts:
    name: Tracked private/build artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check tracked private/build artifacts
        run: pnpm no-js
