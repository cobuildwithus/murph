name: Repo Hygiene

on:
  pull_request:
  push:
    branches:
      - main

# One CI run per ref per workflow: a new push to a PR or main cancels the
# superseded run immediately, freeing org-level concurrency slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tracked-artifacts:
    name: Tracked private/build artifacts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Check tracked private/build artifacts
        run: pnpm no-js

  agent-apply-fix:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/linq-chat-health-preflight'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Preserve nullable scheduled execution context
        shell: bash
        run: |
          set -euo pipefail

          python <<'PY'
          from pathlib import Path

          path = Path("packages/assistant-engine/src/assistant/cron/execution.ts")
          text = path.read_text()
          old = '''          const postureExecutionContext =
            appendAssistantHostedDynamicContextPrompt({
              executionContext: automationTurn.executionContext,
              prompt: buildAssistantLinqDeliveryPosturePrompt(
                authorizedDelivery.deliveryPosture,
              ),
            })
'''
          new = '''          const postureExecutionContext = automationTurn.executionContext
            ? appendAssistantHostedDynamicContextPrompt({
                executionContext: automationTurn.executionContext,
                prompt: buildAssistantLinqDeliveryPosturePrompt(
                  authorizedDelivery.deliveryPosture,
                ),
              })
            : automationTurn.executionContext
'''
          if text.count(old) != 1:
              raise SystemExit("Expected scheduled posture context block was not found exactly once.")
          path.write_text(text.replace(old, new, 1))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/repo-hygiene.yml
          git add -A
          git diff --cached --check
          git commit -m "Fix nullable Linq posture context"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
