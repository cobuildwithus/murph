name: One-shot Junction scale and BP context refactor v2

on:
  push:
    branches:
      - codex/junction-scale-bp-vault-awareness
    paths:
      - .github/workflows/one-shot-junction-scale-bp-context-refactor-v2.yml

permissions:
  contents: write

jobs:
  refactor:
    if: contains(github.event.head_commit.message, '[junction-scale-bp-context-refactor-v2]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/junction-scale-bp-vault-awareness

      - name: Apply the verified structural patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          original = Path(
              ".github/workflows/one-shot-junction-scale-bp-context-refactor.yml",
          )
          workflow_text = original.read_text()
          marker = "      - name: Fold device availability into the existing context snapshot\n        shell: python\n        run: |\n"
          script = workflow_text.split(marker, 1)[1].split(
              "\n      - name: Commit simplified implementation",
              1,
          )[0]
          script = textwrap.dedent(script)

          # The first run proved every production/test replacement before this
          # documentation-only block. Skip the brittle prose rewrite here and
          # update the audit note separately through the contents API.
          audit_start = script.index("\naudit = ")
          cleanup_start = script.index("\nworkflow = Path(", audit_start)
          script = script[:audit_start] + script[cleanup_start:]

          exec(compile(script, str(original), "exec"), {"__name__": "__main__"})
          Path(
              ".github/workflows/one-shot-junction-scale-bp-context-refactor-v2.yml",
          ).unlink()

      - name: Commit simplified implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: fold device availability into context snapshot"
          git push origin HEAD:codex/junction-scale-bp-vault-awareness
