name: Export current PR 1464 refs

on:
  push:
    branches:
      - codex/starter-usage-export-final
    paths:
      - .github/workflows/codex-export-pr1464-current.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build current ref bundle
        shell: bash
        run: |
          set -euo pipefail
          # Refreshed after sponsorship creative invariants advanced main.
          git fetch origin \
            main \
            agent/non-expiring-starter-usage \
            codex/starter-usage-export-final
          git branch --force export-main origin/main
          git branch --force export-pr origin/agent/non-expiring-starter-usage
          git branch --force export-helper origin/codex/starter-usage-export-final
          git bundle create /tmp/pr1464-current.bundle \
            export-main export-pr export-helper
          git rev-parse export-main > /tmp/pr1464-main.txt
          git rev-parse export-pr > /tmp/pr1464-head.txt
          git rev-parse export-helper > /tmp/pr1464-helper.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pr1464-current-refs
          path: |
            /tmp/pr1464-current.bundle
            /tmp/pr1464-main.txt
            /tmp/pr1464-head.txt
            /tmp/pr1464-helper.txt
          retention-days: 1
          compression-level: 0
