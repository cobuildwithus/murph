name: Compiler paired benchmark

on:
  workflow_dispatch:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths:
      - apps/web/scripts/run-production-next-build.sh
      - scripts/run-typescript.mjs
      - scripts/benchmark-compiler-pair.mjs
      - .github/workflows/compiler-benchmark.yml

permissions:
  contents: read

concurrency:
  group: compiler-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired:
    name: Paired TS7 and tsrs checks and builds
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare identical sources with alternating compilers
        run: pnpm benchmark:compilers
      - name: Retain timing and failure evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: compiler-benchmark
          path: .tmp/compiler-benchmark
          retention-days: 7
