name: Apply iMessage SMS group access parity patch

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-patch:
    if: github.head_ref == 'codex/imessage-sms-group-access-parity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/imessage-sms-group-access-parity

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .codex/imessage-sms-group-access-parity/*.part \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/change.patch
          echo '906e7500140e8633d6b4c2c05cba335c63feba826cb4acdd93d9d1330828e861  /tmp/change.patch' \
            | sha256sum --check
          git apply --numstat /tmp/change.patch

      - name: Apply on original base and rebase onto current main
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee /tmp/patch-run.log) 2>&1
          set -x
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git cat-file -e 1e69f621b244c660da124d47d66717e0d54de6b5^{commit}
          git reset --hard 1e69f621b244c660da124d47d66717e0d54de6b5
          git apply --check --recount /tmp/change.patch
          git apply --recount --whitespace=fix /tmp/change.patch
          git add -A
          git commit -m 'refactor(groups): unify access offers across messaging channels'
          git rebase --onto origin/main 1e69f621b244c660da124d47d66717e0d54de6b5 HEAD
          git status --short
          git log --oneline --decorate -5
          git diff --stat origin/main..HEAD
          git diff --check origin/main..HEAD
          test -f agent-docs/exec-plans/completed/2026-07-28-imessage-sms-group-access-parity.md

      - name: Capture patch diagnostics
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/patch-diagnostics/worktree
          cp /tmp/patch-run.log /tmp/patch-diagnostics/apply.log || true
          git status --short > /tmp/patch-diagnostics/status.txt || true
          git log --oneline --decorate -10 > /tmp/patch-diagnostics/log.txt || true
          git diff --name-only --diff-filter=U > /tmp/patch-diagnostics/conflicts.txt || true
          git diff > /tmp/patch-diagnostics/conflict.diff || true
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            mkdir -p "/tmp/patch-diagnostics/worktree/$(dirname "$file")"
            cp "$file" "/tmp/patch-diagnostics/worktree/$file"
          done < /tmp/patch-diagnostics/conflicts.txt

      - name: Upload patch diagnostics
        if: steps.apply.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: imessage-sms-group-access-parity-diagnostics
          path: /tmp/patch-diagnostics
          if-no-files-found: error
          retention-days: 1

      - name: Publish final branch
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:codex/imessage-sms-group-access-parity

      - name: Fail after diagnostics
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: exit 1
