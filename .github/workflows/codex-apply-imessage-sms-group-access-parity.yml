name: Apply iMessage SMS group access parity patch

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: codex-imessage-sms-group-access-parity
  cancel-in-progress: true

jobs:
  apply-patch:
    if: github.head_ref == 'codex/imessage-sms-group-access-parity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/imessage-sms-group-access-parity

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .codex/imessage-sms-group-access-parity/00.part \
            .codex/imessage-sms-group-access-parity/01.part \
            .codex/imessage-sms-group-access-parity/02.part \
            .codex/imessage-sms-group-access-parity/03.part \
            .codex/imessage-sms-group-access-parity/04.part \
            .codex/imessage-sms-group-access-parity/05.part \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/change.patch
          echo 'dbd926c023e7c8ca2905fe84d27c83903a343293bd463410f5c33a0c72105b24  /tmp/change.patch' \
            | sha256sum --check
          git apply --numstat /tmp/change.patch

      - name: Apply to current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git apply --check /tmp/change.patch
          git apply --whitespace=fix /tmp/change.patch
          git diff --check
          test -f agent-docs/exec-plans/completed/2026-07-28-imessage-sms-group-access-parity.md
          test ! -e .codex/imessage-sms-group-access-parity
          test ! -e .github/workflows/codex-apply-imessage-sms-group-access-parity.yml

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Verify changed packages and focused behavior
        shell: bash
        run: |
          set -euo pipefail
          corepack pnpm --filter @murphai/assistant-engine typecheck
          corepack pnpm --filter @murphai/assistant-runtime typecheck
          corepack pnpm --filter @murphai/assistant-engine test -- \
            assistant-codex-group-tool.test.ts \
            assistant-group-challenge-diagnostics-skill.test.ts \
            assistant-skill-assets.test.ts \
            assistant-capability-offers-prompt.test.ts
          corepack pnpm --filter @murphai/assistant-runtime test -- \
            hosted-runtime-group-tool-linq-context.test.ts
          corepack pnpm docs:drift

      - name: Commit and publish final branch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'Patch produced no changes.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(groups): unify access offers across messaging channels'
          git push --force-with-lease origin HEAD:codex/imessage-sms-group-access-parity
