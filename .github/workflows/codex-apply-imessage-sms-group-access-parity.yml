name: Export current main for patch reconciliation

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  export-source:
    if: github.head_ref == 'codex/imessage-sms-group-access-parity' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      - name: Archive source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf /tmp/murph-main-source.tar.gz .
          sha256sum /tmp/murph-main-source.tar.gz > /tmp/murph-main-source.sha256

      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: murph-main-source
          path: |
            /tmp/murph-main-source.tar.gz
            /tmp/murph-main-source.sha256
          if-no-files-found: error
          retention-days: 1
