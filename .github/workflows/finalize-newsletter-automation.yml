              'const saveAutomationArgumentsSchema = z.object({\n  action: z.literal(\'save\'),\n  activeUntil: automationActiveUntilSchema.nullable().optional(),\n  assistantTargetOverride: hostedAutomationAssistantTargetOverrideSchema\n    .nullable()\n    .optional(),\n  automationId: automationIdentifierSchema.optional(),\n  continuityPolicy: z.enum(automationContinuityPolicyValues).optional(),\n  delivery: z.enum(AUTOMATION_DELIVERY_VALUES).optional().describe(\n    \'Command-only delivery mode. Use current_conversation for the bound chat or group_email for one authorized group email. The trusted host validates the route, schedule, and continuity and owns the persisted delivery tag.\',\n  ),\n  instructions: automationInstructionsSchema,\n  schedule: automationScheduleSchema,\n  slug: automationSlugSchema.optional(),\n  status: z.enum(automationStatusValues).optional(),\n  summary: automationSummarySchema.nullable().optional(),\n  supportKind: z.enum(automationSupportKindValues).nullable().optional(),\n  supportSeriesId: automationSupportSeriesIdSchema.optional(),\n  tags: automationTagsSchema.optional(),\n  title: automationTitleSchema,\n}).strict().superRefine((value, context) => {\n  if (value.delivery !== \'group_email\') {\n    return\n  }\n  if (value.schedule.kind !== \'cron\') {\n    context.addIssue({\n      code: z.ZodIssueCode.custom,\n      message: \'Group-email delivery requires a cron schedule.\',\n      path: [\'schedule\'],\n    })\n  }\n  if (\n    value.continuityPolicy !== undefined\n    && value.continuityPolicy !== \'fresh\'\n  ) {\n    context.addIssue({\n      code: z.ZodIssueCode.custom,\n      message: \'Group-email delivery requires fresh continuity.\',\n      path: [\'continuityPolicy\'],\n    })\n  }\n  if (new Set([\n    ...(value.tags ?? []),\n    AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n  ]).size > 32) {\n    context.addIssue({\n      code: z.ZodIssueCode.custom,\n      message: \'Group-email delivery leaves room for at most 31 supplied tags.\',\n      path: [\'tags\'],\n    })\n  }\n})\n'.rstrip() + "\n",
