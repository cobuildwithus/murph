name: Finalize newsletter automation refactor

on:
  push:
    branches:
      - codex/simplify-newsletter-automation
    paths:
      - .github/workflows/finalize-newsletter-automation.yml

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-newsletter-automation]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/simplify-newsletter-automation

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Rebase onto current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Apply final reviewed architecture
        shell: python
        run: |
          from pathlib import Path
          import re
          
          def read(path: str) -> str:
              return Path(path).read_text()
          
          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content)
          
          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              write(path, text.replace(old, new, 1))
          
          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              text = read(path)
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} exact matches, found {count}")
              write(path, text.replace(old, new))
          
          def replace_regex_once(path: str, pattern: str, new: str) -> None:
              text = read(path)
              replaced, count = re.subn(pattern, lambda _match: new, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{path}: expected one regex match, found {count} for {pattern}")
              write(path, replaced)
          
          write('packages/assistant-engine/src/assistant/automation-delivery.ts', 'import type {\n  AutomationContinuityPolicy,\n  AutomationRoute,\n  AutomationSchedule,\n} from \'@murphai/contracts\'\n\nexport const AUTOMATION_DELIVERY_VALUES = [\n  \'current_conversation\',\n  \'group_email\',\n] as const\n\nexport const AUTOMATION_GROUP_EMAIL_DELIVERY_TAG =\n  \'system:automation-delivery:group-email\' as const\n\nexport type AutomationDelivery = typeof AUTOMATION_DELIVERY_VALUES[number]\n\nexport type AutomationGroupEmailConfigurationIssue =\n  | \'group_email_requires_cron_schedule\'\n  | \'group_email_requires_fresh_continuity\'\n  | \'group_email_requires_group_conversation\'\n\nexport function hasAutomationGroupEmailDeliveryTag(\n  tags: readonly string[],\n): boolean {\n  return tags.includes(AUTOMATION_GROUP_EMAIL_DELIVERY_TAG)\n}\n\nexport function resolveAutomationDeliveryTags(input: {\n  delivery: AutomationDelivery\n  existingTags?: readonly string[]\n  removeTags?: readonly string[]\n  requestedTags?: readonly string[]\n}): string[] {\n  const removedTags = new Set([\n    AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n    ...(input.removeTags ?? []),\n  ])\n  const tags = [\n    ...new Set(\n      (input.requestedTags ?? input.existingTags ?? [])\n        .filter((tag) => !removedTags.has(tag)),\n    ),\n  ]\n\n  return input.delivery === \'group_email\'\n    ? [...tags, AUTOMATION_GROUP_EMAIL_DELIVERY_TAG]\n    : tags\n}\n\nexport function resolveAutomationGroupEmailConfigurationIssue(input: {\n  continuityPolicy: AutomationContinuityPolicy\n  delivery: AutomationDelivery\n  route: Pick<AutomationRoute, \'channel\' | \'threadIsDirect\'>\n  schedule: AutomationSchedule\n}): AutomationGroupEmailConfigurationIssue | null {\n  if (input.delivery !== \'group_email\') {\n    return null\n  }\n\n  const channel = input.route.channel?.trim().toLowerCase()\n  if (\n    input.route.threadIsDirect !== false\n    || (channel !== \'linq\' && channel !== \'telegram\')\n  ) {\n    return \'group_email_requires_group_conversation\'\n  }\n  if (input.schedule.kind !== \'cron\') {\n    return \'group_email_requires_cron_schedule\'\n  }\n  return input.continuityPolicy === \'fresh\'\n    ? null\n    : \'group_email_requires_fresh_continuity\'\n}\n\nexport function buildAutomationGroupEmailExecutionPrompt(input: {\n  title: string\n}): string {\n  return [\n    \'Trusted scheduled group-email delivery contract:\',\n    \'- The saved automation instructions and referenced skills define what to produce. This runtime contract only governs authorized email delivery.\',\n    \'- Call `murph.newsletter` with `action="prepare"` exactly once and with no group or route identifier. Use only the returned `members` facts and `referenceAt`. Do not use raw share files or private one-to-one data.\',\n    \'- If preparation is unavailable or `referenceAt` is absent, return a skip decision and stop. If no participant can receive email, return one short chat message pointing to https://www.withmurph.ai/settings?addEmail=true and stop.\',\n    `- The email subject must start with the exact automation title ${JSON.stringify(input.title)} and continue with a specific hook. Provide equivalent HTML and text bodies.`,\n    \'- Call `murph.newsletter` with `action="send"` exactly once and with no group or route identifier. After any send result, return a skip decision; the group-email outbox owns delivery and retry.\',\n    \'- Before finishing, verify that you used only the authorized prepare result and exactly one email delivery path.\',\n  ].join(\'\\n\')\n}\n')
          write('packages/assistant-engine/src/assistant/group-newsletter-automation.ts', 'import type {\n  AutomationSchedule,\n} from \'@murphai/contracts\'\nimport {\n  AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n  buildAutomationGroupEmailExecutionPrompt,\n  hasAutomationGroupEmailDeliveryTag,\n} from \'./automation-delivery.js\'\n\nexport const GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG =\n  \'group-health-newsletter\' as const\n\n// Legacy values remain readable during migration. New email writes use the\n// generic automation-delivery tag; current-chat compatibility writes retain\n// their old tag so configuration-only records still receive an execution\n// overlay.\nexport const GROUP_NEWSLETTER_EMAIL_DELIVERY_TAG =\n  \'system:group-newsletter:email\' as const\nexport const GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG =\n  \'system:group-newsletter:current-chat\' as const\nexport const GROUP_NEWSLETTER_LEGACY_DELIVERY_TAGS = [\n  GROUP_NEWSLETTER_EMAIL_DELIVERY_TAG,\n  GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG,\n] as const\nexport const GROUP_NEWSLETTER_AUTOMATION_INSTRUCTIONS_MARKER =\n  \'Murph group newsletter configuration v1.\' as const\n\nexport const GROUP_NEWSLETTER_HEALTH_SCOPE_VALUES = [\n  \'steps-days.v0\',\n  \'activity-days.v0\',\n  \'workout-days.v0\',\n  \'sleep-duration-days.v0\',\n  \'sleep-times.v0\',\n  \'resting-heart-rate-days.v0\',\n  \'hrv-days.v0\',\n] as const\n\nexport const GROUP_NEWSLETTER_DEFAULT_HEALTH_SCOPES = [\n  ...GROUP_NEWSLETTER_HEALTH_SCOPE_VALUES,\n] as const\n\nexport const GROUP_NEWSLETTER_CURRENT_CHAT_DEFAULT_HEALTH_SCOPES = [\n  \'steps-days.v0\',\n  \'activity-days.v0\',\n  \'sleep-duration-days.v0\',\n] as const\n\nexport const GROUP_NEWSLETTER_DELIVERY_VALUES = [\n  \'current_chat\',\n  \'group_email\',\n] as const\n\nexport const GROUP_NEWSLETTER_TONE_VALUES = [\n  \'supportive\',\n  \'coach_roast\',\n] as const\n\nexport type GroupNewsletterDelivery =\n  typeof GROUP_NEWSLETTER_DELIVERY_VALUES[number]\nexport type GroupNewsletterHealthScope =\n  typeof GROUP_NEWSLETTER_HEALTH_SCOPE_VALUES[number]\nexport type GroupNewsletterTone = typeof GROUP_NEWSLETTER_TONE_VALUES[number]\n\nexport interface GroupNewsletterAutomationConfiguration {\n  customNote?: string | null\n  delivery: GroupNewsletterDelivery\n  healthScopes: readonly GroupNewsletterHealthScope[]\n  newsletterName: string\n  tone: GroupNewsletterTone\n}\n\n/**\n * Compatibility compiler for callers that still use save_newsletter. New\n * newsletter setup is owned by the group-newsletter skill and ordinary\n * automation save/patch with an explicit command-only delivery field.\n */\nexport function buildGroupNewsletterAutomationSaveRequest(input: {\n  configuration: GroupNewsletterAutomationConfiguration\n  schedule: Extract<AutomationSchedule, { kind: \'cron\' }>\n}): {\n  action: \'save\'\n  continuityPolicy: \'fresh\'\n  instructions: string\n  schedule: Extract<AutomationSchedule, { kind: \'cron\' }>\n  slug: typeof GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG\n  tags: string[]\n  title: string\n} {\n  return {\n    action: \'save\',\n    continuityPolicy: \'fresh\',\n    instructions: buildGroupNewsletterAutomationInstructions(input.configuration),\n    schedule: input.schedule,\n    slug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    tags: buildGroupNewsletterAutomationTags(input.configuration.delivery),\n    title: input.configuration.newsletterName,\n  }\n}\n\nexport function buildGroupNewsletterAutomationInstructions(\n  input: GroupNewsletterAutomationConfiguration,\n): string {\n  const customNote = input.customNote?.trim() || null\n  return [\n    GROUP_NEWSLETTER_AUTOMATION_INSTRUCTIONS_MARKER,\n    \'These are configuration values. The runtime appends the current execution contract on every scheduled run.\',\n    `Newsletter name: ${JSON.stringify(input.newsletterName)}`,\n    `Delivery: ${input.delivery}`,\n    `Tone: ${input.tone}`,\n    `Health scopes: ${input.healthScopes.join(\', \')}`,\n    `Custom note: ${customNote === null ? \'none\' : JSON.stringify(customNote)}`,\n  ].join(\'\\n\')\n}\n\nexport function buildGroupNewsletterAutomationTags(\n  delivery: GroupNewsletterDelivery,\n): string[] {\n  return [\n    \'assistant\',\n    \'scheduled\',\n    delivery === \'group_email\'\n      ? AUTOMATION_GROUP_EMAIL_DELIVERY_TAG\n      : GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG,\n  ]\n}\n\nexport function isCanonicalGroupNewsletterAutomationInstructions(\n  instructions: string,\n): boolean {\n  return instructions.startsWith(\n    `${GROUP_NEWSLETTER_AUTOMATION_INSTRUCTIONS_MARKER}\\n`,\n  )\n}\n\nexport function hasLegacyGroupNewsletterDeliveryTag(\n  tags: readonly string[],\n): boolean {\n  return tags.includes(GROUP_NEWSLETTER_EMAIL_DELIVERY_TAG)\n    || tags.includes(GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG)\n}\n\nexport function hasGroupNewsletterDeliveryTag(tags: readonly string[]): boolean {\n  return hasAutomationGroupEmailDeliveryTag(tags)\n    || hasLegacyGroupNewsletterDeliveryTag(tags)\n}\n\nexport function isLegacyGroupNewsletterAutomation(input: {\n  instructions?: string\n  slug: string\n  tags: readonly string[]\n}): boolean {\n  return input.slug === GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG\n    && (\n      hasLegacyGroupNewsletterDeliveryTag(input.tags)\n      || (\n        typeof input.instructions === \'string\'\n        && isCanonicalGroupNewsletterAutomationInstructions(input.instructions)\n      )\n    )\n}\n\nexport function resolveLegacyGroupNewsletterAutomationDelivery(input: {\n  instructions?: string\n  slug: string\n  tags: readonly string[]\n}): GroupNewsletterDelivery | null {\n  if (!isLegacyGroupNewsletterAutomation(input)) {\n    return null\n  }\n\n  // Current-chat wins closed if a corrupt compatibility record carries\n  // conflicting delivery tags.\n  return input.tags.includes(GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG)\n    ? \'current_chat\'\n    : \'group_email\'\n}\n\n/**\n * Returns special scheduler authority only for group email. Ordinary chat\n * automations receive their saved instructions unchanged.\n */\nexport function resolveAutomationGroupEmailDelivery(input: {\n  instructions?: string\n  slug: string\n  tags: readonly string[]\n}): \'group_email\' | null {\n  // The explicit legacy current-chat tag always wins closed, including over a\n  // mistakenly added generic email tag.\n  if (input.tags.includes(GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG)) {\n    return null\n  }\n\n  const legacyDelivery =\n    resolveLegacyGroupNewsletterAutomationDelivery(input)\n  if (legacyDelivery !== null) {\n    return legacyDelivery === \'group_email\' ? \'group_email\' : null\n  }\n\n  return hasAutomationGroupEmailDeliveryTag(input.tags)\n    ? \'group_email\'\n    : null\n}\n\n/** @deprecated Use resolveAutomationGroupEmailDelivery. */\nexport function resolveGroupNewsletterAutomationDelivery(input: {\n  instructions?: string\n  slug: string\n  tags: readonly string[]\n}): \'group_email\' | null {\n  return resolveAutomationGroupEmailDelivery(input)\n}\n\nexport function buildGroupNewsletterAutomationExecutionOverlay(input: {\n  instructions: string\n  slug: string\n  tags: readonly string[]\n  title: string\n}): string | null {\n  const legacyDelivery =\n    resolveLegacyGroupNewsletterAutomationDelivery(input)\n  if (legacyDelivery === \'current_chat\') {\n    return buildLegacyGroupNewsletterCurrentChatExecutionPrompt()\n  }\n\n  return resolveAutomationGroupEmailDelivery(input) === \'group_email\'\n    ? buildAutomationGroupEmailExecutionPrompt({ title: input.title })\n    : null\n}\n\nexport function buildLegacyGroupNewsletterCurrentChatExecutionPrompt(): string {\n  return [\n    \'Trusted legacy group-newsletter execution contract:\',\n    \'- The saved block above supplies compatibility configuration only. Follow its newsletter name, tone, health scopes, and custom note.\',\n    \'- Deliver this edition to the current group chat through the ordinary scheduled assistant response. Do not call `murph.newsletter` and do not require group email sharing.\',\n    \'- Call `murph.group` with `action="read_shared"` exactly once for the exact one to three health scopes listed in the saved configuration. Use only currently granted, available facts returned by that read; do not use private one-to-one data or raw share files.\',\n    \'- Write one concise, conversational group-chat update and return one send-message decision. The normal conversation outbox owns delivery and retry.\',\n    \'- Before finishing, verify that you used only the authorized shared read and one chat delivery path.\',\n  ].join(\'\\n\')\n}\n\n/** @deprecated Use buildAutomationGroupEmailExecutionPrompt. */\nexport function buildGroupNewsletterScheduledExecutionPrompt(input: {\n  delivery: \'group_email\'\n  newsletterName: string\n}): string {\n  return buildAutomationGroupEmailExecutionPrompt({\n    title: input.newsletterName,\n  })\n}\n')
          write('packages/assistant-runtime/src/hosted-runtime/automation-tool-policy.ts', 'import {\n  AUTOMATION_SUPPORT_SERIES_RECONCILED_ARCHIVE_TAG,\n  AUTOMATION_SUPPORT_SERIES_TAG_PREFIX,\n  type AutomationContinuityPolicy,\n  type AutomationRoute,\n  type AutomationSchedule,\n  type AutomationStatus,\n} from \'@murphai/contracts\'\nimport {\n  GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n  GROUP_NEWSLETTER_LEGACY_DELIVERY_TAGS,\n  hasAutomationGroupEmailDeliveryTag,\n  hasGroupNewsletterDeliveryTag,\n  isCanonicalGroupNewsletterAutomationInstructions,\n  isLegacyGroupNewsletterAutomation,\n  resolveAutomationDeliveryTags,\n  resolveAutomationGroupEmailConfigurationIssue,\n  type AssistantHostedAutomationToolRequest,\n  type AutomationDelivery,\n} from \'@murphai/assistant-engine\'\nimport { VaultCliError } from \'@murphai/operator-config/vault-cli-errors\'\n\ntype HostedAutomationSaveRequest = Extract<\n  AssistantHostedAutomationToolRequest,\n  { action: \'save\' }\n>\ntype HostedAutomationPatchRequest = Extract<\n  AssistantHostedAutomationToolRequest,\n  { action: \'patch\' }\n>\n\nexport interface HostedAutomationPolicyExistingRecord {\n  continuityPolicy: AutomationContinuityPolicy\n  instructions: string\n  schedule: AutomationSchedule\n  slug: string\n  status: AutomationStatus\n  tags: readonly string[]\n}\n\nexport interface HostedAutomationSavePolicy {\n  continuityPolicy: AutomationContinuityPolicy\n  status: AutomationStatus\n  tags: string[] | undefined\n}\n\nexport interface HostedAutomationPatchPolicy {\n  status: AutomationStatus\n  tags: string[] | undefined\n}\n\nexport function resolveHostedAutomationSavePolicy(input: {\n  existing: HostedAutomationPolicyExistingRecord | null\n  request: HostedAutomationSaveRequest\n  route: Pick<AutomationRoute, \'channel\' | \'threadIsDirect\'>\n  targetSlug: string\n}): HostedAutomationSavePolicy {\n  const compatibilitySave =\n    isCanonicalLegacyGroupNewsletterSaveRequest(input.request)\n  assertHostedAutomationSaveRequest({\n    compatibilitySave,\n    existing: input.existing,\n    request: input.request,\n    route: input.route,\n    targetSlug: input.targetSlug,\n  })\n\n  const existingGroupEmail =\n    input.existing !== null\n    && hasAutomationGroupEmailDeliveryTag(input.existing.tags)\n  const delivery = input.request.delivery\n    ?? (existingGroupEmail ? \'group_email\' : \'current_conversation\')\n  const status = input.request.status ?? input.existing?.status ?? \'active\'\n  const continuityPolicy =\n    input.request.continuityPolicy\n    ?? input.existing?.continuityPolicy\n    ?? (delivery === \'group_email\' ? \'fresh\' : \'preserve\')\n\n  if (\n    status !== \'archived\'\n    && (input.request.delivery !== undefined || existingGroupEmail)\n  ) {\n    assertHostedAutomationDeliveryConfiguration({\n      continuityPolicy,\n      delivery,\n      route: input.route,\n      schedule: input.request.schedule,\n    })\n  }\n\n  return {\n    continuityPolicy,\n    status,\n    tags: resolveHostedAutomationPolicyTags({\n      compatibilitySave,\n      delivery,\n      existing: input.existing,\n      requestedDelivery: input.request.delivery,\n      requestedTags: input.request.tags,\n    }),\n  }\n}\n\nexport function resolveHostedAutomationPatchPolicy(input: {\n  existing: HostedAutomationPolicyExistingRecord\n  request: HostedAutomationPatchRequest\n  route: Pick<AutomationRoute, \'channel\' | \'threadIsDirect\'>\n}): HostedAutomationPatchPolicy {\n  assertHostedAutomationPatchRequest(input)\n\n  const existingGroupEmail =\n    hasAutomationGroupEmailDeliveryTag(input.existing.tags)\n  const delivery = input.request.delivery\n    ?? (existingGroupEmail ? \'group_email\' : \'current_conversation\')\n  const status = input.request.status ?? input.existing.status\n  if (\n    status !== \'archived\'\n    && (input.request.delivery !== undefined || existingGroupEmail)\n  ) {\n    assertHostedAutomationDeliveryConfiguration({\n      continuityPolicy:\n        input.request.continuityPolicy ?? input.existing.continuityPolicy,\n      delivery,\n      route: input.route,\n      schedule: input.request.schedule ?? input.existing.schedule,\n    })\n  }\n\n  return {\n    status,\n    tags: resolveHostedAutomationPolicyTags({\n      compatibilitySave: false,\n      delivery,\n      existing: input.existing,\n      requestedDelivery: input.request.delivery,\n      requestedTags: input.request.tags,\n    }),\n  }\n}\n\nexport function isCanonicalLegacyGroupNewsletterSaveRequest(\n  request: HostedAutomationSaveRequest,\n): boolean {\n  const tags = request.tags ?? []\n  const deliveryTagCount = tags.filter((tag) =>\n    hasGroupNewsletterDeliveryTag([tag])\n  ).length\n  return request.slug === GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG\n    && request.schedule.kind === \'cron\'\n    && request.continuityPolicy === \'fresh\'\n    && tags.length === 3\n    && tags.includes(\'assistant\')\n    && tags.includes(\'scheduled\')\n    && deliveryTagCount === 1\n    && isCanonicalGroupNewsletterAutomationInstructions(request.instructions)\n}\n\nfunction assertHostedAutomationSaveRequest(input: {\n  compatibilitySave: boolean\n  existing: HostedAutomationPolicyExistingRecord | null\n  request: HostedAutomationSaveRequest\n  route: Pick<AutomationRoute, \'channel\' | \'threadIsDirect\'>\n  targetSlug: string\n}): void {\n  if (input.compatibilitySave) {\n    assertHostedGroupConversationRoute(input.route)\n    return\n  }\n\n  if (input.request.tags?.some((tag) =>\n    hasGroupNewsletterDeliveryTag([tag])\n  )) {\n    throw new VaultCliError(\n      \'invalid_option\',\n      \'Automation delivery tags are host-owned; use the delivery field.\',\n    )\n  }\n  if (\n    isCanonicalGroupNewsletterAutomationInstructions(\n      input.request.instructions,\n    )\n  ) {\n    throw new VaultCliError(\n      \'invalid_option\',\n      \'The legacy newsletter configuration marker is reserved for save_newsletter compatibility.\',\n    )\n  }\n\n  const existingLegacy = input.existing !== null\n    && isLegacyGroupNewsletterAutomation(input.existing)\n  if (existingLegacy && input.request.delivery === undefined) {\n    throw new VaultCliError(\n      \'invalid_option\',\n      \'Migrating a legacy newsletter requires an explicit delivery value and complete ordinary automation instructions.\',\n    )\n  }\n  if (\n    input.existing === null\n    && input.targetSlug === GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG\n    && input.request.delivery === undefined\n  ) {\n    throw new VaultCliError(\n      \'invalid_option\',\n      \'A new group newsletter requires explicit current_conversation or group_email delivery.\',\n    )\n  }\n}\n\nfunction assertHostedAutomationPatchRequest(input: {\n  existing: HostedAutomationPolicyExistingRecord\n  request: HostedAutomationPatchRequest\n}): void {\n  if (input.request.tags?.some((tag) =>\n    hasGroupNewsletterDeliveryTag([tag])\n  )) {\n    throw new VaultCliError(\n      \'invalid_option\',\n      \'Automation delivery tags are host-owned; use the delivery field.\',\n    )\n  }\n  if (\n    input.request.instructions !== undefined\n    && isCanonicalGroupNewsletterAutomationInstructions(\n      input.request.instructions,\n    )\n  ) {\n    throw new VaultCliError(\n      \'invalid_option\',\n      \'The legacy newsletter configuration marker is reserved for save_newsletter compatibility.\',\n    )\n  }\n  if (\n    input.request.slug === GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG\n    && input.existing.slug !== GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG\n    && input.request.delivery === undefined\n  ) {\n    throw new VaultCliError(\n      \'invalid_option\',\n      \'Claiming the group newsletter slug requires explicit current_conversation or group_email delivery.\',\n    )\n  }\n  if (!isLegacyGroupNewsletterAutomation(input.existing)) {\n    return\n  }\n\n  if (input.request.delivery !== undefined) {\n    if (input.request.instructions === undefined) {\n      throw new VaultCliError(\n        \'invalid_option\',\n        \'Migrating a legacy newsletter requires complete ordinary automation instructions in the same patch.\',\n      )\n    }\n    return\n  }\n\n  const changesLegacyConfiguration =\n    input.request.activeUntil !== undefined\n    || input.request.assistantTargetOverride !== undefined\n    || input.request.continuityPolicy !== undefined\n    || input.request.instructions !== undefined\n    || input.request.retargetToCurrentConversation !== undefined\n    || input.request.schedule !== undefined\n    || input.request.slug !== undefined\n    || input.request.summary !== undefined\n    || input.request.supportKind !== undefined\n    || input.request.supportSeriesId !== undefined\n    || input.request.tags !== undefined\n    || input.request.title !== undefined\n  if (changesLegacyConfiguration) {\n    throw new VaultCliError(\n      \'invalid_option\',\n      \'Legacy newsletter configuration changes require explicit delivery and complete ordinary automation instructions; status-only patches remain supported.\',\n    )\n  }\n}\n\nfunction resolveHostedAutomationPolicyTags(input: {\n  compatibilitySave: boolean\n  delivery: AutomationDelivery\n  existing: HostedAutomationPolicyExistingRecord | null\n  requestedDelivery?: AutomationDelivery\n  requestedTags?: readonly string[]\n}): string[] | undefined {\n  if (input.compatibilitySave) {\n    return input.requestedTags ? [...input.requestedTags] : undefined\n  }\n\n  const existingGroupEmail =\n    input.existing !== null\n    && hasAutomationGroupEmailDeliveryTag(input.existing.tags)\n  if (\n    input.requestedDelivery === undefined\n    && !(existingGroupEmail && input.requestedTags !== undefined)\n  ) {\n    return input.requestedTags ? [...input.requestedTags] : undefined\n  }\n\n  return resolveAutomationDeliveryTags({\n    delivery: input.delivery,\n    existingTags: listHostedAutomationMutableTags(input.existing?.tags),\n    removeTags: GROUP_NEWSLETTER_LEGACY_DELIVERY_TAGS,\n    requestedTags: input.requestedTags,\n  })\n}\n\nfunction listHostedAutomationMutableTags(\n  tags: readonly string[] | undefined,\n): string[] {\n  return (tags ?? []).filter((tag) =>\n    tag !== AUTOMATION_SUPPORT_SERIES_RECONCILED_ARCHIVE_TAG\n    && !tag.startsWith(AUTOMATION_SUPPORT_SERIES_TAG_PREFIX)\n  )\n}\n\nfunction assertHostedAutomationDeliveryConfiguration(input: {\n  continuityPolicy: AutomationContinuityPolicy\n  delivery: AutomationDelivery\n  route: Pick<AutomationRoute, \'channel\' | \'threadIsDirect\'>\n  schedule: AutomationSchedule\n}): void {\n  const issue = resolveAutomationGroupEmailConfigurationIssue(input)\n  if (issue === null) {\n    return\n  }\n\n  const message = issue === \'group_email_requires_group_conversation\'\n    ? \'Group-email delivery can be configured only from a current iMessage or Telegram group conversation.\'\n    : issue === \'group_email_requires_cron_schedule\'\n      ? \'Group-email delivery requires a cron schedule.\'\n      : \'Group-email delivery requires continuityPolicy="fresh".\'\n  throw new VaultCliError(\'invalid_option\', message)\n}\n\nfunction assertHostedGroupConversationRoute(\n  route: Pick<AutomationRoute, \'channel\' | \'threadIsDirect\'>,\n): void {\n  const channel = route.channel?.trim().toLowerCase()\n  if (\n    route.threadIsDirect !== false\n    || (channel !== \'linq\' && channel !== \'telegram\')\n  ) {\n    throw new VaultCliError(\n      \'invalid_option\',\n      \'Group newsletters can be configured only from the current iMessage or Telegram group conversation.\',\n    )\n  }\n}\n')
          write('packages/assistant-engine/test/automation-delivery.test.ts', 'import { describe, expect, it } from \'vitest\'\n\nimport { readAutomationDynamicToolRequest } from \'../src/assistant-codex/dynamic-tools/automation.js\'\nimport {\n  AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n  resolveAutomationDeliveryTags,\n  resolveAutomationGroupEmailConfigurationIssue,\n} from \'../src/assistant/automation-delivery.js\'\nimport {\n  GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n  GROUP_NEWSLETTER_AUTOMATION_INSTRUCTIONS_MARKER,\n  GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG,\n  GROUP_NEWSLETTER_EMAIL_DELIVERY_TAG,\n  buildGroupNewsletterAutomationExecutionOverlay,\n  buildGroupNewsletterAutomationSaveRequest,\n  resolveAutomationGroupEmailDelivery,\n} from \'../src/assistant/group-newsletter-automation.js\'\n\ndescribe(\'automation delivery\', () => {\n  it(\'keeps current-conversation delivery command-only on ordinary saves\', () => {\n    expect(readAutomationDynamicToolRequest({\n      arguments: {\n        action: \'save\',\n        continuityPolicy: \'fresh\',\n        delivery: \'current_conversation\',\n        instructions: \'Read the group-newsletter skill and publish one chat edition.\',\n        schedule: { expression: \'0 13 * * 1\', kind: \'cron\' },\n        slug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n        title: \'Family weekly health newsletter\',\n      },\n      tool: \'automation\',\n    })).toEqual({\n      kind: \'automation\',\n      request: {\n        action: \'save\',\n        continuityPolicy: \'fresh\',\n        delivery: \'current_conversation\',\n        instructions: \'Read the group-newsletter skill and publish one chat edition.\',\n        schedule: { expression: \'0 13 * * 1\', kind: \'cron\' },\n        slug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n        title: \'Family weekly health newsletter\',\n      },\n    })\n  })\n\n  it(\'defaults group-email saves to fresh continuity without exposing a reserved tag\', () => {\n    expect(readAutomationDynamicToolRequest({\n      arguments: {\n        action: \'save\',\n        delivery: \'group_email\',\n        instructions: \'Read the group-newsletter skill and send one authorized email edition.\',\n        schedule: { expression: \'0 13 * * 1\', kind: \'cron\' },\n        tags: [\'assistant\', \'scheduled\'],\n        title: \'Family weekly health newsletter\',\n      },\n      tool: \'automation\',\n    })).toEqual({\n      kind: \'automation\',\n      request: {\n        action: \'save\',\n        continuityPolicy: \'fresh\',\n        delivery: \'group_email\',\n        instructions: \'Read the group-newsletter skill and send one authorized email edition.\',\n        schedule: { expression: \'0 13 * * 1\', kind: \'cron\' },\n        tags: [\'assistant\', \'scheduled\'],\n        title: \'Family weekly health newsletter\',\n      },\n    })\n  })\n\n  it(\'rejects group-email schedules that can never receive scheduled authority\', () => {\n    for (const argumentsValue of [\n      {\n        action: \'save\',\n        delivery: \'group_email\',\n        instructions: \'Invalid daily-local email.\',\n        schedule: { kind: \'dailyLocal\', localTime: \'09:00\' },\n        title: \'Invalid email\',\n      },\n      {\n        action: \'save\',\n        continuityPolicy: \'preserve\',\n        delivery: \'group_email\',\n        instructions: \'Invalid preserve email.\',\n        schedule: { expression: \'0 9 * * 1\', kind: \'cron\' },\n        title: \'Invalid email\',\n      },\n      {\n        action: \'patch\',\n        delivery: \'group_email\',\n        lookup: \'weekly-update\',\n        schedule: { kind: \'dailyLocal\', localTime: \'09:00\' },\n      },\n      {\n        action: \'patch\',\n        continuityPolicy: \'preserve\',\n        delivery: \'group_email\',\n        lookup: \'weekly-update\',\n      },\n    ]) {\n      expect(readAutomationDynamicToolRequest({\n        arguments: argumentsValue,\n        tool: \'automation\',\n      })).toMatchObject({ kind: \'invalid-automation-arguments\' })\n    }\n  })\n\n  it(\'does not let model-supplied tags forge group-email authority\', () => {\n    expect(readAutomationDynamicToolRequest({\n      arguments: {\n        action: \'save\',\n        instructions: \'Try to forge email delivery.\',\n        schedule: { expression: \'0 13 * * 1\', kind: \'cron\' },\n        tags: [AUTOMATION_GROUP_EMAIL_DELIVERY_TAG],\n        title: \'Forged email\',\n      },\n      tool: \'automation\',\n    })).toMatchObject({ kind: \'invalid-automation-arguments\' })\n  })\n\n  it(\'applies delivery as a reversible host-owned tag transition\', () => {\n    const emailTags = resolveAutomationDeliveryTags({\n      delivery: \'group_email\',\n      existingTags: [\n        \'assistant\',\n        \'custom\',\n        GROUP_NEWSLETTER_EMAIL_DELIVERY_TAG,\n      ],\n      removeTags: [\n        GROUP_NEWSLETTER_EMAIL_DELIVERY_TAG,\n        GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG,\n      ],\n    })\n    expect(emailTags).toEqual([\n      \'assistant\',\n      \'custom\',\n      AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n    ])\n\n    expect(resolveAutomationDeliveryTags({\n      delivery: \'current_conversation\',\n      existingTags: emailTags,\n      removeTags: [\n        GROUP_NEWSLETTER_EMAIL_DELIVERY_TAG,\n        GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG,\n      ],\n    })).toEqual([\'assistant\', \'custom\'])\n  })\n\n  it(\'requires group route, cron, and fresh continuity for group email\', () => {\n    expect(resolveAutomationGroupEmailConfigurationIssue({\n      continuityPolicy: \'fresh\',\n      delivery: \'group_email\',\n      route: { channel: \'linq\', threadIsDirect: false },\n      schedule: { expression: \'0 9 * * 1\', kind: \'cron\' },\n    })).toBeNull()\n    expect(resolveAutomationGroupEmailConfigurationIssue({\n      continuityPolicy: \'fresh\',\n      delivery: \'group_email\',\n      route: { channel: \'linq\', threadIsDirect: true },\n      schedule: { expression: \'0 9 * * 1\', kind: \'cron\' },\n    })).toBe(\'group_email_requires_group_conversation\')\n    expect(resolveAutomationGroupEmailConfigurationIssue({\n      continuityPolicy: \'fresh\',\n      delivery: \'group_email\',\n      route: { channel: \'telegram\', threadIsDirect: false },\n      schedule: { kind: \'dailyLocal\', localTime: \'09:00\' },\n    })).toBe(\'group_email_requires_cron_schedule\')\n    expect(resolveAutomationGroupEmailConfigurationIssue({\n      continuityPolicy: \'preserve\',\n      delivery: \'group_email\',\n      route: { channel: \'telegram\', threadIsDirect: false },\n      schedule: { expression: \'0 9 * * 1\', kind: \'cron\' },\n    })).toBe(\'group_email_requires_fresh_continuity\')\n  })\n\n  it(\'never infers email authority from the newsletter slug alone\', () => {\n    expect(resolveAutomationGroupEmailDelivery({\n      instructions: \'Read the group-newsletter skill and publish one chat edition.\',\n      slug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n      tags: [],\n    })).toBeNull()\n  })\n\n  it(\'keeps legacy records executable while failing conflicting chat state closed\', () => {\n    const compatibilityInstructions = [\n      GROUP_NEWSLETTER_AUTOMATION_INSTRUCTIONS_MARKER,\n      \'Newsletter name: "Family weekly"\',\n    ].join(\'\\n\')\n    expect(resolveAutomationGroupEmailDelivery({\n      instructions: compatibilityInstructions,\n      slug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n      tags: [],\n    })).toBe(\'group_email\')\n    expect(resolveAutomationGroupEmailDelivery({\n      instructions: compatibilityInstructions,\n      slug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n      tags: [GROUP_NEWSLETTER_EMAIL_DELIVERY_TAG],\n    })).toBe(\'group_email\')\n    expect(resolveAutomationGroupEmailDelivery({\n      instructions: compatibilityInstructions,\n      slug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n      tags: [\n        GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG,\n        AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n      ],\n    })).toBeNull()\n\n    const overlay = buildGroupNewsletterAutomationExecutionOverlay({\n      instructions: compatibilityInstructions,\n      slug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n      tags: [GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG],\n      title: \'Family weekly\',\n    })\n    expect(overlay).toContain(\'`murph.group` with `action="read_shared"` exactly once\')\n    expect(overlay).not.toContain(\'`murph.newsletter` with `action="prepare"`\')\n  })\n\n  it(\'lets the compatibility compiler migrate email writes to the generic tag\', () => {\n    expect(buildGroupNewsletterAutomationSaveRequest({\n      configuration: {\n        delivery: \'group_email\',\n        healthScopes: [\'steps-days.v0\'],\n        newsletterName: \'Family weekly\',\n        tone: \'supportive\',\n      },\n      schedule: { expression: \'0 9 * * 1\', kind: \'cron\' },\n    }).tags).toEqual([\n      \'assistant\',\n      \'scheduled\',\n      AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n    ])\n    expect(buildGroupNewsletterAutomationSaveRequest({\n      configuration: {\n        delivery: \'current_chat\',\n        healthScopes: [\'steps-days.v0\'],\n        newsletterName: \'Family weekly\',\n        tone: \'supportive\',\n      },\n      schedule: { expression: \'0 9 * * 1\', kind: \'cron\' },\n    }).tags).toEqual([\n      \'assistant\',\n      \'scheduled\',\n      GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG,\n    ])\n  })\n})\n')
          write('packages/assistant-runtime/test/automation-tool-policy.test.ts', 'import { describe, expect, it } from \'vitest\'\n\nimport {\n  AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n  GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n  GROUP_NEWSLETTER_AUTOMATION_INSTRUCTIONS_MARKER,\n  GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG,\n} from \'@murphai/assistant-engine\'\nimport type {\n  AssistantHostedAutomationToolRequest,\n} from \'@murphai/assistant-engine\'\n\nimport {\n  resolveHostedAutomationPatchPolicy,\n  resolveHostedAutomationSavePolicy,\n  type HostedAutomationPolicyExistingRecord,\n} from \'../src/hosted-runtime/automation-tool-policy.js\'\n\nconst GROUP_ROUTE = {\n  channel: \'linq\',\n  threadIsDirect: false,\n} as const\nconst DIRECT_ROUTE = {\n  channel: \'linq\',\n  threadIsDirect: true,\n} as const\nconst CRON_SCHEDULE = {\n  expression: \'0 9 * * 1\',\n  kind: \'cron\',\n} as const\n\ntype SaveRequest = Extract<\n  AssistantHostedAutomationToolRequest,\n  { action: \'save\' }\n>\ntype PatchRequest = Extract<\n  AssistantHostedAutomationToolRequest,\n  { action: \'patch\' }\n>\n\nfunction existing(\n  overrides: Partial<HostedAutomationPolicyExistingRecord> = {},\n): HostedAutomationPolicyExistingRecord {\n  return {\n    continuityPolicy: \'fresh\',\n    instructions: \'Read the group-newsletter skill and produce one edition.\',\n    schedule: CRON_SCHEDULE,\n    slug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    status: \'active\',\n    tags: [],\n    ...overrides,\n  }\n}\n\nfunction save(\n  overrides: Partial<SaveRequest> = {},\n): SaveRequest {\n  return {\n    action: \'save\',\n    delivery: \'current_conversation\',\n    instructions: \'Read the group-newsletter skill and produce one edition.\',\n    schedule: CRON_SCHEDULE,\n    slug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    title: \'Family weekly\',\n    ...overrides,\n  }\n}\n\nfunction patch(\n  overrides: Partial<PatchRequest> = {},\n): PatchRequest {\n  return {\n    action: \'patch\',\n    lookup: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    ...overrides,\n  }\n}\n\ndescribe(\'hosted automation tool policy\', () => {\n  it(\'accepts an ordinary current-chat newsletter without special tags\', () => {\n    expect(resolveHostedAutomationSavePolicy({\n      existing: null,\n      request: save({ continuityPolicy: \'fresh\' }),\n      route: GROUP_ROUTE,\n      targetSlug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    })).toEqual({\n      continuityPolicy: \'fresh\',\n      status: \'active\',\n      tags: [],\n    })\n  })\n\n  it(\'requires explicit delivery for a new stable newsletter slug\', () => {\n    const request = save()\n    delete request.delivery\n    expect(() => resolveHostedAutomationSavePolicy({\n      existing: null,\n      request,\n      route: GROUP_ROUTE,\n      targetSlug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    })).toThrow(/requires explicit current_conversation or group_email/u)\n  })\n\n  it(\'adds host-owned email authority and defaults new email continuity to fresh\', () => {\n    expect(resolveHostedAutomationSavePolicy({\n      existing: null,\n      request: save({\n        continuityPolicy: undefined,\n        delivery: \'group_email\',\n        slug: \'group-weekly-update\',\n        tags: [\'assistant\', \'custom\'],\n      }),\n      route: GROUP_ROUTE,\n      targetSlug: \'group-weekly-update\',\n    })).toEqual({\n      continuityPolicy: \'fresh\',\n      status: \'active\',\n      tags: [\n        \'assistant\',\n        \'custom\',\n        AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n      ],\n    })\n  })\n\n  it(\'rejects email authority on direct, non-cron, or preserve configurations\', () => {\n    expect(() => resolveHostedAutomationSavePolicy({\n      existing: null,\n      request: save({ delivery: \'group_email\', slug: \'weekly-email\' }),\n      route: DIRECT_ROUTE,\n      targetSlug: \'weekly-email\',\n    })).toThrow(/current iMessage or Telegram group conversation/u)\n\n    expect(() => resolveHostedAutomationSavePolicy({\n      existing: null,\n      request: save({\n        delivery: \'group_email\',\n        schedule: { kind: \'dailyLocal\', localTime: \'09:00\' },\n        slug: \'weekly-email\',\n      }),\n      route: GROUP_ROUTE,\n      targetSlug: \'weekly-email\',\n    })).toThrow(/requires a cron schedule/u)\n\n    expect(() => resolveHostedAutomationSavePolicy({\n      existing: null,\n      request: save({\n        continuityPolicy: \'preserve\',\n        delivery: \'group_email\',\n        slug: \'weekly-email\',\n      }),\n      route: GROUP_ROUTE,\n      targetSlug: \'weekly-email\',\n    })).toThrow(/requires continuityPolicy="fresh"/u)\n  })\n\n  it(\'preserves paused email mode and unrelated tags on an ordinary resave\', () => {\n    expect(resolveHostedAutomationSavePolicy({\n      existing: existing({\n        status: \'paused\',\n        tags: [\n          \'assistant\',\n          \'old-tag\',\n          AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n        ],\n      }),\n      request: save({\n        delivery: undefined,\n        tags: [\'assistant\', \'new-tag\'],\n      }),\n      route: GROUP_ROUTE,\n      targetSlug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    })).toEqual({\n      continuityPolicy: \'fresh\',\n      status: \'paused\',\n      tags: [\n        \'assistant\',\n        \'new-tag\',\n        AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n      ],\n    })\n  })\n\n  it(\'switches email back to chat by removing only delivery-owned tags\', () => {\n    expect(resolveHostedAutomationSavePolicy({\n      existing: existing({\n        tags: [\n          \'assistant\',\n          \'custom\',\n          AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n          GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG,\n        ],\n      }),\n      request: save({ delivery: \'current_conversation\' }),\n      route: GROUP_ROUTE,\n      targetSlug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    }).tags).toEqual([\'assistant\', \'custom\'])\n  })\n\n  it(\'accepts the exact compatibility compiler shape but reserves its marker\', () => {\n    const compatibilityInstructions = [\n      GROUP_NEWSLETTER_AUTOMATION_INSTRUCTIONS_MARKER,\n      \'Newsletter name: "Family weekly"\',\n    ].join(\'\\n\')\n    expect(resolveHostedAutomationSavePolicy({\n      existing: null,\n      request: save({\n        continuityPolicy: \'fresh\',\n        delivery: undefined,\n        instructions: compatibilityInstructions,\n        tags: [\n          \'assistant\',\n          \'scheduled\',\n          AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n        ],\n      }),\n      route: GROUP_ROUTE,\n      targetSlug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    }).tags).toEqual([\n      \'assistant\',\n      \'scheduled\',\n      AUTOMATION_GROUP_EMAIL_DELIVERY_TAG,\n    ])\n\n    expect(() => resolveHostedAutomationSavePolicy({\n      existing: null,\n      request: save({\n        delivery: \'current_conversation\',\n        instructions: compatibilityInstructions,\n      }),\n      route: GROUP_ROUTE,\n      targetSlug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    })).toThrow(/legacy newsletter configuration marker is reserved/u)\n  })\n\n  it(\'requires one explicit, complete migration from legacy configuration\', () => {\n    const legacy = existing({\n      instructions: [\n        GROUP_NEWSLETTER_AUTOMATION_INSTRUCTIONS_MARKER,\n        \'Newsletter name: "Family weekly"\',\n      ].join(\'\\n\'),\n      tags: [GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG],\n    })\n    const requestWithoutDelivery = save()\n    delete requestWithoutDelivery.delivery\n    expect(() => resolveHostedAutomationSavePolicy({\n      existing: legacy,\n      request: requestWithoutDelivery,\n      route: GROUP_ROUTE,\n      targetSlug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    })).toThrow(/requires an explicit delivery value/u)\n\n    expect(resolveHostedAutomationSavePolicy({\n      existing: legacy,\n      request: save({\n        delivery: \'current_conversation\',\n        instructions: \'Read the group-newsletter skill and publish one chat edition.\',\n      }),\n      route: GROUP_ROUTE,\n      targetSlug: GROUP_HEALTH_NEWSLETTER_AUTOMATION_SLUG,\n    }).tags).toEqual([])\n  })\n\n  it(\'keeps legacy status-only patches working and migrates configuration atomically\', () => {\n    const legacy = existing({\n      instructions: [\n        GROUP_NEWSLETTER_AUTOMATION_INSTRUCTIONS_MARKER,\n        \'Newsletter name: "Family weekly"\',\n      ].join(\'\\n\'),\n      status: \'paused\',\n      tags: [GROUP_NEWSLETTER_CURRENT_CHAT_DELIVERY_TAG],\n    })\n\n    expect(resolveHostedAutomationPatchPolicy({\n      existing: legacy,\n      request: patch({ status: \'archived\' }),\n      route: GROUP_ROUTE,\n    })).toEqual({\n      status: \'archived\',\n      tags: undefined,\n    })\n    expect(() => resolveHostedAutomationPatchPolicy({\n      existing: legacy,\n      request: patch({ title: \'Renamed\' }),\n      route: GROUP_ROUTE,\n    })).toThrow(/configuration changes require explicit delivery/u)\n    expect(() => resolveHostedAutomationPatchPolicy({\n      existing: legacy,\n      request: patch({ delivery: \'current_conversation\' }),\n      route: GROUP_ROUTE,\n    })).toThrow(/requires complete ordinary automation instructions/u)\n\n    expect(resolveHostedAutomationPatchPolicy({\n      existing: legacy,\n      request: patch({\n        delivery: \'current_conversation\',\n        instructions: \'Read the group-newsletter skill and publish one chat edition.\',\n        title: \'Renamed\',\n      }),\n      route: GROUP_ROUTE,\n    })).toEqual({\n      status: \'paused\',\n      tags: [],\n    })\n  })\n\n  it(\'allows archival cleanup of a malformed existing generic email record\', () => {\n    expect(resolveHostedAutomationPatchPolicy({\n      existing: existing({\n        continuityPolicy: \'preserve\',\n        schedule: { kind: \'dailyLocal\', localTime: \'09:00\' },\n        tags: [AUTOMATION_GROUP_EMAIL_DELIVERY_TAG],\n      }),\n      request: patch({ status: \'archived\' }),\n      route: DIRECT_ROUTE,\n    })).toEqual({\n      status: \'archived\',\n      tags: undefined,\n    })\n  })\n})\n')
          write('packages/assistant-engine/skills/group-newsletter/SKILL.md', '---\nname: group-newsletter\ndescription: Set up and run a recurring group health newsletter as an ordinary Murph automation, with optional consented group-email delivery.\n---\n\n# Group Newsletter\n\nUse this skill when a group asks to create, edit, stop, or run a recurring health newsletter, and on every scheduled group-health-newsletter run. A newsletter is an ordinary group automation plus a reusable, host-authorized group-email delivery mode when email is chosen.\n\n## Set up or edit\n\nAsk only for missing choices that materially change the result:\n\n- newsletter name\n- schedule and timezone\n- delivery in the current chat or by group email\n- one to three shared projection scopes for chat, or the desired authorized email scopes\n- supportive tone or an explicitly opted-in light coach roast\n- any custom editorial note\n\nSave one group-scoped automation with `murph.automation action="save"`:\n\n- use the stable slug `group-health-newsletter`\n- use a cron schedule and `continuityPolicy="fresh"`\n- put the complete recipe in `instructions`, including “read the group-newsletter skill before every execution,” the selected scopes, tone, delivery, and custom note\n- pass `delivery="current_conversation"` for chat\n- pass `delivery="group_email"` only when the group explicitly chose email\n- never author a `system:` tag; delivery tags are host-owned state\n\nDo not use `murph.automation action="save_newsletter"` for new setup. It remains only as a rolling-deploy compatibility action.\n\nFor ordinary edits, use `murph.automation action="patch"` against the stable slug. Include `delivery` whenever delivery changes. Switching to group email also requires a cron schedule and fresh continuity. Retarget only when the group explicitly moves the newsletter to the current conversation.\n\nA legacy newsletter stores configuration-only instructions. Its first configuration edit must migrate atomically: send the complete new ordinary instructions and explicit `delivery` in the same save or patch. A status-only pause, resume, or archive remains valid without migration. Never leave a legacy marker with ordinary delivery state.\n\nFor stop or cancel, archive the automation. Never run another group or accept a model-supplied group, member, route, recipient, or vault identifier.\n\n## Read authorized facts\n\nFor `current_conversation`, do not call `murph.newsletter`. Call `murph.group action="read_shared"` once for the exact configured scopes. Use only currently granted and available facts in that result and follow `group-chat`\'s **Shared fact limits**.\n\nFor `group_email`, call `murph.newsletter action="prepare"` exactly once. Use only `members` and `referenceAt`; those are the currently eligible email recipients and their authorized shared facts. If `prepare` is unavailable, lacks `referenceAt`, or provides no usable authorized facts, do not compose or call `send`. Return `{"kind":"skip","privateSummary":"..."}` unless the runtime contract explicitly asks for the short add-email recovery message.\n\nA current absence proves only the current authorized permission or data-availability state. Never attribute it to sync or permissions without evidence, and do not present it as the historical cause of an earlier result. The consented eight-record projection is a bounded current snapshot, not a complete longitudinal record.\n\n## Compose each edition\n\nWrite a small editorial story, not a dashboard dump. Usually include 6–12 useful stats, but fewer is better than padding. Never expose dashboard language, internal scope names, share IDs, participant IDs, eligibility state, or tool mechanics.\n\nUse ordinary human units and labels. “About 30 minutes of movement a day” is clearer than an unexplained active-minute aggregate. Keep workouts, exercise minutes, steps, sleep, heart rate, and HRV separate. A daily `workout-count` record is evidence for that date only; never turn it into a daily or weekly exercise total.\n\nUse the seven local calendar days before today. Exclude today and anything older than that rolling window. Compare people or periods only when every compared date set is identical. When coverage differs, report scoped values or an unranked pattern. Do not claim a prior-week change without a valid matching prior window.\n\nCross-person comparisons are welcome when fair, legible, and socially useful. Do not rank missing or unequal coverage. Avoid medical conclusions, diagnosis, shame, false precision, and pressure to disclose more data.\n\nFor an opted-in roast, use only light, reversible jokes. Roast behavior, not bodies, illness, disability, medication, sleep disorders, fertility, substance use, or mental health.\n\n### Example 1: close race\n\n“Sam edged Maya by 1,240 steps across the same seven days, while Maya held the steadier sleep schedule. Tuesday was the group’s strongest movement day.”\n\n### Example 2: opted-in roast\n\n“Alex won the step race by treating every grocery aisle like a playoff possession. Jordan’s bedtime remains an independent research project.”\n\n## Deliver\n\nFor current chat, return one concise conversational message. The normal conversation outbox owns delivery and retry.\n\nFor group email:\n\n1. Use subject format `<Exact Newsletter Name> — <specific hook>`.\n2. Produce equivalent HTML and text bodies.\n3. Call `murph.newsletter action="send"` exactly once after a successful same-turn prepare.\n4. After any email send result, return a skip decision. Do not retry in the same turn; the runtime owns delivery, retry, and idempotency.\n5. If nobody can currently receive email and the runtime contract permits recovery, send one short group message linking to `https://www.withmurph.ai/settings?addEmail=true`. Do not name or shame missing recipients.\n\nThe first scheduled email remains subject to the runtime\'s opt-out window. Before finishing, verify that the edition used one authorized data path and exactly one delivery path.\n')
          write('packages/assistant-engine/skills/README.md', '# Assistant skills\n\nMost Murph assistant skills are bundled from this public directory.\n\nThe following stable paths remain bounded fail-closed public fallbacks for\nprivate managed social behavior:\n\n- `group-chat/SKILL.md`\n- `group-challenge/SKILL.md`\n- `group-challenge-scorecards/SKILL.md`\n- `groupchat-comedy/SKILL.md`\n\nMurph Hosted\'s complete production versions of those four skills are owned by\nthe private `cobuildwithus/murph-cloud` repository and are materialized over the\nfallbacks before private integration, runner-bundle assembly, and deployment.\n\n`group-newsletter/SKILL.md` is intentionally different. Newsletter setup,\neditorial rules, shared-read behavior, and ordinary automation authoring are\npublic product behavior. The file is the canonical recipe in every build.\nPrivate integration must not replace it. Security-sensitive recipient,\nconsent, route, occurrence, and provider authority remain enforced by public\nruntime code rather than skill text.\n\nDo not restore managed behavior to the four fallback files. Public Murph\nremains the owner of system/developer safety policy, tool admission and\ndispatch, identity, membership, consent, shared-data scope, medical-risk\nboundaries, persistence, recipients, effect truthfulness, and provider\nauthority. Private skill text may shape behavior only within those public\npowers.\n\nThe stable paths and single `$MURPH_ASSISTANT_SKILLS_ROOT` contract are retained\nso local builds need no private dependency and hosted builds need no second\nloader, registry package, network fetch, submodule, or runtime GitHub access.\n')
          write('agent-docs/product-specs/group-health-newsletter.md', '# Group health newsletter\n\nLast verified: 2026-08-09\nStatus: Implemented\n\n## Product goal\n\nA group can ask Murph for a recurring health newsletter in the current chat or by email. The newsletter is an ordinary group automation whose instructions read the `group-newsletter` skill. Email adds one reusable, host-authorized delivery mode; it is not a second scheduler, state store, or retry system.\n\n## User experience\n\nMurph asks only for missing choices: name, schedule, delivery, shared scopes, tone, and an optional editorial note. It then creates or updates one automation bound to the current iMessage or Telegram group.\n\n- Chat delivery uses the normal scheduled assistant response and conversation outbox.\n- Email delivery uses the same automation plus the existing consent-aware group-email effect and outbox.\n- Editing uses ordinary automation save or patch.\n- Pausing, resuming, and stopping use ordinary status patching or archive.\n\n## Authoring contract\n\nThe `group-newsletter` skill uses `murph.automation action="save"` with:\n\n- stable slug `group-health-newsletter`\n- a cron schedule\n- `continuityPolicy="fresh"`\n- complete ordinary instructions that read the skill on every run and record the selected scopes, tone, delivery, and custom note\n- explicit command-only `delivery="current_conversation"` or `delivery="group_email"`\n\n`delivery` is not persisted as model-authored text or a user tag. The trusted hosted automation boundary validates the current route, schedule, and continuity, then applies the single reserved `system:automation-delivery:group-email` tag when needed. Switching back to chat removes that tag. Unrelated and support-series tags are preserved.\n\nThe model cannot author any `system:` tag. A generic email tag without the trusted delivery command is rejected at the host boundary.\n\n## Execution contract\n\n### Current chat\n\nThe scheduled turn receives the saved instructions unchanged. It reads the `group-newsletter` skill, calls `murph.group action="read_shared"` once for the configured scopes, composes one concise update, and returns the normal send-message decision. Cron, routing, and the conversation outbox do not need newsletter-specific behavior.\n\n### Group email\n\nThe reserved delivery tag grants one occurrence-scoped group-email capability only when all of these are true:\n\n- the bound route is a current iMessage or Telegram group\n- the schedule is cron\n- continuity is fresh\n- the run is scheduled rather than manual\n- the automation revision still matches\n- the first-email opt-out window has elapsed\n\nThe runtime appends a small generic email safety contract:\n\n1. prepare one current authorization snapshot\n2. compose from only its authorized `members` facts and `referenceAt`\n3. send once\n4. return a skip decision because the existing outbox owns delivery and retry\n\nThe existing hard authorization boundary remains unchanged: active group binding, membership, health consent, `group-email.v0`, verified email identity, exact projection grants, revocation revalidation, same-occurrence preparation, and durable idempotency.\n\n## Legacy compatibility and migration\n\n`save_newsletter` remains a rolling-deploy adapter only. New setup must use ordinary save or patch.\n\nCompatibility records are recognized only by the historical configuration marker or a historical delivery tag together with the stable newsletter slug. The slug by itself never grants email authority.\n\n- Compatibility email writes now use the generic group-email tag.\n- Historical email tags remain readable.\n- Historical current-chat records retain a narrow execution overlay so their configuration-only instructions keep working.\n- Conflicting current-chat and email tags fail closed to chat.\n- The first configuration edit of a compatibility record must include explicit delivery and complete ordinary instructions in one atomic save or patch.\n- Status-only pause, resume, or archive remains supported before migration.\n\nRemove the adapter and historical tag/marker readers only after production inventory proves that no old caller or record remains.\n\n## Invariants\n\n- Instructions, slugs, titles, and user tags never confer recipients, consent, routes, member identity, shared facts, or email authority.\n- The stable newsletter slug alone never selects email.\n- Current-chat delivery never receives the email tool.\n- Group-email delivery is host-owned, group-only, cron-only, fresh, one-shot, occurrence-scoped, durable, and retry-safe.\n- Changing delivery is reversible and preserves unrelated automation metadata.\n- Legacy migration cannot leave configuration-only instructions paired with ordinary delivery state.\n- A missing email address is never announced with a named or shaming message.\n- Existing stored newsletters remain executable during migration.\n\n## Architecture\n\nContent and editorial behavior live in `packages/assistant-engine/skills/group-newsletter/SKILL.md`.\n\nReusable delivery policy lives in:\n\n- `packages/assistant-engine/src/assistant/automation-delivery.ts` for delivery values, tag transitions, configuration validation, and the generic scheduled-email contract\n- `packages/assistant-runtime/src/hosted-runtime/automation-tool-policy.ts` for trusted save/patch state transitions and legacy migration gates\n\nLegacy newsletter recognition and the current-chat compatibility overlay remain in `group-newsletter-automation.ts` until migration is complete.\n\nThe existing newsletter-named Web callback, runtime port, parser types, and outbox objects remain unchanged in this refactor. Renaming that cross-package transport surface would add broad deployment churn without changing authority or ownership; do it only with the eventual compatibility removal.\n\n## Verification\n\nThe focused suite covers:\n\n- command-only delivery parsing\n- forged reserved-tag rejection\n- group/cron/fresh email constraints\n- email-to-chat tag removal\n- paused-state preservation\n- new-slug non-inference\n- compatibility email and current-chat execution\n- fail-closed conflicting tags\n- atomic legacy migration\n- archival cleanup of malformed historical records\n\nPackage typechecks, documentation drift checks, diff-aware tests, and exact-head pull-request CI remain the release gate.\n')
          write('agent-docs/exec-plans/completed/2026-08-09-newsletter-as-automation.md', '# Newsletter as an ordinary automation\n\nStatus: completed\nOwner: Codex\nStarted: 2026-08-09\nCompleted: 2026-08-09\n\n## Goal\n\nCollapse newsletter setup and current-chat execution into the existing group automation and shared-projection primitives. Keep only the security-sensitive, reusable group-email effect.\n\n## Final design\n\n- `group-newsletter` is the canonical setup and editorial recipe.\n- Ordinary automation save and patch accept a command-only `delivery` value.\n- The trusted hosted boundary owns the reversible generic group-email tag.\n- Current-chat newsletters are ordinary scheduled conversation turns.\n- Generic group email is group-only, cron-only, fresh, and occurrence-scoped.\n- Historical configuration-only records receive only the compatibility overlay they still need.\n- Existing email authorization, revocation revalidation, occurrence identity, and outbox retry semantics remain unchanged.\n\n## Bugs found in final review and fixed\n\n1. The newsletter slug alone was still interpreted as legacy email, so a newly saved chat newsletter could receive email authority.\n2. The hosted save boundary rejected the ordinary-save recipe documented by the new skill.\n3. Historical current-chat records lost their operational execution prompt when the special runtime branch was removed.\n4. `delivery="group_email"` could be requested from a direct route or with a schedule/continuity combination that could never receive scheduled email authority.\n5. Switching from email to chat did not durably remove the email tag because omitted tags are preserved by canonical upsert.\n6. Re-saving a paused email newsletter could reactivate it.\n7. Existing generic email state could be silently dropped or retained incorrectly when unrelated tags changed.\n8. A legacy configuration edit could remove legacy tags while leaving configuration-only instructions behind.\n9. Conflicting current-chat and email tags did not have one explicit fail-closed precedence rule.\n10. The compatibility compiler continued producing the retired email tag instead of migrating writes to the generic tag.\n11. The branch had no pull request and had fallen behind `main`.\n\n## Verification\n\nThe final branch adds focused tests for parser behavior, delivery state transitions, host save/patch policy, route/schedule/continuity gates, paused-state preservation, legacy migration, conflict handling, and compatibility execution.\n\nRelease validation runs:\n\n- focused assistant-engine tests\n- focused assistant-runtime policy tests\n- assistant-engine typecheck\n- assistant-runtime typecheck\n- documentation drift checks\n- diff-aware local tests\n- whitespace checks\n- exact-head pull-request CI\n\n## Deferred cleanup\n\nThe existing newsletter-named Web callback, runtime port, parser types, and outbox objects are not renamed here. They span multiple independently deployed packages while continuing to enforce the correct hard authority boundary. Renaming them now would be broad churn without a behavior or ownership gain. Remove or rename that compatibility surface only after production inventory reaches zero legacy callers and records.\n')
