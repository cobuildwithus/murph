name: Codex export current main

on:
  push:
    branches:
      - codex/starter-usage-main-export
    paths:
      - .github/workflows/codex-export-current-main.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build git bundle
        shell: bash
        run: git bundle create murph-current-main.bundle --all

      - name: Upload git bundle
        uses: actions/upload-artifact@v4
        with:
          name: murph-current-main-bundle
          path: murph-current-main.bundle
          if-no-files-found: error
          retention-days: 1
