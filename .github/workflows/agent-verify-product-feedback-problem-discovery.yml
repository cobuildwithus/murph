name: Verify product feedback problem discovery

on:
  push:
    branches:
      - agent/product-feedback-problem-discovery

permissions:
  contents: write

concurrency:
  group: agent-verify-product-feedback-problem-discovery
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-feedback-problem-discovery
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Install workspace
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate
          pnpm install --frozen-lockfile --prefer-offline

      - name: Run focused assistant-engine tests
        shell: bash
        run: |
          pnpm --dir packages/assistant-engine exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/assistant-product-feedback-problem-discovery.test.ts \
            test/assistant-product-feedback.test.ts
          git diff --check

      - name: Remove verification workflow after success
        shell: bash
        run: |
          rm .github/workflows/agent-verify-product-feedback-problem-discovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/agent-verify-product-feedback-problem-discovery.yml
          git commit -m 'Record focused product feedback prompt verification'
          git push origin HEAD:agent/product-feedback-problem-discovery
