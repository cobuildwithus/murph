name: Apply signup link architecture cleanup

on:
  push:
    branches:
      - feat/explicit-signup-referral-links
    paths:
      - .github/workflows/fix-signup-referral-assistant-contracts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Apply the reviewed cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}")
              target.write_text(text.replace(old, new, 1))

          dynamic_tools_path = Path(
              "packages/assistant-engine/src/assistant-codex/dynamic-tools.ts"
          )
          dynamic_tools = dynamic_tools_path.read_text()
          signup_description = (
              " create_signup_referral_link returns a shareable attributed signup "
              "link only after an explicit link request; it never sends the link or "
              "arms an earned-usage mission, and a group request requires the exact "
              "message_ref."
          )
          if dynamic_tools.count(signup_description) != 1:
              raise SystemExit("signup-link group-tool description anchor did not match")
          dynamic_tools_path.write_text(
              dynamic_tools.replace(signup_description, "", 1)
          )

          group_contract_path = Path(
              "packages/assistant-engine/test/assistant-codex-group-tool.test.ts"
          )
          group_contract = group_contract_path.read_text()
          enum_anchor = '      "cancel_usage_referral",\n'
          if group_contract.count(enum_anchor) != 1:
              raise SystemExit("group action enum anchor did not match")
          if '      "create_signup_referral_link",\n' in group_contract:
              raise SystemExit("signup-link action is already in the contract expectation")
          group_contract_path.write_text(
              group_contract.replace(
                  enum_anchor,
                  enum_anchor + '      "create_signup_referral_link",\n',
                  1,
              )
          )

          low_usage_path = Path(
              "packages/assistant-engine/skills/hosted-low-usage/SKILL.md"
          )
          low_usage = low_usage_path.read_text()
          section_start = low_usage.find("\n## Explicit shareable signup links\n")
          section_end = low_usage.find("\n## Follow-up options\n", section_start)
          if section_start < 0 or section_end < 0:
              raise SystemExit("hosted-low-usage signup-link section was not found")
          low_usage_path.write_text(low_usage[:section_start] + low_usage[section_end:])

          skill_assets_path = Path(
              "packages/assistant-engine/src/assistant-skill-assets.ts"
          )
          skill_assets = skill_assets_path.read_text()
          old_trigger = (
              "      'Use when trusted hosted turn context says Murph usage is running "
              "low; when a user asks about hosted plan, AI usage, billing, group "
              "funding, the available ways to add or earn more usage, or explicitly "
              "asks for a Murph signup, invite, share, or referral link to send "
              "someone; or when they ask how to keep a direct trial, paid plan, "
              "Family-sponsored Murph, or hosted group conversation going.',"
          )
          new_trigger = (
              "      'Use when trusted hosted turn context says Murph usage is running "
              "low; when a user asks about hosted plan, AI usage, billing, group "
              "funding, or the available ways to add or earn more usage; or when they "
              "ask how to keep a direct trial, paid plan, Family-sponsored Murph, or "
              "hosted group conversation going.',"
          )
          if skill_assets.count(old_trigger) != 1:
              raise SystemExit("hosted-low-usage trigger anchor did not match")
          skill_assets = skill_assets.replace(old_trigger, new_trigger, 1)
          next_skill = "  {\n    slug: 'experiment-onboarding',"
          signup_registry = """  {
            slug: 'signup-link',
            name: 'signup-link',
            triggerHint:
              'Use only when a current member explicitly asks for a Murph signup link, invite link, referral link, or shareable link to forward to another person.',
          },
          """.replace("          ", "")
          if skill_assets.count(next_skill) != 1:
              raise SystemExit("skill registry insertion anchor did not match")
          skill_assets_path.write_text(
              skill_assets.replace(next_skill, signup_registry + next_skill, 1)
          )

          signup_skill_path = Path(
              "packages/assistant-engine/skills/signup-link/SKILL.md"
          )
          signup_skill_path.parent.mkdir(parents=True, exist_ok=True)
          if signup_skill_path.exists():
              raise SystemExit("signup-link skill already exists")
          signup_skill_path.write_text("""---
          name: signup-link
          description: Use only when a current member explicitly asks for a Murph signup link, invite link, referral link, or shareable link to forward to another person.
          ---

          # Shareable signup links

          The existing group-chat introduction flow remains the default. Do not create a
          link merely because someone mentions a friend, starts a group, asks about an
          earned-usage mission, or agrees to introduce Murph.

          Only when the current member explicitly asks for a signup, invite, referral, or
          shareable link to forward, call `murph.group` with
          `action="create_signup_referral_link"`. In a group, pass the exact accepted
          `message_ref` from the requester.

          Use only the exact returned `signupUrl`; mention `expiresAt` only when useful.
          Return the link to the requester. Never choose, contact, or message the
          recipient. The link records signup attribution only and does not earn usage,
          complete a mission, or guarantee a reward.
          """.replace("          ", ""))

          Path(
              "packages/assistant-engine/test/assistant-signup-referral-skill-trigger.test.ts"
          ).write_text("""import { readFile } from 'node:fs/promises'
          import path from 'node:path'

          import { describe, expect, it } from 'vitest'

          import {
            ASSISTANT_SKILLS,
            buildAssistantSkillFileRef,
            resolveAssistantSkillsRoot,
          } from '../src/assistant-skill-assets.js'

          describe('assistant signup link guidance', () => {
            it('loads a small dedicated skill only for an explicit shareable-link request', () => {
              const skill = ASSISTANT_SKILLS.find(
                (candidate) => candidate.slug === 'signup-link',
              )
              const lowUsage = ASSISTANT_SKILLS.find(
                (candidate) => candidate.slug === 'hosted-low-usage',
              )

              expect(skill?.triggerHint).toContain('explicitly asks')
              expect(skill?.triggerHint).toContain('shareable link')
              expect(buildAssistantSkillFileRef('signup-link')).toBe(
                '$MURPH_ASSISTANT_SKILLS_ROOT/signup-link/SKILL.md',
              )
              expect(lowUsage?.triggerHint).not.toContain('signup link')
              expect(lowUsage?.triggerHint).not.toContain('invite link')
            })

            it('keeps group introductions as the default and separates attribution from rewards', async () => {
              const skill = await readFile(
                path.join(resolveAssistantSkillsRoot(), 'signup-link', 'SKILL.md'),
                'utf8',
              )
              const normalizedSkill = skill.replace(/\\s+/gu, ' ')

              expect(normalizedSkill).toContain(
                'The existing group-chat introduction flow remains the default',
              )
              expect(normalizedSkill).toContain(
                'Only when the current member explicitly asks for a signup, invite, referral, or shareable link to forward',
              )
              expect(normalizedSkill).toContain(
                '`action="create_signup_referral_link"`',
              )
              expect(normalizedSkill).toContain(
                'pass the exact accepted `message_ref` from the requester',
              )
              expect(normalizedSkill).toContain(
                'Never choose, contact, or message the recipient',
              )
              expect(normalizedSkill).toContain(
                'does not earn usage, complete a mission, or guarantee a reward',
              )
            })
          })
          """.replace("          ", ""))

          replace_once(
              "apps/web/src/lib/hosted-growth/signup-referral.ts",
              """export interface HostedSignupReferralLink {
            expiresAt: Date;
            inviteCode: string;
            signupUrl: string;
            targetMemberId: string;
          }""".replace("            ", "  "),
              """export interface HostedSignupReferralLink {
            expiresAt: Date;
            signupUrl: string;
          }""".replace("            ", "  "),
          )
          replace_once(
              "apps/web/src/lib/hosted-growth/signup-referral.ts",
              """  return {
            expiresAt: invite.expiresAt,
            inviteCode: invite.inviteCode,
            signupUrl: buildHostedSignupReferralUrl(
              invite.inviteCode,
              input.publicBaseUrl,
            ),
            targetMemberId: invite.memberId,
          };""".replace("            ", "    "),
              """  return {
            expiresAt: invite.expiresAt,
            signupUrl: buildHostedSignupReferralUrl(
              invite.inviteCode,
              input.publicBaseUrl,
            ),
          };""".replace("            ", "    "),
          )

          referral_test_path = Path("apps/web/test/hosted-signup-referral.test.ts")
          referral_test = referral_test_path.read_text()
          referral_test = referral_test.replace(
              '"https://www.withmurph.ai/app",',
              '"https://www.withmurph.ai/app?ignored=1#fragment",',
              1,
          )
          helper_anchor = """  existingInvite?: {
            expiresAt: Date;
            inviteCode: string;
            memberId: string;
          } | null;
          }) {
            const tx = {""".replace("            ", "    ")
          helper_replacement = """  existingInvite?: {
            expiresAt: Date;
            inviteCode: string;
            memberId: string;
          } | null;
            referrer?: { id: string; suspendedAt: Date | null } | null;
          }) {
            const referrer = input.referrer === undefined
              ? { id: "member_referrer", suspendedAt: null }
              : input.referrer;
            const tx = {""".replace("            ", "    ")
          if referral_test.count(helper_anchor) != 1:
              raise SystemExit("signup-referral test helper anchor did not match")
          referral_test = referral_test.replace(helper_anchor, helper_replacement, 1)
          member_lookup_anchor = """    hostedMember: {
            findUnique: vi.fn().mockResolvedValue({
              id: "member_referrer",
              suspendedAt: null,
            }),
          },""".replace("            ", "      ")
          member_lookup_replacement = """    hostedMember: {
            findUnique: vi.fn().mockResolvedValue(referrer),
          },""".replace("            ", "      ")
          if referral_test.count(member_lookup_anchor) != 1:
              raise SystemExit("signup-referral referrer mock anchor did not match")
          referral_test = referral_test.replace(
              member_lookup_anchor,
              member_lookup_replacement,
              1,
          )
          referral_test = referral_test.replace(
              """      expiresAt: existingInvite.expiresAt,
                inviteCode: "existing_invite",
                signupUrl:
                  "https://www.withmurph.ai/join/existing_invite",
                targetMemberId: "member_target_existing",
              });""".replace("                ", "      "),
              """      expiresAt: existingInvite.expiresAt,
                signupUrl: "https://www.withmurph.ai/join/existing_invite",
              });""".replace("                ", "      "),
              1,
          )
          query_assertion_anchor = """    expect(mocks.createHostedMember).not.toHaveBeenCalled();"""
          query_assertion = """    expect(tx.hostedInvite.findFirst).toHaveBeenCalledWith({
            orderBy: { createdAt: "desc" },
            select: {
              expiresAt: true,
              inviteCode: true,
              memberId: true,
            },
            where: {
              expiresAt: { gt: new Date("2026-08-04T22:30:00.000Z") },
              referrerMemberId: "member_referrer",
            },
          });
            expect(mocks.createHostedMember).not.toHaveBeenCalled();""".replace("            ", "    ")
          if referral_test.count(query_assertion_anchor) != 1:
              raise SystemExit("signup-referral expiry-filter assertion anchor did not match")
          referral_test = referral_test.replace(
              query_assertion_anchor,
              query_assertion,
              1,
          )
          referral_test = referral_test.replace(
              """    })).resolves.toMatchObject({
            inviteCode: "new_invite",
            signupUrl: "https://www.withmurph.ai/join/new_invite",
            targetMemberId: "member_target_new",
          });""".replace("            ", "      "),
              """    })).resolves.toEqual({
            expiresAt: new Date("2026-08-06T22:30:00.000Z"),
            signupUrl: "https://www.withmurph.ai/join/new_invite",
          });""".replace("            ", "      "),
              1,
          )
          failure_tests_anchor = """  it("rotates to a fresh attributed invite after the prior link is claimed", async () => {"""
          failure_tests = """  it("fails closed when the referring account no longer exists", async () => {
            const { prisma, tx } = createPrisma({ referrer: null });

            await expect(issueHostedSignupReferralLink({
              now: new Date("2026-08-04T22:30:00.000Z"),
              prisma: prisma as never,
              referrerMemberId: "member_referrer",
            })).rejects.toMatchObject({
              code: "HOSTED_SIGNUP_REFERRER_NOT_FOUND",
            });

            expect(tx.hostedInvite.findFirst).not.toHaveBeenCalled();
            expect(mocks.createHostedMember).not.toHaveBeenCalled();
          });

          it("fails closed for a suspended referring account", async () => {
            const { prisma, tx } = createPrisma({
              referrer: {
                id: "member_referrer",
                suspendedAt: new Date("2026-08-04T21:30:00.000Z"),
              },
            });

            await expect(issueHostedSignupReferralLink({
              now: new Date("2026-08-04T22:30:00.000Z"),
              prisma: prisma as never,
              referrerMemberId: "member_referrer",
            })).rejects.toMatchObject({
              code: "HOSTED_MEMBER_SUSPENDED",
            });

            expect(tx.hostedInvite.findFirst).not.toHaveBeenCalled();
            expect(mocks.createHostedMember).not.toHaveBeenCalled();
          });

          it("rotates to a fresh attributed invite after the prior link is claimed", async () => {""".replace("          ", "")
          if referral_test.count(failure_tests_anchor) != 1:
              raise SystemExit("signup-referral failure-test insertion anchor did not match")
          referral_test_path.write_text(
              referral_test.replace(failure_tests_anchor, failure_tests, 1)
          )

          group_tool_test_path = Path("apps/web/test/hosted-group-tool.test.ts")
          group_tool_test = group_tool_test_path.read_text()
          old_group_mock = """    mocks.issueHostedSignupReferralLink.mockResolvedValue({
            expiresAt: new Date("2026-08-06T22:30:00.000Z"),
            inviteCode: "invite",
            signupUrl: "https://www.withmurph.ai/?referral=invite",
            targetMemberId: "member_target",
          });""".replace("            ", "    ")
          new_group_mock = """    mocks.issueHostedSignupReferralLink.mockResolvedValue({
            expiresAt: new Date("2026-08-06T22:30:00.000Z"),
            signupUrl: "https://www.withmurph.ai/join/signup_invite",
          });""".replace("            ", "    ")
          if group_tool_test.count(old_group_mock) != 1:
              raise SystemExit("hosted group signup-link mock anchor did not match")
          group_tool_test = group_tool_test.replace(old_group_mock, new_group_mock, 1)
          if group_tool_test.count("https://www.withmurph.ai/?referral=invite") != 1:
              raise SystemExit("hosted group signup-link output URL anchor did not match")
          group_tool_test_path.write_text(
              group_tool_test.replace(
                  "https://www.withmurph.ai/?referral=invite",
                  "https://www.withmurph.ai/join/signup_invite",
                  1,
              )
          )

          migration_test_path = Path(
              "apps/web/test/hosted-onboarding-privacy-foundation-migration.test.ts"
          )
          migration_test = migration_test_path.read_text()
          const_anchor = "    const hostedThreadContainerUsageDefaultMigrationSql = readFileSync("
          const_block = """    const hostedSignupReferralAttributionMigrationSql = readFileSync(
            new URL(
              "../prisma/migrations/20260804223000_hosted_signup_referral_attribution/migration.sql",
              import.meta.url,
            ),
            "utf8",
          );
          const normalizedHostedSignupReferralAttributionMigrationSql =
            hostedSignupReferralAttributionMigrationSql.replace(/\\s+/gu, " ");
          const hostedThreadContainerUsageDefaultMigrationSql = readFileSync(""".replace("          ", "")
          if migration_test.count(const_anchor) != 1:
              raise SystemExit("migration contract const anchor did not match")
          migration_test = migration_test.replace(const_anchor, const_block, 1)
          list_anchor = """      "20260802000000_add_hosted_linq_line_inventory_confirmed_at",
            "migration_lock.toml",""".replace("            ", "      ")
          list_replacement = """      "20260802000000_add_hosted_linq_line_inventory_confirmed_at",
            "20260804223000_hosted_signup_referral_attribution",
            "migration_lock.toml",""".replace("            ", "      ")
          if migration_test.count(list_anchor) != 1:
              raise SystemExit("migration inventory anchor did not match")
          migration_test = migration_test.replace(list_anchor, list_replacement, 1)
          assertion_anchor = "    expect(deviceSyncSignalSourceProviderMigrationSql).toContain("
          assertion_block = """    expect(normalizedHostedSignupReferralAttributionMigrationSql).toContain(
            'ADD COLUMN "referrer_member_id" TEXT',
          );
          expect(normalizedHostedSignupReferralAttributionMigrationSql).toContain(
            'CREATE INDEX "hosted_invite_referrer_member_id_created_at_idx" ON "hosted_invite"("referrer_member_id", "created_at")',
          );
          expect(normalizedHostedSignupReferralAttributionMigrationSql).toContain(
            'FOREIGN KEY ("referrer_member_id") REFERENCES "hosted_member"("id") ON DELETE SET NULL ON UPDATE CASCADE',
          );
          expect(deviceSyncSignalSourceProviderMigrationSql).toContain(""".replace("          ", "")
          if migration_test.count(assertion_anchor) != 1:
              raise SystemExit("migration assertion anchor did not match")
          migration_test_path.write_text(
              migration_test.replace(assertion_anchor, assertion_block, 1)
          )

          # Strong postconditions before the transport deletes itself.
          assert "## Explicit shareable signup links" not in low_usage_path.read_text()
          assert "slug: 'signup-link'" in skill_assets_path.read_text()
          assert dynamic_tools_path.read_text().count(signup_description) == 0
          assert '      "create_signup_referral_link",\n' in group_contract_path.read_text()
          assert "inviteCode: string;" not in Path(
              "apps/web/src/lib/hosted-growth/signup-referral.ts"
          ).read_text().split("type HostedReusableSignupReferralInvite", 1)[0]

          Path(".github/workflows/fix-signup-referral-assistant-contracts.yml").unlink()
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: isolate explicit signup link flow"
          git push
