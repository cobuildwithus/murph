name: Apply final signup link contract cleanup

on:
  push:
    branches:
      - feat/explicit-signup-referral-links
    paths:
      - .github/workflows/fix-signup-referral-assistant-contracts.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Apply reviewed contract cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one replacement anchor, found {count}"
                  )
              target.write_text(text.replace(old, new, 1))

          dynamic_tools_path = Path(
              "packages/assistant-engine/src/assistant-codex/dynamic-tools.ts"
          )
          signup_description = (
              " create_signup_referral_link returns a shareable attributed signup "
              "link only after an explicit link request; it never sends the link or "
              "arms an earned-usage mission, and a group request requires the exact "
              "message_ref."
          )
          replace_once(
              str(dynamic_tools_path),
              signup_description,
              "",
          )

          group_contract_path = Path(
              "packages/assistant-engine/test/assistant-codex-group-tool.test.ts"
          )
          group_contract = group_contract_path.read_text()
          action_anchor = '      "cancel_usage_referral",\n'
          if group_contract.count(action_anchor) != 1:
              raise SystemExit("group action contract anchor did not match")
          if '      "create_signup_referral_link",\n' in group_contract:
              raise SystemExit("signup link action was already in the contract inventory")
          group_contract_path.write_text(
              group_contract.replace(
                  action_anchor,
                  action_anchor + '      "create_signup_referral_link",\n',
                  1,
              )
          )

          low_usage_path = Path(
              "packages/assistant-engine/skills/hosted-low-usage/SKILL.md"
          )
          low_usage = low_usage_path.read_text()
          section_start = low_usage.find("\n## Explicit shareable signup links\n")
          section_end = low_usage.find("\n## Follow-up options\n", section_start)
          if section_start < 0 or section_end < 0:
              raise SystemExit("signup link guidance was not found in hosted-low-usage")
          low_usage_path.write_text(low_usage[:section_start] + low_usage[section_end:])

          skill_assets_path = Path(
              "packages/assistant-engine/src/assistant-skill-assets.ts"
          )
          skill_assets = skill_assets_path.read_text()
          low_usage_start = skill_assets.find(
              "  {\n    slug: 'hosted-low-usage',"
          )
          next_skill_start = skill_assets.find(
              "  {\n    slug: 'experiment-onboarding',",
              low_usage_start,
          )
          if low_usage_start < 0 or next_skill_start < 0:
              raise SystemExit("assistant skill registry boundaries were not found")
          replacement = """  {
            slug: 'hosted-low-usage',
            name: 'hosted-low-usage',
            triggerHint:
              'Use when trusted hosted turn context says Murph usage is running low; when a user asks about hosted plan, AI usage, billing, group funding, or the available ways to add or earn more usage; or when they ask how to keep a direct trial, paid plan, Family-sponsored Murph, or hosted group conversation going.',
          },
          {
            slug: 'signup-link',
            name: 'signup-link',
            triggerHint:
              'Use only when a current member explicitly asks for a Murph signup link, invite link, referral link, or shareable link to forward to another person.',
          },
          """.replace("          ", "")
          skill_assets_path.write_text(
              skill_assets[:low_usage_start]
              + replacement
              + skill_assets[next_skill_start:]
          )

          migration_test_path = Path(
              "apps/web/test/hosted-onboarding-privacy-foundation-migration.test.ts"
          )
          migration_test = migration_test_path.read_text()
          migration_lock = '      "migration_lock.toml",\n'
          migration_entry = (
              '      "20260804223000_hosted_signup_referral_attribution",\n'
          )
          if migration_test.count(migration_lock) != 1:
              raise SystemExit("migration inventory terminator did not match")
          if migration_entry in migration_test:
              raise SystemExit("signup referral migration was already inventoried")
          migration_test_path.write_text(
              migration_test.replace(
                  migration_lock,
                  migration_entry + migration_lock,
                  1,
              )
          )

          group_tool_test_path = Path("apps/web/test/hosted-group-tool.test.ts")
          group_tool_test = group_tool_test_path.read_text()
          old_url = "https://www.withmurph.ai/?referral=invite"
          if group_tool_test.count(old_url) != 2:
              raise SystemExit("signup link test URL count was not exactly two")
          for line in (
              '      inviteCode: "invite",\n',
              '      targetMemberId: "member_target",\n',
          ):
              if group_tool_test.count(line) != 1:
                  raise SystemExit(f"signup link mock field did not match: {line.strip()}")
              group_tool_test = group_tool_test.replace(line, "", 1)
          group_tool_test_path.write_text(
              group_tool_test.replace(
                  old_url,
                  "https://www.withmurph.ai/join/signup_invite",
              )
          )

          assert signup_description not in dynamic_tools_path.read_text()
          assert group_contract_path.read_text().count(
              '      "create_signup_referral_link",\n'
          ) == 1
          assert "## Explicit shareable signup links" not in low_usage_path.read_text()
          assert skill_assets_path.read_text().count("slug: 'signup-link'") == 1
          assert migration_test_path.read_text().count(migration_entry) == 1
          assert old_url not in group_tool_test_path.read_text()

          Path(".github/workflows/fix-signup-referral-assistant-contracts.yml").unlink()
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: isolate explicit signup link flow"
          git push
