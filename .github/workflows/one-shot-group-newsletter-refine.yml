name: One-shot group sharing refinement

on:
  push:
    branches:
      - fix/group-newsletter-sharing-prompts
    paths:
      - .github/workflows/one-shot-group-newsletter-refine.yml

permissions:
  contents: write

jobs:
  refine:
    if: contains(github.event.head_commit.message, '[refine-group-newsletter-patch]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: fix/group-newsletter-sharing-prompts

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Apply ownership refinement
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              target.write_text(text.replace(old, new, 1))

          join_policy = "apps/web/src/lib/hosted-groups/join-policy.ts"
          replace_once(
              join_policy,
              '''
          export function resolveHostedGroupAccessOfferProjectionScopes(
            value: unknown,
          ): HostedVaultShareProjectionScope[] {
            const normalized = normalizeHostedGroupAccessOfferProjectionScopes(value);
            if (normalized.length > 0) {
              return normalized;
            }
            if (Array.isArray(value) && value.length > 0) {
              return [];
            }
            return [...HOSTED_GROUP_DEFAULT_ACCESS_OFFER_PROJECTION_SCOPES];
          }
          ''',
              '''
          ''',
          )

          group_store = "apps/web/src/lib/hosted-groups/group-store.ts"
          replace_once(
              group_store,
              '''import {
            emptyHostedGroupJoinPolicy,
          ''',
              '''import {
            emptyHostedGroupJoinPolicy,
            HOSTED_GROUP_DEFAULT_ACCESS_OFFER_PROJECTION_SCOPES,
          ''',
          )
          store_path = Path(group_store)
          store_text = store_path.read_text()
          store_pattern = re.compile(
              r'export async function createHostedGroupJoinLinkForOwnedThreadContainerTx\(input: \{.*?\n\}\n\nexport async function readHostedGroupJoinView',
              re.S,
          )
          store_replacement = '''export async function createHostedGroupJoinLinkForOwnedThreadContainerTx(input: {
            tx: Prisma.TransactionClient;
            actorMemberId: string;
            containerMemberId: string;
            displayName?: string | null;
            kind?: HostedGroupKind | string | null;
            now: Date;
            requestedVaultShareProjectionScopes?: readonly HostedVaultShareProjectionScope[] | null;
            requestedVaultShareProjectionKinds?: readonly HostedVaultShareProjectionKind[] | null;
          }): Promise<{
            group: HostedGroupSummary;
            groupCreated: boolean;
            joinCode: string;
          }> {
            await lockHostedThreadContainerRow(input.tx, input.containerMemberId);
            const container = await input.tx.hostedThreadContainer.findUnique({
              where: { memberId: input.containerMemberId },
              select: { ownerMemberId: true },
            });
            if (!container) {
              throw hostedOnboardingError({
                code: "HOSTED_GROUP_THREAD_CONTAINER_NOT_FOUND",
                httpStatus: 404,
                message: "This hosted runtime is not a connected group chat.",
              });
            }
            if (container.ownerMemberId !== input.actorMemberId) {
              throw hostedOnboardingError({
                code: "HOSTED_GROUP_OWNER_REQUIRED",
                httpStatus: 403,
                message: "Only the group owner can create a join link.",
              });
            }

            const existingGroup = await input.tx.hostedGroup.findUnique({
              where: { runtimeMemberId: input.containerMemberId },
              select: { id: true },
            });
            const groupCreated = existingGroup === null;
            const requestedVaultShareProjectionScopes =
              normalizeHostedGroupAccessOfferProjectionScopes(
                input.requestedVaultShareProjectionScopes
                  ?? fixedProjectionKindsToScopes(
                    input.requestedVaultShareProjectionKinds ?? [],
                  ),
              );
            const effectiveRequestedVaultShareProjectionScopes = groupCreated
              ? normalizeHostedGroupAccessOfferProjectionScopes([
                  ...HOSTED_GROUP_DEFAULT_ACCESS_OFFER_PROJECTION_SCOPES,
                  ...requestedVaultShareProjectionScopes,
                ])
              : requestedVaultShareProjectionScopes;
            const group = await ensureHostedGroupForThreadContainerTx({
              containerMemberId: input.containerMemberId,
              displayName: input.displayName ?? null,
              kind: input.kind ?? null,
              now: input.now,
              requestedVaultShareProjectionScopes:
                effectiveRequestedVaultShareProjectionScopes,
              tx: input.tx,
            });
            const link = await createOrReadHostedGroupJoinLinkTx({
              actorMemberId: input.actorMemberId,
              groupId: group.id,
              now: input.now,
              tx: input.tx,
            });
            return {
              group,
              groupCreated,
              joinCode: link.joinCode,
            };
          }

          export async function readHostedGroupJoinView'''
          store_text, store_count = store_pattern.subn(
              store_replacement,
              store_text,
              count=1,
          )
          if store_count != 1:
              raise SystemExit(
                  f"{group_store}: create-link function replacement found {store_count}",
              )
          store_path.write_text(store_text)

          group_tool = "apps/web/src/lib/hosted-groups/group-tool.ts"
          replace_once(
              group_tool,
              '''import {
            normalizeHostedVaultShareProjectionScopes,
            projectHostedVaultShareProjectionDisplays,
            resolveHostedGroupAccessOfferProjectionScopes,
          } from "./join-policy";
          ''',
              '''import {
            normalizeHostedGroupAccessOfferProjectionScopes,
            normalizeHostedVaultShareProjectionScopes,
            projectHostedVaultShareProjectionDisplays,
          } from "./join-policy";
          ''',
          )
          replace_once(
              group_tool,
              '''    const requestedVaultShareProjectionScopes =
                resolveHostedGroupAccessOfferProjectionScopes(
                  input.joinLink?.requestedVaultShareProjectionScopes
                    ?? input.joinLink?.requestedVaultShareProjectionKinds,
                );
          ''',
              '''    const requestedVaultShareProjectionScopes =
                normalizeHostedGroupAccessOfferProjectionScopes(
                  input.joinLink?.requestedVaultShareProjectionScopes
                    ?? input.joinLink?.requestedVaultShareProjectionKinds
                    ?? [],
                );
          ''',
          )
          replace_once(
              group_tool,
              '''  const projectionScopes = resolveHostedGroupAccessOfferProjectionScopes(
              input.joinOffer?.projectionScopes
                ?? input.joinOffer?.projectionKinds,
            );
          ''',
              '''  const requestedProjectionScopes =
              normalizeHostedGroupAccessOfferProjectionScopes(
                input.joinOffer?.projectionScopes
                  ?? input.joinOffer?.projectionKinds
                  ?? [],
              );
          ''',
          )
          replace_once(
              group_tool,
              '''      requestedVaultShareProjectionScopes: projectionScopes,
              tx,
            });
            const offerPost = await prepareHostedGroupJoinOfferPostTx({
              groupId: result.group.id,
              projectionScopes,
              tx,
            });
          ''',
              '''      requestedVaultShareProjectionScopes: requestedProjectionScopes,
              tx,
            });
            const projectionScopes = result.groupCreated
              ? result.group.requestedVaultShareProjectionScopes
              : requestedProjectionScopes;
            const offerPost = await prepareHostedGroupJoinOfferPostTx({
              groupId: result.group.id,
              projectionScopes,
              tx,
            });
          ''',
          )
          replace_once(
              group_tool,
              '''      offerPost,
              ownerMemberId: ownerAccess.ownerMemberId,
              ...result,
          ''',
              '''      offerPost,
              ownerMemberId: ownerAccess.ownerMemberId,
              projectionScopes,
              ...result,
          ''',
          )
          # After the transaction, every provider effect must use the exact
          # effective scope snapshot returned by the transaction.
          group_text = Path(group_tool).read_text()
          post_start = group_text.index(
              "async function handleHostedRuntimeGroupPostJoinOffer",
          )
          post_end = group_text.index(
              "async function handleHostedRuntimeGroupSetChatAvatar",
              post_start,
          )
          post_block = group_text[post_start:post_end]
          post_block = post_block.replace(
              "    projectionScopes,\n",
              "    projectionScopes: created.projectionScopes,\n",
          )
          post_block = post_block.replace(
              "        projectionScopes,\n",
              "        projectionScopes: created.projectionScopes,\n",
          )
          if post_block.count("created.projectionScopes") != 3:
              raise SystemExit(
                  "group-tool.ts: expected three post-transaction scope uses",
              )
          Path(group_tool).write_text(
              group_text[:post_start] + post_block + group_text[post_end:],
          )

          web_test = "apps/web/test/hosted-group-tool.test.ts"
          replace_once(
              web_test,
              '''  readHostedGroupJoinPolicy,
              resolveHostedGroupAccessOfferProjectionScopes,
            } from "@/src/lib/hosted-groups/join-policy";
          ''',
              '''  readHostedGroupJoinPolicy,
            } from "@/src/lib/hosted-groups/join-policy";
          ''',
          )
          replace_once(
              web_test,
              '''describe("hosted group access-offer defaults", () => {
            it("requests every top-level permission when no narrower set is supplied", () => {
              const resolved = resolveHostedGroupAccessOfferProjectionScopes([]);
              expect(resolved).toEqual(HOSTED_GROUP_DEFAULT_ACCESS_OFFER_PROJECTION_SCOPES);
              expect(resolved).toEqual(expect.arrayContaining([
                SLEEP_DURATION_SCOPE,
                WORKOUTS_SCOPE,
                PROTEIN_SCOPE,
              ]));
              expect(resolved.every((scope) => !("selector" in scope))).toBe(true);
              expect(resolved.length).toBeLessThan(
                HOSTED_VAULT_SHARE_SELECTABLE_PROJECTION_SCOPES.length,
              );
            });

            it("keeps explicit scopes narrow and renders one natural consent sentence", () => {
              expect(resolveHostedGroupAccessOfferProjectionScopes([WORKOUTS_SCOPE]))
                .toEqual([WORKOUTS_SCOPE]);
              expect(buildHostedGroupJoinOfferMessage({
          ''',
              '''describe("hosted group access-offer defaults", () => {
            it("defines every top-level permission for initial group creation", () => {
              const defaults = [
                ...HOSTED_GROUP_DEFAULT_ACCESS_OFFER_PROJECTION_SCOPES,
              ];
              expect(defaults).toEqual(expect.arrayContaining([
                SLEEP_DURATION_SCOPE,
                WORKOUTS_SCOPE,
                PROTEIN_SCOPE,
              ]));
              expect(defaults.every((scope) => !("selector" in scope))).toBe(true);
              expect(defaults.length).toBeLessThan(
                HOSTED_VAULT_SHARE_SELECTABLE_PROJECTION_SCOPES.length,
              );
            });

            it("keeps additive scopes narrow and renders one natural consent sentence", () => {
              expect(normalizeHostedGroupAccessOfferProjectionScopes([WORKOUTS_SCOPE]))
                .toEqual([WORKOUTS_SCOPE]);
              expect(buildHostedGroupJoinOfferMessage({
          ''',
          )

          store_test = "apps/web/test/hosted-group-store.test.ts"
          replace_once(
              store_test,
              '''import {
            normalizeHostedVaultShareProjectionKinds,
          } from "@/src/lib/hosted-groups/join-policy";
          ''',
              '''import {
            HOSTED_GROUP_DEFAULT_ACCESS_OFFER_PROJECTION_SCOPES,
            normalizeHostedVaultShareProjectionKinds,
          } from "@/src/lib/hosted-groups/join-policy";
          ''',
          )
          replace_once(
              store_test,
              '''const ACTIVITY_SCOPE = hostedVaultShareProjectionKindToScope("activity-days.v0");
          ''',
              '''const ACTIVITY_SCOPE = hostedVaultShareProjectionKindToScope("activity-days.v0");
          const DEFAULT_GROUP_ACCESS_OFFER_SCOPES = [
            ...HOSTED_GROUP_DEFAULT_ACCESS_OFFER_PROJECTION_SCOPES,
          ];
          const DEFAULT_GROUP_ACCESS_OFFER_KINDS =
            DEFAULT_GROUP_ACCESS_OFFER_SCOPES.map((scope) => scope.projectionKind);
          ''',
          )
          store_test_path = Path(store_test)
          store_test_text = store_test_path.read_text()
          seed_pattern = re.compile(
              r'  it\("seeds email authorization as the default requested and owner-granted group projection", async \(\) => \{.*?\n  \}\);\n\n  it\("stores a legacy deep-sleep request as the single source-aware permission",',
              re.S,
          )
          seed_replacement = '''  it("requests every top-level permission on new groups while auto-granting only profile and email", async () => {
            const tx = buildGroupLinkTx({
              existingGroup: false,
              grantedProjectionKinds: ["group-email.v0", "profile-name.v0"],
              joinCode: null,
              ownerMemberId: "member_owner",
              requestedProjectionKinds: ["group-email.v0"],
            });
            const now = new Date("2026-07-01T00:00:00.000Z");

            await expect(createHostedGroupJoinLinkForOwnedThreadContainerTx({
              actorMemberId: "member_owner",
              containerMemberId: "member_group_runtime",
              now,
              tx,
            })).resolves.toMatchObject({
              group: {
                members: [
                  {
                    grantedVaultShareProjectionKinds: ["group-email.v0", "profile-name.v0"],
                    memberId: "member_owner",
                  },
                ],
                requestedVaultShareProjectionKinds:
                  DEFAULT_GROUP_ACCESS_OFFER_KINDS,
                requestedVaultShareProjectionScopes:
                  DEFAULT_GROUP_ACCESS_OFFER_SCOPES,
              },
              groupCreated: true,
              joinCode: "join_created",
            });

            expect(tx.hostedGroup.create).toHaveBeenCalledWith(expect.objectContaining({
              data: expect.objectContaining({
                joinPolicyJson: {
                  requestedVaultShareProjectionKinds:
                    DEFAULT_GROUP_ACCESS_OFFER_KINDS,
                  requestedVaultShareProjectionScopes:
                    DEFAULT_GROUP_ACCESS_OFFER_SCOPES,
                  schema: "murph.hosted-group.join-policy.v1",
                },
              }),
            }));
            expect(mocks.grantHostedVaultShareTx).toHaveBeenCalledTimes(2);
            expect(mocks.grantHostedVaultShareTx).toHaveBeenCalledWith(expect.objectContaining({
              destinationMemberId: "member_group_runtime",
              grantorMemberId: "member_owner",
              now,
              projectionScope: PROFILE_SCOPE,
            }));
            expect(mocks.grantHostedVaultShareTx).toHaveBeenCalledWith(expect.objectContaining({
              destinationMemberId: "member_group_runtime",
              grantorMemberId: "member_owner",
              now,
              projectionScope: GROUP_EMAIL_SCOPE,
            }));
          });

          it("stores a legacy deep-sleep request as the single source-aware permission",'''
          store_test_text, seed_count = seed_pattern.subn(
              seed_replacement,
              store_test_text,
              count=1,
          )
          if seed_count != 1:
              raise SystemExit(
                  f"{store_test}: seed test replacement found {seed_count}",
              )
          legacy_pattern = re.compile(
              r'  it\("stores a legacy deep-sleep request as the single source-aware permission", async \(\) => \{.*?\n  \}\);\n\n  it\("merges the default email request into existing groups without granting email",',
              re.S,
          )
          legacy_replacement = '''  it("deduplicates a legacy deep-sleep request into the comprehensive new-group defaults", async () => {
            const tx = buildGroupLinkTx({
              existingGroup: false,
              joinCode: null,
              ownerMemberId: "member_owner",
            });
            const now = new Date("2026-07-01T00:00:00.000Z");

            await expect(createHostedGroupJoinLinkForOwnedThreadContainerTx({
              actorMemberId: "member_owner",
              containerMemberId: "member_group_runtime",
              now,
              requestedVaultShareProjectionScopes: [LEGACY_DEEP_SLEEP_SCOPE],
              tx,
            })).resolves.toMatchObject({
              group: {
                requestedVaultShareProjectionKinds:
                  DEFAULT_GROUP_ACCESS_OFFER_KINDS,
                requestedVaultShareProjectionScopes:
                  DEFAULT_GROUP_ACCESS_OFFER_SCOPES,
              },
              groupCreated: true,
            });

            expect(tx.hostedGroup.create).toHaveBeenCalledWith(expect.objectContaining({
              data: expect.objectContaining({
                joinPolicyJson: {
                  requestedVaultShareProjectionKinds:
                    DEFAULT_GROUP_ACCESS_OFFER_KINDS,
                  requestedVaultShareProjectionScopes:
                    DEFAULT_GROUP_ACCESS_OFFER_SCOPES,
                  schema: "murph.hosted-group.join-policy.v1",
                },
              }),
            }));
          });

          it("merges the default email request into existing groups without granting email",'''
          store_test_text, legacy_count = legacy_pattern.subn(
              legacy_replacement,
              store_test_text,
              count=1,
          )
          if legacy_count != 1:
              raise SystemExit(
                  f"{store_test}: legacy test replacement found {legacy_count}",
              )
          # One exact-return test exercises an existing group and must include
          # the new internal creation-state field.
          exact_old = '''      },
              joinCode: "join_created",
            });

            expect(tx.hostedGroup.update).toHaveBeenCalledWith({
          '''
          exact_new = '''      },
              groupCreated: false,
              joinCode: "join_created",
            });

            expect(tx.hostedGroup.update).toHaveBeenCalledWith({
          '''
          if store_test_text.count(exact_old) != 1:
              raise SystemExit(
                  f"{store_test}: exact existing-return assertion drifted",
              )
          store_test_text = store_test_text.replace(exact_old, exact_new, 1)
          named_old = '''      requestedVaultShareProjections: [
                expect.objectContaining({ projectionKind: "group-email.v0" }),
              ],
          '''
          named_new = '''      requestedVaultShareProjections: expect.arrayContaining([
                expect.objectContaining({ projectionKind: "group-email.v0" }),
                expect.objectContaining({ projectionKind: "workouts.v0" }),
              ]),
          '''
          if store_test_text.count(named_old) != 1:
              raise SystemExit(
                  f"{store_test}: named-group join-view assertion drifted",
              )
          store_test_path.write_text(
              store_test_text.replace(named_old, named_new, 1),
          )

          product_spec = Path("agent-docs/product-specs/group-health-newsletter.md")
          spec_text = product_spec.read_text()
          spec_text = spec_text.replace(
              "the disclosed reaction or join page and may deselect any permission; an explicit creator request for a narrower set remains narrow. Selector-specific activity scopes stay optional because workout details already include type.",
              "the disclosed reaction or join page and may deselect any permission. Later additive permission offers remain scoped to the exact new data requested. Selector-specific activity scopes stay optional because workout details already include type.",
              1,
          )
          spec_text = spec_text.replace(
              "requested permission before granting it, and an explicit creator request for a\n          narrower set remains narrow. Selector-specific activity scopes remain optional\n          additions rather than duplicating the workout-detail contract.",
              "requested permission before granting it. Later additive offers remain narrow\n          and disclose only the exact new data requested. Selector-specific activity scopes\n          remain optional additions rather than duplicating the workout-detail contract.",
              1,
          )
          product_spec.write_text(spec_text)

          Path('.github/workflows/one-shot-group-newsletter-refine.yml').unlink()

      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline

      - name: Focused assistant-engine proof
        run: >-
          pnpm --dir packages/assistant-engine exec vitest run
          --config vitest.config.ts --no-coverage
          test/assistant-codex-group-tool.test.ts
          test/group-newsletter-automation.test.ts

      - name: Focused hosted-web proof
        run: >-
          pnpm exec vitest run
          --config apps/web/vitest.workspace.ts --no-coverage
          apps/web/test/hosted-group-tool.test.ts
          apps/web/test/hosted-group-store.test.ts

      - name: Typecheck touched owners
        run: |
          pnpm --dir packages/assistant-engine typecheck
          pnpm --dir apps/web prisma:generate
          pnpm --dir apps/web typecheck:prepared

      - name: Check patch shape
        run: |
          git diff --check
          test ! -e .github/workflows/one-shot-group-newsletter-refine.yml
          grep -q "groupCreated" apps/web/src/lib/hosted-groups/group-store.ts
          grep -q "created.projectionScopes" apps/web/src/lib/hosted-groups/group-tool.ts
          grep -q "same-period workout count" packages/assistant-engine/src/assistant/group-newsletter-automation.ts

      - name: Commit refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/lib/hosted-groups/group-tool.ts \
            apps/web/src/lib/hosted-groups/group-store.ts \
            apps/web/src/lib/hosted-groups/join-policy.ts \
            apps/web/test/hosted-group-tool.test.ts \
            apps/web/test/hosted-group-store.test.ts \
            agent-docs/product-specs/group-health-newsletter.md \
            .github/workflows/one-shot-group-newsletter-refine.yml
          git commit -m "fix: scope comprehensive sharing to new groups"
          git push origin HEAD:fix/group-newsletter-sharing-prompts
