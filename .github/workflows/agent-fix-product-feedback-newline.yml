name: Fix product feedback prompt newline escaping

on:
  push:
    branches:
      - agent/product-feedback-problem-discovery

permissions:
  contents: write

concurrency:
  group: agent-fix-product-feedback-newline
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-feedback-problem-discovery
          fetch-depth: 0

      - name: Correct newline escape and verify
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/assistant-engine/src/assistant/system-prompt.ts')
          text = path.read_text()
          start_marker = 'function buildAssistantProductFeedbackGuidanceText(): string {'
          end_marker = '\n\nfunction buildAssistantStyleSettingsGuidanceText'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          region = text[start:end]

          old = r'].join("\\n");'
          new = r'].join("\n");'
          if region.count(old) != 1:
              raise SystemExit('expected exactly one double-escaped product feedback join')

          region = region.replace(old, new)
          if old in region or region.count(new) != 1:
              raise SystemExit('newline correction did not converge')

          path.write_text(text[:start] + region + text[end:])
          Path('.github/workflows/agent-fix-product-feedback-newline.yml').unlink()
          PY

          git diff --check
          git diff -- packages/assistant-engine/src/assistant/system-prompt.ts

      - name: Commit correction
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/assistant-engine/src/assistant/system-prompt.ts .github/workflows/agent-fix-product-feedback-newline.yml
          git commit -m 'Fix product feedback prompt line breaks'
          git push origin HEAD:agent/product-feedback-problem-discovery
