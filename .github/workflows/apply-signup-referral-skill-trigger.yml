name: Apply signup referral skill trigger

on:
  push:
    branches:
      - feat/explicit-signup-referral-links
    paths:
      - .github/workflows/apply-signup-referral-skill-trigger.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Add explicit signup-link skill trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/assistant-engine/src/assistant-skill-assets.ts")
          text = path.read_text()
          old = "Use when trusted hosted turn context says Murph usage is running low; when a user asks about hosted plan, AI usage, billing, group funding, or the available ways to add or earn more usage; or when they ask how to keep a direct trial, paid plan, Family-sponsored Murph, or hosted group conversation going."
          new = "Use when trusted hosted turn context says Murph usage is running low; when a user asks about hosted plan, AI usage, billing, group funding, the available ways to add or earn more usage, or explicitly asks for a Murph signup, invite, share, or referral link to send someone; or when they ask how to keep a direct trial, paid plan, Family-sponsored Murph, or hosted group conversation going."
          if text.count(old) != 1:
              raise SystemExit("hosted-low-usage trigger anchor did not match exactly once")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/apply-signup-referral-skill-trigger.yml").unlink()
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit trigger update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/assistant-engine/src/assistant-skill-assets.ts .github/workflows/apply-signup-referral-skill-trigger.yml
          git commit -m "fix: route explicit signup-link requests to referral guidance"
          git push
