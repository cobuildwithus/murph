name: Verify stale group preview runtime test removal

on:
  push:
    branches:
      - agent/remove-stale-group-preview-runtime-test

permissions:
  contents: write

concurrency:
  group: verify-stale-group-preview-runtime-test-removal
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Remove obsolete preview acceptance contract
        run: |
          python scripts/remove-stale-group-preview-runtime-test.py
          git diff --check
          if git grep -n -E 'ASSISTANT_GROUP_PHONE_CALL_PREVIEW_HEADING|currentGroupPhoneCallPreviewAuthority|resolveDeliveredAssistantGroupPhoneCallPreviewAuthority|AssistantGroupPhoneCallPreviewAuthority|group-phone-call-preview-authority|GROUP CALL PREVIEW|preview delivery receipt' -- packages; then
            echo 'Legacy group-call preview machinery or acceptance coverage remains.' >&2
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run assistant-runtime coverage
        env:
          MURPH_VITEST_MAX_WORKERS: 50%
        run: pnpm --dir packages/assistant-runtime test:coverage

      - name: Commit verified cleanup without scaffolding
        run: |
          rm -f \
            .github/stale-group-preview-runtime-test-trigger \
            .github/workflows/verify-stale-group-preview-runtime-test-removal.yml \
            scripts/remove-stale-group-preview-runtime-test.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test(assistant-runtime): remove obsolete group preview contract'
          git push origin HEAD:${GITHUB_REF_NAME}
