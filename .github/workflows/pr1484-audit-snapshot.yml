name: Push PR 1484 yield-boundary test fixes

on:
  push:
    branches:
      - agent/pr1484-audit-snapshot-20260810

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/member-owned-provider-applications
          fetch-depth: 0

      - name: Update yield-boundary tests
        shell: bash
        run: |
          set -euo pipefail
          expected_head=bddf0cb2e74d083b71671cedd520ee169224b5f3
          test "$(git rev-parse HEAD)" = "$expected_head"
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/assistant-runtime/test/hosted-runtime-maintenance.test.ts")
          source = path.read_text()
          if source.count("  vi.clearAllMocks();") != 1:
              raise SystemExit("expected one global mock clear")
          source = source.replace("  vi.clearAllMocks();", "  vi.resetAllMocks();", 1)

          def update_test(title: str, transform):
              nonlocal_source = None

          def replace_in_test(text: str, title: str, old: str, new: str) -> str:
              marker = f'  it("{title}", async () => {{'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"missing test: {title}")
              end = text.find('\n  it("', start + len(marker))
              if end < 0:
                  end = len(text)
              chunk = text[start:end]
              if chunk.count(old) != 1:
                  raise SystemExit(f"expected one target in test: {title}")
              return text[:start] + chunk.replace(old, new, 1) + text[end:]

          source = replace_in_test(
              source,
              "yields before dirty control-plane fetch when foreground input is waiting",
              '    await expectDenseRawRetentionMailboxWakeAt("2026-04-08T00:00:30.000Z");',
              "    await expectDenseRawRetentionMailboxWakeAt(null);",
          )
          source = replace_in_test(
              source,
              "carries staged dirty acks when foreground input arrives after dirty fetch",
              "    const shouldYield = vi.fn()\n      .mockReturnValueOnce(false)\n      .mockReturnValue(true);",
              "    const shouldYield = vi.fn()\n      .mockReturnValueOnce(false)\n      .mockReturnValueOnce(false)\n      .mockReturnValue(true);",
          )
          source = replace_in_test(
              source,
              "carries staged dirty acks when foreground input arrives after scheduler work",
              "    const shouldYield = vi.fn()\n      .mockReturnValueOnce(false)\n      .mockReturnValueOnce(false)\n      .mockReturnValue(true);",
              "    const shouldYield = vi.fn()\n      .mockReturnValueOnce(false)\n      .mockReturnValueOnce(false)\n      .mockReturnValueOnce(false)\n      .mockReturnValue(true);",
          )
          path.write_text(source)
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/assistant-runtime/test/hosted-runtime-maintenance.test.ts
          git commit -m "test: align device-sync yield checks with pre-service boundary"
          git push --force-with-lease=refs/heads/agent/member-owned-provider-applications:bddf0cb2e74d083b71671cedd520ee169224b5f3 \
            origin HEAD:refs/heads/agent/member-owned-provider-applications
