name: Push PR 1484 partial config mock fix

on:
  push:
    branches:
      - agent/pr1484-audit-snapshot-20260810

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/member-owned-provider-applications
          fetch-depth: 0

      - name: Apply test mock fix
        shell: bash
        run: |
          set -euo pipefail
          expected_head=30d8c425f433cacfefa330a54a74e733cdd267ae
          test "$(git rev-parse HEAD)" = "$expected_head"
          python - <<'PY'
          from pathlib import Path

          path = Path("packages/assistant-runtime/test/hosted-runtime-maintenance.test.ts")
          source = path.read_text()
          old = '''vi.mock("@murphai/device-syncd/config", () => ({
            createConfiguredDeviceSyncProvidersFromConfigs:
              mocks.createConfiguredDeviceSyncProvidersFromConfigs,
            readConfiguredJunctionDeviceSyncProviderConfig:
              mocks.readConfiguredJunctionDeviceSyncProviderConfig,
          }));'''
          new = '''vi.mock("@murphai/device-syncd/config", async (importOriginal) => {
            const actual = await importOriginal<
              typeof import("@murphai/device-syncd/config")
            >();
            return {
              ...actual,
              createConfiguredDeviceSyncProvidersFromConfigs:
                mocks.createConfiguredDeviceSyncProvidersFromConfigs,
              readConfiguredJunctionDeviceSyncProviderConfig:
                mocks.readConfiguredJunctionDeviceSyncProviderConfig,
            };
          });'''
          if source.count(old) != 1:
              raise SystemExit("expected one full device-sync config mock")
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/assistant-runtime/test/hosted-runtime-maintenance.test.ts
          git commit -m "test: preserve device-sync config exports in maintenance mocks"
          git push --force-with-lease=refs/heads/agent/member-owned-provider-applications:30d8c425f433cacfefa330a54a74e733cdd267ae \
            origin HEAD:refs/heads/agent/member-owned-provider-applications
