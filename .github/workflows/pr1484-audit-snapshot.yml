name: Validate PR 1484 exact head

on:
  push:
    branches:
      - agent/pr1484-audit-snapshot-20260810

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: 7087a2159ebc41f66cb4af655d96e77c95b62337
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/web prisma generate

      - name: Validate Prisma schema
        run: pnpm --dir apps/web prisma validate

      - name: Typecheck device sync
        run: pnpm --dir packages/device-syncd typecheck

      - name: Typecheck assistant runtime
        run: pnpm --dir packages/assistant-runtime typecheck

      - name: Typecheck Web
        run: pnpm --dir apps/web typecheck

      - name: Run focused Web tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec vitest run --config vitest.config.ts --no-coverage \
            test/device-provider-application-crypto.test.ts \
            test/device-provider-application-ingress-store.test.ts \
            test/device-provider-application-store.test.ts \
            test/device-provider-application-types.test.ts \
            test/device-sync-hosted-runtime-authority.test.ts \
            test/device-sync-internal-runtime.test.ts \
            test/device-sync-providers.test.ts \
            test/hosted-account-data-service.test.ts \
            test/prisma-store-oauth-connection.test.ts \
            test/prisma-store-oauth-sessions.test.ts

      - name: Run focused runtime tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/assistant-runtime exec vitest run --config vitest.config.ts --no-coverage \
            test/hosted-runtime-device-sync-provider-configs.test.ts \
            test/hosted-runtime-device-sync-maintenance.test.ts \
            test/hosted-device-sync-runtime.test.ts

      - name: Run device-sync package tests
        run: pnpm --dir packages/device-syncd test

      - name: Run smoke checks
        run: pnpm test:smoke

      - name: Verify generated and source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short --untracked-files=no)" || {
            git status --short
            exit 1
          }
