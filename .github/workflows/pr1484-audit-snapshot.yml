name: Rebase PR 1484 onto audited main

on:
  push:
    branches:
      - agent/pr1484-audit-snapshot-20260810

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/member-owned-provider-applications
          fetch-depth: 0

      - name: Rebase exact audited head
        shell: bash
        run: |
          set -euo pipefail
          expected_head=ee78d0004d070d0e9aa422f20b603a826f085545
          audited_main=5cfb1d36c54440d0453ee5b86cfa736a201c5db5
          merge_base=337a75888b8c8046b208a75195d3e787dec83834
          test "$(git rev-parse HEAD)" = "$expected_head"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rebase --onto "$audited_main" "$merge_base"
          git diff --check "$audited_main"..HEAD
          git push --force-with-lease=refs/heads/agent/member-owned-provider-applications:"$expected_head" \
            origin HEAD:refs/heads/agent/member-owned-provider-applications
