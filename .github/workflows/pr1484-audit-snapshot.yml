name: Validate final PR 1484 repository guards

on:
  push:
    branches:
      - agent/pr1484-audit-snapshot-20260810

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: d77e7cb234870a4ecc7fa8634515ceaba61087c2
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C apps/web run prisma:generate

      - name: Run diff-aware verification
        run: pnpm test:diff:local

      - name: Run scenario integrity smoke check
        run: pnpm test:scenario-integrity

      - name: Run hosted crypto boundary guard
        run: pnpm hosted-crypto:guard

      - name: Run provider request boundary guard
        run: pnpm provider-requests:guard

      - name: Run dependency policy guard
        run: pnpm deps:guard

      - name: Verify workspace boundaries
        run: pnpm verify:workspace-boundaries

      - name: Verify workspace package cycles
        run: pnpm verify:workspace-package-cycles

      - name: Verify no generated JavaScript sidecars
        run: pnpm no-js

      - name: Verify generated and source cleanliness
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -z "$(git status --short --untracked-files=no)" || {
            git status --short
            exit 1
          }
