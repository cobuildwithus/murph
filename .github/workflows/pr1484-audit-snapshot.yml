name: Push verified PR 1484 provider boundary fix

on:
  push:
    branches:
      - agent/pr1484-audit-snapshot-20260810

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/member-owned-provider-applications
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          expected_head=bd43a41267b70162fce248375b8e9638cd4e3e17
          test "$(git rev-parse HEAD)" = "$expected_head"

          : > /tmp/provider-boundary.patch
          for blob in \
            83d8c354f4d8d0b89233fcb25dfd5edc94f79d58 \
            9de1be97ea46d356ca5e526e5a5b9dcbf8a975a0 \
            2cb4ae7670474c8963be10cf525fa511bff97d27 \
            b44d238f87fa5524d19fb3dafb24058429c9e1b4 \
            750dddf5a38a6df082a749b5c4b4c487ff3a4387 \
            c8f036f23b679a69820d78d92023da2de0b5d1eb \
            367a3635d77b8bb7500f50caa1a4d2a3283d1857 \
            13949dc6bf5cc9d72438062cd15a2c843fc2543c \
            95c9722b3fa6bb71245bc9bab6f8174164e901de
          do
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/${blob}" --jq .content \
              | tr -d '\n' \
              | base64 -d >> /tmp/provider-boundary.patch
          done

          echo "db919c698920137b8797597b6b53c84acb9215caf5152d239380b4626265e332  /tmp/provider-boundary.patch" \
            | sha256sum -c -
          test "$(wc -c < /tmp/provider-boundary.patch)" = "10265"
          git apply --check /tmp/provider-boundary.patch
          git apply /tmp/provider-boundary.patch
          git diff --check

      - name: Typecheck and lint Web
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C apps/web run typecheck
          pnpm -C apps/web run lint

      - name: Run focused Web regressions
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C apps/web exec vitest run --config vitest.workspace.ts --no-coverage \
            test/agent-session-provider-service.test.ts \
            test/agent-session-service.test.ts

      - name: Verify package boundary
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C packages/device-syncd exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/package-boundary.test.ts

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web/src/lib/device-sync/agent-session-provider-service.ts \
            apps/web/src/lib/device-sync/agent-session-service.ts \
            apps/web/test/agent-session-provider-service.test.ts
          git commit -m "refactor: preserve device-sync provider runtime boundary"
          git push --force-with-lease=refs/heads/agent/member-owned-provider-applications:bd43a41267b70162fce248375b8e9638cd4e3e17 \
            origin HEAD:refs/heads/agent/member-owned-provider-applications
