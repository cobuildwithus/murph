name: Rebase final PR 1484 candidate

on:
  push:
    branches:
      - agent/pr1484-audit-snapshot-20260810

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/member-owned-provider-applications
          fetch-depth: 0

      - name: Rebase onto latest audited main
        shell: bash
        run: |
          set -euo pipefail
          expected_head=e207abf716fedae5d7708adbc787841f92b6f41c
          audited_main=d1a42bf9a7aba1f65d35f4fcee332a9cc9c989d7
          test "$(git rev-parse HEAD)" = "$expected_head"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rebase "$audited_main"
          git diff --check "$audited_main"..HEAD
          git push --force-with-lease=refs/heads/agent/member-owned-provider-applications:"$expected_head" \
            origin HEAD:refs/heads/agent/member-owned-provider-applications
