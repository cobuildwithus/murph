name: Push PR 1484 stale-binding projection fix

on:
  push:
    branches:
      - agent/pr1484-audit-snapshot-20260810

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/member-owned-provider-applications
          fetch-depth: 0

      - name: Apply projection fix
        shell: bash
        run: |
          set -euo pipefail
          expected_head=8176acf2207337f3249ba5f88aaf8da00d3954a6
          test "$(git rev-parse HEAD)" = "$expected_head"
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/lib/device-sync/hosted-runtime-authority.ts")
          source = path.read_text()
          old = '''                  refreshedSources.map(toHostedRuntimeConnectionSourceSnapshot),
                ).connection'''
          new = '''                  refreshedSources.map(toHostedRuntimeConnectionSourceSnapshot),
                  {
                    forceReauthorizationRequired:
                      !providerApplicationBindingCurrent,
                    includeCredentialMaterial: false,
                  },
                ).connection'''
          if source.count(old) != 1:
              raise SystemExit("expected exactly one runtime apply response projection")
          path.write_text(source.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit and push WIP fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/src/lib/device-sync/hosted-runtime-authority.ts
          git commit -m "fix: project stale provider bindings as repair-required"
          git push --force-with-lease=refs/heads/agent/member-owned-provider-applications:8176acf2207337f3249ba5f88aaf8da00d3954a6 \
            origin HEAD:refs/heads/agent/member-owned-provider-applications
