name: Push PR 1484 audit fixes

on:
  push:
    branches:
      - agent/pr1484-audit-snapshot-20260810

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: agent/member-owned-provider-applications
          fetch-depth: 0

      - name: Apply audited fixes
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          set -euo pipefail
          expected_head=7087a2159ebc41f66cb4af655d96e77c95b62337
          test "$(git rev-parse HEAD)" = "$expected_head"
          printf '%s' "$PATCH_GZIP_BASE64" \
            | base64 --decode \
            | gzip --decompress > /tmp/pr1484-fixes.patch
          git apply --check /tmp/pr1484-fixes.patch
          git apply /tmp/pr1484-fixes.patch
          git diff --check

      - name: Commit and push WIP fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            apps/web/src/lib/device-sync/provider-applications/crypto.ts \
            apps/web/src/lib/device-sync/provider-applications/store.ts \
            apps/web/src/lib/device-sync/prisma-store/oauth-sessions.ts \
            apps/web/src/lib/device-sync/prisma-store.ts \
            apps/web/src/lib/device-sync/provider-applications/ingress-store.ts \
            apps/web/test/device-sync-hosted-runtime-authority.test.ts \
            apps/web/test/device-provider-application-ingress-store.test.ts \
            apps/web/test/prisma-store-oauth-sessions.test.ts \
            apps/web/test/device-provider-application-crypto.test.ts \
            apps/web/test/device-provider-application-store.test.ts
          git commit -m "fix: harden provider application recovery and OAuth binding"
          git push --force-with-lease=refs/heads/agent/member-owned-provider-applications:7087a2159ebc41f66cb4af655d96e77c95b62337 \
            origin HEAD:refs/heads/agent/member-owned-provider-applications
