name: Migrate Cloudflare Secrets Private

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-cloudflare-secrets-private
  cancel-in-progress: false

jobs:
  encrypt:
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    steps:
      - name: Encrypt configured deploy secrets for private production
        env:
          TARGET_ENVIRONMENT: production
          TARGET_KEY_ID: "3380204578043523366"
          TARGET_PUBLIC_KEY: "8TBLIjl/ZGOcaCkPgxUSzzZgMcUluIVDKu8BiunQAAs="
          TARGET_REPOSITORY: cobuildwithus/murph-cloud
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_IMAGES_SIGNING_KEY: ${{ secrets.CLOUDFLARE_IMAGES_SIGNING_KEY }}
          DEVICE_SYNC_SECRET: ${{ secrets.DEVICE_SYNC_SECRET }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          HOSTED_AI_USAGE_REPORTING_SECRET: ${{ secrets.HOSTED_AI_USAGE_REPORTING_SECRET }}
          HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_PRIVATE_JWK: ${{ secrets.HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_PRIVATE_JWK }}
          HOSTED_DATABASE_ALERT_LINQ_CHAT_ID: ${{ secrets.HOSTED_DATABASE_ALERT_LINQ_CHAT_ID }}
          HOSTED_DATABASE_ALERT_LINQ_SECONDARY_CHAT_ID: ${{ secrets.HOSTED_DATABASE_ALERT_LINQ_SECONDARY_CHAT_ID }}
          HOSTED_DATABASE_ALERT_PLANETSCALE_SERVICE_TOKEN: ${{ secrets.HOSTED_DATABASE_ALERT_PLANETSCALE_SERVICE_TOKEN }}
          HOSTED_DATABASE_ALERT_PLANETSCALE_SERVICE_TOKEN_ID: ${{ secrets.HOSTED_DATABASE_ALERT_PLANETSCALE_SERVICE_TOKEN_ID }}
          HOSTED_EMAIL_SIGNING_SECRET: ${{ secrets.HOSTED_EMAIL_SIGNING_SECRET }}
          HOSTED_LOG_FINGERPRINT_SECRET: ${{ secrets.HOSTED_LOG_FINGERPRINT_SECRET }}
          HOSTED_PROVIDER_EGRESS_CREDENTIAL_SIGNING_SECRET: ${{ secrets.HOSTED_PROVIDER_EGRESS_CREDENTIAL_SIGNING_SECRET }}
          HOSTED_R2_PRESIGN_ACCESS_KEY_ID: ${{ secrets.HOSTED_R2_PRESIGN_ACCESS_KEY_ID }}
          HOSTED_R2_PRESIGN_SECRET_ACCESS_KEY: ${{ secrets.HOSTED_R2_PRESIGN_SECRET_ACCESS_KEY }}
          HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK: ${{ secrets.HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK }}
          JUNCTION_API_KEY: ${{ secrets.JUNCTION_API_KEY }}
          JUNCTION_CLIENT_USER_ID_SECRET: ${{ secrets.JUNCTION_CLIENT_USER_ID_SECRET }}
          JUNCTION_WEBHOOK_SECRET: ${{ secrets.JUNCTION_WEBHOOK_SECRET }}
          LINQ_API_TOKEN: ${{ secrets.LINQ_API_TOKEN }}
          LINQ_WEBHOOK_SECRET: ${{ secrets.LINQ_WEBHOOK_SECRET }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MURPH_DATA_API_KEY: ${{ secrets.MURPH_DATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          VENICE_API_KEY: ${{ secrets.VENICE_API_KEY }}
          WHOOP_CLIENT_ID: ${{ secrets.WHOOP_CLIENT_ID }}
          WHOOP_CLIENT_SECRET: ${{ secrets.WHOOP_CLIENT_SECRET }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          php <<'PHP'
          <?php
          declare(strict_types=1);

          if (!function_exists("sodium_crypto_box_seal")) {
              fwrite(STDERR, "PHP sodium sealed-box support is unavailable.\n");
              exit(1);
          }

          $keyId = getenv("TARGET_KEY_ID");
          $publicKeyBase64 = getenv("TARGET_PUBLIC_KEY");
          if ($keyId === false || $keyId === "" || $publicKeyBase64 === false || $publicKeyBase64 === "") {
              fwrite(STDERR, "Target GitHub environment key inputs are required.\n");
              exit(1);
          }

          try {
              $publicKey = sodium_base642bin(
                  $publicKeyBase64,
                  SODIUM_BASE64_VARIANT_ORIGINAL,
                  "",
              );
          } catch (SodiumException $error) {
              fwrite(STDERR, "Target GitHub environment public key is invalid.\n");
              exit(1);
          }
          if (strlen($publicKey) !== SODIUM_CRYPTO_BOX_PUBLICKEYBYTES) {
              fwrite(STDERR, "Target GitHub environment public key has the wrong length.\n");
              exit(1);
          }

          $secretNames = [
              "CLOUDFLARE_ACCOUNT_ID",
              "CLOUDFLARE_API_TOKEN",
              "CLOUDFLARE_IMAGES_SIGNING_KEY",
              "DEVICE_SYNC_SECRET",
              "ELEVENLABS_API_KEY",
              "EXA_API_KEY",
              "HOSTED_AI_USAGE_REPORTING_SECRET",
              "HOSTED_CRYPTO_CLOUDFLARE_AUTOMATION_PRIVATE_JWK",
              "HOSTED_DATABASE_ALERT_LINQ_CHAT_ID",
              "HOSTED_DATABASE_ALERT_LINQ_SECONDARY_CHAT_ID",
              "HOSTED_DATABASE_ALERT_PLANETSCALE_SERVICE_TOKEN",
              "HOSTED_DATABASE_ALERT_PLANETSCALE_SERVICE_TOKEN_ID",
              "HOSTED_EMAIL_SIGNING_SECRET",
              "HOSTED_LOG_FINGERPRINT_SECRET",
              "HOSTED_PROVIDER_EGRESS_CREDENTIAL_SIGNING_SECRET",
              "HOSTED_R2_PRESIGN_ACCESS_KEY_ID",
              "HOSTED_R2_PRESIGN_SECRET_ACCESS_KEY",
              "HOSTED_WEB_CALLBACK_SIGNING_PRIVATE_JWK",
              "JUNCTION_API_KEY",
              "JUNCTION_CLIENT_USER_ID_SECRET",
              "JUNCTION_WEBHOOK_SECRET",
              "LINQ_API_TOKEN",
              "LINQ_WEBHOOK_SECRET",
              "MAPBOX_ACCESS_TOKEN",
              "MURPH_DATA_API_KEY",
              "OPENAI_API_KEY",
              "TELEGRAM_BOT_TOKEN",
              "VENICE_API_KEY",
              "WHOOP_CLIENT_ID",
              "WHOOP_CLIENT_SECRET",
              "XAI_API_KEY",
          ];

          $encryptedSecrets = [];
          foreach ($secretNames as $name) {
              $value = getenv($name);
              if ($value === false || $value === "") {
                  fwrite(STDERR, "Configured public production secret is unavailable: {$name}\n");
                  exit(1);
              }

              $encryptedSecrets[] = [
                  "name" => $name,
                  "encrypted_value" => base64_encode(
                      sodium_crypto_box_seal($value, $publicKey),
                  ),
              ];
              sodium_memzero($value);
          }

          $manifest = [
              "key_id" => $keyId,
              "source_repository" => getenv("GITHUB_REPOSITORY"),
              "source_sha" => getenv("GITHUB_SHA"),
              "target_environment" => getenv("TARGET_ENVIRONMENT"),
              "target_repository" => getenv("TARGET_REPOSITORY"),
              "secrets" => $encryptedSecrets,
          ];
          file_put_contents(
              "cloudflare-secret-ciphertext.json",
              json_encode($manifest, JSON_THROW_ON_ERROR | JSON_UNESCAPED_SLASHES),
          );
          fwrite(STDOUT, "Encrypted " . count($encryptedSecrets) . " deploy secrets.\n");
          PHP

      - name: Upload ciphertext manifest
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cloudflare-secret-ciphertext
          path: cloudflare-secret-ciphertext.json
          if-no-files-found: error
          retention-days: 1
