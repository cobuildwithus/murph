name: PR 1484 audited fix apply

on:
  push:
    branches:
      - agent/pr1484-audit-export

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/member-owned-provider-applications
          fetch-depth: 0
          path: target

      - name: Check out isolated audit payload
        uses: actions/checkout@v4
        with:
          ref: agent/pr1484-audit-export
          fetch-depth: 1
          path: helper

      - name: Apply exact audited patch
        shell: bash
        run: |
          set -euo pipefail
          cd target
          expected_head=e5fe6d0f70a1c46a2e098ae117bdcd971aa126f8
          actual_head=$(git rev-parse HEAD)
          test "$actual_head" = "$expected_head" || {
            echo "PR head changed: expected $expected_head, found $actual_head" >&2
            exit 1
          }
          base64 --decode ../helper/.github/pr1484/fixes-1.patch.gz.b64 \
            | gzip --decompress > /tmp/pr1484-fixes.patch
          git apply --index --whitespace=nowarn /tmp/pr1484-fixes.patch
          git diff --cached --check

      - name: Commit and push fixes
        shell: bash
        run: |
          set -euo pipefail
          cd target
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: harden member-owned provider applications"
          git push origin HEAD:agent/member-owned-provider-applications
