name: PR 1484 final audited rebuild

on:
  push:
    branches:
      - agent/pr1484-audit-export

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out target history
        uses: actions/checkout@v4
        with:
          ref: agent/member-owned-provider-applications
          fetch-depth: 0
          path: target

      - name: Check out isolated audit payload
        uses: actions/checkout@v4
        with:
          ref: agent/pr1484-audit-export
          fetch-depth: 1
          path: helper

      - name: Rebuild exact feature tree on one main snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd target
          expected_target=ee78d0004d070d0e9aa422f20b603a826f085545
          feature_commit=e5fe6d0f70a1c46a2e098ae117bdcd971aa126f8
          test "$(git rev-parse HEAD)" = "$expected_target"
          git fetch origin main
          main_sha=$(git rev-parse origin/main)
          echo "PR1484_MAIN_SHA=$main_sha" >> "$GITHUB_ENV"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B rebuilt "$main_sha"
          git cherry-pick "$feature_commit"
          base64 --decode ../helper/.github/pr1484/fixes-final.patch.gz.b64 \
            | gzip --decompress > /tmp/pr1484-fixes-final.patch
          git apply --index --whitespace=nowarn /tmp/pr1484-fixes-final.patch
          git diff --cached --check
          git commit -m "fix: complete member-owned provider application audit"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: target/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: target
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: target
        run: pnpm -C apps/web exec prisma generate

      - name: Typecheck affected packages
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          pnpm -C packages/device-syncd typecheck
          pnpm -C packages/assistant-runtime typecheck
          pnpm -C apps/web typecheck

      - name: Run focused tests
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run --config apps/web/vitest.config.ts --no-coverage \
            apps/web/test/device-provider-application-crypto.test.ts \
            apps/web/test/device-provider-application-ingress-store.test.ts \
            apps/web/test/device-provider-application-store.test.ts \
            apps/web/test/device-provider-application-types.test.ts \
            apps/web/test/device-sync-hosted-runtime-authority.test.ts \
            apps/web/test/device-sync-internal-runtime.test.ts \
            apps/web/test/device-sync-providers.test.ts \
            apps/web/test/hosted-account-data-service.test.ts \
            apps/web/test/prisma-store-oauth-connection.test.ts \
            apps/web/test/prisma-store-oauth-sessions.test.ts
          pnpm exec vitest run --config packages/device-syncd/vitest.config.ts --no-coverage \
            packages/device-syncd/test/config.test.ts \
            packages/device-syncd/test/hosted-runtime.test.ts
          pnpm exec vitest run --config packages/assistant-runtime/vitest.config.ts --no-coverage \
            packages/assistant-runtime/test/hosted-runtime-device-sync-provider-configs.test.ts

      - name: Run repository smoke checks
        working-directory: target
        run: pnpm test:smoke

      - name: Verify final tree and push
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$PR1484_MAIN_SHA"...HEAD
          test -z "$(git status --short --untracked-files=no)" || {
            git status --short
            echo "Validation changed tracked files." >&2
            exit 1
          }
          git push \
            --force-with-lease=refs/heads/agent/member-owned-provider-applications:ee78d0004d070d0e9aa422f20b603a826f085545 \
            origin HEAD:agent/member-owned-provider-applications
