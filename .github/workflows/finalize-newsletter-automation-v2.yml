name: Finalize newsletter automation refactor v2

on:
  push:
    branches:
      - codex/simplify-newsletter-automation
    paths:
      - .github/workflows/finalize-newsletter-automation-v2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-newsletter-v2]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/simplify-newsletter-automation

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Rebase onto current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Extract and run the reviewed patch idempotently
        shell: python
        run: |
          from pathlib import Path
          import re
          import runpy

          workflow = Path('.github/workflows/finalize-newsletter-automation.yml')
          lines = workflow.read_text().splitlines()
          step_index = next(
              index for index, line in enumerate(lines)
              if line.strip() == '- name: Apply final reviewed architecture'
          )
          run_index = next(
              index for index in range(step_index + 1, len(lines))
              if lines[index].strip() == 'run: |'
          )
          script_lines: list[str] = []
          for line in lines[run_index + 1:]:
              if line.startswith('      - name:') or line.startswith('      - uses:'):
                  break
              if line.startswith('          '):
                  script_lines.append(line[10:])
              elif line.strip() == '':
                  script_lines.append('')
              else:
                  raise SystemExit(f'unexpected workflow indentation: {line!r}')

          script = '\n'.join(script_lines) + '\n'
          helper_pattern = re.compile(
              r"def replace_once\(path: str, old: str, new: str\) -> None:\n"
              r"(?:    .*\n)+?"
              r"(?=def replace_count)",
          )
          robust_helper = '''def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              exact_count = text.count(old)
              if exact_count == 1:
                  write(path, text.replace(old, new, 1))
                  return
              if exact_count > 1:
                  raise SystemExit(
                      f"{path}: expected one exact match, found {exact_count}: "
                      f"{old.splitlines()[0][:120]!r}"
                  )
              if text.count(new) == 1:
                  return
              whitespace_pattern = ''.join(
                  r'\\s+' if part.isspace() else re.escape(part)
                  for part in re.split(r'(\\s+)', old)
              )
              matches = list(re.finditer(whitespace_pattern, text, flags=re.S))
              if len(matches) == 1:
                  match = matches[0]
                  write(path, text[:match.start()] + new + text[match.end():])
                  return
              raise SystemExit(
                  f"{path}: exact={exact_count}, whitespace={len(matches)}, "
                  f"replacement={text.count(new)}: {old.splitlines()[0][:120]!r}"
              )

          '''
          script, count = helper_pattern.subn(
              lambda _match: robust_helper,
              script,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'failed to replace patch helper: {count}')

          patch_script = Path('/tmp/finalize-newsletter-automation.py')
          patch_script.write_text(script)
          runpy.run_path(str(patch_script), run_name='__main__')

          policy_path = Path(
              'packages/assistant-runtime/src/hosted-runtime/automation-tool-policy.ts'
          )
          policy = policy_path.read_text()
          active_gate = "    status !== 'archived'\n"
          if policy.count(active_gate) != 2:
              raise SystemExit(
                  f'expected two hosted delivery status gates, found {policy.count(active_gate)}'
              )
          policy_path.write_text(policy.replace(active_gate, "    status === 'active'\n"))

          cron_path = Path(
              'packages/assistant-engine/src/assistant/cron/execution.ts'
          )
          cron = cron_path.read_text()
          old_import = "import {\n  resolveAutomationGroupEmailDelivery,\n} from '../group-newsletter-automation.js'\n"
          new_import = "import {\n  resolveAutomationGroupEmailConfigurationIssue,\n} from '../automation-delivery.js'\nimport {\n  resolveAutomationGroupEmailDelivery,\n} from '../group-newsletter-automation.js'\n"
          if cron.count(old_import) != 1:
              raise SystemExit(
                  f'expected one group-email resolver import, found {cron.count(old_import)}'
              )
          cron = cron.replace(old_import, new_import, 1)
          old_authority = "    input.job.source.schedule.kind !== 'cron' ||\n    resolveAutomationGroupEmailDelivery(input.job.source) !== 'group_email'\n"
          new_authority = "    resolveAutomationGroupEmailDelivery(input.job.source) !== 'group_email' ||\n    resolveAutomationGroupEmailConfigurationIssue({\n      continuityPolicy: input.job.source.continuityPolicy,\n      delivery: 'group_email',\n      route: input.job.source.route,\n      schedule: input.job.source.schedule,\n    }) !== null\n"
          if cron.count(old_authority) != 1:
              raise SystemExit(
                  f'expected one scheduled email authority gate, found {cron.count(old_authority)}'
              )
          cron_path.write_text(cron.replace(old_authority, new_authority, 1))

          policy_test_path = Path(
              'packages/assistant-runtime/test/automation-tool-policy.test.ts'
          )
          policy_test = policy_test_path.read_text()
          insertion = '''
            it('allows pausing a malformed existing email record without reauthorizing it', () => {
              expect(resolveHostedAutomationPatchPolicy({
                existing: existing({
                  continuityPolicy: 'preserve',
                  schedule: { kind: 'dailyLocal', localTime: '09:00' },
                  tags: [AUTOMATION_GROUP_EMAIL_DELIVERY_TAG],
                }),
                request: patch({ status: 'paused' }),
                route: DIRECT_ROUTE,
              })).toEqual({
                status: 'paused',
                tags: undefined,
              })
            })

          '''
          marker = "  it('allows archival cleanup of a malformed existing generic email record', () => {\n"
          if policy_test.count(marker) != 1:
              raise SystemExit(
                  f'expected one malformed-record archival test, found {policy_test.count(marker)}'
              )
          policy_test_path.write_text(
              policy_test.replace(marker, insertion + marker, 1)
          )

          Path('.github/workflows/finalize-newsletter-automation-v2.yml').unlink()

      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline

      - name: Focused assistant-engine proof
        run: >-
          pnpm --dir packages/assistant-engine exec vitest run
          --config vitest.config.ts --no-coverage
          test/automation-delivery.test.ts
          test/assistant-managed-group-skill-fallbacks.test.ts
          test/assistant-hosted-domain-tools.test.ts
          test/assistant-skill-assets.test.ts

      - name: Focused assistant-runtime proof
        run: >-
          pnpm --dir packages/assistant-runtime exec vitest run
          --config vitest.config.ts --no-coverage
          test/automation-tool-policy.test.ts

      - name: Typecheck touched owners
        run: |
          pnpm --dir packages/assistant-engine typecheck
          pnpm --dir packages/assistant-runtime typecheck

      - name: Repository validation
        run: |
          pnpm docs:drift
          pnpm test:diff:local
          git diff --check
          test ! -e .github/workflows/finalize-newsletter-automation.yml
          test ! -e .github/workflows/finalize-newsletter-automation-v2.yml
          test ! -e agent-docs/exec-plans/active/2026-08-09-newsletter-as-automation.md
          test -e agent-docs/exec-plans/completed/2026-08-09-newsletter-as-automation.md
          grep -q 'system:automation-delivery:group-email' packages/assistant-engine/src/assistant/automation-delivery.ts
          grep -q 'resolveHostedAutomationSavePolicy' packages/assistant-runtime/src/hosted-runtime/workspace-assistant-phase.ts
          grep -q 'resolveAutomationGroupEmailConfigurationIssue' packages/assistant-engine/src/assistant/cron/execution.ts

      - name: Commit and push reviewed fixes
        run: |
          git add -A
          git commit -m "refactor(automation): finalize ordinary group newsletters"
          git push --force-with-lease origin HEAD:codex/simplify-newsletter-automation
