name: Web Viewport Overflow

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  push:
    branches:
      - main
  workflow_dispatch:

# One CI run per ref: a new push to a PR or main cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdown-docs-scope:
    name: Classify viewport documentation scope
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      markdown_only: ${{ steps.scope-result.outputs.markdown_only }}
    steps:
      - name: Check out trusted base classifier
        id: checkout-base
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci-markdown-docs-scope.mjs
          sparse-checkout-cone-mode: false

      - name: Run trusted exact-PR classifier
        id: classify
        if: ${{ steps.checkout-base.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          if [[ ! -f scripts/ci-markdown-docs-scope.mjs ]]; then
            echo "markdown_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/ci-markdown-docs-scope.mjs

      - name: Publish fail-closed scope result
        id: scope-result
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout-base.outcome }}
          CLASSIFIER_OUTCOME: ${{ steps.classify.outcome }}
          CLASSIFIER_MARKDOWN_ONLY: ${{ steps.classify.outputs.markdown_only }}
        shell: bash
        run: |
          set -euo pipefail
          markdown_only=false
          if [[ "$CHECKOUT_OUTCOME" == "success" && "$CLASSIFIER_OUTCOME" == "success" && "$CLASSIFIER_MARKDOWN_ONLY" == "true" ]]; then
            markdown_only=true
          fi
          echo "markdown_only=$markdown_only" >> "$GITHUB_OUTPUT"
          echo "Viewport scope classified with trusted base policy: markdown_only=$markdown_only"

  viewport-overflow:
    name: No horizontal overflow on marketing pages
    needs: markdown-docs-scope
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - name: Record Markdown documentation receipt
        if: ${{ github.event_name == 'pull_request' && needs.markdown-docs-scope.result == 'success' && needs.markdown-docs-scope.outputs.markdown_only == 'true' }}
        run: echo "Viewport overflow satisfied by exact-inventory Markdown documentation proof."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        run: pnpm install --frozen-lockfile

      # The overflow spec drives a real browser; install only Chromium plus its
      # OS libraries. Playwright boots the hosted-web dev server itself (see
      # apps/web/playwright.config.ts) with placeholder smoke env, so no
      # database or extra secrets are required to render the public pages.
      - name: Install Playwright Chromium
        timeout-minutes: 14
        run: scripts/install-playwright-chromium.sh
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}

      - name: Smoke headed Chromium under Xvfb
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        env:
          MURPH_E2E_HEADED_BROWSER_SMOKE: "1"
        run: >-
          xvfb-run --auto-servernum pnpm exec vitest run
          --config apps/web/vitest.workspace.ts --no-coverage
          apps/web/test/hosted-headed-browser-smoke.test.ts

      - name: Check marketing pages for horizontal overflow
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        run: pnpm --dir apps/web test:viewport-overflow

      - name: Upload Playwright report on failure
        if: ${{ failure() && (github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true') }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
