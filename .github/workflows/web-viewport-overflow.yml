name: Web Viewport Overflow

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# One CI run per ref: a new push to a PR or main cancels the superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  viewport-overflow:
    name: No horizontal overflow on marketing pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The overflow spec drives a real browser; install only Chromium plus its
      # OS libraries. Playwright boots the hosted-web dev server itself (see
      # apps/web/playwright.config.ts) with placeholder smoke env, so no
      # database or extra secrets are required to render the public pages.
      - name: Install Playwright Chromium
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      - name: Smoke headed Chromium under Xvfb
        env:
          MURPH_E2E_HEADED_BROWSER_SMOKE: "1"
        run: >-
          xvfb-run --auto-servernum pnpm exec vitest run
          --config apps/web/vitest.workspace.ts --no-coverage
          apps/web/test/hosted-headed-browser-smoke.test.ts

      - name: Check marketing pages for horizontal overflow
        run: pnpm --dir apps/web test:viewport-overflow

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
          if-no-files-found: ignore
