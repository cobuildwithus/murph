name: Agent Murph Group Plan Bootstrap

on:
  push:
    branches:
      - agent/murph-group-plan
    paths:
      - .github/agent-group-plan/READY
  pull_request:
    branches:
      - agent/stripe-billing-hardening
    paths:
      - .github/agent-group-plan/READY
      - .github/agent-group-plan/patch-*
      - .github/workflows/agent-murph-group-plan-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: agent-murph-group-plan-bootstrap
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/murph-group-plan

      - name: Merge current billing base in the worktree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git merge --no-edit origin/agent/stripe-billing-hardening

      - name: Assemble and partially apply patch
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/agent-group-plan/patch-001 \
            .github/agent-group-plan/patch-002 \
            .github/agent-group-plan/patch-003-00.part \
            .github/agent-group-plan/patch-003-01.part \
            .github/agent-group-plan/patch-003-02.part \
            .github/agent-group-plan/patch-003-03.part \
            .github/agent-group-plan/patch-004 \
            .github/agent-group-plan/patch-005 \
            .github/agent-group-plan/patch-006 \
            .github/agent-group-plan/patch-007 \
            .github/agent-group-plan/patch-008 \
            .github/agent-group-plan/patch-009 \
            > /tmp/murph-group-plan.patch

          set +e
          git apply --reject --whitespace=fix /tmp/murph-group-plan.patch \
            > /tmp/group-plan-apply.log 2>&1
          apply_status=$?
          git diff --check >> /tmp/group-plan-apply.log 2>&1
          diff_status=$?
          set -e

          mkdir -p /tmp/group-plan-rebase/tree
          cp /tmp/murph-group-plan.patch /tmp/group-plan-rebase/original.patch
          cp /tmp/group-plan-apply.log /tmp/group-plan-rebase/apply.log
          git diff --binary > /tmp/group-plan-rebase/partially-applied.patch
          python - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path('.')
          output = Path('/tmp/group-plan-rebase/tree')
          patch = Path('/tmp/murph-group-plan.patch').read_text()
          paths = set(re.findall(r'^diff --git a/(.+?) b/(.+?)$', patch, re.M)[0][0] for _ in [])
          paths = set()
          for left, right in re.findall(r'^diff --git a/(.+?) b/(.+?)$', patch, re.M):
              paths.add(right)
          paths.update(
              str(path.relative_to(root)).removesuffix('.rej')
              for path in root.rglob('*.rej')
          )
          for relative in sorted(paths):
              source = root / relative
              if source.is_file():
                  target = output / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
              reject = root / f'{relative}.rej'
              if reject.is_file():
                  target = output / f'{relative}.rej'
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(reject, target)
          PY

          if [ "$apply_status" -ne 0 ] || [ "$diff_status" -ne 0 ]; then
            exit 1
          fi

      - name: Upload rebase worktree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group-plan-rebase-worktree
          path: /tmp/group-plan-rebase
          if-no-files-found: error
          retention-days: 1

      - name: Fail after rebase diagnostics
        if: steps.apply.outcome == 'failure'
        shell: bash
        run: |
          cat /tmp/group-plan-apply.log
          exit 1

      - name: Enable pnpm
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Run focused Group plan tests
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm --dir apps/web exec vitest run \
              --config vitest.workspace.ts \
              --no-coverage \
              test/hosted-group-plan-policy.test.ts \
              test/hosted-onboarding-billing-plans.test.ts \
              test/hosted-onboarding-env.test.ts \
              test/hosted-billing-settings.test.tsx \
              test/hosted-usage-status.test.ts \
              test/hosted-subscription-tool.test.ts \
              test/hosted-subscription-tool-route.test.ts \
              test/user-facing-messages.test.ts
            pnpm --dir packages/hosted-execution exec vitest run \
              test/plan-usage.test.ts \
              test/subscription.test.ts
            pnpm --dir packages/assistant-engine exec vitest run \
              test/assistant-subscription-tool.test.ts
            pnpm --dir packages/hosted-local-harness exec vitest run \
              test/dev-hosted-local/stripe.test.ts
          } 2>&1 | tee /tmp/group-plan-tests.log

      - name: Run prepared typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck:prepared 2>&1 | tee /tmp/group-plan-typecheck.log

      - name: Upload validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: group-plan-validation-diagnostics
          path: |
            /tmp/group-plan-tests.log
            /tmp/group-plan-typecheck.log
          if-no-files-found: warn
          retention-days: 1

      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/agent-group-plan
          rm -f .github/workflows/agent-murph-group-plan-bootstrap.yml
          find . -name '*.rej' -delete
          git diff --check
          git add -A
          git commit -m "Add eligible Murph Group plan"
          git push origin HEAD:agent/murph-group-plan
