name: Agent merge main

on:
  pull_request:
    paths:
      - .github/workflows/agent-merge-main.yml

permissions:
  contents: write

jobs:
  merge:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Merge current main without hiding conflicts
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-merge-main.yml
          git fetch origin main

          if ! git merge --no-commit --no-ff origin/main; then
            echo "Merge conflicts:" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi

          git diff --check
          git commit -m "Merge main into Linq chat health preflight"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
