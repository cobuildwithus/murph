name: Export PR 1446 audited candidate

on:
  push:
    branches:
      - agent/pr1446-recover-finalizer

permissions:
  contents: read

concurrency:
  group: export-pr1446-audited-candidate
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Reconstruct audited patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            scripts/pr1446-final/00 \
            scripts/pr1446-final/01 \
            | tr -d '\r\n ' \
            | base64 -d \
            | gzip -d \
            > /tmp/pr1446-final.patch
          echo '1d92ac0a305f0cef6fcb7bbf5405929fbe2b767e1a2e0dac3b0ac6f1d8cc7a04  /tmp/pr1446-final.patch' \
            | sha256sum --check

      - name: Materialize current-main candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main agent/optional-sponsorship-moments
          rm -rf /tmp/pr1446-candidate
          git worktree add --detach /tmp/pr1446-candidate origin/main
          cd /tmp/pr1446-candidate

          set +e
          git apply --3way --index /tmp/pr1446-final.patch
          apply_status=$?
          set -e

          mapfile -t unmerged < <(git diff --name-only --diff-filter=U)
          if [[ "$apply_status" -ne 0 ]]; then
            if [[ "${#unmerged[@]}" -ne 1 || "${unmerged[0]}" != "agent-docs/index.md" ]]; then
              printf 'Unexpected patch conflicts:\n' >&2
              printf '  %s\n' "${unmerged[@]}" >&2
              exit "$apply_status"
            fi

            # The index is an inventory, not an implementation owner. Preserve
            # every newer mainline entry and update only this product-spec row.
            git show HEAD:agent-docs/index.md > agent-docs/index.md
            python - <<'PY'
          from pathlib import Path

          index = Path('agent-docs/index.md')
          lines = index.read_text().splitlines(keepends=True)
          matches = [
              offset
              for offset, line in enumerate(lines)
              if '`agent-docs/product-specs/hosted-usage-topups.md`' in line
          ]
          if len(matches) != 1:
              raise SystemExit(
                  f'expected one hosted-usage-topups index row, found {len(matches)}'
              )

          offset = matches[0]
          row = lines[offset]
          old = (
              'and a single room-specific roughly 15-second song on activation '
              'with later refills silent.'
          )
          new = (
              'and an optional participant-authorized message, poem, or '
              '15-second song on activation with later refills silent.'
          )
          if new not in row:
              if old not in row:
                  raise SystemExit('hosted-usage-topups index row shape changed')
              row = row.replace(old, new, 1)
              lines[offset] = row
              index.write_text(''.join(lines))
          PY
            git add agent-docs/index.md
          elif [[ "${#unmerged[@]}" -ne 0 ]]; then
            printf 'Patch reported success with unresolved conflicts:\n' >&2
            printf '  %s\n' "${unmerged[@]}" >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          migration_test = Path(
              'apps/web/test/hosted-onboarding-privacy-foundation-migration.test.ts'
          )
          text = migration_test.read_text()
          migration = '      "20260807210000_add_group_sponsorship_creative_request",\n'
          if migration not in text:
              anchor = '      "20260806180000_fix_hosted_usage_plan_transition_bridge",\n'
              if anchor not in text:
                  raise SystemExit('migration-list anchor not found')
              text = text.replace(anchor, anchor + migration, 1)
              migration_test.write_text(text)

          product_spec = Path('agent-docs/product-specs/hosted-usage-topups.md')
          text = product_spec.read_text()
          old = (
              'Its private monthly maximum never changes public output or creates a '
              'running bit.'
          )
          new = (
              'Its private monthly maximum never changes the public acknowledgment '
              'or creates a running bit.'
          )
          if old in text:
              text = text.replace(old, new, 1)
              product_spec.write_text(text)
          elif new not in text:
              raise SystemExit('monthly-maximum contract text not found')
          PY

          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name "OpenAI"
          git config user.email "noreply@openai.com"
          git commit -m "Materialize audited PR 1446 candidate"

          git archive --format=tar.gz \
            --output=/tmp/murph-pr1446-candidate.tar.gz \
            HEAD
          git archive --format=tar.gz \
            --output=/tmp/murph-current-main.tar.gz \
            origin/main
          git diff --binary origin/main...HEAD > /tmp/pr1446-candidate.patch
          git diff --stat origin/main...HEAD > /tmp/pr1446-candidate.stat
          git diff --name-status origin/main...HEAD > /tmp/pr1446-candidate.files
          git rev-parse origin/main > /tmp/pr1446-current-main.sha
          git rev-parse HEAD > /tmp/pr1446-candidate.sha
          sha256sum \
            /tmp/murph-pr1446-candidate.tar.gz \
            /tmp/murph-current-main.tar.gz \
            /tmp/pr1446-final.patch \
            /tmp/pr1446-candidate.patch \
            /tmp/pr1446-candidate.stat \
            /tmp/pr1446-candidate.files \
            > /tmp/pr1446-audit-SHA256SUMS

      - name: Upload audited candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr1446-audited-candidate
          path: |
            /tmp/murph-pr1446-candidate.tar.gz
            /tmp/murph-current-main.tar.gz
            /tmp/pr1446-final.patch
            /tmp/pr1446-candidate.patch
            /tmp/pr1446-candidate.stat
            /tmp/pr1446-candidate.files
            /tmp/pr1446-current-main.sha
            /tmp/pr1446-candidate.sha
            /tmp/pr1446-audit-SHA256SUMS
          retention-days: 1
          if-no-files-found: error
