name: Export PR 1539 source

on:
  push:
    branches:
      - agent/pr1539-source-export
    paths:
      - .github/workflows/agent-pr1539-source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Archive tracked source
        shell: bash
        run: git archive --format=tar.gz --output=pr1539-source.tar.gz HEAD
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: pr1539-source
          path: pr1539-source.tar.gz
          if-no-files-found: error
          retention-days: 1
