name: Agent image continuation rewrite

on:
  push:
    branches:
      - agent/physical-note-return-address-continuation

permissions:
  contents: write

concurrency:
  group: agent-image-continuation-rewrite
  cancel-in-progress: true

jobs:
  rewrite:
    if: contains(github.event.head_commit.message, '[agent-rewrite-image-continuation]')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Rewrite and publish branch
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          git clone --depth 1 --filter=blob:none --sparse --branch "${GITHUB_REF_NAME}" --single-branch https://github.com/cobuildwithus/murph.git work
          cd work
          git sparse-checkout set .github/workflows scripts packages/assistant-engine
          node scripts/agent-rewrite-image-continuation.mjs
          rm .github/workflows/agent-rewrite-image-continuation.yml
          rm scripts/agent-rewrite-image-continuation.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Keep image generation in the active assistant turn"
          git push origin "HEAD:${GITHUB_REF_NAME}"
