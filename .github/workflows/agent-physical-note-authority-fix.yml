name: Agent physical-note authority fix

on:
  push:
    branches: [agent/physical-notes]
    paths:
      - .github/workflows/agent-physical-note-authority-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/physical-notes

      - name: Bind later group approval to its exact input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('packages/assistant-engine/src/assistant-codex/dynamic-tools.ts')
          text = path.read_text()

          old_import = '''  createPhysicalNoteRequestKey,
            MURPH_SEND_PHYSICAL_NOTE_TOOL,
            readPhysicalNoteDynamicToolRequest,
            type PhysicalNoteDynamicToolRequest,
          } from './dynamic-tools/physical-notes.js'
          '''
          new_import = '''  createPhysicalNoteRequestKey,
            MURPH_SEND_PHYSICAL_NOTE_TOOL,
            readPhysicalNoteDynamicToolRequest,
            resolvePhysicalNoteExplicitOriginInputId,
            type PhysicalNoteDynamicToolRequest,
          } from './dynamic-tools/physical-notes.js'
          '''
          if old_import not in text:
              raise SystemExit('physical-note import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_origin = '''        const userActionScope = hasExplicitArtwork
                    ? hostedToolContext.currentUserActionScope?.() ?? null
                    : null
                  originAssistantInputId = trustedCompletion?.originAssistantInputId
                    ?? userActionScope?.acceptedInputIds.at(-1)
                    ?? null
          '''
          new_origin = '''        const userActionScope = hasExplicitArtwork
                    ? hostedToolContext.currentUserActionScope?.() ?? null
                    : null
                  const explicitOriginAssistantInputId = userActionScope
                    ? resolvePhysicalNoteExplicitOriginInputId({
                        acceptedInputIds: userActionScope.acceptedInputIds,
                        conversationScope: userActionScope.conversationScope,
                        ...(input.request.messageRef
                          ? { messageRef: input.request.messageRef }
                          : {}),
                      })
                    : null
                  originAssistantInputId = trustedCompletion?.originAssistantInputId
                    ?? explicitOriginAssistantInputId
                    ?? null
          '''
          if old_origin not in text:
              raise SystemExit('physical-note origin anchor not found')
          text = text.replace(old_origin, new_origin, 1)

          old_error = '''              ? 'sending previously previewed physical-note artwork requires fresh user input and the exact trusted generated-image ref and SHA-256'
          '''
          new_error = '''              ? 'sending previously previewed physical-note artwork requires fresh user input, the exact trusted generated-image ref and SHA-256, and in groups the exact approving Message ref'
          '''
          if old_error not in text:
              raise SystemExit('physical-note authority error anchor not found')
          path.write_text(text.replace(old_error, new_error, 1))
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/agent-physical-note-authority-fix.yml
          git add packages/assistant-engine/src/assistant-codex/dynamic-tools.ts
          git diff --cached --check
          git commit -m 'fix: bind group note approval to exact input [physical-note-authority-applied]'
          git push origin HEAD:agent/physical-notes
