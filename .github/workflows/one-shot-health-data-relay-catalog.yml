name: One-shot health data relay catalog

on:
  push:
    branches:
      - agent/health-data-relay-catalog
    paths:
      - .github/workflows/one-shot-health-data-relay-catalog.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-health-data-relay-catalog-v3]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: agent/health-data-relay-catalog

      - name: Apply relay catalog
        shell: python
        run: |
          from pathlib import Path
          
          def replace_exact(label: str, path: str, old: str, new: str, expected: int = 1) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: {path}: expected {expected} exact matches, found {count}")
              target.write_text(text.replace(old, new, expected))
          
          replace_exact('replacement-0', 'apps/web/app/(dashboard)/connect/connect-page-content.tsx', 'import { ConnectSourcesGrid } from "./connect-page-client";\nimport { sortConnectSourcesByConnectionState } from "./connect-source-order";\n', 'import { ConnectSourcesGrid } from "./connect-page-client";\nimport {\n  HEALTH_DATA_RELAY_SOURCE_IDS,\n  HEALTH_DATA_RELAY_SOURCE_UI,\n} from "./health-data-relay-sources";\nimport { sortConnectSourcesByConnectionState } from "./connect-source-order";\n', 1)
          
          replace_exact('replacement-1', 'apps/web/app/(dashboard)/connect/connect-page-content.tsx', 'const MURPH_IOS_APP_STORE_URL =\n  "https://apps.apple.com/us/app/murph-ai/id6786145859";\nconst MURPH_ANDROID_PLAY_STORE_URL =\n  "https://play.google.com/store/apps/details?id=ai.withmurph.app";\nconst DISPLAY_ONLY_CONNECT_SOURCE_IDS = new Set<string>([\n  "apple-health",\n  "coros",\n  "huawei-health",\n  "mobvoi-health",\n  "ringconn",\n  "suunto",\n  "xiaomi-mi-fitness",\n  "zepp",\n]);\n', 'const MURPH_IOS_APP_STORE_URL =\n  "https://apps.apple.com/us/app/murph-ai/id6786145859";\nconst DISPLAY_ONLY_CONNECT_SOURCE_IDS = new Set<string>([\n  "apple-health",\n  "coros",\n  "huawei-health",\n  "ringconn",\n  "suunto",\n  "xiaomi-mi-fitness",\n  "zepp",\n  ...HEALTH_DATA_RELAY_SOURCE_IDS,\n]);\n', 1)
          
          replace_exact('replacement-2', 'apps/web/app/(dashboard)/connect/connect-page-content.tsx', '  "mobvoi-health": {\n    description:\n      "TicWatch sleep, activity, heart rate, and workouts through Android Health Connect.",\n    logo: logoAsset(\n      "wearable-relay.svg",\n      "h-auto max-h-7 w-auto max-w-[8rem] object-contain",\n      64,\n      40,\n    ),\n    name: "Mobvoi / TicWatch",\n    unavailableActionLabel: "Download app",\n    unavailableActionUrl: MURPH_ANDROID_PLAY_STORE_URL,\n    unavailableMessage:\n      "In Mobvoi Health, turn on Google Fit sharing, then allow those categories in Health Connect before opening Murph on Android.",\n  },\n', '  ...HEALTH_DATA_RELAY_SOURCE_UI,\n', 1)
          
          replace_exact('replacement-3', 'apps/web/app/(dashboard)/connect/connect-page-content.tsx', '  "samsung-health": {\n    description: "Phone and watch activity, sleep, and heart rate.",\n    logo: logoAsset("samsung-health.png"),\n    name: "Samsung Health",\n  },\n', '', 1)
          
          replace_exact('replacement-4', 'packages/device-syncd/src/config/connect-routes.ts', '  {\n    connectSourceId: "mobvoi-health",\n    label: "Mobvoi / TicWatch",\n    routes: [\n      unavailableRoute(\n        "Mobvoi and TicWatch devices sync supported data through Android Health Connect in the Murph Android app.",\n      ),\n    ],\n  },\n  {\n    connectSourceId: "health-connect",\n    label: "Health Connect",\n    routes: [unavailableRoute("Health Connect is a mobile/local device flow, not hosted Junction Link.")],\n  },\n', '  {\n    connectSourceId: "mobvoi-health",\n    label: "Mobvoi / TicWatch",\n    routes: [\n      unavailableRoute(\n        "Mobvoi and TicWatch devices sync supported data through Android Health Connect in the Murph Android app.",\n      ),\n    ],\n  },\n  {\n    connectSourceId: "wyze-scale",\n    label: "Wyze Scale",\n    routes: [\n      unavailableRoute(\n        "Wyze Scale data syncs through Apple Health in the Murph iOS app.",\n      ),\n    ],\n  },\n  {\n    connectSourceId: "eufy-life",\n    label: "Eufy Smart Scale / eufyLife",\n    routes: [\n      unavailableRoute(\n        "Eufy Smart Scale and eufyLife data sync through Apple Health in the Murph iOS app.",\n      ),\n    ],\n  },\n  {\n    connectSourceId: "vesync-etekcity",\n    label: "VeSync / Etekcity",\n    routes: [\n      unavailableRoute(\n        "VeSync and Etekcity scale data syncs through Apple Health in the Murph iOS app.",\n      ),\n    ],\n  },\n  {\n    connectSourceId: "ad-heart-track",\n    label: "A&D Heart Track",\n    routes: [\n      unavailableRoute(\n        "A&D Heart Track data syncs through Apple Health in the Murph iOS app.",\n      ),\n    ],\n  },\n  {\n    connectSourceId: "microlife-connected-health",\n    label: "Microlife Connected Health+",\n    routes: [\n      unavailableRoute(\n        "Microlife Connected Health+ data syncs through Apple Health in the Murph iOS app.",\n      ),\n    ],\n  },\n  {\n    connectSourceId: "health-connect",\n    label: "Health Connect",\n    routes: [unavailableRoute("Health Connect is a mobile/local device flow, not hosted Junction Link.")],\n  },\n', 1)
          
          replace_exact('replacement-5', 'apps/web/app/(dashboard)/connect/connect-source-order.ts', '  "apple-health",\n  "samsung-health",\n  "garmin",\n', '  "apple-health",\n  "health-connect",\n  "samsung-health",\n  "garmin",\n', 1)
          
          replace_exact('replacement-6', 'apps/web/app/(dashboard)/connect/connect-source-order.ts', '  "withings",\n  "oura",\n', '  "withings",\n  "wyze-scale",\n  "eufy-life",\n  "vesync-etekcity",\n  "ad-heart-track",\n  "microlife-connected-health",\n  "oura",\n', 1)
          
          replace_exact('replacement-7', 'apps/web/app/design/connect-source-card-study.tsx', 'import { SourceCard } from "@/app/(dashboard)/connect/connect-source-card";\nimport { ConnectDisconnectDialog } from "@/app/(dashboard)/connect/connect-page-dialogs";\n', 'import { SourceCard } from "@/app/(dashboard)/connect/connect-source-card";\nimport { ConnectDisconnectDialog } from "@/app/(dashboard)/connect/connect-page-dialogs";\nimport { listHealthDataRelayConnectSources } from "@/app/(dashboard)/connect/health-data-relay-sources";\n', 1)
          
          replace_exact('replacement-8', 'apps/web/app/design/connect-source-card-study.tsx', 'const MOBVOI_CONNECT_SOURCE: ConnectSource = {\n  description:\n    "TicWatch sleep, activity, heart rate, and workouts through Android Health Connect.",\n  id: "mobvoi-health",\n  logo: {\n    className: "h-auto max-h-8 w-auto max-w-[8rem] object-contain",\n    height: 40,\n    src: "/brand-logos/connect/wearable-relay.svg",\n    width: 64,\n  },\n  name: "Mobvoi / TicWatch",\n  unavailableActionLabel: "Download app",\n  unavailableActionUrl:\n    "https://play.google.com/store/apps/details?id=ai.withmurph.app",\n  unavailableMessage:\n    "In Mobvoi Health, turn on Google Fit sharing, then allow those categories in Health Connect before opening Murph on Android.",\n};\n\n', 'const HEALTH_DATA_RELAY_CONNECT_SOURCES =\n  listHealthDataRelayConnectSources();\n\n', 1)
          
          replace_exact('replacement-9', 'apps/web/app/design/connect-source-card-study.tsx', '  {\n    authenticated: true,\n    errorMessage: null,\n    source: MOBVOI_CONNECT_SOURCE,\n  },\n', '  ...HEALTH_DATA_RELAY_CONNECT_SOURCES.map((source) => ({\n    authenticated: true,\n    errorMessage: null,\n    source,\n  })),\n', 1)
          
          replace_exact('replacement-10', 'apps/web/test/connect-source-and-experiment-card-routes.test.tsx', '  const displayOnlySourceIds = new Set([\n    "apple-health",\n    "coros",\n    "huawei-health",\n    "mobvoi-health",\n    "ringconn",\n    "suunto",\n    "xiaomi-mi-fitness",\n    "zepp",\n  ]);\n', '  const displayOnlySourceIds = new Set([\n    "apple-health",\n    "coros",\n    "huawei-health",\n    "health-connect",\n    "samsung-health",\n    "mobvoi-health",\n    "wyze-scale",\n    "eufy-life",\n    "vesync-etekcity",\n    "ad-heart-track",\n    "microlife-connected-health",\n    "ringconn",\n    "suunto",\n    "xiaomi-mi-fitness",\n    "zepp",\n  ]);\n', 1)
          
          replace_exact('replacement-11', 'packages/assistant-engine/src/assistant/system-prompt.ts', "- Mobvoi/TicWatch: turn on Google Fit sharing in Mobvoi Health, enable Google Fit's Health Connect sync for the wanted categories, then open Murph on Android and connect Health Connect.\n- Apple Health and Health Connect relay paths have no direct cloud access or guaranteed history backfill. Murph receives only categories and history written into the relay.\n", "- Mobvoi/TicWatch: turn on Google Fit sharing in Mobvoi Health, enable Google Fit's Health Connect sync for the wanted categories, then open Murph on Android and connect Health Connect.\n- Samsung Health: turn on Health Connect sharing for the wanted categories, then open Murph on Android and connect Health Connect.\n- Wyze Scale, Eufy/eufyLife, and VeSync/Etekcity: enable Apple Health sharing in the vendor app, then open Murph on iPhone and connect Apple Health.\n- A&D Heart Track and Microlife Connected Health+: enable Apple Health sharing in the vendor app, then open Murph on iPhone and connect Apple Health.\n- Apple Health and Health Connect relay paths have no direct cloud access or guaranteed history backfill. Murph receives only categories and history written into the relay.\n", 1)
          
          replace_exact('replacement-12', 'packages/assistant-engine/test/model-behavior.test.ts', "    expect(prompt).toContain(\n      'Mobvoi/TicWatch: turn on Google Fit sharing in Mobvoi Health',\n    )\n    expect(prompt).toContain('Starting Murph: if asked how to begin')\n", "    expect(prompt).toContain(\n      'Mobvoi/TicWatch: turn on Google Fit sharing in Mobvoi Health',\n    )\n    expect(prompt).toContain(\n      'Samsung Health: turn on Health Connect sharing for the wanted categories',\n    )\n    expect(prompt).toContain(\n      'Wyze Scale, Eufy/eufyLife, and VeSync/Etekcity',\n    )\n    expect(prompt).toContain(\n      'A&D Heart Track and Microlife Connected Health+',\n    )\n    expect(prompt).toContain('Starting Murph: if asked how to begin')\n", 1)
          
          replace_exact('replacement-13', 'apps/web/test/connect-page.test.ts', '    {\n      assetPath: "/brand-logos/connect/wearable-relay.svg",\n      description:\n        "TicWatch sleep, activity, heart rate, and workouts through Android Health Connect.",\n      name: "Mobvoi / TicWatch",\n    },\n    {\n      assetPath: "/brand-logos/connect/whoop.svg",\n', '    {\n      assetPath: "/brand-logos/connect/wearable-relay.svg",\n      description:\n        "TicWatch sleep, activity, heart rate, and workouts through Android Health Connect.",\n      name: "Mobvoi / TicWatch",\n    },\n    {\n      assetPath: "/brand-logos/connect/wearable-relay.svg",\n      description:\n        "Android health apps, smart scales, blood pressure monitors, and supported records through Health Connect.",\n      name: "Health Connect",\n    },\n    {\n      assetPath: "/brand-logos/connect/wearable-relay.svg",\n      description:\n        "Samsung Health activity, sleep, weight, body composition, and blood pressure through Health Connect.",\n      name: "Samsung Health",\n    },\n    {\n      assetPath: "/brand-logos/connect/wearable-relay.svg",\n      description:\n        "Wyze Scale weight and body-composition trends through Apple Health.",\n      name: "Wyze Scale",\n    },\n    {\n      assetPath: "/brand-logos/connect/wearable-relay.svg",\n      description:\n        "Eufy Smart Scale and eufyLife weight and body-composition trends through Apple Health.",\n      name: "Eufy Smart Scale / eufyLife",\n    },\n    {\n      assetPath: "/brand-logos/connect/wearable-relay.svg",\n      description:\n        "Etekcity and VeSync smart-scale weight and body-composition trends through Apple Health.",\n      name: "VeSync / Etekcity",\n    },\n    {\n      assetPath: "/brand-logos/connect/wearable-relay.svg",\n      description:\n        "A&D Heart Track blood pressure, pulse, and supported weight data through Apple Health.",\n      name: "A&D Heart Track",\n    },\n    {\n      assetPath: "/brand-logos/connect/wearable-relay.svg",\n      description:\n        "Microlife Connected Health+ blood pressure and pulse readings through Apple Health.",\n      name: "Microlife Connected Health+",\n    },\n    {\n      assetPath: "/brand-logos/connect/whoop.svg",\n', 1)
          
          replace_exact('replacement-14', 'apps/web/test/connect-page.test.ts', '  assert.match(markup, />34 of 34 sources</);\n', '  assert.match(markup, />41 of 41 sources</);\n', 1)
          
          replace_exact('replacement-15', 'apps/web/test/connect-page.test.ts', '  assert.equal(sources.length, 34);\n', '  assert.equal(sources.length, 41);\n', 1)
          
          replace_exact('replacement-16', 'apps/web/test/connect-page.test.ts', '  assert.equal(\n    markup.match(/>Not available<\/button>/gu)?.length,\n    sources.length - 8,\n  );\n', '  assert.equal(\n    markup.match(/>Not available<\/button>/gu)?.length,\n    sources.length - 15,\n  );\n', 1)
          
          replace_exact('replacement-17', 'apps/web/test/connect-page.test.ts', '  assert.match(\n    markup,\n    /In Mobvoi Health, turn on Google Fit sharing, then allow those categories in Health Connect before opening Murph on Android\./,\n  );\n  assert.match(markup, /aria-label="Oura connection is not available yet"/);\n', '  assert.match(\n    markup,\n    /In Mobvoi Health, turn on Google Fit sharing, then allow those categories in Health Connect before opening Murph on Android\./,\n  );\n  for (const relayName of [\n    "Health Connect",\n    "Samsung Health",\n    "Mobvoi / TicWatch",\n    "Wyze Scale",\n    "Eufy Smart Scale / eufyLife",\n    "VeSync / Etekcity",\n    "A&D Heart Track",\n    "Microlife Connected Health+",\n  ]) {\n    assert.match(\n      markup,\n      new RegExp(\n        `aria-label="Download app for ${escapeRegExp(relayName)}"`,\n        "u",\n      ),\n    );\n  }\n  assert.equal(markup.match(/>Download app<\/a>/gu)?.length, 9);\n  assert.match(markup, /aria-label="Oura connection is not available yet"/);\n', 1)
          
          replace_exact('replacement-18', 'apps/web/test/connect-page.test.ts', '  assert.doesNotMatch(markup, />Health Connect</u);\n  assert.doesNotMatch(markup, />Samsung Health</u);\n', '  assert.match(markup, />Health Connect</u);\n  assert.match(markup, />Samsung Health</u);\n', 1)
          
          replace_exact('replacement-19', 'apps/web/test/connect-page.test.ts', '  assert.ok(\n    sourceHeadingIndex(markup, "Apple Health") <\n      sourceHeadingIndex(markup, "Garmin"),\n  );\n', '  assert.ok(\n    sourceHeadingIndex(markup, "Apple Health") <\n      sourceHeadingIndex(markup, "Health Connect"),\n  );\n  assert.ok(\n    sourceHeadingIndex(markup, "Health Connect") <\n      sourceHeadingIndex(markup, "Samsung Health"),\n  );\n  assert.ok(\n    sourceHeadingIndex(markup, "Samsung Health") <\n      sourceHeadingIndex(markup, "Garmin"),\n  );\n', 1)
          
          replace_exact('replacement-20', 'apps/web/test/connect-page.test.ts', '  assert.ok(\n    sourceHeadingIndex(markup, "Withings") < sourceHeadingIndex(markup, "Oura"),\n  );\n', '  assert.ok(\n    sourceHeadingIndex(markup, "Withings") <\n      sourceHeadingIndex(markup, "Wyze Scale"),\n  );\n  assert.ok(\n    sourceHeadingIndex(markup, "Wyze Scale") <\n      sourceHeadingIndex(markup, "Eufy Smart Scale / eufyLife"),\n  );\n  assert.ok(\n    sourceHeadingIndex(markup, "Eufy Smart Scale / eufyLife") <\n      sourceHeadingIndex(markup, "VeSync / Etekcity"),\n  );\n  assert.ok(\n    sourceHeadingIndex(markup, "VeSync / Etekcity") <\n      sourceHeadingIndex(markup, "A&D Heart Track"),\n  );\n  assert.ok(\n    sourceHeadingIndex(markup, "A&D Heart Track") <\n      sourceHeadingIndex(markup, "Microlife Connected Health+"),\n  );\n  assert.ok(\n    sourceHeadingIndex(markup, "Microlife Connected Health+") <\n      sourceHeadingIndex(markup, "Oura"),\n  );\n', 1)
          
          Path('apps/web/app/(dashboard)/connect/health-data-relay-sources.ts').write_text('import type { ConnectSource } from "./connect-page-types";\n\ntype ConnectSourceUi = Omit<ConnectSource, "id">;\ntype RelayPlatform = "android" | "ios";\n\nconst MURPH_IOS_APP_STORE_URL =\n  "https://apps.apple.com/us/app/murph-ai/id6786145859";\nconst MURPH_ANDROID_PLAY_STORE_URL =\n  "https://play.google.com/store/apps/details?id=ai.withmurph.app";\nconst RELAY_LOGO = {\n  className: "h-auto max-h-7 w-auto max-w-[8rem] object-contain",\n  height: 40,\n  src: "/brand-logos/connect/wearable-relay.svg",\n  width: 64,\n} as const;\n\nexport const HEALTH_DATA_RELAY_SOURCE_IDS = [\n  "health-connect",\n  "samsung-health",\n  "mobvoi-health",\n  "wyze-scale",\n  "eufy-life",\n  "vesync-etekcity",\n  "ad-heart-track",\n  "microlife-connected-health",\n] as const;\n\ntype HealthDataRelaySourceId =\n  (typeof HEALTH_DATA_RELAY_SOURCE_IDS)[number];\n\nfunction relaySourceUi(input: {\n  description: string;\n  name: string;\n  platform: RelayPlatform;\n  setup: string;\n}): ConnectSourceUi {\n  return {\n    description: input.description,\n    logo: { ...RELAY_LOGO },\n    name: input.name,\n    unavailableActionLabel: "Download app",\n    unavailableActionUrl:\n      input.platform === "android"\n        ? MURPH_ANDROID_PLAY_STORE_URL\n        : MURPH_IOS_APP_STORE_URL,\n    unavailableMessage: input.setup,\n  };\n}\n\nexport const HEALTH_DATA_RELAY_SOURCE_UI = {\n  "health-connect": relaySourceUi({\n    description:\n      "Android health apps, smart scales, blood pressure monitors, and supported records through Health Connect.",\n    name: "Health Connect",\n    platform: "android",\n    setup:\n      "Connect the device\'s own app to Health Connect, then open Murph on Android and approve the categories you want to share.",\n  }),\n  "samsung-health": relaySourceUi({\n    description:\n      "Samsung Health activity, sleep, weight, body composition, and blood pressure through Health Connect.",\n    name: "Samsung Health",\n    platform: "android",\n    setup:\n      "In Samsung Health, turn on Health Connect sharing, then open Murph on Android and approve the categories you want to share.",\n  }),\n  "mobvoi-health": relaySourceUi({\n    description:\n      "TicWatch sleep, activity, heart rate, and workouts through Android Health Connect.",\n    name: "Mobvoi / TicWatch",\n    platform: "android",\n    setup:\n      "In Mobvoi Health, turn on Google Fit sharing, then allow those categories in Health Connect before opening Murph on Android.",\n  }),\n  "wyze-scale": relaySourceUi({\n    description:\n      "Wyze Scale weight and body-composition trends through Apple Health.",\n    name: "Wyze Scale",\n    platform: "ios",\n    setup:\n      "In the Wyze app, enable Apple Health sharing, then open Murph on iPhone and connect Apple Health.",\n  }),\n  "eufy-life": relaySourceUi({\n    description:\n      "Eufy Smart Scale and eufyLife weight and body-composition trends through Apple Health.",\n    name: "Eufy Smart Scale / eufyLife",\n    platform: "ios",\n    setup:\n      "In eufyLife, enable Apple Health sharing, then open Murph on iPhone and connect Apple Health.",\n  }),\n  "vesync-etekcity": relaySourceUi({\n    description:\n      "Etekcity and VeSync smart-scale weight and body-composition trends through Apple Health.",\n    name: "VeSync / Etekcity",\n    platform: "ios",\n    setup:\n      "In VeSync, enable Apple Health sharing for the scale, then open Murph on iPhone and connect Apple Health.",\n  }),\n  "ad-heart-track": relaySourceUi({\n    description:\n      "A&D Heart Track blood pressure, pulse, and supported weight data through Apple Health.",\n    name: "A&D Heart Track",\n    platform: "ios",\n    setup:\n      "In Heart Track, enable Apple Health sharing, then open Murph on iPhone and connect Apple Health.",\n  }),\n  "microlife-connected-health": relaySourceUi({\n    description:\n      "Microlife Connected Health+ blood pressure and pulse readings through Apple Health.",\n    name: "Microlife Connected Health+",\n    platform: "ios",\n    setup:\n      "In Connected Health+, enable Apple Health sharing, then open Murph on iPhone and connect Apple Health.",\n  }),\n} satisfies Record<HealthDataRelaySourceId, ConnectSourceUi>;\n\nexport function listHealthDataRelayConnectSources(): ConnectSource[] {\n  return HEALTH_DATA_RELAY_SOURCE_IDS.map((id) => ({\n    id,\n    ...HEALTH_DATA_RELAY_SOURCE_UI[id],\n  }));\n}\n')
          
          Path('apps/web/test/health-data-relay-sources.test.ts').write_text('import { describe, expect, it } from "vitest";\n\nimport {\n  HEALTH_DATA_RELAY_SOURCE_IDS,\n  HEALTH_DATA_RELAY_SOURCE_UI,\n  listHealthDataRelayConnectSources,\n} from "../app/(dashboard)/connect/health-data-relay-sources";\n\ndescribe("health data relay source catalog", () => {\n  it("keeps every vendor setup-only and points to the matching Murph app", () => {\n    expect(HEALTH_DATA_RELAY_SOURCE_IDS).toEqual([\n      "health-connect",\n      "samsung-health",\n      "mobvoi-health",\n      "wyze-scale",\n      "eufy-life",\n      "vesync-etekcity",\n      "ad-heart-track",\n      "microlife-connected-health",\n    ]);\n\n    const sources = listHealthDataRelayConnectSources();\n    expect(sources).toHaveLength(HEALTH_DATA_RELAY_SOURCE_IDS.length);\n\n    for (const source of sources) {\n      expect(source.connectTarget).toBeUndefined();\n      expect(source.connected).toBeUndefined();\n      expect(source.setupGuideId).toBeUndefined();\n      expect(source.unavailableActionLabel).toBe("Download app");\n      expect(source.unavailableMessage).toBeTruthy();\n      expect(source.logo.src).toBe(\n        "/brand-logos/connect/wearable-relay.svg",\n      );\n    }\n\n    for (const id of [\n      "health-connect",\n      "samsung-health",\n      "mobvoi-health",\n    ] as const) {\n      expect(HEALTH_DATA_RELAY_SOURCE_UI[id].unavailableActionUrl).toBe(\n        "https://play.google.com/store/apps/details?id=ai.withmurph.app",\n      );\n    }\n\n    for (const id of [\n      "wyze-scale",\n      "eufy-life",\n      "vesync-etekcity",\n      "ad-heart-track",\n      "microlife-connected-health",\n    ] as const) {\n      expect(HEALTH_DATA_RELAY_SOURCE_UI[id].unavailableActionUrl).toBe(\n        "https://apps.apple.com/us/app/murph-ai/id6786145859",\n      );\n    }\n  });\n});\n')
          
          Path('packages/device-syncd/test/connect-relay-sources.test.ts').write_text('import { describe, expect, it } from "vitest";\n\nimport { DEVICE_CONNECT_SOURCES } from "../src/config/connect-routes.ts";\n\nconst IOS_RELAY_SOURCE_IDS = [\n  "wyze-scale",\n  "eufy-life",\n  "vesync-etekcity",\n  "ad-heart-track",\n  "microlife-connected-health",\n] as const;\n\ndescribe("health data relay connect routes", () => {\n  it("keeps vendor relays out of hosted provider authorization", () => {\n    for (const sourceId of IOS_RELAY_SOURCE_IDS) {\n      const source = DEVICE_CONNECT_SOURCES.find(\n        (candidate) => candidate.connectSourceId === sourceId,\n      );\n      expect(source?.routes).toHaveLength(1);\n      const route = source?.routes[0];\n      expect(route?.kind).toBe("unavailable");\n      if (!route || route.kind !== "unavailable") {\n        throw new Error(`${sourceId} should remain a setup-only relay`);\n      }\n      expect(route.reason).toContain("Apple Health");\n    }\n\n    const healthConnect = DEVICE_CONNECT_SOURCES.find(\n      (candidate) => candidate.connectSourceId === "health-connect",\n    );\n    expect(healthConnect?.routes).toHaveLength(1);\n    expect(healthConnect?.routes[0]).toMatchObject({\n      kind: "unavailable",\n    });\n\n    const samsung = DEVICE_CONNECT_SOURCES.find(\n      (candidate) => candidate.connectSourceId === "samsung-health",\n    );\n    expect(samsung?.routes).toEqual([\n      {\n        kind: "junction_sdk",\n        sourceProviderSlug: "samsung_health",\n      },\n    ]);\n  });\n});\n')
          
          Path('apps/web/e2e/health-data-relay-cards-responsive.spec.ts').write_text('import { expect, test } from "@playwright/test";\n\nconst RELAY_SOURCE_NAMES = [\n  "Health Connect",\n  "Samsung Health",\n  "Mobvoi / TicWatch",\n  "Wyze Scale",\n  "Eufy Smart Scale / eufyLife",\n  "VeSync / Etekcity",\n  "A&D Heart Track",\n  "Microlife Connected Health+",\n] as const;\nconst ANDROID_RELAY_SOURCE_NAMES = new Set<string>([\n  "Health Connect",\n  "Samsung Health",\n  "Mobvoi / TicWatch",\n]);\nconst PROOF_VIEWPORTS = [\n  { name: "mobile", width: 390 },\n  { name: "desktop", width: 1440 },\n] as const;\nconst OVERFLOW_TOLERANCE_PX = 1;\n\nfunction isLoopbackUrl(rawUrl: string): boolean {\n  try {\n    const { hostname } = new URL(rawUrl);\n    return (\n      hostname === "127.0.0.1"\n      || hostname === "localhost"\n      || hostname === "[::1]"\n    );\n  } catch {\n    return false;\n  }\n}\n\ntest.describe("health data relay source catalog", () => {\n  test.use({ deviceScaleFactor: 2 });\n\n  test("every relay card stays complete and contained", async ({ page }, testInfo) => {\n    test.setTimeout(180_000);\n\n    await page.route("**/*", (route) => {\n      if (isLoopbackUrl(route.request().url())) {\n        route.continue();\n      } else {\n        route.abort();\n      }\n    });\n    await page.addInitScript(() => {\n      const style = document.createElement("style");\n      style.textContent =\n        "*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}";\n      (document.head ?? document.documentElement).appendChild(style);\n    });\n\n    for (const viewport of PROOF_VIEWPORTS) {\n      await page.setViewportSize({ width: viewport.width, height: 1200 });\n      const response = await page.goto(\n        `/design?tab=sections&proofViewport=${viewport.name}#connect-source-card-actions`,\n        { waitUntil: "load" },\n      );\n      expect(\n        response?.status(),\n        `/design should respond 200 at ${viewport.width}px`,\n      ).toBe(200);\n      await page.evaluate(async () => {\n        await document.fonts?.ready;\n        await new Promise((resolve) =>\n          requestAnimationFrame(() => requestAnimationFrame(resolve)),\n        );\n      });\n\n      const study = page.locator(\n        \'[data-design-study="connect-source-card-actions"]\',\n      );\n\n      for (const sourceName of RELAY_SOURCE_NAMES) {\n        const heading = study.getByRole("heading", {\n          exact: true,\n          name: sourceName,\n        });\n        const card = heading.locator("xpath=../../..");\n        const downloadLink = card.locator(\n          `a[aria-label="Download app for ${sourceName}"]`,\n        );\n\n        await expect(heading).toHaveCount(1);\n        await expect(card).toBeVisible();\n        await expect(downloadLink).toHaveAttribute(\n          "href",\n          ANDROID_RELAY_SOURCE_NAMES.has(sourceName)\n            ? "https://play.google.com/store/apps/details?id=ai.withmurph.app"\n            : "https://apps.apple.com/us/app/murph-ai/id6786145859",\n        );\n\n        const overflowPx = await card.evaluate(\n          (element) => element.scrollWidth - element.clientWidth,\n        );\n        expect(\n          overflowPx,\n          `${sourceName} should not overflow at ${viewport.width}px`,\n        ).toBeLessThanOrEqual(OVERFLOW_TOLERANCE_PX);\n      }\n\n      const screenshotPath = testInfo.outputPath(\n        `health-data-relay-catalog-${viewport.name}.png`,\n      );\n      await study.screenshot({ path: screenshotPath });\n      await testInfo.attach(`health-data-relay-catalog-${viewport.name}`, {\n        contentType: "image/png",\n        path: screenshotPath,\n      });\n    }\n  });\n});\n')
          
          Path('.github/workflows/one-shot-health-data-relay-catalog.yml').unlink()

