name: Native iOS Hosted E2E

on:
  schedule:
    - cron: "17 */6 * * *"

# This trusted default-branch controller spends native-runner capacity only
# when the latest completed schedule is not a success for current protected main.
# A failed canary remains eligible at the next slot; an explicit workflow rerun
# also retries the same revision immediately. Source pins live in protected main.
permissions:
  actions: read
  contents: read

concurrency:
  group: native-ios-production-canary
  cancel-in-progress: false

jobs:
  select-main:
    name: Select changed protected main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_run: ${{ steps.select.outputs.should_run }}
      web_sha: ${{ steps.select.outputs.web_sha }}
    steps:
      - name: Compare main with the latest completed scheduled outcome
        id: select
        env:
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CURRENT_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Schedule must identify an exact protected-main SHA."; exit 1; }
          previous_sha=""
          previous_conclusion=""
          if [[ "${RUN_ATTEMPT}" == 1 ]]; then
            previous_run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/native-ios-hosted-e2e.yml/runs?event=schedule&status=completed&per_page=1" --jq '.workflow_runs[0] // {}')"
            previous_sha="$(jq -r '.head_sha // ""' <<< "${previous_run}")"
            previous_status="$(jq -r '.status // ""' <<< "${previous_run}")"
            previous_conclusion="$(jq -r '.conclusion // ""' <<< "${previous_run}")"
            if [[ -n "${previous_sha}" ]]; then
              [[ "${previous_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Latest completed native iOS schedule did not expose an exact SHA."; exit 1; }
              [[ "${previous_status}" == completed ]] || { echo "::error::Latest native iOS schedule was not completed."; exit 1; }
              [[ "${previous_conclusion}" =~ ^(action_required|cancelled|failure|neutral|skipped|stale|startup_failure|success|timed_out)$ ]] || { echo "::error::Latest native iOS schedule had an invalid conclusion."; exit 1; }
            elif [[ "${previous_run}" != "{}" ]]; then
              echo "::error::Latest native iOS schedule was malformed."
              exit 1
            fi
          fi
          should_run=true
          if [[ "${RUN_ATTEMPT}" == 1 && "${previous_sha}" == "${CURRENT_SHA}" && "${previous_conclusion}" == success ]]; then
            should_run=false
          fi
          {
            echo "should_run=${should_run}"
            echo "web_sha=${CURRENT_SHA}"
          } >> "${GITHUB_OUTPUT}"
          echo "::notice::native-ios-e2e stage=schedule_admission result=${should_run}"

  production-canary:
    name: Non-destructive production native iOS canary
    needs: select-main
    if: ${{ needs.select-main.outputs.should_run == 'true' }}
    environment: native-ios-production-canary
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ needs.select-main.outputs.web_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install trusted control dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify scheduled SHA is protected-main history
        env:
          DEPLOYED_SHA: ${{ needs.select-main.outputs.web_sha }}
        run: |
          set -euo pipefail
          [[ "${DEPLOYED_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Production canary must identify an exact Git SHA."; exit 1; }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${DEPLOYED_SHA}" origin/main || { echo "::error::Production canary refuses a revision outside main history."; exit 1; }

      - name: Mint private iOS workflow token
        id: ios-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.NATIVE_IOS_E2E_GITHUB_APP_ID }}
          private-key: ${{ secrets.NATIVE_IOS_E2E_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER }}
          repositories: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_NAME }}
          permission-actions: write
          permission-contents: read

      - name: Verify current production alias and dispatch non-destructive canary
        env:
          DEPLOYED_SHA: ${{ needs.select-main.outputs.web_sha }}
          HOSTED_WEB_PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
          HOSTED_WEB_VERCEL_PROJECT_ID: ${{ vars.HOSTED_WEB_VERCEL_PROJECT_ID }}
          HOSTED_WEB_VERCEL_TEAM_ID: ${{ vars.HOSTED_WEB_VERCEL_TEAM_ID }}
          HOSTED_WEB_VERCEL_TOKEN: ${{ secrets.HOSTED_WEB_VERCEL_TOKEN }}
          NATIVE_IOS_E2E_GITHUB_TOKEN: ${{ steps.ios-app-token.outputs.token }}
          NATIVE_IOS_E2E_IOS_REPOSITORY: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER }}/${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_NAME }}
          NATIVE_IOS_E2E_IOS_WORKFLOW: ${{ vars.NATIVE_IOS_E2E_IOS_WORKFLOW }}
          PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/native-ios-hosted-e2e.mjs canary \
            --policy .github/native-hosted-e2e-controller.json \
            --web-sha "${DEPLOYED_SHA}" \
            --web-base-url "${PRODUCTION_BASE_URL}" \
            --correlation-id "murph-production-${DEPLOYED_SHA}-${{ github.run_id }}-${{ github.run_attempt }}"
