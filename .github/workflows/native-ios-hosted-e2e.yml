name: Native iOS Hosted E2E

on:
  workflow_run:
    workflows:
      - Repo Hygiene
    types:
      - completed
  deployment_status:

# The PR run is split deliberately: workflow_run executes this trusted default-
# branch workflow after credential-free Repo Hygiene. It may inspect and deploy
# the exact same-repository PR SHA, but it never checks that SHA out onto the
# secret-bearing runner. The hosted E2E Vercel project is dedicated test
# authority; production Vercel settings are untouched.
permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: native-ios-hosted-e2e-${{ github.event.workflow_run.pull_requests[0].head.sha || github.event.deployment.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  classify-pr:
    name: Select native iOS hosted E2E
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.selection.outputs.base_sha }}
      head_ref: ${{ steps.selection.outputs.head_ref }}
      head_sha: ${{ steps.selection.outputs.head_sha }}
      selected: ${{ steps.selection.outputs.selected }}
      selection_reason: ${{ steps.selection.outputs.selection_reason }}
      trusted: ${{ steps.selection.outputs.trusted }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Resolve current PR and path selection
        id: selection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/native-ios-hosted-e2e-control.mjs resolve-pr
          --pr-number "${{ github.event.workflow_run.pull_requests[0].number }}"
          --expected-head-sha "${{ github.event.workflow_run.pull_requests[0].head.sha }}"

      - name: Mark selected commit pending
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/native-ios-hosted-e2e-control.mjs set-status
          --sha "${{ steps.selection.outputs.head_sha }}"
          --state pending
          --description "Native iOS hosted E2E gate is evaluating this commit."

  pr-live:
    name: Real hosted Web + native iOS lane
    needs:
      - classify-pr
    if: ${{ github.event.workflow_run.conclusion == 'success' && needs.classify-pr.outputs.selected == 'true' && needs.classify-pr.outputs.trusted == 'true' }}
    environment: native-ios-hosted-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: native-ios-hosted-e2e-live
      cancel-in-progress: false
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Revalidate current PR head before live authority
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node scripts/native-ios-hosted-e2e-control.mjs resolve-pr
          --pr-number "${{ github.event.workflow_run.pull_requests[0].number }}"
          --expected-head-sha "${{ needs.classify-pr.outputs.head_sha }}"

      - name: Preflight protected cross-repository configuration
        shell: bash
        env:
          NATIVE_IOS_E2E_GITHUB_APP_ID: ${{ vars.NATIVE_IOS_E2E_GITHUB_APP_ID }}
          NATIVE_IOS_E2E_GITHUB_APP_PRIVATE_KEY: ${{ secrets.NATIVE_IOS_E2E_GITHUB_APP_PRIVATE_KEY }}
          NATIVE_IOS_E2E_IOS_EXPECTED_SHA: ${{ vars.NATIVE_IOS_E2E_IOS_EXPECTED_SHA }}
          NATIVE_IOS_E2E_IOS_REF: ${{ vars.NATIVE_IOS_E2E_IOS_REF }}
          NATIVE_IOS_E2E_IOS_REPOSITORY_NAME: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_NAME }}
          NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER }}
          NATIVE_IOS_E2E_IOS_WORKFLOW: ${{ vars.NATIVE_IOS_E2E_IOS_WORKFLOW }}
          NATIVE_IOS_E2E_VERCEL_CUSTOM_ENVIRONMENT_ID: ${{ vars.NATIVE_IOS_E2E_VERCEL_CUSTOM_ENVIRONMENT_ID }}
          NATIVE_IOS_E2E_VERCEL_GITHUB_REPOSITORY_ID: ${{ vars.NATIVE_IOS_E2E_VERCEL_GITHUB_REPOSITORY_ID }}
          NATIVE_IOS_E2E_VERCEL_PROJECT_ID: ${{ vars.NATIVE_IOS_E2E_VERCEL_PROJECT_ID }}
          NATIVE_IOS_E2E_VERCEL_PROJECT_NAME: ${{ vars.NATIVE_IOS_E2E_VERCEL_PROJECT_NAME }}
          NATIVE_IOS_E2E_VERCEL_TOKEN: ${{ secrets.NATIVE_IOS_E2E_VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          required=(
            NATIVE_IOS_E2E_GITHUB_APP_ID
            NATIVE_IOS_E2E_GITHUB_APP_PRIVATE_KEY
            NATIVE_IOS_E2E_IOS_EXPECTED_SHA
            NATIVE_IOS_E2E_IOS_REF
            NATIVE_IOS_E2E_IOS_REPOSITORY_NAME
            NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER
            NATIVE_IOS_E2E_IOS_WORKFLOW
            NATIVE_IOS_E2E_VERCEL_CUSTOM_ENVIRONMENT_ID
            NATIVE_IOS_E2E_VERCEL_GITHUB_REPOSITORY_ID
            NATIVE_IOS_E2E_VERCEL_PROJECT_ID
            NATIVE_IOS_E2E_VERCEL_PROJECT_NAME
            NATIVE_IOS_E2E_VERCEL_TOKEN
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is required for the protected native iOS hosted E2E lane."
              exit 1
            fi
          done
          if ! [[ "${NATIVE_IOS_E2E_IOS_EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::NATIVE_IOS_E2E_IOS_EXPECTED_SHA must pin the approved private workflow commit."
            exit 1
          fi

      - name: Mint repository-scoped private iOS workflow token
        id: ios-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.NATIVE_IOS_E2E_GITHUB_APP_ID }}
          private-key: ${{ secrets.NATIVE_IOS_E2E_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER }}
          repositories: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_NAME }}
          permission-actions: write
          permission-contents: read

      - name: Deploy exact PR SHA to dedicated hosted E2E Web project
        id: web
        env:
          NATIVE_IOS_E2E_VERCEL_CUSTOM_ENVIRONMENT_ID: ${{ vars.NATIVE_IOS_E2E_VERCEL_CUSTOM_ENVIRONMENT_ID }}
          NATIVE_IOS_E2E_VERCEL_GITHUB_REPOSITORY_ID: ${{ vars.NATIVE_IOS_E2E_VERCEL_GITHUB_REPOSITORY_ID }}
          NATIVE_IOS_E2E_VERCEL_PROJECT_ID: ${{ vars.NATIVE_IOS_E2E_VERCEL_PROJECT_ID }}
          NATIVE_IOS_E2E_VERCEL_PROJECT_NAME: ${{ vars.NATIVE_IOS_E2E_VERCEL_PROJECT_NAME }}
          NATIVE_IOS_E2E_VERCEL_TEAM_ID: ${{ vars.NATIVE_IOS_E2E_VERCEL_TEAM_ID }}
          NATIVE_IOS_E2E_VERCEL_TOKEN: ${{ secrets.NATIVE_IOS_E2E_VERCEL_TOKEN }}
          PR_HEAD_REF: ${{ needs.classify-pr.outputs.head_ref }}
          PR_HEAD_SHA: ${{ needs.classify-pr.outputs.head_sha }}
        run: >-
          node scripts/native-ios-hosted-e2e-control.mjs deploy-preview
          --sha "${PR_HEAD_SHA}"
          --ref "${PR_HEAD_REF}"
          --correlation-id "murph-pr-${PR_HEAD_SHA}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Dispatch and await exact private native iOS workflow
        id: ios
        env:
          NATIVE_IOS_E2E_GITHUB_TOKEN: ${{ steps.ios-app-token.outputs.token }}
          NATIVE_IOS_E2E_IOS_EXPECTED_SHA: ${{ vars.NATIVE_IOS_E2E_IOS_EXPECTED_SHA }}
          NATIVE_IOS_E2E_IOS_REF: ${{ vars.NATIVE_IOS_E2E_IOS_REF }}
          NATIVE_IOS_E2E_IOS_REPOSITORY: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER }}/${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_NAME }}
          NATIVE_IOS_E2E_IOS_WORKFLOW: ${{ vars.NATIVE_IOS_E2E_IOS_WORKFLOW }}
          WEB_BASE_URL: ${{ steps.web.outputs.base_url }}
          WEB_DEPLOYMENT_ID: ${{ steps.web.outputs.deployment_id }}
          WEB_SHA: ${{ needs.classify-pr.outputs.head_sha }}
        run: >-
          node scripts/native-ios-hosted-e2e-control.mjs dispatch-and-wait
          --mode pr
          --web-sha "${WEB_SHA}"
          --web-base-url "${WEB_BASE_URL}"
          --web-deployment-ref "${WEB_DEPLOYMENT_ID}"
          --correlation-id "murph-pr-${WEB_SHA}-${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Retire hosted E2E preview deployment
        if: ${{ always() && steps.web.outputs.deployment_id != '' }}
        env:
          NATIVE_IOS_E2E_VERCEL_TEAM_ID: ${{ vars.NATIVE_IOS_E2E_VERCEL_TEAM_ID }}
          NATIVE_IOS_E2E_VERCEL_TOKEN: ${{ secrets.NATIVE_IOS_E2E_VERCEL_TOKEN }}
        run: >-
          node scripts/native-ios-hosted-e2e-control.mjs delete-preview
          --deployment-id "${{ steps.web.outputs.deployment_id }}"

  pr-required:
    name: Publish native iOS hosted E2E required status
    needs:
      - classify-pr
      - pr-live
    if: ${{ always() && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Publish stable required commit status
        env:
          CLASSIFY_RESULT: ${{ needs.classify-pr.result }}
          GITHUB_TOKEN: ${{ github.token }}
          LIVE_RESULT: ${{ needs.pr-live.result }}
          SELECTED: ${{ needs.classify-pr.outputs.selected }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          STATUS_SHA: ${{ needs.classify-pr.outputs.head_sha || github.event.workflow_run.pull_requests[0].head.sha }}
          TRUSTED: ${{ needs.classify-pr.outputs.trusted }}
        shell: bash
        run: |
          set -euo pipefail
          state=failure
          description="Native iOS hosted E2E control-plane selection failed."

          if [[ "${CLASSIFY_RESULT}" == "success" && "${SOURCE_CONCLUSION}" != "success" ]]; then
            description="Repo Hygiene must pass before native iOS hosted E2E."
          elif [[ "${CLASSIFY_RESULT}" == "success" && "${SELECTED}" != "true" ]]; then
            state=success
            description="PR does not change native auth/control/device-sync owners."
          elif [[ "${CLASSIFY_RESULT}" == "success" && "${TRUSTED}" != "true" ]]; then
            description="Selected PR requires a reviewed same-repository human-authored head."
          elif [[ "${CLASSIFY_RESULT}" == "success" && "${LIVE_RESULT}" == "success" ]]; then
            state=success
            description="Exact hosted Web and private native iOS E2E lane passed."
          elif [[ "${CLASSIFY_RESULT}" == "success" ]]; then
            description="Selected native iOS hosted E2E lane did not pass."
          fi

          node scripts/native-ios-hosted-e2e-control.mjs set-status \
            --sha "${STATUS_SHA}" \
            --state "${state}" \
            --description "${description}"

          if [[ "${state}" != "success" ]]; then
            exit 1
          fi

  production-canary:
    name: Non-destructive production native iOS canary
    if: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment_status.description == 'Deployment has completed' && contains(fromJSON('["Production","production"]'), github.event.deployment.environment) && (github.event.deployment_status.creator.login == 'vercel[bot]' || github.event.deployment.creator.login == 'vercel[bot]') }}
    environment: native-ios-production-canary
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: native-ios-production-canary-live
      cancel-in-progress: false
    steps:
      - name: Checkout trusted default-branch control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify deployed SHA is protected-main history
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "${DEPLOYED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Production deployment must identify an exact Git SHA."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${DEPLOYED_SHA}" origin/main; then
            echo "::error::Production native iOS canary refuses a deployment outside main history."
            exit 1
          fi

      - name: Preflight protected production canary configuration
        shell: bash
        env:
          HOSTED_WEB_PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
          HOSTED_WEB_VERCEL_PROJECT_ID: ${{ vars.HOSTED_WEB_VERCEL_PROJECT_ID }}
          HOSTED_WEB_VERCEL_TOKEN: ${{ secrets.HOSTED_WEB_VERCEL_TOKEN }}
          NATIVE_IOS_E2E_GITHUB_APP_ID: ${{ vars.NATIVE_IOS_E2E_GITHUB_APP_ID }}
          NATIVE_IOS_E2E_GITHUB_APP_PRIVATE_KEY: ${{ secrets.NATIVE_IOS_E2E_GITHUB_APP_PRIVATE_KEY }}
          NATIVE_IOS_E2E_IOS_EXPECTED_SHA: ${{ vars.NATIVE_IOS_E2E_IOS_EXPECTED_SHA }}
          NATIVE_IOS_E2E_IOS_REF: ${{ vars.NATIVE_IOS_E2E_IOS_REF }}
          NATIVE_IOS_E2E_IOS_REPOSITORY_NAME: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_NAME }}
          NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER }}
          NATIVE_IOS_E2E_IOS_WORKFLOW: ${{ vars.NATIVE_IOS_E2E_IOS_WORKFLOW }}
        run: |
          set -euo pipefail
          required=(
            HOSTED_WEB_PRODUCTION_BASE_URL
            HOSTED_WEB_VERCEL_PROJECT_ID
            HOSTED_WEB_VERCEL_TOKEN
            NATIVE_IOS_E2E_GITHUB_APP_ID
            NATIVE_IOS_E2E_GITHUB_APP_PRIVATE_KEY
            NATIVE_IOS_E2E_IOS_EXPECTED_SHA
            NATIVE_IOS_E2E_IOS_REF
            NATIVE_IOS_E2E_IOS_REPOSITORY_NAME
            NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER
            NATIVE_IOS_E2E_IOS_WORKFLOW
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::${name} is required for the protected production native iOS canary."
              exit 1
            fi
          done
          if ! [[ "${NATIVE_IOS_E2E_IOS_EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::NATIVE_IOS_E2E_IOS_EXPECTED_SHA must pin the approved private workflow commit."
            exit 1
          fi

      - name: Verify exact current Vercel production deployment
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
          HOSTED_WEB_PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
          HOSTED_WEB_VERCEL_PROJECT_ID: ${{ vars.HOSTED_WEB_VERCEL_PROJECT_ID }}
          HOSTED_WEB_VERCEL_TEAM_ID: ${{ vars.HOSTED_WEB_VERCEL_TEAM_ID }}
          HOSTED_WEB_VERCEL_TOKEN: ${{ secrets.HOSTED_WEB_VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(pnpm --dir apps/web exec tsx scripts/resolve-vercel-production-alias-sha.ts)"
          if [[ "${current_sha}" != "${DEPLOYED_SHA}" ]]; then
            echo "::error::Production alias no longer resolves to the deployment_status SHA."
            exit 1
          fi

      - name: Mint repository-scoped private iOS workflow token
        id: ios-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.NATIVE_IOS_E2E_GITHUB_APP_ID }}
          private-key: ${{ secrets.NATIVE_IOS_E2E_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER }}
          repositories: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_NAME }}
          permission-actions: write
          permission-contents: read

      - name: Dispatch non-destructive exact-production native iOS canary
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha }}
          NATIVE_IOS_E2E_GITHUB_TOKEN: ${{ steps.ios-app-token.outputs.token }}
          NATIVE_IOS_E2E_IOS_EXPECTED_SHA: ${{ vars.NATIVE_IOS_E2E_IOS_EXPECTED_SHA }}
          NATIVE_IOS_E2E_IOS_REF: ${{ vars.NATIVE_IOS_E2E_IOS_REF }}
          NATIVE_IOS_E2E_IOS_REPOSITORY: ${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_OWNER }}/${{ vars.NATIVE_IOS_E2E_IOS_REPOSITORY_NAME }}
          NATIVE_IOS_E2E_IOS_WORKFLOW: ${{ vars.NATIVE_IOS_E2E_IOS_WORKFLOW }}
          PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
        run: >-
          node scripts/native-ios-hosted-e2e-control.mjs dispatch-and-wait
          --mode production_canary
          --web-sha "${DEPLOYED_SHA}"
          --web-base-url "${PRODUCTION_BASE_URL}"
          --web-deployment-ref "production-alias:${DEPLOYED_SHA}"
          --correlation-id "murph-production-${DEPLOYED_SHA}-${{ github.run_id }}-${{ github.run_attempt }}"
