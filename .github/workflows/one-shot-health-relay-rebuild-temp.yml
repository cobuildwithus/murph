name: One-shot health relay rebuild temp

on:
  push:
    branches:
      - agent/health-relay-rebuild-temp
    paths:
      - .github/workflows/one-shot-health-relay-rebuild-temp.yml

permissions:
  contents: write

jobs:
  rebuild:
    if: contains(github.event.head_commit.message, '[apply-health-relay-rebuild-temp-v2]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: agent/health-relay-rebuild-temp

      - name: Build one clean feature commit
        run: |
          set -euo pipefail
          git fetch origin main agent/mobvoi-health-connect
          git show origin/agent/mobvoi-health-connect:.github/workflows/one-shot-health-relay-clean-rebase.yml \
            | sed -n '/^          from pathlib import Path$/,/^          PY$/p' \
            | sed 's/^          //' \
            | sed '$d' > /tmp/apply-health-relay.py
          test -s /tmp/apply-health-relay.py
          python <<'PY'
          from pathlib import Path

          script = Path('/tmp/apply-health-relay.py')
          text = script.read_text()
          old = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one exact match, found {count}")
              target.write_text(text.replace(old, new, 1))
          '''
          new = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count == 1:
                  target.write_text(text.replace(old, new, 1))
                  return
              if path == "packages/device-syncd/src/config/connect-routes.ts":
                  marker = ''' + "'''" + '''  {
            connectSourceId: "health-connect",
            label: "Health Connect",
            routes: [unavailableRoute("Health Connect is a mobile/local device flow, not hosted Junction Link.")],
          },
          ''' + "'''" + '''
                  replacement = ''' + "'''" + '''  {
            connectSourceId: "mobvoi-health",
            label: "Mobvoi / TicWatch",
            routes: [
              unavailableRoute(
                "Mobvoi and TicWatch devices sync supported data through Android Health Connect in the Murph Android app.",
              ),
            ],
          },
          {
            connectSourceId: "wyze-scale",
            label: "Wyze Scale",
            routes: [unavailableRoute("Wyze Scale data syncs through Apple Health in the Murph iOS app.")],
          },
          {
            connectSourceId: "eufy-life",
            label: "Eufy Smart Scale / eufyLife",
            routes: [unavailableRoute("Eufy Smart Scale and eufyLife data sync through Apple Health in the Murph iOS app.")],
          },
          {
            connectSourceId: "vesync-etekcity",
            label: "VeSync / Etekcity",
            routes: [unavailableRoute("VeSync and Etekcity scale data syncs through Apple Health in the Murph iOS app.")],
          },
          {
            connectSourceId: "ad-heart-track",
            label: "A&D Heart Track",
            routes: [unavailableRoute("A&D Heart Track data syncs through Apple Health in the Murph iOS app.")],
          },
          {
            connectSourceId: "microlife-connected-health",
            label: "Microlife Connected Health+",
            routes: [unavailableRoute("Microlife Connected Health+ data syncs through Apple Health in the Murph iOS app.")],
          },
          {
            connectSourceId: "health-connect",
            label: "Health Connect",
            routes: [unavailableRoute("Health Connect is a mobile/local device flow, not hosted Junction Link.")],
          },
          ''' + "'''" + '''
                  marker_count = text.count(marker)
                  if marker_count == 1:
                      target.write_text(text.replace(marker, replacement, 1))
                      return
              raise SystemExit(f"{path}: expected one exact match, found {count}")
          '''
          if text.count(old) != 1:
              raise SystemExit('replace_once definition changed unexpectedly')
          script.write_text(text.replace(old, new, 1))
          PY
          git reset --hard origin/main
          python /tmp/apply-health-relay.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Health Connect relay app catalog"
          git push --force-with-lease origin HEAD:agent/health-relay-rebuild-temp
