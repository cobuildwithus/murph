name: Cloudflare Hosted E2E

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# One CI run per ref per workflow: a new push to a PR or main cancels the
# superseded run immediately, freeing org-level concurrency slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The hosted local E2E harness runs `prisma db push` during setup, so these
  # jobs need a real loopback Postgres target rather than the unreachable
  # build-only placeholder URL used by release/build verification lanes.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/murph_test
  # Stream harness child-process logs (web/wrangler/runner/temporal) straight
  # to the CI log. Without this the harness buffers them in memory, so a
  # beforeAll spin-up hang times out with zero diagnostic output (observed
  # 2026-06-10: codex-image-media e2e hung 300s silently). This lane runs an
  # all-synthetic local stack (stub tokens, loopback Postgres), so streaming
  # exposes no real credentials; deploy lanes keep this set to "0".
  MURPH_E2E_STREAM_DEV_LOGS: "1"
  # Log every assistant-provider stub request (method + URL only) so timing
  # regressions in wake/turn interleaving are diagnosable from the CI log.
  MURPH_E2E_DEBUG_ASSISTANT_PROVIDER_STUB: "1"
  HOSTED_DEVICE_ROUTING_INDEX_KEY: 0101010101010101010101010101010101010101010101010101010101010101
  HOSTED_CONTACT_PRIVACY_KEYS: v1:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
  HOSTED_MAILBOX_FINGERPRINT_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
  NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.HOSTED_WEB_VERIFY_PRIVY_APP_ID }}
  NEXT_DIST_DIR_MODE: smoke
  NEXT_DIST_DIR_SUFFIX: hosted-e2e
  PRIVY_VERIFICATION_KEY: ci-hosted-web-verification-key
  # The runner-bundle workspace build defaults to a fully serial
  # `--workspace-concurrency=1`; CI runners have 4 vCPUs, so build in parallel.
  MURPH_RUNNER_BUNDLE_BUILD_CONCURRENCY: "4"

jobs:
  runner-bundle:
    name: Build hosted runner bundle and web dist
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Build the hosted-local runner bundle once and share it with every
      # scenario-group job below; the jobs run with `--no-bundle` so they
      # skip the duplicated full-workspace build.
      - name: Assemble hosted-local runner bundle
        env:
          MURPH_RUNNER_BUNDLE_SKIP_PACK_PREFLIGHTS: "1"
          # The linq-webhook-audio scenario needs the bundle-local e2e parser
          # toolchain stub (ffmpeg); other scenarios ignore the extra files.
          MURPH_RUNNER_BUNDLE_TEST_PARSER_TOOLCHAIN: "1"
        run: pnpm --dir apps/cloudflare runner:bundle:hosted-local

      # The tar includes the workspace dist outputs because the Temporal
      # worker's workflow webpack bundle resolves @murphai/* package exports
      # to dist/, unlike vitest and tsx which alias workspace sources.
      - name: Pack runner bundle artifact
        run: tar --zstd -cf runner-bundle.tar.zst apps/cloudflare/.deploy/runner-bundle packages/*/dist apps/cloudflare/dist

      - name: Upload runner bundle artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hosted-local-runner-bundle
          path: runner-bundle.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      # Build the hosted web production dist once and share it with every
      # scenario job. The E2E stack serves this prebuilt smoke dist with
      # `next start`, avoiding per-route Turbopack JIT during the scenarios.
      - name: Build hosted web production dist
        run: pnpm --dir apps/web build

      - name: Pack hosted web dist artifact
        run: tar --zstd -cf hosted-web-next-dist.tar.zst apps/web/.next-smoke-hosted-e2e

      - name: Upload hosted web dist artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: hosted-web-next-dist
          path: hosted-web-next-dist.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  # Scenario legs are grouped to reduce repeated harness preparation and
  # org-level concurrency slot usage. Scenarios within a leg run serially,
  # reuse the suite-owned runner image and smoke proof when isolation allows,
  # and reset their full-stack state between scenarios.
  hosted-scenarios:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner || 'ubuntu-24.04' }}
    timeout-minutes: ${{ matrix.timeoutMinutes || 25 }}
    needs: runner-bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Codex media + provider egress E2E
            runner: blacksmith-4vcpu-ubuntu-2404
            slug: codex-media-provider-egress
            scenarios: codex-image-media-delivery openai-egress-authority provider-egress-token-bridge warm-reuse-egress
          - name: Linq reminder + onboarding follow-up E2E
            fastGate: "1"
            slug: linq-reminder-onboarding-followup
            scenarios: linq-scheduled-reminder linq-onboarding-followup
          - name: Linq delivery + recovery + Temporal E2E
            fastGate: "1"
            slug: linq-delivery-recovery-temporal
            scenarios: linq-delivery linq-lost-active-operation temporal-orchestration timezone-injection linq-same-wake-batching
          - name: Telegram + idle checkpoint E2E
            slug: telegram-idle-checkpoint
            scenarios: telegram idle-checkpoint-deferred-progress direct-r2-presigned-put
          # linq-webhook-audio gates the Worker-mediated Workers AI transcription
          # path: audio media flows through the container parser drain, the
          # remote-transcription provider, and the murph-transcribe.worker
          # egress handler with a deterministic fake AI binding from the
          # hosted-local test entrypoint.
          - name: Linq webhook media + device connect E2E
            slug: linq-webhook-device-connect
            scenarios: linq-webhook linq-webhook-audio device-connect
          - name: Runtime checkpoint durability E2E
            slug: runtime-checkpoint-durability
            scenarios: canonical-receipt-lost-ack-recovery snapshot-publication-fallback shutdown-checkpoint-conversation-ahead
          - name: Delivery ambiguity + restart E2E
            slug: delivery-ambiguity-restart
            scenarios: retryable-outbox-foreground-restart usage-limit-ambiguous-send
          - name: Linq route authority + admission E2E
            slug: linq-route-authority-admission
            scenarios: linq-group-route-drift linq-home-line-reroute-retry family-sponsored-group-roundtrip linq-unknown-first-contact-fallback
          - name: Sensitive effect + handoff E2E
            slug: sensitive-effect-handoff
            scenarios: vault-file-approval-resume retell-call-result-roundtrip computer-handoff-linq-roundtrip
          - name: Junction wearable direct-resource replay E2E
            slug: junction-wearable-direct-resource-replay
            scenarios: device-sync-junction-wearable-direct-resource-replay
            timeoutMinutes: 35
          # This is intentionally a separately named check: it recreates the
          # production 180-second priority inversion and fails after 30 seconds
          # if a real foreground Linq message cannot replace background ownership.
          - name: Hosted foreground reply priority E2E
            fastGate: "1"
            slug: foreground-reply-priority
            scenarios: foreground-reply-priority
            timeoutMinutes: 30
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: murph_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d murph_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Codex CLI for hosted-local model catalog
        shell: bash
        run: |
          set -euo pipefail

          codex_cli_version="$(
            sed -n 's/^ARG CODEX_CLI_VERSION=//p' Dockerfile.cloudflare-hosted-runner-base | tail -n 1
          )"
          if [[ -z "${codex_cli_version}" ]]; then
            echo "Missing CODEX_CLI_VERSION in Dockerfile.cloudflare-hosted-runner-base" >&2
            exit 1
          fi

          npm_prefix="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/hosted-local-codex-npm"
          mkdir -p "${npm_prefix}"
          npm install --prefix "${npm_prefix}" --global --omit=dev --no-audit --no-fund --ignore-scripts "@openai/codex@${codex_cli_version}"
          echo "${npm_prefix}/bin" >> "$GITHUB_PATH"
          "${npm_prefix}/bin/codex" --version

      - name: Install/check Temporal CLI
        run: pnpm temporal:cli:setup

      - name: Download runner bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: hosted-local-runner-bundle

      - name: Unpack runner bundle
        run: |
          tar --zstd -xf runner-bundle.tar.zst
          rm runner-bundle.tar.zst

      - name: Download hosted web dist
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: hosted-web-next-dist

      - name: Unpack hosted web dist
        run: |
          rm -rf apps/web/.next-smoke-hosted-e2e
          tar --zstd -xf hosted-web-next-dist.tar.zst

      - name: Run hosted E2E scenarios
        env:
          MURPH_HOSTED_LOCAL_E2E_FAST_GATE: ${{ matrix.fastGate || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/cloudflare-hosted-e2e
          read -r -a scenarios <<< "${{ matrix.scenarios }}"
          # One suite invocation keeps the prepared runner image and smoke proof
          # alive across this group's serial, isolated scenario batches.
          pnpm hosted-local e2e "${scenarios[@]}" --no-bundle 2>&1 \
            | tee ".artifacts/cloudflare-hosted-e2e/${{ matrix.slug }}.log"

      - name: Prove hosted PostgreSQL ordering and cleanup
        if: ${{ matrix.slug == 'linq-route-authority-admission' }}
        env:
          MURPH_TEST_POSTGRES_CONCURRENCY: "1"
        run: >-
          pnpm exec vitest run --config apps/web/vitest.workspace.ts --no-coverage
          apps/web/test/device-sync-dirty-account-deletion-concurrency.test.ts
          apps/web/test/hosted-accepted-attempt-recheck-postgres-concurrency.test.ts
          apps/web/test/hosted-assistant-ask-retention-postgres.test.ts
          apps/web/test/hosted-execution-usage-postgres-concurrency.test.ts
          apps/web/test/hosted-onboarding-linq-home-routing-postgres.test.ts
          apps/web/test/hosted-onboarding-linq-recent-message-load-postgres.test.ts
          apps/web/test/hosted-onboarding-member-lock-postgres.test.ts
          apps/web/test/hosted-onboarding-telegram-routing-postgres.test.ts
          apps/web/test/hosted-onboarding-linq-participant-addition-concurrency.test.ts
          apps/web/test/prisma-database-retry-postgres.test.ts
          apps/web/test/hosted-linq-invite-deletion-contract-migration-postgres.test.ts
          apps/web/test/hosted-linq-provider-health-contract-migration-postgres.test.ts
          apps/web/test/hosted-production-500-regressions-postgres.test.ts
          apps/web/test/hosted-usage-credit-postgres-concurrency.test.ts

      - name: Upload hosted E2E logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cloudflare-hosted-e2e-${{ matrix.slug }}-logs
          path: |
            .artifacts/cloudflare-hosted-e2e/*.log
            .artifacts/hosted-local/**/state.json
          if-no-files-found: warn

  hosted-e2e-required:
    name: Hosted E2E required gate
    runs-on: ubuntu-24.04
    needs:
      - runner-bundle
      - hosted-scenarios
    if: ${{ always() }}
    steps:
      - name: Check hosted E2E jobs
        run: |
          if [[ "${{ needs.runner-bundle.result }}" != "success" ]]; then
            echo "Hosted runner bundle job failed or did not complete."
            exit 1
          fi
          if [[ "${{ needs.hosted-scenarios.result }}" != "success" ]]; then
            echo "Hosted E2E scenario matrix failed or did not complete."
            exit 1
          fi

  hosted-device-sync-e2e-required:
    name: Hosted device-sync E2E required gate
    runs-on: ubuntu-24.04
    needs:
      - hosted-scenarios
    if: ${{ always() }}
    steps:
      - name: Check hosted device-sync E2E job
        run: |
          if [[ "${{ needs.hosted-scenarios.result }}" != "success" ]]; then
            echo "Hosted E2E scenario matrix, including Junction replay, failed or did not complete."
            exit 1
          fi
