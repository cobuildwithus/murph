name: Cloudflare Hosted E2E

on:
  pull_request:
    paths:
      - ".github/workflows/cloudflare-hosted-e2e.yml"
      - "apps/cloudflare/**"
      - "packages/assistant-engine/**"
      - "packages/assistant-runtime/**"
      - "packages/cloudflare-hosted-control/**"
      - "packages/hosted-execution/**"
      - "scripts/dev-hosted-local/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/murph_test
  DEVICE_SYNC_ENCRYPTION_KEY: 0101010101010101010101010101010101010101010101010101010101010101
  DEVICE_SYNC_ENCRYPTION_KEY_VERSION: v1
  HOSTED_CONTACT_PRIVACY_KEYS: v1:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
  NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.HOSTED_WEB_VERIFY_PRIVY_APP_ID }}
  PRIVY_VERIFICATION_KEY: ci-hosted-web-verification-key

jobs:
  linq-delivery:
    name: Linq delivery E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: cloudflare-hosted-e2e-linq-${{ github.event.pull_request.number || github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run Linq delivery hosted E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/cloudflare-hosted-e2e
          pnpm --dir apps/cloudflare test:e2e:linq-delivery:local 2>&1 \
            | tee .artifacts/cloudflare-hosted-e2e/linq-delivery.log

      - name: Upload Linq delivery E2E logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-hosted-e2e-linq-delivery-logs
          path: .artifacts/cloudflare-hosted-e2e/linq-delivery.log
          if-no-files-found: warn

  duplicate-commit:
    name: Duplicate commit E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: cloudflare-hosted-e2e-duplicate-${{ github.event.pull_request.number || github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run duplicate-commit hosted E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts/cloudflare-hosted-e2e
          pnpm --dir apps/cloudflare test:e2e:duplicate-commit:local 2>&1 \
            | tee .artifacts/cloudflare-hosted-e2e/duplicate-commit.log

      - name: Upload duplicate-commit E2E logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cloudflare-hosted-e2e-duplicate-commit-logs
          path: .artifacts/cloudflare-hosted-e2e/duplicate-commit.log
          if-no-files-found: warn
