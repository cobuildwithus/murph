name: Diagnose Apple Health relay wearables

on:
  push:
    branches:
      - agent/apple-health-relay-wearables

permissions:
  contents: write

concurrency:
  group: agent-apple-health-relay-wearables-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/apple-health-relay-wearables

      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Web focused tests
        id: web_tests
        continue-on-error: true
        run: pnpm --dir apps/web test:prepared -- connect-page.test.ts connect-source-and-experiment-card-routes.test.tsx

      - name: Assistant behavior tests
        id: assistant_tests
        continue-on-error: true
        run: pnpm --dir packages/assistant-engine test -- model-behavior.test.ts

      - name: Device sync tests
        id: device_sync_tests
        continue-on-error: true
        run: pnpm --dir packages/device-syncd test

      - name: Assistant typecheck
        id: assistant_typecheck
        continue-on-error: true
        run: pnpm --dir packages/assistant-engine typecheck

      - name: Web typecheck
        id: web_typecheck
        continue-on-error: true
        run: |
          pnpm --dir apps/web prisma:generate
          pnpm --dir apps/web typecheck:prepared

      - name: Remove diagnostic workflow and push branch
        if: always()
        run: |
          rm .github/workflows/agent-apple-health-relays-diagnose.yml
          git add .github/workflows/agent-apple-health-relays-diagnose.yml
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove relay diagnostic workflow"
          fi
          git push origin HEAD:agent/apple-health-relay-wearables

      - name: Surface validation failures
        if: always()
        run: |
          test "${{ steps.web_tests.outcome }}" = success
          test "${{ steps.assistant_tests.outcome }}" = success
          test "${{ steps.device_sync_tests.outcome }}" = success
          test "${{ steps.assistant_typecheck.outcome }}" = success
          test "${{ steps.web_typecheck.outcome }}" = success
