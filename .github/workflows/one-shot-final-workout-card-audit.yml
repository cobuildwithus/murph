          pnpm --dir packages/contracts typecheck
          pnpm --dir packages/operator-config typecheck
          pnpm --dir packages/assistant-engine typecheck
          pnpm --dir packages/contracts exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/workout-session-card.test.ts
          pnpm --dir packages/operator-config exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/assistant-response-cards.test.ts \
            test/workout-session-response-card.test.ts \
