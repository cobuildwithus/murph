name: Agent Apple Health relay patch

on:
  push:
    branches:
      - agent/apple-health-relay-wearables

permissions:
  contents: write

concurrency:
  group: agent-apple-health-relay-wearables
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/apple-health-relay-wearables

      - name: Apply Apple Health relay changes
        shell: bash
        env:
          PATCH_GZIP_BASE64: 
        run: |
          printf '%s' "$PATCH_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/apply.py
          python3 /tmp/apply.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused checks
        id: checks
        continue-on-error: true
        run: |
          pnpm --dir apps/web test:prepared -- connect-page.test.ts connect-source-and-experiment-card-routes.test.tsx
          pnpm --dir packages/assistant-engine test -- model-behavior.test.ts
          pnpm --dir packages/device-syncd test
          pnpm --dir packages/assistant-engine typecheck
          pnpm --dir apps/web prisma:generate
          pnpm --dir apps/web typecheck:prepared

      - name: Commit final branch changes and remove temporary workflow
        run: |
          rm .github/workflows/agent-apple-health-relays.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/app/'(dashboard)'/connect/connect-page-client.tsx \
            apps/web/app/'(dashboard)'/connect/connect-page-content.tsx \
            apps/web/app/'(dashboard)'/connect/connect-page-types.ts \
            apps/web/app/'(dashboard)'/connect/connect-source-order.ts \
            apps/web/src/lib/device-sync/apple-health-relay-setup-guide.ts \
            apps/web/test/connect-page.test.ts \
            apps/web/test/connect-source-and-experiment-card-routes.test.tsx \
            packages/assistant-engine/src/assistant/system-prompt.ts \
            packages/assistant-engine/test/model-behavior.test.ts \
            packages/device-syncd/src/config/connect-routes.ts \
            .github/workflows/agent-apple-health-relays.yml
          git commit -m "feat: add Apple Health relay wearables"
          git push origin HEAD:agent/apple-health-relay-wearables

      - name: Surface focused-check failures
        if: steps.checks.outcome == 'failure'
        run: exit 1
