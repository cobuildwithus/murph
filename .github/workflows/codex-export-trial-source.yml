name: Codex export implementation checkout

on:
  push:
    branches:
      - codex/trial-usage-source
    paths:
      - .github/workflows/codex-export-trial-source.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build git bundle
        shell: bash
        run: git bundle create murph.bundle HEAD

      - name: Upload git bundle
        uses: actions/upload-artifact@v4
        with:
          name: murph-git-bundle
          path: murph.bundle
          if-no-files-found: error
          retention-days: 1
