name: One-shot fix context snapshot schema assertion v2

on:
  push:
    branches:
      - codex/junction-scale-bp-vault-awareness
    paths:
      - .github/workflows/one-shot-fix-context-schema-test-v2.yml

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-context-schema-test-v2]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/junction-scale-bp-vault-awareness

      - name: Update the schema-version assertion
        shell: python
        run: |
          from pathlib import Path

          target = Path('packages/assistant-engine/test/assistant-context-snapshot.test.ts')
          text = target.read_text()
          anchor = "expect(JSON.parse(await readFile(snapshotPath, 'utf8'))).toMatchObject({"
          start = text.index(anchor)
          end = text.index('\n      })', start) + len('\n      })')
          block = text[start:end]
          old = 'schemaVersion: 5,'
          if block.count(old) != 1:
              raise RuntimeError(f'expected one v5 assertion in anchored block, found {block.count(old)}')
          replacement = block.replace(old, 'schemaVersion: 6,', 1)
          target.write_text(text[:start] + replacement + text[end:])
          for workflow in [
              '.github/workflows/one-shot-fix-context-schema-test.yml',
              '.github/workflows/one-shot-fix-context-schema-test-v2.yml',
          ]:
              Path(workflow).unlink(missing_ok=True)

      - name: Commit the repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: expect current context snapshot schema"
          git push origin HEAD:codex/junction-scale-bp-vault-awareness
