name: One-shot workout-session response-card patch

on:
  push:
    branches:
      - agent/workout-session-response-card
    paths:
      - .github/workflows/one-shot-workout-session-response-card.yml

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-workout-session-response-card]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: agent/workout-session-response-card

      - name: Verify reviewed base
        run: git merge-base --is-ancestor b855d045189224b964d0d479f8ae54f2fc9d18fc HEAD

      - name: Apply focused change set
        shell: bash
        run: |
          cat .github/patches/workout-session-response-card/part-*.b64 > /tmp/murph-workout-pr1.b64
          base64 --decode /tmp/murph-workout-pr1.b64 > /tmp/murph-workout-pr1.zip
          wc -c /tmp/murph-workout-pr1.zip
          sha256sum /tmp/murph-workout-pr1.zip
          echo "88f2cdd53ad6860e22a42a10c773034c6944b5c94648483922e8a8616d822fb6  /tmp/murph-workout-pr1.zip" | sha256sum -c -
          python -c "import zipfile; zipfile.ZipFile('/tmp/murph-workout-pr1.zip').extractall('/tmp')"
          python /tmp/pr1-current/apply.py .
          rm -rf .github/patches/workout-session-response-card
          rm .github/workflows/one-shot-workout-session-response-card.yml
          git diff --check

      - name: Commit applied change set
        shell: bash
        run: |
          git config user.name "Codex"
          git config user.email "codex@users.noreply.github.com"
          git add -A
          git commit -m "feat(workouts): add canonical workout-session response cards"
          git push origin HEAD:agent/workout-session-response-card
