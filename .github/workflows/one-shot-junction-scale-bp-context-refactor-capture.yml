name: Capture Junction scale and BP context refactor traceback

on:
  push:
    branches:
      - codex/junction-scale-bp-vault-awareness
    paths:
      - .github/workflows/one-shot-junction-scale-bp-context-refactor-capture.yml

permissions:
  contents: write

jobs:
  capture:
    if: contains(github.event.head_commit.message, '[junction-scale-bp-context-capture]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/junction-scale-bp-vault-awareness

      - name: Capture exact traceback without committing partial edits
        shell: bash
        run: |
          set +e
          python <<'PY' > /tmp/junction-context-refactor-traceback.txt 2>&1
          from pathlib import Path
          import textwrap
          import traceback

          try:
              original = Path(
                  ".github/workflows/one-shot-junction-scale-bp-context-refactor.yml",
              )
              workflow_text = original.read_text()
              marker = "      - name: Fold device availability into the existing context snapshot\n        shell: python\n        run: |\n"
              script = workflow_text.split(marker, 1)[1].split(
                  "\n      - name: Commit simplified implementation",
                  1,
              )[0]
              script = textwrap.dedent(script)
              audit_start = script.index("\naudit = ")
              cleanup_start = script.index("\nworkflow = Path(", audit_start)
              script = script[:audit_start] + script[cleanup_start:]
              exec(compile(script, str(original), "exec"), {"__name__": "__main__"})
          except Exception:
              traceback.print_exc()
              raise
          PY
          status=$?
          git reset --hard HEAD
          cp /tmp/junction-context-refactor-traceback.txt .junction-context-refactor-traceback.txt
          rm .github/workflows/one-shot-junction-scale-bp-context-refactor-capture.yml
          printf '\nexit_status=%s\n' "$status" >> .junction-context-refactor-traceback.txt

      - name: Commit captured traceback
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: capture context refactor traceback"
          git push origin HEAD:codex/junction-scale-bp-vault-awareness
