name: Verify Zepp Apple Health relay patch

on:
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: codex-zepp-pr-verification
  cancel-in-progress: false

jobs:
  patch-and-verify:
    if: ${{ github.event.pull_request.head.ref == 'codex/zepp-apple-health-relay' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout task branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/zepp-apple-health-relay

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Apply focused patch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f apps/web/src/lib/device-sync/zepp-apple-health-setup-guide.ts ]]; then
            echo "Zepp patch is already present; continuing to verification."
            exit 0
          fi

          ruby -ryaml -e '
            workflow = YAML.unsafe_load_file(".github/workflows/codex-zepp-apple-health-relay.yml")
            step = workflow.fetch("jobs").fetch("patch-and-verify").fetch("steps").find do |candidate|
              candidate["name"] == "Apply focused patch"
            end
            raise "Patch step not found" unless step && step["run"]
            run = step.fetch("run")
            needle = "replace_once(connect_test_path, '\''  assert.ok(sourceHeadingIndex(markup, \"Apple Health\") < sourceHeadingIndex(markup, \"Garmin\"));\\n'\''"
            raise "Expected one ordering replacement" unless run.scan(needle).length == 1
            run = run.sub(needle, needle.sub("replace_once", "replace_all"))
            File.write("/tmp/apply-zepp-patch.sh", "set -euo pipefail\n#{run}")
          '

          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/apply-zepp-patch.sh")
          content = path.read_text(encoding="utf-8")
          replacements = [
              (
                  "- Apple Watch/iPhone/Apple Health, WHOOP, and Zepp/Amazfit relay handoffs: apply the app-link rule above, then after opening Murph, sign in and connect Apple Health.",
                  "- Apple Watch/iPhone, WHOOP, and Zepp/Amazfit: apply the app-link rule; in Murph, sign in and connect Apple Health.",
              ),
              (
                  "- WHOOP limits third-party access. Direct sync omits steps; Apple Health may relay them. Do not infer/request missing steps.",
                  "- WHOOP limits third-party access; direct sync lacks steps. Apple Health may relay them. Never infer/request missing steps.",
              ),
              (
                  "- WHOOP: More > App Settings > Integrations > Apple Health > Connect > Turn On All (or chosen categories) > Allow; then connect Apple Health in Murph.",
                  "- WHOOP: More > App Settings > Integrations > Apple Health > Connect > Turn On All (or chosen categories) > Allow.",
              ),
              (
                  "- Zepp/Amazfit is an Apple Health relay, not a direct Murph connection. Tell the user to enable Apple Health sharing in the Zepp app for the categories they want, then connect Apple Health in Murph. Do not promise direct Zepp cloud access or historical backfill.",
                  "- Zepp/Amazfit is an Apple Health relay, not a direct Murph connection. Enable sharing in Zepp, then connect it in Murph. Do not promise direct Zepp cloud access or historical backfill.",
              ),
              (
                  "When the user asks to set up Zepp/Amazfit and ",
                  "With ",
              ),
              (
                  " is available, send one short privacy-safe voice memo that explains those two steps. Keep accompanying text minimal and follow the app-link rule, including the App Store URL alone on the final line.",
                  ", send one brief privacy-safe Zepp setup memo. Keep text minimal; put the App Store URL alone on the final line.",
              ),
              (
                  "Apple Watch/iPhone/Apple Health, WHOOP, and Zepp/Amazfit relay handoffs",
                  "Apple Watch/iPhone, WHOOP, and Zepp/Amazfit",
              ),
              (
                  "enable Apple Health sharing in the Zepp app",
                  "Enable sharing in Zepp",
              ),
              (
                  "one short privacy-safe voice memo",
                  "one brief privacy-safe Zepp setup memo",
              ),
          ]

          for old, new in replacements:
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(
                      f"Expected exactly one prompt-compaction match, found {count}: {old!r}"
                  )
              content = content.replace(old, new, 1)

          path.write_text(content, encoding="utf-8")
          PY

          bash /tmp/apply-zepp-patch.sh

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --dir apps/web prisma:generate

      - name: Focused web tests
        run: >-
          pnpm exec vitest run
          --config apps/web/vitest.workspace.ts
          --no-coverage
          apps/web/test/connect-page.test.ts
          apps/web/test/device-sync-completion-dialog-client.test.ts

      - name: Focused assistant prompt tests
        run: >-
          pnpm --dir packages/assistant-engine exec vitest run
          --config vitest.config.ts
          --no-coverage
          test/model-behavior.test.ts

      - name: Typecheck affected packages
        run: |
          pnpm --dir packages/device-syncd typecheck
          pnpm --dir packages/assistant-engine typecheck
          pnpm --dir apps/web typecheck

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git rm -f --ignore-unmatch .github/workflows/codex-zepp-apple-health-relay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "feat: add Zepp Apple Health setup [zepp-patch-applied]"
          git push origin HEAD:codex/zepp-apple-health-relay
