name: Retry final challenge standings integration

on:
  push:
    branches:
      - agent/challenge-standings-card

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: agent/challenge-standings-card
          fetch-depth: 0

      - name: Apply corrected final patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          workflow = Path(
              '.github/workflows/finalize-challenge-standings-card.yml'
          ).read_text()
          step_marker = '      - name: Apply final source and regression fixes\n'
          step_start = workflow.index(step_marker)
          run_marker = '        run: |\n'
          script_start = workflow.index(run_marker, step_start) + len(run_marker)
          script_end = workflow.index('\n      - name: Setup pnpm', script_start)
          raw_script = workflow[script_start:script_end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in raw_script.splitlines()
          ) + '\n'

          brittle = '''outbox = replace_once(outbox, old_outbox, new_outbox, "outbox card audience gate")'''
          robust = '''outbox = replace_between(
              outbox,
              "    if (intent.card !== null && intent.threadIsDirect !== true) {",
              "    if (intent.nativeReplyRequested !== true) {",
              new_outbox,
              "outbox card audience gate",
          )'''
          if script.count(brittle) != 1:
              raise RuntimeError('Expected the original outbox replacement once.')
          script = script.replace(brittle, robust, 1)

          Path('/tmp/apply-final-challenge-card.sh').write_text(script)
          PY
          bash /tmp/apply-final-challenge-card.sh

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify challenge standings packages
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @murphai/contracts test:vitest
          pnpm --filter @murphai/operator-config test
          pnpm --filter @murphai/assistant-engine test
          pnpm --filter @murphai/contracts typecheck
          pnpm --filter @murphai/operator-config typecheck
          pnpm --filter @murphai/assistant-engine typecheck
          git diff --check

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-challenge-standings-card.yml
          rm .github/workflows/retry-finalize-challenge-standings-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finish challenge standings card integration"
          git push origin HEAD:agent/challenge-standings-card
