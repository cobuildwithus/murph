name: Materialize Murph persona integration

on:
  push:
    branches: [agent/murph-personas]
    paths:
      - .github/workflows/apply-murph-persona-integration.yml
      - scripts/persona-integration-parts/**

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch quietly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git clone --quiet --depth=1 --branch agent/murph-personas \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Apply and commit integration
        shell: bash
        run: |
          set -o pipefail
          cat scripts/persona-integration-parts/*.b64 \
            | base64 --decode \
            | gunzip > /tmp/apply-murph-persona-integration.mjs
          sed -i '533s/  4,/  1,/' /tmp/apply-murph-persona-integration.mjs
          sed -i '535s/, 3);/, 4);/' /tmp/apply-murph-persona-integration.mjs
          node /tmp/apply-murph-persona-integration.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: materialize Murph persona integration [persona-applied]"
          git push origin HEAD:agent/murph-personas
