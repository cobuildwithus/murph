      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Build contracts
        run: pnpm --dir packages/contracts build

      - name: Run focused regressions
        run: |
          pnpm exec vitest run --no-coverage \
            packages/contracts/test/assistant-personas.test.ts \
            packages/contracts/test/preferences.test.ts \
            packages/core/test/preferences.test.ts \
            packages/hosted-execution/test/hosted-execution-contract-guards.test.ts \
            packages/assistant-engine/test/persona-prompts.test.ts \
            packages/assistant-engine/test/assistant-style-dynamic-tool.test.ts \
            packages/assistant-engine/test/assistant-codex-turn-planning.test.ts \
            apps/web/test/settings-assistant-style-route.test.ts \
            apps/web/test/home-initial-visit-dialog.test.tsx \
            apps/web/test/hosted-onboarding-member-preferences.test.ts \
            apps/web/test/hosted-assistant-personalization-tool.test.ts \
            apps/web/test/account-settings-snapshot.test.ts

      - name: Typecheck packages
        run: pnpm typecheck:packages

      - name: Typecheck Web
        run: pnpm --dir apps/web typecheck

      - name: Check diff
        run: git diff --check

      - name: Commit repaired implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair and simplify Murph persona integration [persona-repaired]"
          git push origin HEAD:agent/murph-personas
