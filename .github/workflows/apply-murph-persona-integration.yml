name: Diagnose final Murph persona planning regression

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Diagnose planning regression
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git clone --quiet --depth=1 --branch agent/murph-personas \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          python scripts/repair-persona-remaining.py
          corepack enable >/dev/null
          corepack prepare pnpm@10.33.0 --activate >/dev/null
          pnpm install --frozen-lockfile --reporter=silent >/dev/null
          pnpm --dir packages/contracts build >/dev/null
          pnpm exec vitest run --no-coverage \
            packages/assistant-engine/test/assistant-codex-turn-planning.test.ts \
            --reporter=verbose
