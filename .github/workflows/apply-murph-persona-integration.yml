name: Diagnose remaining Web persona regression

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout and apply repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git clone --quiet --depth=1 --branch agent/murph-personas \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          python scripts/repair-persona-remaining.py
          sed -i \
            's/const explicitAssistantPersona = privateInteractiveAudience/const explicitAssistantPersona = privateInteractiveProviderTurn/' \
            packages/assistant-engine/src/assistant/codex-turn/planning.ts
          sed -i \
            's/privateInteractiveAudience || groupAssistantStylePreferencesApply/privateInteractiveProviderTurn || groupAssistantStylePreferencesApply/' \
            packages/assistant-engine/src/assistant/codex-turn/planning.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Install and prepare
        run: |
          corepack enable >/dev/null
          corepack prepare pnpm@10.33.0 --activate >/dev/null
          pnpm install --frozen-lockfile --reporter=silent
          pnpm --dir packages/contracts build >/dev/null
          pnpm --dir apps/web prisma:generate >/dev/null

      - name: Initial visit
        run: pnpm exec vitest run --config apps/web/vitest.workspace.ts --no-coverage apps/web/test/home-initial-visit-dialog.test.tsx --reporter=verbose
      - name: Hosted member preferences
        run: pnpm exec vitest run --config apps/web/vitest.workspace.ts --no-coverage apps/web/test/hosted-onboarding-member-preferences.test.ts --reporter=verbose
      - name: Hosted personalization tool
        run: pnpm exec vitest run --config apps/web/vitest.workspace.ts --no-coverage apps/web/test/hosted-assistant-personalization-tool.test.ts --reporter=verbose
      - name: Account settings snapshot
        run: pnpm exec vitest run --config apps/web/vitest.workspace.ts --no-coverage apps/web/test/account-settings-snapshot.test.ts --reporter=verbose
