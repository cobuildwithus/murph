name: Diagnose Murph persona planning

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [agent/murph-personas]
    paths:
      - .github/workflows/apply-murph-persona-integration.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run planning regression
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git clone --quiet --depth=1 --branch agent/murph-personas \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          corepack enable >/dev/null
          corepack prepare pnpm@10.33.0 --activate >/dev/null
          pnpm install --frozen-lockfile --reporter=silent
          pnpm --dir packages/contracts build >/dev/null
          pnpm exec vitest run --no-coverage \
            packages/assistant-engine/test/assistant-codex-turn-planning.test.ts \
            --reporter=verbose
