name: Diagnose Murph persona integration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [agent/murph-personas]
    paths:
      - .github/workflows/apply-murph-persona-integration.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch quietly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git clone --quiet --depth=1 --branch agent/murph-personas \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Build contracts
        run: pnpm --dir packages/contracts build

      - name: Contracts persona catalog
        run: pnpm exec vitest run --no-coverage packages/contracts/test/assistant-personas.test.ts --reporter=verbose

      - name: Contracts preferences
        run: pnpm exec vitest run --no-coverage packages/contracts/test/preferences.test.ts --reporter=verbose

      - name: Core preferences
        run: pnpm exec vitest run --no-coverage packages/core/test/preferences.test.ts --reporter=verbose

      - name: Hosted execution contract guards
        run: pnpm exec vitest run --no-coverage packages/hosted-execution/test/hosted-execution-contract-guards.test.ts --reporter=verbose

      - name: Persona prompts
        run: pnpm exec vitest run --no-coverage packages/assistant-engine/test/persona-prompts.test.ts --reporter=verbose

      - name: Assistant style tool
        run: pnpm exec vitest run --no-coverage packages/assistant-engine/test/assistant-style-dynamic-tool.test.ts --reporter=verbose

      - name: Assistant turn planning
        run: pnpm exec vitest run --no-coverage packages/assistant-engine/test/assistant-codex-turn-planning.test.ts --reporter=verbose

      - name: Initial visit
        run: pnpm exec vitest run --no-coverage apps/web/test/home-initial-visit-dialog.test.tsx --reporter=verbose

      - name: Hosted preferences
        run: pnpm exec vitest run --no-coverage apps/web/test/hosted-onboarding-member-preferences.test.ts --reporter=verbose

      - name: Account settings snapshot
        run: pnpm exec vitest run --no-coverage apps/web/test/account-settings-snapshot.test.ts --reporter=verbose
