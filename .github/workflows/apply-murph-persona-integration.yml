name: Finalize Murph persona repair

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout branch quietly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git clone --quiet --depth=1 --branch agent/murph-personas \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .

      - name: Apply reviewed source repairs
        shell: bash
        run: |
          python scripts/repair-persona-remaining.py
          python scripts/finalize-persona-review.py
          python - <<'PY'
          from pathlib import Path
          path = Path("packages/assistant-engine/src/assistant/persona-prompts.ts")
          text = path.read_text()
          old = '    "Do not announce the persona, imitate a real person, or claim its credentials or biography.",\n'
          new = (
              '    "Do not announce the persona.",\n'
              '    "Do not imitate a real person or claim this persona\'s credentials or biography.",\n'
          )
          if text.count(old) != 1:
              raise SystemExit("persona anti-impersonation prompt did not match")
          path.write_text(text.replace(old, new))
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install workspace
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Prepare generated clients
        run: |
          pnpm --dir packages/contracts build
          pnpm --dir apps/web prisma:generate

      - name: Run package regressions
        run: |
          pnpm exec vitest run --no-coverage \
            packages/contracts/test/assistant-personas.test.ts \
            packages/contracts/test/preferences.test.ts \
            packages/core/test/preferences.test.ts \
            packages/vault-usecases/test/preferences.test.ts \
            packages/hosted-execution/test/hosted-execution-contract-guards.test.ts \
            packages/hosted-execution/test/assistant-personalization.test.ts \
            packages/assistant-runtime/test/hosted-runtime-context-coverage.test.ts \
            packages/assistant-engine/test/persona-prompts.test.ts \
            packages/assistant-engine/test/assistant-style-dynamic-tool.test.ts \
            packages/assistant-engine/test/assistant-codex-turn-planning.test.ts

      - name: Run Web regressions
        run: |
          pnpm exec vitest run \
            --config apps/web/vitest.workspace.ts \
            --no-coverage \
            apps/web/test/settings-assistant-style-route.test.ts \
            apps/web/test/murph-persona-picker.test.tsx \
            apps/web/test/voice-memo-player.test.tsx \
            apps/web/test/home-initial-visit-dialog.test.tsx \
            apps/web/test/hosted-onboarding-member-preferences.test.ts \
            apps/web/test/hosted-assistant-personalization-tool.test.ts \
            apps/web/test/account-settings-snapshot.test.ts \
            apps/web/test/customize-murph-settings.test.tsx

      - name: Typecheck packages
        run: pnpm typecheck:packages

      - name: Typecheck Web
        run: pnpm --dir apps/web typecheck

      - name: Validate source shape
        run: |
          node --check scripts/generate-murph-persona-previews.mjs
          git diff --check
          test ! -e apps/web/app/api/settings/assistant-persona/route.ts
          test ! -e scripts/repair-persona-remaining.py
          test ! -e scripts/finalize-persona-review.py
          test ! -e scripts/apply-murph-persona-integration.mjs.gz.b64
          test ! -e scripts/persona-integration-parts
          test ! -e .github/workflows/apply-murph-persona-integration.yml

      - name: Commit cleaned implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair and simplify Murph persona integration [persona-repaired]"
          git push origin HEAD:agent/murph-personas
