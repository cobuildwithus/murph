name: Apply Murph persona integration

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - agent/murph-personas
    paths:
      - .github/workflows/apply-murph-persona-integration.yml
      - scripts/apply-murph-persona-integration.mjs.gz.b64

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/murph-personas

      - name: Detect a settled integration head
        id: settled
        shell: bash
        run: |
          message="$(git log -1 --pretty=%B)"
          if [[ "$message" == *"[persona-applied]"* || "$message" == *"[persona-failed]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: ${{ steps.settled.outputs.skip != 'true' }}
        with:
          node-version: 24.14.1

      - name: Enable pnpm
        if: ${{ steps.settled.outputs.skip != 'true' }}
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Apply narrow source integrations
        id: integrate
        if: ${{ steps.settled.outputs.skip != 'true' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          base64 --decode scripts/apply-murph-persona-integration.mjs.gz.b64 \
            | gunzip > /tmp/apply-murph-persona-integration.mjs
          node /tmp/apply-murph-persona-integration.mjs \
            2>&1 | tee /tmp/murph-persona-integration.log

      - name: Report integration failure
        if: ${{ steps.settled.outputs.skip != 'true' && steps.integrate.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Persona integration codemod failed"
            echo
            echo '```text'
            tail -n 180 /tmp/murph-persona-integration.log
            echo '```'
            echo
            echo "Partial diff before the ephemeral runner was discarded:"
            echo '```text'
            git diff --stat
            echo '```'
          } > /tmp/persona-pr-comment.md
          gh pr comment 801 --body-file /tmp/persona-pr-comment.md
          exit 1

      - name: Install workspace
        if: ${{ steps.settled.outputs.skip != 'true' && steps.integrate.outcome == 'success' }}
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        if: ${{ steps.settled.outputs.skip != 'true' && steps.integrate.outcome == 'success' }}
        run: pnpm --dir packages/contracts build

      - name: Generate persona voice previews when credentials are configured
        if: ${{ steps.settled.outputs.skip != 'true' && steps.integrate.outcome == 'success' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MURPH_ELEVENLABS_MODEL_ID: ${{ secrets.MURPH_ELEVENLABS_MODEL_ID }}
          MURPH_ELEVENLABS_VOICE_ID: ${{ secrets.MURPH_ELEVENLABS_VOICE_ID }}
        shell: bash
        run: |
          if [[ -n "$ELEVENLABS_API_KEY" && -n "$MURPH_ELEVENLABS_VOICE_ID" ]]; then
            node scripts/generate-murph-persona-previews.mjs
          else
            echo "Persona preview credentials are not configured; keeping the deterministic generator and preview paths only."
          fi

      - name: Verify persona integration
        id: verify
        if: ${{ steps.settled.outputs.skip != 'true' && steps.integrate.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm exec vitest run --no-coverage \
              packages/contracts/test/assistant-personas.test.ts \
              packages/contracts/test/preferences.test.ts \
              packages/core/test/preferences.test.ts \
              packages/hosted-execution/test/hosted-execution-contract-guards.test.ts \
              packages/assistant-engine/test/persona-prompts.test.ts \
              packages/assistant-engine/test/assistant-style-dynamic-tool.test.ts \
              packages/assistant-engine/test/assistant-codex-turn-planning.test.ts \
              apps/web/test/home-initial-visit-dialog.test.tsx \
              apps/web/test/hosted-onboarding-member-preferences.test.ts \
              apps/web/test/account-settings-snapshot.test.ts
            pnpm typecheck:packages
            pnpm --dir apps/web typecheck
            git diff --check
          } 2>&1 | tee /tmp/murph-persona-verification.log

      - name: Report verification failure
        if: ${{ steps.settled.outputs.skip != 'true' && steps.integrate.outcome == 'success' && steps.verify.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Persona integration verification failed"
            echo
            echo '```text'
            tail -n 220 /tmp/murph-persona-verification.log
            echo '```'
            echo
            echo "Integrated diff summary:"
            echo '```text'
            git diff --stat
            echo '```'
          } > /tmp/persona-pr-comment.md
          gh pr comment 801 --body-file /tmp/persona-pr-comment.md
          exit 1

      - name: Commit integrated implementation
        if: ${{ steps.settled.outputs.skip != 'true' && steps.integrate.outcome == 'success' && steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Murph personas [persona-applied]"
          git push origin HEAD:agent/murph-personas
