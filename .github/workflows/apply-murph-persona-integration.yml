name: Apply Murph persona integration

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches: [agent/murph-personas]
    paths:
      - .github/workflows/apply-murph-persona-integration.yml
      - scripts/apply-murph-persona-integration.mjs.gz.b64

concurrency:
  group: murph-persona-integration
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/murph-personas

      - name: Pin latest branch head
        run: |
          git fetch origin agent/murph-personas
          git checkout -B agent/murph-personas origin/agent/murph-personas

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Apply narrow integrations
        id: integrate
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          base64 --decode scripts/apply-murph-persona-integration.mjs.gz.b64 \
            | gunzip > /tmp/apply-murph-persona-integration.mjs
          node /tmp/apply-murph-persona-integration.mjs \
            2>&1 | tee /tmp/murph-persona-integration.log

      - name: Upload integration diagnostic
        if: ${{ steps.integrate.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: murph-persona-integration-failure
          path: /tmp/murph-persona-integration.log
          if-no-files-found: error

      - name: Stop after integration failure
        if: ${{ steps.integrate.outcome == 'failure' }}
        run: exit 1

      - name: Install workspace
        if: ${{ steps.integrate.outcome == 'success' }}
        run: pnpm install --frozen-lockfile

      - name: Build contracts
        if: ${{ steps.integrate.outcome == 'success' }}
        run: pnpm --dir packages/contracts build

      - name: Generate preview MP3s when credentials are configured
        if: ${{ steps.integrate.outcome == 'success' }}
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MURPH_ELEVENLABS_MODEL_ID: ${{ secrets.MURPH_ELEVENLABS_MODEL_ID }}
          MURPH_ELEVENLABS_VOICE_ID: ${{ secrets.MURPH_ELEVENLABS_VOICE_ID }}
        shell: bash
        run: |
          if [[ -n "$ELEVENLABS_API_KEY" && -n "$MURPH_ELEVENLABS_VOICE_ID" ]]; then
            node scripts/generate-murph-persona-previews.mjs
          else
            echo "Preview credentials unavailable; retaining deterministic generator and paths."
          fi

      - name: Verify integration
        id: verify
        if: ${{ steps.integrate.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            pnpm exec vitest run --no-coverage \
              packages/contracts/test/assistant-personas.test.ts \
              packages/contracts/test/preferences.test.ts \
              packages/core/test/preferences.test.ts \
              packages/hosted-execution/test/hosted-execution-contract-guards.test.ts \
              packages/assistant-engine/test/persona-prompts.test.ts \
              packages/assistant-engine/test/assistant-style-dynamic-tool.test.ts \
              packages/assistant-engine/test/assistant-codex-turn-planning.test.ts \
              apps/web/test/home-initial-visit-dialog.test.tsx \
              apps/web/test/hosted-onboarding-member-preferences.test.ts \
              apps/web/test/account-settings-snapshot.test.ts
            pnpm typecheck:packages
            pnpm --dir apps/web typecheck
            git diff --check
          } 2>&1 | tee /tmp/murph-persona-verification.log

      - name: Upload verification diagnostic
        if: ${{ steps.integrate.outcome == 'success' && steps.verify.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: murph-persona-verification-failure
          path: /tmp/murph-persona-verification.log
          if-no-files-found: error

      - name: Stop after verification failure
        if: ${{ steps.integrate.outcome == 'success' && steps.verify.outcome == 'failure' }}
        run: exit 1

      - name: Commit integrated implementation
        if: ${{ steps.integrate.outcome == 'success' && steps.verify.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate Murph personas [persona-applied]"
          git push origin HEAD:agent/murph-personas
