name: Diagnose Junction scale and BP context refactor

on:
  push:
    branches:
      - codex/junction-scale-bp-vault-awareness
    paths:
      - .github/workflows/one-shot-junction-scale-bp-context-refactor-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[junction-scale-bp-context-diagnostic]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/junction-scale-bp-vault-awareness

      - name: Expose structural patch failure
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          import traceback

          try:
              original = Path(
                  ".github/workflows/one-shot-junction-scale-bp-context-refactor.yml",
              )
              workflow_text = original.read_text()
              marker = "      - name: Fold device availability into the existing context snapshot\n        shell: python\n        run: |\n"
              script = workflow_text.split(marker, 1)[1].split(
                  "\n      - name: Commit simplified implementation",
                  1,
              )[0]
              script = textwrap.dedent(script)
              audit_start = script.index("\naudit = ")
              cleanup_start = script.index("\nworkflow = Path(", audit_start)
              script = script[:audit_start] + script[cleanup_start:]
              exec(compile(script, str(original), "exec"), {"__name__": "__main__"})
          except Exception:
              details = traceback.format_exc()
              escaped = (
                  details
                  .replace('%', '%25')
                  .replace('\r', '%0D')
                  .replace('\n', '%0A')
              )
              print(f"::error title=Context snapshot refactor::{escaped}")
              raise
