name: PR 1405 simplification gate

on:
  pull_request:
    branches:
      - main
    types:
      - reopened

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr1405-simplification
  cancel-in-progress: false

jobs:
  simplify:
    if: github.event.pull_request.number == 1405
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/health-commons-agent-knowledge
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Materialize and apply the simplification
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_BLOBS: >-
            6816f2c4acd042fb57513191dfd63bb0edb05d8e
            726437795664272ac64a47159b5cd0bf7813c52e
            92493fd477e511a884ca4c68abf87b6f83cde7a9
            9f1febfcb882d3f3183240fb0245a15c78bef491
        run: |
          : > /tmp/pr1405-apply.py.gz.b64
          for blob in $PATCH_BLOBS; do
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs/$blob" \
              | python -c 'import base64,json,sys; sys.stdout.write(base64.b64decode(json.load(sys.stdin)["content"]).decode())' \
              >> /tmp/pr1405-apply.py.gz.b64
          done
          base64 --decode /tmp/pr1405-apply.py.gz.b64 | gzip --decompress > /tmp/pr1405-apply.py
          python /tmp/pr1405-apply.py
          rm -f \
            .github/workflows/pr1405-checkout-snapshot.yml \
            .github/workflows/pr1405-simplify-on-reopen.yml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate derived artifacts
        run: |
          pnpm --dir packages/health-commons generate
          pnpm --dir packages/assistant-engine build
          pnpm --dir packages/cli gen:config-schema

      - name: Verify Health Commons
        run: |
          pnpm --dir packages/health-commons typecheck
          pnpm exec vitest run \
            --config packages/health-commons/vitest.config.ts \
            --no-coverage \
            packages/health-commons/test/knowledge-index.test.ts \
            packages/health-commons/test/knowledge-index-full-catalog.test.ts \
            packages/health-commons/test/knowledge-question.test.ts

      - name: Verify CLI
        run: |
          pnpm --dir packages/cli typecheck
          pnpm exec vitest run \
            --config packages/cli/vitest.workspace.ts \
            --no-coverage \
            packages/cli/test/commons-command-coverage.test.ts

      - name: Verify assistant contracts
        run: |
          pnpm --dir packages/assistant-engine typecheck
          pnpm --dir packages/assistant-engine exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/model-behavior.test.ts \
            test/assistant-skill-assets.test.ts

      - name: Verify patch hygiene
        run: git diff --check

      - name: Commit and push the verified implementation
        run: |
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add -A
          git diff --cached --check
          git commit -m 'refactor(health-commons): simplify agent knowledge access'
          git push origin HEAD:codex/health-commons-agent-knowledge

      - name: Update the pull request description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/pr-body.md <<'EOF'
          ## Why

          Health Commons already held source-backed claims, extracted findings,
          safety guidance, and research summaries, but Murph used it reliably only
          for protocol and experiment work. Ordinary health answers therefore
          bypassed the product's best evidence.

          ## User-visible goal

          Before answering a substantive health question or making a health
          recommendation, Murph can perform one bounded Health Commons lookup using
          the member's full natural-language question. Knowledge does not require a
          protocol, experiment, or UI.

          ## Architecture

          - Health Commons remains the single source of public health knowledge.
          - Authored Markdown and JSONL remain authoritative.
          - The build produces one ignored, read-only SQLite FTS projection with no
            user data, runtime writes, service, migration, embedding model, or vector
            database.
          - The agent makes one call:
            `vault-cli commons knowledge search "<member question>" --format json`.
          - Topic resolution, focused retrieval, evidence limits, and matching
            safety happen inside Health Commons rather than in the model prompt.
          - The packet returns at most three directly sourced evidence items and one
            safety item.
          - Unknown or ambiguous topics fail closed. A missing index never blocks the
            reply.
          - Protocol discovery and experiment setup remain separate and optional.
            Murph does not create or suggest an experiment unless the member asks to
            try or track something.
          - The topic-specific red-light-therapy knowledge skill and device seed are
            removed. Health Commons owns the evidence; remaining skills own only
            genuine workflows.

          ## Complexity removed from the agent contract

          Murph no longer needs to know an exact Health Commons title or alias,
          invent a separate focus, emit the reserved `overall evidence` literal,
          choose between one and two searches, compare catalog hashes, or combine
          evidence and safety packets itself.

          ## Invariants

          - Every ordinary evidence item has direct source references.
          - Safety is restricted to the same resolved topic.
          - Hidden citations cannot establish topic identity.
          - Retrieval never starts or changes an experiment.
          - Public Health Commons stays separate from the member's private wiki.
          - Generated artifacts remain ignored build outputs.

          ## Verification

          The simplification gate runs before the commit is pushed:

          - Health Commons generation and typecheck.
          - Exact-topic regression suite plus full-question lookup coverage.
          - CLI typecheck and command coverage.
          - Assistant typecheck, prompt behavior, and skill-registry coverage.
          - `git diff --check`.

          ## Design proof

          Not applicable. This change has no web frontend or user-facing visual
          state.
          EOF
          gh api \
            --method PATCH \
            "repos/$GITHUB_REPOSITORY/pulls/1405" \
            --raw-field body="$(cat /tmp/pr-body.md)"

      - name: Record the simplification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/issues/1405/comments" \
            --raw-field body='Implemented the architecture simplification: one full-question Health Commons lookup, internal topic/evidence/safety resolution, and removal of the red-light topic knowledge skill. The commit was pushed only after the focused Health Commons, CLI, assistant, and diff-hygiene gates passed.'
