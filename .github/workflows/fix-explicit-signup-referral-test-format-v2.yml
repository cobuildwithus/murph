name: Fix explicit signup referral test format v2

on:
  push:
    branches:
      - feat/explicit-signup-referral-links
    paths:
      - .github/workflows/fix-explicit-signup-referral-test-format-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Format signup referral email-group assertion
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/assistant-runtime/test/hosted-runtime-group-tool-linq-context.test.ts")
          text = path.read_text()
          old = '''    await expect(groupTool.request({
    action: "create_signup_referral_link",
  })).resolves.toEqual({
    action: "create_signup_referral_link",
    result: {
      status: "unavailable",
      unavailableReason: "authenticated_sender_required",
    },
  });
'''
          new = '''    await expect(groupTool.request({
      action: "create_signup_referral_link",
    })).resolves.toEqual({
      action: "create_signup_referral_link",
      result: {
        status: "unavailable",
        unavailableReason: "authenticated_sender_required",
      },
    });
'''
          if text.count(old) != 1:
              raise SystemExit("malformed assertion did not match exactly once")
          path.write_text(text.replace(old, new, 1))
          Path(".github/workflows/fix-explicit-signup-referral-test-format-v2.yml").unlink()
          PY

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit formatting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/assistant-runtime/test/hosted-runtime-group-tool-linq-context.test.ts .github/workflows/fix-explicit-signup-referral-test-format-v2.yml
          git commit -m "test: clean signup referral email-group assertion"
          git push
