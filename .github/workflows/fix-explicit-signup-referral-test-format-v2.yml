name: Fix explicit signup referral test format v2

on:
  push:
    branches:
      - feat/explicit-signup-referral-links
    paths:
      - .github/workflows/fix-explicit-signup-referral-test-format-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Format signup referral email-group assertion
        run: python3 -c 'import base64; exec(base64.b64decode(""))'

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit formatting fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/assistant-runtime/test/hosted-runtime-group-tool-linq-context.test.ts .github/workflows/fix-explicit-signup-referral-test-format-v2.yml
          git commit -m "test: clean signup referral email-group assertion"
          git push
