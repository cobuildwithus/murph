name: Apply saved-card group funding integration

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reuse-saved-card-for-group-funding
          fetch-depth: 0
      - name: Apply integration patch
        id: apply
        run: |
          set +e
          python agent-scripts/apply-saved-card-group-funding.py > apply-saved-card-group-funding.log 2>&1
          status=$?
          cat apply-saved-card-group-funding.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-card-group-funding-apply-log
          path: apply-saved-card-group-funding.log
      - name: Commit implementation
        if: steps.apply.outputs.status == '0'
        run: |
          rm agent-scripts/apply-saved-card-group-funding.py
          rm .github/workflows/apply-saved-card-group-funding.yml
          rm apply-saved-card-group-funding.log
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add -A
          git commit -m "feat: reuse saved cards for group funding"
          git push origin HEAD:agent/reuse-saved-card-for-group-funding
      - name: Fail on patch assertion
        if: steps.apply.outputs.status != '0'
        run: exit 1
