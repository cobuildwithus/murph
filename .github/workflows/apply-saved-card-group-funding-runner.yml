name: Apply saved-card group funding integration

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reuse-saved-card-for-group-funding
          fetch-depth: 0
      - name: Apply integration patch
        run: |
          set +e
          python agent-scripts/apply-saved-card-group-funding.py > /tmp/apply.log 2>&1
          status=$?
          cat /tmp/apply.log
          if [ "$status" -ne 0 ]; then
            cp /tmp/apply.log agent-scripts/apply-saved-card-group-funding.error.log
            git config user.name "OpenAI"
            git config user.email "openai@users.noreply.github.com"
            git add agent-scripts/apply-saved-card-group-funding.error.log
            git commit -m "chore: capture saved-card patch failure"
            git push origin HEAD:agent/reuse-saved-card-for-group-funding
            exit "$status"
          fi
      - name: Commit implementation
        run: |
          rm -f agent-scripts/apply-saved-card-group-funding.error.log
          rm agent-scripts/apply-saved-card-group-funding.py
          rm .github/workflows/apply-saved-card-group-funding.yml
          git config user.name "OpenAI"
          git config user.email "openai@users.noreply.github.com"
          git add -A
          git commit -m "feat: reuse saved cards for group funding"
          git push origin HEAD:agent/reuse-saved-card-for-group-funding
