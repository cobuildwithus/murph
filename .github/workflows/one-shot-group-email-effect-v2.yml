name: One-shot generic group email effect v2

on:
  push:
    branches: [codex/newsletter-as-group-automation]
    paths: [.github/workflows/one-shot-group-email-effect-v2.yml]

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/newsletter-as-group-automation
      - name: Reuse the guarded source transform without the stale availability assertion
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          old = Path('.github/workflows/one-shot-group-email-effect.yml').read_text()
          marker = "      - name: Expose email as a generic group effect\n        shell: python\n        run: |\n"
          tail = "\n      - name: Commit source changes"
          script = old.split(marker, 1)[1].split(tail, 1)[0]
          script = textwrap.dedent(script)
          stale = '''text = replace_once(
              text,
              "    newsletterAvailable?: boolean | null\\n",
              "",
              'newsletter availability field',
          )
          '''
          if script.count(stale) != 1:
              raise SystemExit('could not isolate stale newsletter availability assertion')
          script = script.replace(stale, '', 1)
          exec(compile(script, '<group-email-refactor>', 'exec'))
          Path('.github/workflows/one-shot-group-email-effect-v2.yml').unlink()
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: expose scheduled email as a group effect"
          git push origin HEAD:codex/newsletter-as-group-automation
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --prefer-offline
      - name: Typecheck affected packages
        run: |
          pnpm --filter @murphai/assistant-engine typecheck
          pnpm --filter @murphai/assistant-runtime typecheck
