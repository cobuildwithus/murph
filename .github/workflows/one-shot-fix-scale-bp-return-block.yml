name: Normalize scale and BP snapshot return block

on:
  push:
    branches:
      - codex/junction-scale-bp-vault-awareness
    paths:
      - .github/workflows/one-shot-fix-scale-bp-return-block.yml

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[fix-scale-bp-return-block]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/junction-scale-bp-vault-awareness

      - name: Normalize the return block
        shell: python
        run: |
          from pathlib import Path

          target = Path(
              'packages/assistant-engine/src/assistant/context-snapshot.ts',
          )
          text = target.read_text()
          start_marker = (
              '    bodyMeasurementsLine: '
              'renderAssistantSnapshotBodyMeasurementsLine(\n'
          )
          end_marker = '    goalCount: goals.length,\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    bodyMeasurementsLine: renderAssistantSnapshotBodyMeasurementsLine(
            deviceMeasurementCoverage.latestBodyMeasurementDate,
          ),
          bloodPressureMeasurementsLine:
            renderAssistantSnapshotBloodPressureMeasurementsLine(
              deviceMeasurementCoverage.latestBloodPressureMeasurementDate,
            ),
          conditionCount: conditions.length,
          '''.replace('\n          ', '\n')
          target.write_text(text[:start] + replacement + text[end:])
          Path(
              '.github/workflows/one-shot-fix-scale-bp-return-block.yml',
          ).unlink()

      - name: Commit normalized return block
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize context snapshot return block"
          git push origin HEAD:codex/junction-scale-bp-vault-awareness
