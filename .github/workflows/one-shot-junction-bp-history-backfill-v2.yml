name: One-shot Junction blood pressure history backfill v2

on:
  push:
    branches:
      - codex/junction-blood-pressure-history-backfill
    paths:
      - .github/workflows/one-shot-junction-bp-history-backfill-v2.yml

permissions:
  contents: write

jobs:
  implement:
    if: contains(github.event.head_commit.message, '[junction-bp-history-backfill-v2]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/junction-blood-pressure-history-backfill

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply implementation and align existing proof
        shell: python
        run: |
          from pathlib import Path
          import textwrap

          original = Path('.github/workflows/one-shot-junction-bp-history-backfill.yml')
          workflow_text = original.read_text()
          marker = (
              '      - name: Implement resource-specific sparse timeseries backfill\n'
              '        shell: python\n'
              '        run: |\n'
          )
          script = workflow_text.split(marker, 1)[1].split(
              '\n      - name: Run focused device-sync proof',
              1,
          )[0]
          exec(
              compile(textwrap.dedent(script), str(original), 'exec'),
              {'__name__': '__main__'},
          )

          provider_test = Path('packages/device-syncd/test/junction-provider.test.ts')
          provider_text = provider_test.read_text()
          old_expected = '[...JUNCTION_DEFAULT_TIMESERIES_RESOURCES].sort(),'
          new_expected = '''[...JUNCTION_DEFAULT_TIMESERIES_RESOURCES]
                .filter((resource) => resource !== "blood_pressure")
                .sort(),'''.replace('\n                ', '\n    ')
          if provider_text.count(old_expected) != 2:
              raise RuntimeError(
                  'expected exactly two generic-backfill default-resource assertions, '
                  f'found {provider_text.count(old_expected)}',
              )
          provider_test.write_text(provider_text.replace(old_expected, new_expected))

          backfill_test = Path(
              'packages/device-syncd/test/junction-blood-pressure-backfill.test.ts',
          )
          backfill_text = backfill_test.read_text()
          old_resource = 'resource: url.pathname.slice(timeseriesPrefix.length),'
          new_resource = (
              'resource: url.pathname.slice(timeseriesPrefix.length)'
              '.replace(/\\/grouped$/u, ""),'
          )
          if backfill_text.count(old_resource) != 1:
              raise RuntimeError(
                  f'expected one captured resource parser, found {backfill_text.count(old_resource)}',
              )
          backfill_test.write_text(
              backfill_text.replace(old_resource, new_resource, 1),
          )

      - name: Run focused device-sync proof
        run: |
          pnpm --filter @murphai/device-syncd test
          pnpm --filter @murphai/device-syncd typecheck

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/one-shot-junction-bp-history-backfill.yml
          rm .github/workflows/one-shot-junction-bp-history-backfill-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: backfill sparse blood pressure history"
          git push origin HEAD:codex/junction-blood-pressure-history-backfill
