name: One-shot debug Junction BP history

on:
  push:
    branches:
      - codex/junction-blood-pressure-history-backfill
    paths:
      - .github/workflows/one-shot-debug-junction-bp-history.yml

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: codex/junction-blood-pressure-history-backfill
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final fixes and instrument the failing case
        run: |
          python scripts/one-shot-finalize-junction-bp-history.py
          python scripts/one-shot-debug-junction-bp-history.py
      - name: Run the instrumented regression
        run: pnpm --filter @murphai/device-syncd test -- junction-blood-pressure-backfill
