name: Friction Log

on:
  push:
    branches:
      - main
    paths:
      - ".agents/friction-log/**"
  issues:
    types:
      - closed
      - reopened
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * *"

concurrency:
  group: friction-log
  cancel-in-progress: false

permissions: {}

jobs:
  friction-log:
    name: Friction Log
    environment:
      name: frog-reconciliation
      deployment: false
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'issues' ||
      github.event.issue.user.login == vars.FROG_APP_BOT_LOGIN)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          cache: pnpm
          node-version-file: .nvmrc

      - name: Install reviewed dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Mint Frog GitHub App token
        id: frog-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FROG_APP_CLIENT_ID }}
          private-key: ${{ secrets.FROG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Report and reconcile frictions
        uses: wevm/frog/action@7b71c098683d49a573c279a2031a24205ea76841 # v1.1.0
        with:
          branch: frog/sync
          command: node_modules/.bin/frog
          issue-author: ${{ vars.FROG_APP_BOT_LOGIN }}
          push: pull-request
          token: ${{ steps.frog-app-token.outputs.token }}

      - name: Add required Murph PR context
        env:
          FROG_APP_BOT_LOGIN: ${{ vars.FROG_APP_BOT_LOGIN }}
          FROG_BASE_BRANCH: ${{ github.event.repository.default_branch }}
          FROG_PR_BODY_FOOTER: |-
            ## Why and outcome

            Reconcile committed developer-friction metadata with its linked GitHub issues.

            ## Product UX

            - Effort: Not applicable — internal developer tooling only.
            - Result: Not applicable
            - Walkthrough: No member-facing path changes.

            ## Evidence

            - Direct: The Frog reconciliation workflow reports the linked issue and pull-request state.
            - Coverage: The workflow guard checks the generated body, deployment disposition, and changelog declaration.

            ## Deployment concerns

            - Deployment: not applicable
            - Reason: This bookkeeping-only pull request does not change code, configuration, or runtime deploy boundaries.

            ## Changelog

            - Changelog: not applicable
            - Reason: This pull request only reconciles internal developer-friction bookkeeping and has no member-visible product behavior.
          FROG_PR_BRANCH: frog/sync
          GH_TOKEN: ${{ steps.frog-app-token.outputs.token }}
        run: |
          set -euo pipefail

          frog_pull_requests="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f state=open \
              -f base="$FROG_BASE_BRANCH" \
              -f head="${GITHUB_REPOSITORY_OWNER}:$FROG_PR_BRANCH" \
              -F per_page=2
          )"
          frog_pr_number="$(
            printf '%s' "$frog_pull_requests" \
              | pnpm exec tsx scripts/frog-pr-context.ts select
          )"
          if [[ -z "$frog_pr_number" ]]; then
            echo "No open Frog reconciliation pull request requires Murph context."
            exit 0
          fi

          frog_current_body_file="$(mktemp "${RUNNER_TEMP%/}/frog-pr-current.XXXXXX")"
          frog_body_file="$(mktemp "${RUNNER_TEMP%/}/frog-pr-body.XXXXXX")"
          gh pr view "$frog_pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --json body \
            --jq .body > "$frog_current_body_file"
          pnpm exec tsx scripts/frog-pr-context.ts normalize \
            < "$frog_current_body_file" \
            > "$frog_body_file"

          if cmp -s "$frog_current_body_file" "$frog_body_file"; then
            echo "The Frog reconciliation pull request already has exact Murph context."
            exit 0
          fi

          gh pr edit "$frog_pr_number" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file "$frog_body_file"
