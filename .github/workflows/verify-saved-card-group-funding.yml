name: Verify saved-card group funding

on:
  pull_request:
    branches:
      - agent/saved-card-funding-verify-runner

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reuse-saved-card-for-group-funding-v2
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run clean build and typecheck
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          pnpm build:workspace:clean > /tmp/build.log 2>&1
          build_exit=$?
          pnpm typecheck > /tmp/typecheck.log 2>&1
          typecheck_exit=$?
          echo "build_exit=$build_exit" >> "$GITHUB_OUTPUT"
          echo "typecheck_exit=$typecheck_exit" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload verification logs
        uses: actions/upload-artifact@v4
        with:
          name: saved-card-group-funding-verification-logs
          path: |
            /tmp/build.log
            /tmp/typecheck.log
      - name: Fail when verification failed
        if: steps.verify.outputs.build_exit != '0' || steps.verify.outputs.typecheck_exit != '0'
        run: exit 1
