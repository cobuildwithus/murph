name: Linq Production Canary

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Current Vercel production commit SHA to prove before the canary.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linq-production-canary
  cancel-in-progress: false

jobs:
  production-canary:
    name: Exercise hourly production iMessage journey
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted main controller
        shell: bash
        env:
          CONTROLLER_SHA: ${{ github.sha }}
          CONTROLLER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${CONTROLLER_REF}" == refs/heads/main ]] || { echo "::error::Production canary requires the main controller."; exit 1; }
          test "$(git rev-parse HEAD)" = "${CONTROLLER_SHA}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor "${CONTROLLER_SHA}" origin/main

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify current exact Vercel production deployment
        id: current-production
        shell: bash
        env:
          REQUESTED_DEPLOYED_SHA: ${{ inputs.deployed_sha }}
          HOSTED_WEB_PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
          HOSTED_WEB_VERCEL_PROJECT_ID: ${{ vars.HOSTED_WEB_VERCEL_PROJECT_ID }}
          HOSTED_WEB_VERCEL_TEAM_ID: ${{ vars.HOSTED_WEB_VERCEL_TEAM_ID }}
          HOSTED_WEB_VERCEL_TOKEN: ${{ secrets.HOSTED_WEB_VERCEL_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${HOSTED_WEB_VERCEL_TOKEN}" ] || [ -z "${HOSTED_WEB_VERCEL_PROJECT_ID}" ] || [ -z "${HOSTED_WEB_PRODUCTION_BASE_URL}" ]; then
            echo "::error::The Vercel production verifier is not configured."
            exit 1
          fi

          current_sha="$(pnpm --dir apps/web exec tsx scripts/resolve-vercel-production-alias-sha.ts)"
          [[ "${current_sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Production alias did not resolve to an exact SHA."; exit 1; }
          git merge-base --is-ancestor "${current_sha}" origin/main || { echo "::error::Production deployment is outside protected main history."; exit 1; }
          if [[ -n "${REQUESTED_DEPLOYED_SHA}" && "${REQUESTED_DEPLOYED_SHA}" != "${current_sha}" ]]; then
            echo "::error::Requested production deployment is no longer current."
            exit 1
          fi
          verified_sha="$(DEPLOYED_SHA="${current_sha}" pnpm --dir apps/web exec tsx scripts/verify-current-vercel-production-deployment.ts)"
          [[ "${verified_sha}" == "${current_sha}" ]] || { echo "::error::Exact production verification returned a different revision."; exit 1; }
          echo "deployed_sha=${current_sha}" >> "${GITHUB_OUTPUT}"

      - name: Run production iMessage journey
        env:
          HOSTED_WEB_PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
          MURPH_LINQ_PRODUCTION_CANARY_RESET_SECRET: ${{ secrets.MURPH_LINQ_PRODUCTION_CANARY_RESET_SECRET }}
          MURPH_LINQ_PRODUCTION_CANARY_TARGET_PHONE_NUMBER: ${{ secrets.MURPH_LINQ_PRODUCTION_CANARY_TARGET_PHONE_NUMBER }}
          SPECTRUM_PROJECT_ID: ${{ secrets.MURPH_LINQ_PRODUCTION_CANARY_SPECTRUM_PROJECT_ID }}
          SPECTRUM_PROJECT_SECRET: ${{ secrets.MURPH_LINQ_PRODUCTION_CANARY_SPECTRUM_PROJECT_SECRET }}
        run: pnpm --filter @murphai/hosted-web linq:production-canary

      - name: Record completed journey for the exercised deployment
        env:
          DEPLOYED_SHA: ${{ steps.current-production.outputs.deployed_sha }}
          HOSTED_WEB_PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
          HOSTED_WEB_VERCEL_PROJECT_ID: ${{ vars.HOSTED_WEB_VERCEL_PROJECT_ID }}
          HOSTED_WEB_VERCEL_TEAM_ID: ${{ vars.HOSTED_WEB_VERCEL_TEAM_ID }}
          HOSTED_WEB_VERCEL_TOKEN: ${{ secrets.HOSTED_WEB_VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          verified_sha="$(pnpm --dir apps/web exec tsx scripts/verify-current-vercel-production-deployment.ts)"
          [[ "${verified_sha}" == "${DEPLOYED_SHA}" ]] || { echo "::error::Production changed during the journey."; exit 1; }
          echo "::notice::linq-canary result=passed journey_executed=true deployed_sha=${verified_sha} completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
