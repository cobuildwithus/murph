name: Validate final PR 1405 candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-and-squash:
    if: github.event.pull_request.head.ref == 'agent/pr1405-final-validated'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/pr1405-final-validated
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Apply final correction
        run: python3 .github/scripts/pr1405-final-validate.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Health Commons
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --dir packages/health-commons generate
          pnpm --dir packages/health-commons typecheck
          pnpm --dir packages/health-commons test:vitest

      - name: Build workspace
        run: pnpm build

      - name: Verify CLI
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --dir packages/cli gen:config-schema
          pnpm --dir packages/cli typecheck
          pnpm --dir packages/cli exec vitest run --config vitest.workspace.ts --no-coverage test/commons-command-coverage.test.ts

      - name: Verify assistant behavior and skill ownership
        shell: bash
        run: |
          set -euxo pipefail
          pnpm --dir packages/assistant-engine typecheck
          pnpm --dir packages/assistant-engine exec vitest run --config vitest.config.ts --no-coverage \
            test/model-behavior.test.ts \
            test/assistant-skill-assets.test.ts \
            test/assistant-codex-real-e2e.test.ts

      - name: Verify hosted package typing
        run: pnpm --dir apps/cloudflare typecheck

      - name: Verify patch hygiene
        run: git diff --check

      - name: Publish one clean validated commit
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          active = Path('agent-docs/exec-plans/active/2026-08-07-health-commons-agent-knowledge.md')
          completed = Path('agent-docs/exec-plans/completed/2026-08-07-health-commons-agent-knowledge.md')
          if not active.exists():
              raise SystemExit('active Health Commons plan is missing')
          text = active.read_text()
          text = text.replace('Status: active', 'Status: completed', 1)
          text = text.replace('[in progress]', '[complete]')
          if 'Completed: 2026-08-10' not in text:
              text = text.rstrip() + '\n\nCompleted: 2026-08-10\n'
          completed.parent.mkdir(parents=True, exist_ok=True)
          completed.write_text(text)
          active.unlink()
          PY

          find .github -maxdepth 3 -type f -name 'pr1405*' -delete
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --mixed 5f1669983dcd3850cc171877f04945aa43cc2176
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'refactor(health-commons): simplify agent knowledge access'
          git push --force-with-lease origin HEAD:agent/pr1405-final-validated
