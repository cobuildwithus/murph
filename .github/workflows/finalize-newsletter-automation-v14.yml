name: Finalize newsletter automation refactor v14

on:
  push:
    branches:
      - codex/simplify-newsletter-automation
    paths:
      - .github/workflows/finalize-newsletter-automation-v14.yml

permissions:
  contents: write

jobs:
  finalize:
    if: contains(github.event.head_commit.message, '[finalize-newsletter-v14]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/simplify-newsletter-automation

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Rebase onto current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main

      - name: Apply reviewed patch and update canonical docs index
        shell: python
        run: |
          from pathlib import Path
          import runpy

          def extract_step_script(path: str, step_name: str) -> str:
              lines = Path(path).read_text().splitlines()
              step_index = next(
                  index for index, line in enumerate(lines)
                  if line.strip() == f'- name: {step_name}'
              )
              run_index = next(
                  index for index in range(step_index + 1, len(lines))
                  if lines[index].strip() == 'run: |'
              )
              output: list[str] = []
              for line in lines[run_index + 1:]:
                  if line.startswith('      - name:') or line.startswith('      - uses:'):
                      break
                  if line.startswith('          '):
                      output.append(line[10:])
                  elif not line.strip():
                      output.append('')
                  else:
                      raise SystemExit(f'unexpected workflow indentation: {line!r}')
              return '\n'.join(output) + '\n'

          script = extract_step_script(
              '.github/workflows/finalize-newsletter-automation-v13.yml',
              'Apply reviewed patch with escape-free line-safe matching',
          )
          patch_script = Path('/tmp/finalize-newsletter-automation-v14.py')
          patch_script.write_text(script)
          runpy.run_path(str(patch_script), run_name='__main__')

          index_path = Path('agent-docs/index.md')
          lines = index_path.read_text().splitlines()
          prefix = '| `agent-docs/product-specs/group-health-newsletter.md` |'
          matching = [
              index for index, line in enumerate(lines)
              if line.startswith(prefix)
          ]
          if len(matching) != 1:
              raise SystemExit(
                  'expected one canonical newsletter index row, found '
                  f'{len(matching)}'
              )
          lines[matching[0]] = (
              '| `agent-docs/product-specs/group-health-newsletter.md` | '
              'Implemented ordinary recurring group newsletter automation: '
              'one stable authenticated-group slug, host-owned current-chat or '
              'group-email delivery state, cron and fresh-continuity validation, '
              'the first-send opt-out window, bounded historical compatibility, '
              'public skill-owned composition rules, canonical group projection '
              'reads, and reuse of the generic scheduler, runtime, and outbox '
              'without a second newsletter control plane. | '
              'Group newsletter behavior | Medium | 2026-08-09 |'
          )
          index_path.write_text('\n'.join(lines) + '\n')

          current = Path('.github/workflows/finalize-newsletter-automation-v14.yml')
          if current.exists():
              current.unlink()

      - name: Install workspace dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline

      - name: Focused assistant-engine proof
        run: >-
          pnpm --dir packages/assistant-engine exec vitest run
          --config vitest.config.ts --no-coverage
          test/automation-delivery.test.ts
          test/assistant-managed-group-skill-fallbacks.test.ts
          test/assistant-hosted-domain-tools.test.ts
          test/assistant-skill-assets.test.ts

      - name: Focused assistant-runtime proof
        run: >-
          pnpm --dir packages/assistant-runtime exec vitest run
          --config vitest.config.ts --no-coverage
          test/automation-tool-policy.test.ts

      - name: Typecheck touched owners
        run: |
          pnpm --dir packages/assistant-engine typecheck
          pnpm --dir packages/assistant-runtime typecheck

      - name: Repository validation
        run: |
          pnpm docs:drift
          pnpm test:diff:local
          git diff --check
          for workflow in finalize-newsletter-automation{,-v2,-v3,-v4,-v5,-v6,-v7,-v8,-v9,-v10,-v11,-v12,-v13,-v14}.yml; do
            test ! -e ".github/workflows/$workflow"
          done
          test ! -e agent-docs/exec-plans/active/2026-08-09-newsletter-as-automation.md
          test -e agent-docs/exec-plans/completed/2026-08-09-newsletter-as-automation.md
          grep -q 'system:automation-delivery:group-email' packages/assistant-engine/src/assistant/automation-delivery.ts
          grep -q 'resolveHostedAutomationSavePolicy' packages/assistant-runtime/src/hosted-runtime/workspace-assistant-phase.ts
          grep -q 'resolveAutomationGroupEmailConfigurationIssue' packages/assistant-engine/src/assistant/cron/execution.ts
          grep -q 'Read the `group-newsletter` skill' packages/assistant-engine/src/assistant/group-newsletter-automation.ts
          grep -q 'without a second newsletter control plane' agent-docs/index.md

      - name: Commit and push reviewed fixes
        run: |
          git add -A
          git commit -m "refactor(automation): finalize ordinary group newsletters"
          git push --force-with-lease origin HEAD:codex/simplify-newsletter-automation
