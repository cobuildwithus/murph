name: Agent Max design proof publisher

on:
  push:
    branches:
      - agent/add-murph-max-plan
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: agent-max-design-proof-publisher-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: github.actor == 'rocketman-21'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Download the validated proof artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 31240331177 \
            --repo cobuildwithus/murph \
            --name agent-max-design-proof-d1534479358cfc8e25a74f21dcfc2c0e31375adf \
            --dir "$RUNNER_TEMP/agent-max-design-proof"
          test -s "$RUNNER_TEMP/agent-max-design-proof/max-desktop.png"
          test -s "$RUNNER_TEMP/agent-max-design-proof/max-mobile.png"

      - name: Publish proof on a dedicated non-merge branch
        run: |
          set -euo pipefail
          git fetch origin main
          git switch --force-create design-proof-pr-1440-max origin/main
          mkdir -p .design-proof/pr-1440
          cp "$RUNNER_TEMP/agent-max-design-proof/max-desktop.png" \
            .design-proof/pr-1440/max-desktop.png
          cp "$RUNNER_TEMP/agent-max-design-proof/max-mobile.png" \
            .design-proof/pr-1440/max-mobile.png
          git add .design-proof/pr-1440
          git config user.name "rocketman"
          git config user.email "20303031+rocketman-21@users.noreply.github.com"
          git commit -m "docs: publish PR 1440 Max design proof"
          git push --force origin HEAD:refs/heads/design-proof-pr-1440-max
