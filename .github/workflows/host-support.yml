name: Murph Host Support

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  push:
    branches:
      - main

# One CI run per ref per workflow: a new push to a PR or main cancels the
# superseded run immediately, freeing org-level concurrency slots.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI must still run apps/web verify, but this workflow does not have the hosted
  # onboarding or hosted device-sync secrets that production deploy surfaces carry.
  # The database/hosted-device/contact-privacy values below are deterministic CI-only
  # placeholders that let hosted-web routes boot for build/smoke without wiring the
  # real production control-plane secrets into GitHub Actions.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/murph_test
  HOSTED_DEVICE_ROUTING_INDEX_KEY: 0101010101010101010101010101010101010101010101010101010101010101
  HOSTED_CONTACT_PRIVACY_KEYS: v1:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
  HOSTED_MAILBOX_FINGERPRINT_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
  NEXT_PUBLIC_PRIVY_APP_ID: ${{ vars.HOSTED_WEB_VERIFY_PRIVY_APP_ID }}
  PRIVY_VERIFICATION_KEY: ci-hosted-web-verification-key

jobs:
  markdown-docs-scope:
    name: Classify host-support documentation scope
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    outputs:
      markdown_only: ${{ steps.scope-result.outputs.markdown_only }}
    steps:
      - name: Check out trusted base classifier
        id: checkout-base
        continue-on-error: true
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci-markdown-docs-scope.mjs
          sparse-checkout-cone-mode: false

      - name: Run trusted exact-PR classifier
        id: classify
        if: ${{ steps.checkout-base.outcome == 'success' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.base.sha }}"
          if [[ ! -f scripts/ci-markdown-docs-scope.mjs ]]; then
            echo "markdown_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/ci-markdown-docs-scope.mjs

      - name: Publish fail-closed scope result
        id: scope-result
        if: ${{ always() }}
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout-base.outcome }}
          CLASSIFIER_OUTCOME: ${{ steps.classify.outcome }}
          CLASSIFIER_MARKDOWN_ONLY: ${{ steps.classify.outputs.markdown_only }}
        shell: bash
        run: |
          set -euo pipefail
          markdown_only=false
          if [[ "$CHECKOUT_OUTCOME" == "success" && "$CLASSIFIER_OUTCOME" == "success" && "$CLASSIFIER_MARKDOWN_ONLY" == "true" ]]; then
            markdown_only=true
          fi
          echo "markdown_only=$markdown_only" >> "$GITHUB_OUTPUT"
          echo "Host-support scope classified with trusted base policy: markdown_only=$markdown_only"

  cli-host-matrix:
    name: CLI host matrix (${{ matrix.os }})
    needs: markdown-docs-scope
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - name: Record Markdown documentation receipt
        if: ${{ github.event_name == 'pull_request' && needs.markdown-docs-scope.result == 'success' && needs.markdown-docs-scope.outputs.markdown_only == 'true' }}
        run: echo "CLI host matrix (${{ matrix.os }}) satisfied by exact-inventory Markdown documentation proof."

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        with:
          persist-credentials: false

      - name: Setup pnpm
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        env:
          # The macOS host leg is the portability check, not the build-speed lane.
          # Keep package-script builds serial there so downstream `tsc -b --force`
          # scripts do not rewrite shared project-reference declarations at once.
          MURPH_BUILD_WORKSPACE_CONCURRENCY: ${{ matrix.os == 'macos-latest' && '1' || '4' }}
        run: pnpm build

      - name: Prepare built CLI runtime artifacts
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        run: pnpm build:test-runtime:prepared

      - name: Run cross-platform CLI coverage
        if: ${{ github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true' }}
        run: env MURPH_PREPARED_CLI_RUNTIME_ARTIFACTS=1 pnpm exec vitest run packages/cli/test/setup-cli.test.ts packages/cli/test/inbox-service-boundaries.test.ts --no-coverage --maxWorkers 1

  markdown-docs-proof:
    name: Markdown documentation proof
    needs: markdown-docs-scope
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.markdown-docs-scope.result == 'success' && needs.markdown-docs-scope.outputs.markdown_only == 'true' }}
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact documentation merge candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check exact documentation diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "$EXPECTED_MERGE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet --no-tags --no-write-fetch-head --depth=1 origin "$BASE_SHA"
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git diff --check "$BASE_SHA" "$CANDIDATE_SHA" --

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install documentation tooling
        run: pnpm install --frozen-lockfile

      - name: Check durable documentation drift and references
        env:
          MURPH_DOCS_DRIFT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MURPH_DOCS_DRIFT_CANDIDATE_SHA: ${{ github.sha }}
        run: pnpm docs:drift

      - name: Check documentation gardening
        run: pnpm docs:gardening

  release-build-typecheck-linux:
    name: Release build/typecheck (ubuntu)
    needs: markdown-docs-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Validate release metadata
        run: |
          bash -n scripts/release-check.sh scripts/release.sh scripts/update-changelog.sh scripts/generate-release-notes.sh
          node --check scripts/release-artifact-secret-guard.mjs
          node --check scripts/release-helpers.mjs
          node --check scripts/verify-release-target.mjs
          node --check scripts/pack-publishables.mjs
          node --check scripts/publish-publishables.mjs
          node --test scripts/release-artifact-secret-guard.test.mjs
          node --test scripts/check-runner-bundle-budget-ci.test.mjs
          node scripts/check-runner-bundle-budget-ci.mjs
          node scripts/verify-release-target.mjs

      - name: Clean workspace build
        run: pnpm build:workspace:clean

      # Restore only on trusted main pushes, after the cold build, so PR code
      # cannot seed later required checks and the clean build stays cache-free.
      - name: Restore release typecheck build info
        if: github.event_name == 'push'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            tsconfig.tools.tsbuildinfo
            packages/*/*typecheck*.tsbuildinfo
            apps/cloudflare/typecheck.tsbuildinfo
            apps/web/.next/cache/tsconfig.tsbuildinfo
          key: tsbuildinfo-release-build-typecheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'packages/*/package.json', 'apps/*/package.json', 'tsconfig*.json', 'packages/*/tsconfig*.json', 'apps/*/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-release-build-typecheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'packages/*/package.json', 'apps/*/package.json', 'tsconfig*.json', 'packages/*/tsconfig*.json', 'apps/*/tsconfig*.json') }}-

      - name: Typecheck
        run: pnpm typecheck

      - name: Verify built package boundaries
        run: |
          pnpm --dir packages/messaging-ingress verify:package-boundary:prepared
          pnpm --dir packages/inboxd verify:package-boundary:prepared
          pnpm --dir packages/hosted-local-harness verify:package-boundary:prepared

      - name: Test repo verification tools
        run: pnpm test:repo-tools

      - name: Artifact hygiene
        run: pnpm no-js

      - name: Doc gardening
        run: bash scripts/doc-gardening.sh --fail-on-issues

  release-package-coverage-linux:
    name: Release package coverage (${{ matrix.shard }})
    needs: markdown-docs-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Three shards balanced so each job's test wall clock roughly matches the
      # slowest single package lane (the CLI suite, ~5 minutes). Fewer, fuller
      # shards keep per-job checkout/install overhead and org-level concurrency
      # slot usage down; the org concurrency cap is the real CI bottleneck.
      matrix:
        include:
          - shard: cli
            packages: packages/cli
          - shard: assistant
            packages: >-
              packages/assistant-engine
              packages/assistant-cli
              packages/assistantd
              packages/hosted-execution
          - shard: platform
            packages: >-
              packages/assistant-runtime
              packages/setup-cli
              packages/operator-config
              packages/core
              packages/query
              packages/vault-usecases
              packages/device-syncd
              packages/exercise-library
              packages/health-metrics
              packages/inboxd
              packages/importers
              packages/runtime-state
              packages/cloudflare-hosted-control
              packages/clinical-records
              packages/contracts
              packages/gateway-core
              packages/inbox-services
              packages/messaging-ingress
              packages/openclaw-plugin
              packages/parsers
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Health Commons catalog
        run: pnpm health-commons:generate

      - name: Prepare built CLI runtime artifacts
        if: ${{ matrix.shard == 'cli' }}
        run: pnpm build:test-runtime:prepared

      - name: Verify CLI package shape
        if: ${{ matrix.shard == 'cli' }}
        run: pnpm --dir packages/cli exec tsx scripts/verify-package-shape.ts

      - name: Run package coverage shard
        run: |
          for package_dir in ${{ matrix.packages }}; do
            if [[ "$package_dir" == "packages/cli" ]]; then
              env MURPH_PREPARED_CLI_RUNTIME_ARTIFACTS=1 MURPH_CLI_RELEASE_TARBALL_TEST=1 MURPH_VITEST_MAX_WORKERS=50% pnpm exec vitest run --config packages/cli/vitest.workspace.ts --coverage
            else
              env MURPH_VITEST_MAX_WORKERS=50% pnpm --dir "$package_dir" test:coverage
            fi
          done

  release-app-verification-linux:
    name: Release app verification (ubuntu)
    needs: markdown-docs-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true') }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_DB: murph_search_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d murph_search_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      MURPH_APP_VERIFY_PARALLEL: "1"
      MURPH_SUPPLEMENT_SEARCH_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/murph_search_test
      MURPH_VERIFY_STEP_PARALLEL: "1"
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Codex upstream egress source
        run: pnpm --dir apps/cloudflare verify:codex-upstream-source

      # Keep trusted-main app reuse on its own namespace so the two release
      # lanes never exchange incremental state and PRs cannot seed it.
      - name: Restore release app verification build info
        if: github.event_name == 'push'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            apps/cloudflare/typecheck.tsbuildinfo
            apps/web/.next/cache/tsconfig.tsbuildinfo
            apps/web/.next/cache/tsconfig.next.tsbuildinfo
          key: tsbuildinfo-release-app-verification-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'packages/*/package.json', 'apps/*/package.json', 'tsconfig*.json', 'packages/*/tsconfig*.json', 'apps/*/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-release-app-verification-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.nvmrc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'packages/*/package.json', 'apps/*/package.json', 'tsconfig*.json', 'packages/*/tsconfig*.json', 'apps/*/tsconfig*.json') }}-

      - name: Run app verification
        run: pnpm test:apps

  production-runner-bundle-budget-linux:
    name: Production runner bundle budget (ubuntu)
    needs: markdown-docs-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true') }}
    runs-on: ubuntu-24.04
    env:
      MURPH_RUNNER_BUNDLE_BUILD_CONCURRENCY: "4"
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          path: candidate
          ref: ${{ github.sha }}

      - name: Prove candidate and exact first parent
        id: revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git -C candidate rev-parse HEAD)"
          base_sha="$(git -C candidate rev-parse HEAD^1)"
          test "$candidate_sha" = "$EXPECTED_CANDIDATE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$(git -C candidate rev-parse HEAD^2)" = "$EXPECTED_PR_HEAD_SHA"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact first parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          path: base
          ref: ${{ steps.revisions.outputs.base_sha }}

      - name: Require deployment runner platform
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: candidate/package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: candidate/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            base/pnpm-lock.yaml
            candidate/pnpm-lock.yaml

      - name: Install base deps
        working-directory: base
        run: pnpm install --frozen-lockfile

      - name: Install candidate deps
        working-directory: candidate
        run: pnpm install --frozen-lockfile

      - name: Assemble base production runner bundle
        working-directory: base
        run: pnpm --dir apps/cloudflare runner:bundle

      - name: Assemble candidate production runner bundle
        working-directory: candidate
        run: pnpm --dir apps/cloudflare runner:bundle

      - name: Compare exact total output
        run: node candidate/scripts/check-runner-bundle-budget-ci.mjs compare base candidate

  release-fixture-coverage-linux:
    name: Release fixture coverage (ubuntu)
    needs: markdown-docs-scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.markdown-docs-scope.outputs.markdown_only != 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run fixture coverage
        run: pnpm test:scenario-integrity

  release-checks-linux:
    name: Release checks (ubuntu)
    runs-on: ubuntu-24.04
    needs:
      - markdown-docs-scope
      - markdown-docs-proof
      - release-build-typecheck-linux
      - release-package-coverage-linux
      - release-app-verification-linux
      - release-fixture-coverage-linux
      - production-runner-bundle-budget-linux
    if: ${{ !cancelled() }}
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - name: Check release proof mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RESULT: ${{ needs.markdown-docs-scope.result }}
          MARKDOWN_ONLY: ${{ needs.markdown-docs-scope.outputs.markdown_only }}
          DOCS_RESULT: ${{ needs.markdown-docs-proof.result }}
          BUILD_RESULT: ${{ needs.release-build-typecheck-linux.result }}
          PACKAGE_RESULT: ${{ needs.release-package-coverage-linux.result }}
          APP_RESULT: ${{ needs.release-app-verification-linux.result }}
          FIXTURE_RESULT: ${{ needs.release-fixture-coverage-linux.result }}
          BUNDLE_RESULT: ${{ needs.production-runner-bundle-budget-linux.result }}
        shell: bash
        run: |
          set -euo pipefail
          mode=full-shard
          if [[ "$EVENT_NAME" == "pull_request" && "$SCOPE_RESULT" == "success" && "$MARKDOWN_ONLY" == "true" ]]; then
            mode=docs-proof
          fi

          case "$mode" in
            docs-proof)
              if [[ "$DOCS_RESULT" != "success" ]]; then
                echo "Markdown documentation proof did not succeed." >&2
                exit 1
              fi
              for result in "$BUILD_RESULT" "$PACKAGE_RESULT" "$APP_RESULT" "$FIXTURE_RESULT" "$BUNDLE_RESULT"; do
                if [[ "$result" != "skipped" ]]; then
                  echo "Markdown documentation proof requires every release shard to remain skipped." >&2
                  exit 1
                fi
              done
              echo "Release checks satisfied by exact-inventory Markdown documentation proof."
              ;;
            full-shard)
              if [[ "$DOCS_RESULT" != "skipped" ]]; then
                echo "Full release proof requires the documentation-only job to remain skipped." >&2
                exit 1
              fi
              for result in "$BUILD_RESULT" "$PACKAGE_RESULT" "$APP_RESULT" "$FIXTURE_RESULT" "$BUNDLE_RESULT"; do
                if [[ "$result" != "success" ]]; then
                  echo "Full release proof requires every release shard to succeed." >&2
                  exit 1
                fi
              done
              echo "Release checks satisfied by full release shards."
              ;;
            *)
              echo "Unsupported release proof mode." >&2
              exit 1
              ;;
          esac
