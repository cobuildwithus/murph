name: Murph Host Support

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  push:
    branches:
      - main

# PR updates supersede their previous proof. Main commits keep independent
# proof so later merges cannot cancel a production candidate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI must still run apps/web verify, but this workflow does not have the hosted
  # onboarding or hosted device-sync secrets that production deploy surfaces carry.
  # The database/hosted-device/contact-privacy values below are deterministic CI-only
  # placeholders that let hosted-web routes boot for build/smoke without wiring the
  # real production control-plane secrets into GitHub Actions.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:1/murph_test
  HOSTED_DEVICE_ROUTING_INDEX_KEY: 0101010101010101010101010101010101010101010101010101010101010101
  HOSTED_CONTACT_PRIVACY_KEYS: v1:BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
  HOSTED_MAILBOX_FINGERPRINT_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc

jobs:
  cli-host-matrix:
    name: CLI host matrix (${{ matrix.os }})
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-latest
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        env:
          # The macOS host leg is the portability check, not the build-speed lane.
          # Keep package-script builds serial there so downstream `tsc -b --force`
          # scripts do not rewrite shared project-reference declarations at once.
          MURPH_BUILD_WORKSPACE_CONCURRENCY: ${{ matrix.os == 'macos-latest' && '1' || '4' }}
        run: pnpm build

      - name: Prepare built CLI runtime artifacts
        run: pnpm build:test-runtime:prepared

      - name: Run cross-platform CLI coverage
        run: env MURPH_PREPARED_CLI_RUNTIME_ARTIFACTS=1 pnpm exec vitest run packages/cli/test/cli-entry.test.ts packages/cli/test/vault-cli-routing.test.ts packages/cli/test/inbox-service-boundaries.test.ts --no-coverage --maxWorkers 1

  release-verification-plan-linux:
    name: Release verification plan (ubuntu)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    outputs:
      package_matrix: ${{ steps.verification_plan.outputs.package_matrix }}
      hosted_web_test_matrix: ${{ steps.verification_plan.outputs.hosted_web_test_matrix }}
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - name: Check out exact release candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Validate and publish release verification plan
        id: verification_plan
        run: node scripts/release-verification-plan.mjs --github-output "$GITHUB_OUTPUT"

  release-build-typecheck-linux:
    name: Release build/typecheck (ubuntu)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Guard cyclomatic complexity regressions
        if: ${{ github.event_name == 'pull_request' }}
        env:
          MURPH_COMPLEXITY_BASE_SHA: ${{ github.sha }}^1
          MURPH_COMPLEXITY_HEAD_SHA: ${{ github.sha }}
        run: pnpm complexity:diff

      # Exercise owner history before the broad build. A first reply alone
      # cannot prove that later wakes still preempt checkpoints.
      - name: Gate foreground priority across runtime transitions
        timeout-minutes: 5
        run: >-
          pnpm --dir packages/assistant-runtime test
          test/hosted-runtime-promoted-foreground-priority.test.ts

      - name: Validate runtime artifact guards
        run: |
          node --check scripts/release-artifact-secret-guard.mjs
          node --test scripts/release-artifact-secret-guard.test.mjs
          node --test scripts/check-runner-bundle-budget-ci.test.mjs
          node --test scripts/benchmark-event-list.test.mjs
          node --test scripts/benchmark-event-read-import.test.mjs
          node scripts/check-runner-bundle-budget-ci.mjs

      - name: Clean workspace build
        run: pnpm build:workspace:clean

      # Restore only on trusted main pushes, after the cold build, so PR code
      # cannot seed later required checks and the clean build stays cache-free.
      - name: Restore release typecheck build info
        if: github.event_name == 'push'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            tsconfig.tools.tsbuildinfo
            packages/*/*typecheck*.tsbuildinfo
            apps/cloudflare/typecheck.tsbuildinfo
            apps/web/.next/cache/tsconfig.tsbuildinfo
          key: tsbuildinfo-release-build-typecheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/run-typescript.mjs', '.nvmrc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'packages/*/package.json', 'apps/*/package.json', 'tsconfig*.json', 'packages/*/tsconfig*.json', 'apps/*/tsconfig*.json') }}-${{ github.sha }}
          restore-keys: |
            tsbuildinfo-release-build-typecheck-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/run-typescript.mjs', '.nvmrc', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'packages/*/package.json', 'apps/*/package.json', 'tsconfig*.json', 'packages/*/tsconfig*.json', 'apps/*/tsconfig*.json') }}-

      - name: Typecheck
        env:
          MURPH_TYPECHECK_COMPILER: tsrs
        run: pnpm typecheck

      - name: Verify built package boundaries
        run: |
          pnpm --dir packages/messaging-ingress verify:package-boundary:prepared
          pnpm --dir packages/inboxd verify:package-boundary:prepared
          pnpm --dir packages/hosted-local-harness verify:package-boundary:prepared

      - name: Test repo verification tools
        env:
          MURPH_VITEST_FILE_PARALLELISM: "1"
          MURPH_VITEST_MAX_WORKERS: "2"
        run: pnpm test:repo-tools

      - name: Artifact hygiene
        run: pnpm no-js

      - name: Doc gardening
        run: bash scripts/doc-gardening.sh --fail-on-issues

  release-package-coverage-linux:
    name: Release package coverage (${{ matrix.shard }})
    needs:
      - release-verification-plan-linux
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # The validated release plan isolates CLI, Assistant Engine, Assistant
      # Runtime, and Hosted Local Harness, with three platform groups, and
      # splits the three long owners' test files across runners by file.
      # Package commands remain serial; Assistant Engine and Assistant Runtime
      # each run two isolated test files at a time with serial in-file suites.
      matrix: ${{ fromJSON(needs.release-verification-plan-linux.outputs.package_matrix) }}
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Health Commons catalog
        run: pnpm health-commons:generate

      - name: Prepare built CLI runtime artifacts
        if: ${{ matrix.package_shard == 'cli' || matrix.package_shard == 'assistant-engine' }}
        run: pnpm build:test-runtime:prepared

      - name: Verify CLI runtime artifacts
        if: ${{ matrix.package_shard == 'cli' }}
        run: pnpm --dir packages/cli exec tsx scripts/verify-runtime-artifacts.ts

      - name: Run package coverage shard
        shell: bash
        env:
          PACKAGE_SHARD: ${{ matrix.package_shard }}
          # Empty unless the release plan splits this package's files; then
          # this runner owns files i of n and its siblings own the rest.
          VITEST_SHARD: ${{ matrix.vitest_shard }}
        run: |
          set -euo pipefail
          package_dirs="$(node scripts/release-verification-plan.mjs --package-dirs "$PACKAGE_SHARD")"
          if [[ -z "$package_dirs" ]]; then
            echo "Release package shard '$PACKAGE_SHARD' matched zero packages." >&2
            exit 1
          fi

          while IFS= read -r package_dir; do
            [[ -n "$package_dir" ]] || continue
            if [[ "$package_dir" == "packages/cli" ]]; then
              env MURPH_PREPARED_CLI_RUNTIME_ARTIFACTS=1 MURPH_VITEST_MAX_WORKERS=50% pnpm exec vitest run --config packages/cli/vitest.workspace.ts --coverage ${VITEST_SHARD:+--shard "$VITEST_SHARD"}
            elif [[ "$package_dir" == "packages/assistant-engine" || "$package_dir" == "packages/assistant-runtime" ]]; then
              env MURPH_VITEST_FILE_PARALLELISM=1 MURPH_VITEST_MAX_WORKERS=2 pnpm --dir "$package_dir" test:coverage ${VITEST_SHARD:+--shard "$VITEST_SHARD"}
            elif [[ -n "$VITEST_SHARD" ]]; then
              echo "Release package shard '$PACKAGE_SHARD' has a file split but no runner for it." >&2
              exit 1
            else
              env MURPH_VITEST_MAX_WORKERS=50% pnpm --dir "$package_dir" test:coverage
            fi
          done <<< "$package_dirs"

  release-web-build-linux:
    name: Release Web build verification (ubuntu)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MURPH_HOSTED_WEB_VERIFY_LANE: build
      MURPH_HOSTED_WEB_VERIFY_SKIP_TYPECHECK: "1"
      MURPH_VERIFY_STEP_PARALLEL: "1"
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run hosted-Web build, lint, and smoke verification
        run: pnpm --dir apps/web verify

  release-web-tests-linux:
    name: Release Web tests (${{ matrix.shard }})
    needs:
      - release-verification-plan-linux
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-verification-plan-linux.outputs.hosted_web_test_matrix) }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: murph_search_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d murph_search_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      MURPH_HOSTED_WEB_TEST_SHARD: ${{ matrix.shard }}
      MURPH_HOSTED_WEB_VERIFY_LANE: test-shard
      MURPH_HOSTED_WEB_VERIFY_SKIP_TYPECHECK: "1"
      MURPH_SUPPLEMENT_SEARCH_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/murph_search_test
      MURPH_CONSENT_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/murph_consent_test
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Prepare isolated consent proof database
        run: DATABASE_URL="$MURPH_CONSENT_TEST_DB_URL" pnpm --dir apps/web exec prisma db push

      - name: Run hosted-Web test shard
        run: pnpm --dir apps/web verify

  release-web-postgres-linux:
    name: Release Web PostgreSQL (${{ matrix.shard }}/5)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [1, 2, 3, 4, 5]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: murph_test_gate
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d murph_test_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/murph_test_gate
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma clients
        run: pnpm --dir apps/web prisma:generate

      - name: Verify PostgreSQL discovery and execution receipts
        run: node --test scripts/run-postgres-tests.test.mjs

      - name: Apply production database migrations
        run: pnpm --dir apps/web prisma:migrate:deploy

      - name: Run discovered PostgreSQL test shard
        run: node scripts/run-postgres-tests.mjs --shard ${{ matrix.shard }}/5

  release-cloudflare-verification-linux:
    name: Release Cloudflare verification (ubuntu)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MURPH_CLOUDFLARE_VERIFY_SKIP_TYPECHECK: "1"
      MURPH_VERIFY_STEP_PARALLEL: "1"
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Verify pinned Codex upstream egress source
        run: pnpm --dir apps/cloudflare verify:codex-upstream-source

      - name: Prepare runtime-state timing exports
        run: pnpm --filter @murphai/runtime-state build

      - name: Run Cloudflare verification
        run: pnpm --dir apps/cloudflare verify

  release-hosted-web-browser-smoke-linux:
    name: Release hosted Web browser smoke (ubuntu)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: murph_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d murph_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    # Production admission runs this scenario on every main commit, after the
    # merge. Run the same scenario against the same production Web build here,
    # so a change that breaks it fails its pull request instead of main. The
    # environment mirrors the admission build in
    # temporal-web-deployment-admission.yml and the private integration lane.
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/murph_test
      HOSTED_EMAIL_DOMAIN: mail.example.test
      HOSTED_EMAIL_FROM_ADDRESS: assistant@mail.example.test
      HOSTED_EMAIL_LOCAL_PART: assistant
      HOSTED_EMAIL_SIGNING_SECRET: hosted-local-email-signing-key
      MURPH_E2E_DEBUG_ASSISTANT_PROVIDER_STUB: "1"
      MURPH_E2E_STREAM_DEV_LOGS: "1"
      MURPH_RUNNER_BUNDLE_BUILD_CONCURRENCY: "4"
      NEXT_DIST_DIR_MODE: smoke
      NEXT_DIST_DIR_SUFFIX: murph-cloud-integration
      NEXT_PUBLIC_PRIVY_APP_ID: cm_app_smoke_placeholder1
      PRIVY_VERIFICATION_KEY: ci-hosted-web-verification-key
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Expose pinned Codex CLI
        run: echo "$GITHUB_WORKSPACE/packages/assistant-engine/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install Playwright Chromium
        timeout-minutes: 14
        run: scripts/install-playwright-chromium.sh

      - name: Build admission-shaped hosted Web production dist
        run: |
          pnpm --dir packages/hosted-execution build
          pnpm --dir apps/web build

      - name: Run the production admission browser smoke
        run: pnpm hosted-local e2e hosted-web-browser-smoke

  production-runner-bundle-budget-linux:
    name: Production runner bundle budget (ubuntu)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      MURPH_RUNNER_BUNDLE_BUILD_CONCURRENCY: "4"
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - name: Check out exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          fetch-depth: 2
          path: candidate
          ref: ${{ github.sha }}

      - name: Prove candidate and exact first parent
        id: revisions
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_sha="$(git -C candidate rev-parse HEAD)"
          base_sha="$(git -C candidate rev-parse HEAD^1)"
          test "$candidate_sha" = "$EXPECTED_CANDIDATE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            test "$(git -C candidate rev-parse HEAD^2)" = "$EXPECTED_PR_HEAD_SHA"
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact first parent
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
          path: base
          ref: ${{ steps.revisions.outputs.base_sha }}

      - name: Require deployment runner platform
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          package_json_file: candidate/package.json

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: candidate/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            base/pnpm-lock.yaml
            candidate/pnpm-lock.yaml

      - name: Install base deps
        working-directory: base
        run: pnpm install --frozen-lockfile

      - name: Install candidate deps
        working-directory: candidate
        run: pnpm install --frozen-lockfile

      - name: Assemble base production runner bundle
        working-directory: base
        run: pnpm --dir apps/cloudflare runner:bundle

      - name: Assemble candidate production runner bundle
        working-directory: candidate
        run: pnpm --dir apps/cloudflare runner:bundle

      - name: Compare exact total output
        run: node candidate/scripts/check-runner-bundle-budget-ci.mjs compare base candidate

      - name: Check one-vCPU container latency
        # Worst case only: both revisions change the base image source, so each
        # compiles native Codex. Otherwise one published image serves both.
        timeout-minutes: 195
        env:
          # Match the proven native permission gate while both checkouts are installed.
          # This bounds compilation only; the benchmark still runs with one vCPU.
          CODEX_CARGO_JOBS: "2"
        run: |
          node --test candidate/scripts/check-container-latency-ci.test.mjs
          node candidate/scripts/check-container-latency-ci.mjs base candidate

  release-fixture-coverage-linux:
    name: Release fixture coverage (ubuntu)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          # Cache the pnpm store keyed on pnpm-lock.yaml; biggest win on the
          # macOS leg where a cold install costs ~2 minutes.
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Run fixture coverage
        run: pnpm test:scenario-integrity

  release-checks-linux:
    name: Release checks (ubuntu)
    runs-on: ubuntu-24.04
    needs:
      - release-verification-plan-linux
      - release-build-typecheck-linux
      - release-package-coverage-linux
      - release-web-build-linux
      - release-web-tests-linux
      - release-web-postgres-linux
      - release-cloudflare-verification-linux
      - release-hosted-web-browser-smoke-linux
      - release-fixture-coverage-linux
      - production-runner-bundle-budget-linux
    if: ${{ !cancelled() }}
    steps:
      - name: Reject draft pull request proof
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          echo "::error::Mark the pull request ready for review to run exact-head CI."
          exit 1

      - name: Require every release shard to succeed
        env:
          PLAN_RESULT: ${{ needs.release-verification-plan-linux.result }}
          BUILD_RESULT: ${{ needs.release-build-typecheck-linux.result }}
          PACKAGE_RESULT: ${{ needs.release-package-coverage-linux.result }}
          WEB_BUILD_RESULT: ${{ needs.release-web-build-linux.result }}
          WEB_TEST_RESULT: ${{ needs.release-web-tests-linux.result }}
          WEB_POSTGRES_RESULT: ${{ needs.release-web-postgres-linux.result }}
          CLOUDFLARE_RESULT: ${{ needs.release-cloudflare-verification-linux.result }}
          BROWSER_SMOKE_RESULT: ${{ needs.release-hosted-web-browser-smoke-linux.result }}
          FIXTURE_RESULT: ${{ needs.release-fixture-coverage-linux.result }}
          BUNDLE_RESULT: ${{ needs.production-runner-bundle-budget-linux.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$PLAN_RESULT" "$BUILD_RESULT" "$PACKAGE_RESULT" "$WEB_BUILD_RESULT" "$WEB_TEST_RESULT" "$WEB_POSTGRES_RESULT" "$CLOUDFLARE_RESULT" "$BROWSER_SMOKE_RESULT" "$FIXTURE_RESULT" "$BUNDLE_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Release proof requires every release shard to succeed." >&2
              exit 1
            fi
          done
          echo "Release checks satisfied by full release shards."
