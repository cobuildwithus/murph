name: PR 1097 Fix Permission Batching

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.number == 1097
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply exact permission-batching corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              (
                  Path('packages/assistant-engine/skills/group-challenge-scorecards/SKILL.md'),
                  '''2. If any scope is `not_granted`, immediately handle the exact eligible permission
             offer from that read and stop before making another shared read. The latest read is
             the only permission evidence.
          3. Otherwise retain only the normalized component evidence needed for scoring and
             continue to the next batch.
          4. Every successful batch must return the same ordered set of current
             `participantId` values. If membership differs, do not combine snapshots or publish
             standings; record the run as unverified and try again on a later turn.
          5. Only after every scoring batch is granted may a separate diagnostic-only
             `device-sync-status.v0` read investigate genuinely missing data.''',
                  '''2. If any `not_granted` participant/scope still needs a new eligible permission
             offer, handle that exact offer immediately and stop before another shared read. The
             latest read is the only permission evidence.
          3. When every `not_granted` participant/scope in the batch already has an explicit
             decline or handled offer action on the challenge page, retain `not_granted` as
             normalized partial coverage and continue; no later action depends on that read's
             offer evidence.
          4. Otherwise retain only the normalized component evidence needed for scoring and
             continue to the next batch.
          5. Every successful batch must return the same ordered set of current
             `participantId` values. If membership differs, do not combine snapshots or publish
             standings; record the run as unverified and try again on a later turn.
          6. Only after every scoring batch has been read and no new permission offer is owed may
             a separate diagnostic-only `device-sync-status.v0` read investigate genuinely
             missing data.''',
              ),
              (
                  Path('agent-docs/product-specs/group-challenge-formats-and-scorecards.md'),
                  '''2. When that read proves any exact scoring scope `not_granted`, immediately handle
             the eligible permission offer from that evidence and stop before another shared
             read. The latest read remains the only permission evidence.
          3. Otherwise retain only normalized component evidence and read the next batch.
          4. Require every successful batch to return the same ordered current
             `participantId` set. A changed membership snapshot cannot be combined; the run is
             unverified and publishes no standings.
          5. Only after all scoring batches are granted may a separate diagnostic-only
             `device-sync-status.v0` read investigate genuinely missing data.''',
                  '''2. When that read proves a `not_granted` participant/scope that still needs a new
             eligible permission offer, handle the exact offer from that evidence and stop before
             another shared read. The latest read remains the only permission evidence.
          3. When every `not_granted` participant/scope in the batch already has an explicit
             decline or handled offer action, retain `not_granted` as normalized partial coverage
             and continue; no later action depends on that read's offer evidence.
          4. Otherwise retain only normalized component evidence and read the next batch.
          5. Require every successful batch to return the same ordered current
             `participantId` set. A changed membership snapshot cannot be combined; the run is
             unverified and publishes no standings.
          6. Only after all scoring batches have been read and no new permission offer is owed may
             a separate diagnostic-only `device-sync-status.v0` read investigate genuinely
             missing data.''',
              ),
              (
                  Path('packages/assistant-engine/test/assistant-group-challenge-scorecards-skill.test.ts'),
                  """      'If any scope is `not_granted`, immediately handle the exact eligible permission offer from that read and stop before making another shared read.',""",
                  """      'If any `not_granted` participant/scope still needs a new eligible permission offer, handle that exact offer immediately and stop before another shared read.',""",
              ),
          ]

          for path, old, new in replacements:
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'exact replacement count for {path}: {text.count(old)}')
              path.write_text(text.replace(old, new))

          test_path = Path('packages/assistant-engine/test/assistant-group-challenge-scorecards-skill.test.ts')
          test_text = test_path.read_text()
          anchor = """    expect(skill).toContain(
                'If any `not_granted` participant/scope still needs a new eligible permission offer, handle that exact offer immediately and stop before another shared read.',
              )
          """
          addition = anchor + """    expect(skill).toContain(
                'already has an explicit decline or handled offer action on the challenge page, retain `not_granted` as normalized partial coverage and continue',
              )
          """
          if test_text.count(anchor) != 1:
              raise SystemExit('skill-test insertion anchor missing')
          test_path.write_text(test_text.replace(anchor, addition))

          spec_path = Path('agent-docs/product-specs/group-challenge-formats-and-scorecards.md')
          spec_text = spec_path.read_text()
          if spec_text.count('type GroupChallengeScorecardComponent = {') != 1:
              raise SystemExit('persisted component type anchor missing')
          spec_text = spec_text.replace(
              'type GroupChallengeScorecardComponent = {',
              'type PersistedGroupChallengeComponentRule = {',
          )
          fence = '''};
          ```

          The model owns `evaluationRule`.'''
          expanded = '''};
          ```

          The deterministic `score-challenge` payload projects this page-owned rule down to
          `id`, `label`, `quantityUnit`, `points`, `perQuantity`, and optional `maxPoints`.
          Projection scopes, `evaluationRule`, and `settlementMode` remain on the challenge page
          and never cross the arithmetic boundary.

          The model owns `evaluationRule`.'''
          if spec_text.count(fence) != 1:
              raise SystemExit('arithmetic projection insertion anchor missing')
          spec_path.write_text(spec_text.replace(fence, expanded))
          PY
      - name: Commit correction and remove this one-use workflow
        run: |
          rm .github/workflows/pr1097-fix-permission-batching.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/pr1097-fix-permission-batching.yml \
            agent-docs/product-specs/group-challenge-formats-and-scorecards.md \
            packages/assistant-engine/skills/group-challenge-scorecards/SKILL.md \
            packages/assistant-engine/test/assistant-group-challenge-scorecards-skill.test.ts
          git commit -m "Allow handled permission gaps in composite scoring"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
