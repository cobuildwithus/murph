name: Publish final PR 1464 candidate

on:
  push:
    branches:
      - codex/starter-usage-export-final
    paths:
      - .github/workflows/codex-publish-pr1464-final.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and publish exact audited candidate
        shell: bash
        run: |
          set -euo pipefail

          expected_main="f7359e41ad63bdd430b3d67d34e77161323091b0"
          expected_old_head="0feeae892ec981a0515ae2474b51dfdff1dd646e"
          expected_final_tree="afcde634f72a93b544a20c9f13851aaa78231d28"
          expected_harden_sha="c1295ffe14ce59c853d564c2065b3cc7862dbc9ce823e0929a3aa503e14d1e5f"
          expected_supplement_sha="8fe82c99d222c3cfc36fe814e002e31644d407f90e9e42b833158f049e3594e6"
          implementation_commit="3a27da086599bf186120cf7061b978930553b2dd"
          workflow_commit="0feeae892ec981a0515ae2474b51dfdff1dd646e"
          helper_ref="origin/codex/starter-usage-export-final"
          target_ref="refs/heads/agent/non-expiring-starter-usage"

          git fetch origin \
            main \
            agent/non-expiring-starter-usage \
            codex/starter-usage-export-final

          test "$(git rev-parse origin/main)" = "$expected_main"
          test "$(git rev-parse origin/agent/non-expiring-starter-usage)" = "$expected_old_head"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach "$expected_main"

          mkdir -p /tmp/pr1464-base /tmp/pr1464-supplement
          while IFS= read -r path; do
            git show "$helper_ref:$path"
          done < <(
            git ls-tree -r --name-only "$helper_ref" -- \
              '.github/pr1464-publish/payload-*' | sort
          ) | base64 --decode | xz --decompress > /tmp/pr1464-base.tar
          tar -C /tmp/pr1464-base -xf /tmp/pr1464-base.tar
          test "$(sha256sum /tmp/pr1464-base/harden.patch | cut -d' ' -f1)" = "$expected_harden_sha"

          while IFS= read -r path; do
            git show "$helper_ref:$path"
          done < <(
            git ls-tree -r --name-only "$helper_ref" -- \
              '.github/pr1464-supplement/payload-*' | sort
          ) | base64 --decode | xz --decompress > /tmp/pr1464-supplement.tar
          tar -C /tmp/pr1464-supplement -xf /tmp/pr1464-supplement.tar
          test "$(sha256sum /tmp/pr1464-supplement/supplement.patch | cut -d' ' -f1)" = "$expected_supplement_sha"

          set +e
          git cherry-pick "$implementation_commit"
          implementation_status=$?
          set -e
          test "$implementation_status" -ne 0

          implementation_conflicts=(
            'apps/web/app/(dashboard)/settings/page.tsx'
            'apps/web/app/design/group-member-plan-study.tsx'
            'apps/web/app/design/group-usage-funding-study.tsx'
            'apps/web/app/design/sections-content.tsx'
            'apps/web/app/page.tsx'
            'apps/web/src/components/settings/hosted-billing-settings.tsx'
            'apps/web/src/lib/hosted-execution/usage-status.ts'
            'apps/web/src/lib/hosted-onboarding/personal-usage-credit-eligibility.ts'
            'apps/web/test/hosted-billing-settings.test.tsx'
            'apps/web/test/hosted-onboarding-billing-plans.test.ts'
          )
          printf '%s\n' "${implementation_conflicts[@]}" | sort > /tmp/expected-conflicts
          git diff --name-only --diff-filter=U | sort > /tmp/actual-conflicts
          cmp /tmp/expected-conflicts /tmp/actual-conflicts
          git checkout --ours -- "${implementation_conflicts[@]}"
          git add -- "${implementation_conflicts[@]}"
          GIT_EDITOR=true git cherry-pick --continue

          git cherry-pick "$workflow_commit"

          set +e
          git am --3way /tmp/pr1464-base/harden.patch
          harden_status=$?
          set -e
          test "$harden_status" -ne 0

          harden_conflicts=(
            'apps/web/app/(dashboard)/settings/page.tsx'
            'apps/web/src/lib/hosted-execution/usage-status.ts'
          )
          printf '%s\n' "${harden_conflicts[@]}" | sort > /tmp/expected-conflicts
          git diff --name-only --diff-filter=U | sort > /tmp/actual-conflicts
          cmp /tmp/expected-conflicts /tmp/actual-conflicts
          git checkout --ours -- "${harden_conflicts[@]}"
          git add -- "${harden_conflicts[@]}"
          GIT_EDITOR=true git am --continue

          git apply --index /tmp/pr1464-supplement/supplement.patch
          git commit -m "Compose Starter usage with current paid plans"

          git diff --check "$expected_main"..HEAD
          test "$(git rev-parse 'HEAD^{tree}')" = "$expected_final_tree"

          git push origin "HEAD:$target_ref" \
            --force-with-lease="$target_ref:$expected_old_head"
