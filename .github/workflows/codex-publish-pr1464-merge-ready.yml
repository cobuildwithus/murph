name: Publish PR 1464 merge-ready head

on:
  push:
    branches:
      - codex/starter-usage-export-final
    paths:
      - .github/workflows/codex-publish-pr1464-merge-ready.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/non-expiring-starter-usage
          fetch-depth: 0

      - name: Merge current main into the audited PR head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/non-expiring-starter-usage
          expected_head="d96d6428a1d574cddd1cd3c707e2289b1b35eace"
          actual_head="$(git rev-parse origin/agent/non-expiring-starter-usage)"
          test "$actual_head" = "$expected_head"
          git checkout -B agent/non-expiring-starter-usage "$actual_head"
          git merge --no-ff origin/main -m "Merge current main into Starter usage cutover"
          git diff --check
          git push origin HEAD:refs/heads/agent/non-expiring-starter-usage
