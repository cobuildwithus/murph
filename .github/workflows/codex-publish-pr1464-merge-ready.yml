name: Publish PR 1464 merge-ready head

on:
  push:
    branches:
      - codex/starter-usage-export-final
    paths:
      - .github/workflows/codex-publish-pr1464-merge-ready.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/non-expiring-starter-usage
          fetch-depth: 0

      - name: Apply the final audit fix and merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main agent/non-expiring-starter-usage
          expected_head="34931f918eff2588ed5d61a7e6e719abba221b6d"
          actual_head="$(git rev-parse origin/agent/non-expiring-starter-usage)"
          test "$actual_head" = "$expected_head"
          git checkout -B agent/non-expiring-starter-usage "$actual_head"
          printf '%s' '' | base64 --decode > /tmp/pr1464-final.patch
          git apply --index /tmp/pr1464-final.patch
          git diff --cached --check
          git commit -m "Allow safe Starter cutover replays after usage"
          git merge --no-ff origin/main -m "Merge current main into Starter usage cutover"
          git diff --check
          git push origin HEAD:refs/heads/agent/non-expiring-starter-usage
