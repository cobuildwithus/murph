name: PR 1405 simple knowledge bridge

on:
  pull_request:
    types: [reopened]
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm
      - name: Expand authored broad family closure
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          report=.github/pr1405-isolated-validation.txt
          python .github/scripts/pr1405-expand-broad-family-closure.py > "$report" 2>&1
      - name: Install dependencies
        id: install
        if: steps.apply.outcome == 'success'
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Generate and validate
        if: always()
        shell: bash
        run: |
          set +e
          report=.github/pr1405-isolated-validation.txt
          failures=0
          printf '\napply outcome: %s\ninstall outcome: %s\n' '${{ steps.apply.outcome }}' '${{ steps.install.outcome }}' >> "$report"
          run_check() {
            printf '\n===== %s =====\n' "$*" >> "$report"
            "$@" >> "$report" 2>&1
            status=$?
            printf '\nexit: %s\n' "$status" >> "$report"
            if [ "$status" -ne 0 ]; then failures=1; fi
          }
          if [ '${{ steps.apply.outcome }}' = 'success' ] && [ '${{ steps.install.outcome }}' = 'success' ]; then
            run_check pnpm --dir packages/health-commons generate
            run_check pnpm --dir packages/health-commons typecheck
            run_check pnpm --dir packages/health-commons test:vitest
            run_check pnpm build
            run_check pnpm --dir packages/cli gen:config-schema
            run_check pnpm --dir packages/cli typecheck
            run_check pnpm --dir packages/cli exec vitest run --config vitest.workspace.ts --no-coverage test/commons-command-coverage.test.ts
            run_check pnpm --dir packages/assistant-engine typecheck
            run_check pnpm --dir packages/assistant-engine exec vitest run --config vitest.config.ts --no-coverage test/model-behavior.test.ts test/assistant-skill-assets.test.ts
            run_check git diff --check
          else
            failures=1
          fi
          printf '\n===== changed files =====\n' >> "$report"
          git status --short >> "$report"
          exit "$failures"
      - name: Commit implementation and report
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(health-commons): expand authored broad family closure' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
