name: BYOI branch patch

on:
  push:
    branches:
      - agent/bring-your-own-inference
    paths:
      - scripts/apply-byoi-branch-patch.py
      - scripts/apply-byoi-ci-fixes.py
      - .github/workflows/byoi-branch-patch.yml

permissions:
  contents: write

concurrency:
  group: byoi-branch-patch
  cancel-in-progress: false

jobs:
  patch:
    if: github.repository == 'cobuildwithus/murph'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: agent/bring-your-own-inference

      - name: Apply asserted feature-branch edits
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "agent/bring-your-own-inference"
          python3 scripts/apply-byoi-branch-patch.py
          python3 scripts/apply-byoi-ci-fixes.py
          git diff --check

      - name: Commit patch result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code; then
            echo "No branch patch changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "fix: integrate custom inference contracts"
          git push origin HEAD:agent/bring-your-own-inference
