name: Finish scale and BP snapshot indentation

on:
  push:
    branches:
      - codex/junction-scale-bp-vault-awareness
    paths:
      - .github/workflows/one-shot-indent-scale-bp-snapshot.yml

permissions:
  contents: write

jobs:
  indent:
    if: contains(github.event.head_commit.message, '[indent-scale-bp-snapshot]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/junction-scale-bp-vault-awareness

      - name: Normalize inherited list indentation
        shell: python
        run: |
          from pathlib import Path

          target = Path(
              'packages/assistant-engine/src/assistant/context-snapshot.ts',
          )
          text = target.read_text()
          marker = '    collectAssistantSnapshotDeviceMeasurementCoverage(input),\n'
          start = text.index(marker) + len(marker)
          end = text.index('  const goals = goalRead.records\n', start)
          segment = text[start:end]
          lines = segment.splitlines(keepends=True)
          if not lines or not all(
              not line.strip() or line.startswith('  ')
              for line in lines
          ):
              raise RuntimeError('unexpected Promise.all segment indentation')
          normalized = ''.join(
              line[2:] if line.startswith('  ') else line
              for line in lines
          )
          target.write_text(text[:start] + normalized + text[end:])
          Path(
              '.github/workflows/one-shot-indent-scale-bp-snapshot.yml',
          ).unlink()

      - name: Commit normalized indentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: finish context snapshot indentation"
          git push origin HEAD:codex/junction-scale-bp-vault-awareness
