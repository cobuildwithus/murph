name: Live Junction Garmin Canary

on:
  push:
    branches:
      - main
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Public orchestration and the private executor both serialize their owned runs.
# Before migrating, let the last provider-bearing public run finish naturally.
concurrency:
  group: live-junction-wearable-canary
  cancel-in-progress: false

jobs:
  connect:
    name: Prove Garmin data through the private hosted runtime
    if: ${{ github.ref == 'refs/heads/main' && github.ref_protected }}
    environment: temporal-compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Check out exact trusted main controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc

      - name: Mint private canary dispatch token
        id: private-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TEMPORAL_COMPATIBILITY_GITHUB_APP_ID }}
          private-key: ${{ secrets.TEMPORAL_COMPATIBILITY_GITHUB_APP_PRIVATE_KEY }}
          owner: cobuildwithus
          repositories: murph-cloud
          permission-actions: write
          permission-contents: read

      - name: Require completed canonical Garmin data proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
          WEARABLE_CANARY_PRIVATE_GITHUB_TOKEN: ${{ steps.private-app-token.outputs.token }}
        run: node scripts/github-wearable-canary.mjs
