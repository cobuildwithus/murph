name: Finalize explicit Telegram phone-call routing

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-telegram-phone-calls-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  finalize:
    if: >-
      github.event.pull_request.number == 1351 &&
      github.event.pull_request.head.ref == 'codex/telegram-scheduled-phone-calls'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          check-latest: false

      - name: Apply the reviewed explicit-channel implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/agent/telegram-scheduled-phone-calls:refs/remotes/origin/agent/telegram-scheduled-phone-calls
          git show \
            origin/agent/telegram-scheduled-phone-calls:.github/workflows/agent-telegram-scheduled-phone-calls.yml \
            > /tmp/agent-telegram-scheduled-phone-calls.yml
          python - <<'PY'
          from pathlib import Path

          source = Path('/tmp/agent-telegram-scheduled-phone-calls.yml').read_text(
              encoding='utf-8'
          ).splitlines()
          collecting = False
          found_step = False
          output: list[str] = []
          for line in source:
              if line == '      - name: Apply the reviewed routing correction':
                  found_step = True
                  continue
              if found_step and line == '        run: |':
                  collecting = True
                  continue
              if collecting and line.startswith('      - name: Setup Node'):
                  break
              if collecting:
                  output.append(line[10:] if line.startswith('          ') else line)
          if not output:
              raise SystemExit('Could not extract the reviewed routing transformation.')
          Path('/tmp/apply-telegram-phone-calls.py').write_text(
              '\n'.join(output) + '\n',
              encoding='utf-8',
          )
          PY
          python /tmp/apply-telegram-phone-calls.py

      - name: Apply final route-shape hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f'expected one replacement in {path}, found {count}: {old[:120]!r}'
                  )
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          def insert_before(path: str, marker: str, addition: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(
                      f'expected one insertion marker in {path}, found {count}: {marker[:120]!r}'
                  )
              target.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')

          destination_path = (
              'apps/web/src/lib/hosted-routing/assistant-notification-destination.ts'
          )
          replace_once(
              destination_path,
              '''  if (destination) {
            return destination;
          }

          throw hostedOnboardingError({
          '''.replace('          ', ''),
              '''  if (
            destination
            && (
              input.directChannel === undefined
              || (
                destination.conversationShape === "direct-member"
                && destination.externalThreadRouteAuthority === null
                && destination.route.threadIsDirect === true
                && destination.route.channel === input.directChannel
              )
            )
          ) {
            return destination;
          }

          throw hostedOnboardingError({
          '''.replace('          ', ''),
          )

          service_path = 'apps/web/src/lib/phone-calls/service.ts'
          replace_once(
              service_path,
              '''  if (
            input.resultNotificationChannel
            && (
              threadContainerDestination
              || notificationDestination.route.channel
                !== input.resultNotificationChannel
            )
          ) {
            throw new Error(
              "Hosted phone call result notification channel does not match the direct route.",
            );
          }
          '''.replace('          ', ''),
              '''  if (
            input.resultNotificationChannel
            && (
              threadContainerDestination
              || notificationDestination.route.threadIsDirect !== true
              || notificationDestination.route.channel
                !== input.resultNotificationChannel
            )
          ) {
            throw new Error(
              "Hosted phone call result notification channel does not match the direct route.",
            );
          }
          '''.replace('          ', ''),
          )

          destination_test = (
              'apps/web/test/hosted-assistant-notification-destination.test.ts'
          )
          insert_before(
              destination_test,
              '''  it.each([
            {
              member: {
          '''.replace('          ', ''),
              '''  it("rejects a thread container when a direct result channel is required", async () => {
            const containerMemberId = "container-frozen-direct";
            const row = await buildRouteRow({
              accountLookupKey: HOSTED_TELEGRAM_THREAD_ACCOUNT_LOOKUP_KEY,
              channel: "telegram",
              containerMemberId,
              threadId: "-100123456789",
            });
            const prisma = createPrisma({
              containerMemberId,
              rows: [row],
            });

            await expect(requireHostedAssistantNotificationDestination({
              directChannel: "telegram",
              memberId: containerMemberId,
              prisma,
            })).rejects.toThrow("durable notification route");
          });

          '''.replace('          ', ''),
          )

          service_test = 'apps/web/test/phone-call-result-notification-channel.test.ts'
          insert_before(
              service_test,
              '''const GROUP_DESTINATION = {
          '''.replace('          ', ''),
              '''const NON_DIRECT_TELEGRAM_DESTINATION = {
            ...TELEGRAM_DESTINATION,
            route: {
              ...TELEGRAM_DESTINATION.route,
              threadIsDirect: false as const,
            },
          };
          '''.replace('          ', ''),
          )
          insert_before(
              service_test,
              '''    it.each([
              ["legacy null to Telegram", null, "telegram", TELEGRAM_DESTINATION],
          '''.replace('          ', ''),
              '''    it("rejects a non-direct route for a frozen direct channel", async () => {
              const harness = createHarness();

              await expect(createHostedPhoneCall({
                ...baseInput(harness),
                notificationDestinationResolver: async () =>
                  NON_DIRECT_TELEGRAM_DESTINATION,
                requestKey: "phone_call_non_direct_channel_mismatch",
                resultNotificationChannel: "telegram",
              })).rejects.toThrow("does not match the direct route");

              expect(harness.reserve).not.toHaveBeenCalled();
              expect(harness.runtime.start).not.toHaveBeenCalled();
            });

          '''.replace('          ', ''),
          )

          for path in [
              Path('packages/hosted-execution/src/phone-calls.ts'),
              Path('apps/web/src/lib/phone-calls/service.ts'),
              Path('apps/web/src/lib/phone-calls/result.ts'),
          ]:
              text = path.read_text(encoding='utf-8')
              for forbidden in [
                  'phone_call_scheduled_telegram_',
                  'HOSTED_TELEGRAM_SCHEDULED_PHONE_CALL_REQUEST_KEY_PREFIX',
                  'hpc_t_',
              ]:
                  if forbidden in text:
                      raise SystemExit(
                          f'forbidden abandoned routing encoding {forbidden!r} in {path}'
                      )

      - name: Install pinned workspace dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack pnpm install --frozen-lockfile --prefer-offline

      - name: Format and validate Prisma
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/web exec prisma format --schema prisma/schema.prisma
          pnpm --dir apps/web exec prisma validate --schema prisma/schema.prisma
          pnpm --dir apps/web exec prisma generate --schema prisma/schema.prisma

      - name: Verify focused contracts
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/hosted-execution exec vitest run \
            --config vitest.config.ts \
            test/phone-calls.test.ts \
            test/phone-call-result-notification-channel.test.ts \
            --no-coverage
          pnpm --dir packages/assistant-engine exec vitest run \
            --config vitest.config.ts \
            test/assistant-phone-call-result-channel.test.ts \
            test/assistant-phone-calls.test.ts \
            test/assistant-codex-turn-planning.test.ts \
            --no-coverage
          pnpm exec vitest run \
            --config apps/web/vitest.workspace.ts \
            --no-coverage \
            apps/web/test/phone-call-result-notification-channel.test.ts \
            apps/web/test/hosted-assistant-notification-destination.test.ts \
            apps/web/test/hosted-phone-call-private-storage-classification.test.ts \
            apps/web/test/phone-calls-retell.test.ts \
            apps/web/test/phone-calls-service.test.ts \
            apps/web/test/production-migration-guard.test.ts

      - name: Verify affected owners and bundle
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/hosted-execution typecheck
          pnpm --dir packages/assistant-engine typecheck
          pnpm --dir apps/web typecheck
          pnpm exec vitest run \
            --config apps/cloudflare/vitest.config.ts \
            apps/cloudflare/test/runner-bundle-entrypoint-bundle.test.ts \
            --no-coverage
          pnpm --dir apps/cloudflare typecheck
          pnpm --dir apps/cloudflare runner:bundle
          pnpm docs:drift
          git diff --check

      - name: Publish the clean verified candidate
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-explicit-telegram-phone-calls.yml
          rm -rf .github/one-time
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Enable exact Telegram phone-call result routing'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
