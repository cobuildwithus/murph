name: One-shot finalize Junction blood-pressure history

on:
  push:
    branches:
      - codex/junction-blood-pressure-history-backfill
    paths:
      - .github/workflows/one-shot-finalize-junction-bp-history.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: codex/junction-blood-pressure-history-backfill
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply final audit fixes
        run: python scripts/one-shot-finalize-junction-bp-history.py
      - name: Verify final device-sync changes
        run: |
          git diff --check
          pnpm --filter @murphai/device-syncd test
          pnpm --filter @murphai/device-syncd typecheck
      - name: Commit verified fixes
        run: |
          git config user.name "rocketman"
          git config user.email "20303031+rocketman-21@users.noreply.github.com"
          git rm .github/workflows/one-shot-finalize-junction-bp-history.yml
          git rm scripts/one-shot-finalize-junction-bp-history.py
          git add packages/device-syncd/src/config/provider-manifests.ts
          git add packages/device-syncd/src/providers/junction.ts
          git add packages/device-syncd/test/junction-blood-pressure-backfill.test.ts
          git commit -m "fix: make Junction BP history backfill durable"
          git push origin HEAD:codex/junction-blood-pressure-history-backfill
