name: One-shot finalize device-context awareness

on:
  push:
    branches:
      - codex/junction-scale-bp-vault-awareness
    paths:
      - .github/workflows/one-shot-finalize-device-context-awareness.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: codex/junction-scale-bp-vault-awareness
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply final audit fixes
        run: python scripts/one-shot-finalize-device-context-awareness.py
      - name: Verify final context changes
        run: |
          git diff --check
          pnpm --filter @murphai/assistant-engine test -- assistant-context-snapshot-device-availability
          pnpm --filter @murphai/assistant-engine typecheck
          pnpm --filter @murphai/vault-usecases test -- junction-scale-blood-pressure-canonicalization
          pnpm --filter @murphai/vault-usecases typecheck
      - name: Commit verified fixes
        run: |
          git config user.name "rocketman"
          git config user.email "20303031+rocketman-21@users.noreply.github.com"
          git rm .github/workflows/one-shot-finalize-device-context-awareness.yml
          git rm scripts/one-shot-finalize-device-context-awareness.py
          git add packages/assistant-engine/src/assistant/context-snapshot.ts
          git add packages/assistant-engine/test/assistant-context-snapshot-device-availability.test.ts
          git add packages/vault-usecases/test/junction-scale-blood-pressure-canonicalization.test.ts
          git commit -m "fix: require canonical paired BP context"
          git push origin HEAD:codex/junction-scale-bp-vault-awareness
