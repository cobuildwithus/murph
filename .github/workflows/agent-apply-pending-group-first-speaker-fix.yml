name: Apply pending-group first-speaker fix

on:
  push:
    branches:
      - agent/pending-group-setup

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'fix(linq): admit prepared group before sender fallback') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Apply focused admission fix and regression proof
        run: |
          python <<'PY'
          from pathlib import Path

          source_path = Path("apps/web/src/lib/hosted-onboarding/webhook-provider-linq.ts")
          source = source_path.read_text()

          source = source.replace(
          '''/**
           * Group chats with no explicit thread route stay ignored unless the sender is
           * an active member and the recipient resolves to an active managed Murph Linq
           * line; only then is the dedicated thread-container runtime provisioned and
           * the triggering message routed into it. The webhook recipient alone is never
           * line authority. Existing routes are handled before this admission path.
           */''',
          '''/**
           * An unbound group can be admitted by either one roster-matched pending setup
           * or the existing active-sender fallback. The recipient must still resolve to
           * an active managed Murph Linq line; the webhook recipient alone is never line
           * authority. Existing routes are handled before this admission path.
           */''',
          )

          old_sender = '''  const sender = senderLookup?.core ?? null;
            if (!sender) {
              return ignored("sender-identity-unresolved");
            }
            const senderIdentityMatch: HostedLinqExistingMemberMatch =
              participantContact.kind === "phone" ? "phone-identity" : "verified-email";
            if (
              isHostedMemberSuspended(sender.suspendedAt)
              || !(await readHostedRuntimeAiAccessDecision({
                memberId: sender.id,
                prisma: input.prisma,
              })).allowed
            ) {
              return ignored("sender-inactive", senderIdentityMatch);
            }

            if (!(await hasActiveHostedLinqManagedLine({
              phoneNumberLookupKeys: input.threadRouteAccountLookupKeys,
              prisma: input.prisma,
            }))) {
              return ignored("recipient-line-unmanaged", senderIdentityMatch);
            }
          '''
          new_sender = '''  const sender = senderLookup?.core ?? null;
            const senderIdentityMatch: HostedLinqExistingMemberMatch = sender
              ? participantContact.kind === "phone"
                ? "phone-identity"
                : "verified-email"
              : "none";

            if (!(await hasActiveHostedLinqManagedLine({
              phoneNumberLookupKeys: input.threadRouteAccountLookupKeys,
              prisma: input.prisma,
            }))) {
              return ignored("recipient-line-unmanaged", senderIdentityMatch);
            }

            const activeSenderMemberId = sender
              && !isHostedMemberSuspended(sender.suspendedAt)
              && (await readHostedRuntimeAiAccessDecision({
                memberId: sender.id,
                prisma: input.prisma,
              })).allowed
                ? sender.id
                : null;
          '''
          if old_sender not in source:
              raise SystemExit("sender admission block did not match expected head")
          source = source.replace(old_sender, new_sender, 1)

          source = source.replace(
          '''      fallbackOwnerMemberId: sender.id,
                mailboxDedupeKey: input.event.event_id,
                occurredAt: new Date(occurredAt),
                participantMemberIds: input.participantMemberIds,
                recipientPhoneLookupKeys: input.threadRouteAccountLookupKeys,
                senderMemberId: sender.id,
          ''',
          '''      fallbackOwnerMemberId: activeSenderMemberId,
                mailboxDedupeKey: input.event.event_id,
                occurredAt: new Date(occurredAt),
                participantMemberIds: input.participantMemberIds,
                recipientPhoneLookupKeys: input.threadRouteAccountLookupKeys,
                senderMemberId: activeSenderMemberId,
          ''',
          1,
          )

          old_unavailable = '''    if (preparedResult.kind !== "ensured") {
                return ignored("provision-unavailable", senderIdentityMatch);
              }
          '''
          new_unavailable = '''    if (preparedResult.kind !== "ensured") {
                return !sender
                  ? ignored("sender-identity-unresolved")
                  : activeSenderMemberId === null
                    ? ignored("sender-inactive", senderIdentityMatch)
                    : ignored("provision-unavailable", senderIdentityMatch);
              }
          '''
          if old_unavailable not in source:
              raise SystemExit("prepared-result block did not match expected head")
          source = source.replace(old_unavailable, new_unavailable, 1)

          old_plan = '''    prisma: input.prisma,
                resolvedParticipantMemberId: sender.id,
                route,
          '''
          new_plan = '''    prisma: input.prisma,
                ...(activeSenderMemberId
                  ? { resolvedParticipantMemberId: activeSenderMemberId }
                  : {}),
                route,
          '''
          if old_plan not in source:
              raise SystemExit("explicit-route sender block did not match expected head")
          source = source.replace(old_plan, new_plan, 1)
          source_path.write_text(source)

          test_path = Path("apps/web/test/hosted-onboarding-linq-thread-route.test.ts")
          tests = test_path.read_text()
          marker = '''  it("does not select ownership from a partial oversized roster", async () => {\n'''
          regression = '''  it("uses a unique prepared owner when an unregistered participant speaks first", async () => {
            const prisma = createStatefulThreadRoutePrisma();
            let transactionOpen = false;
            prisma.$transaction.mockImplementation(async (callback: (tx: unknown) => Promise<unknown>) => {
              transactionOpen = true;
              try {
                return await callback(prisma);
              } finally {
                transactionOpen = false;
              }
            });
            vi.mocked(prismaModule.getPrisma).mockReturnValue(prisma as never);
            vi.mocked(linqModule.verifyAndParseHostedLinqWebhookRequest)
              .mockReturnValue(buildLinqMessageReceivedEvent({}) as never);
            mockSenderLookup(null);
            mockSuccessfulGroupProvision({ prisma, senderCore });
            prisma.hostedMemberIdentity.findMany.mockImplementation(async ({ where }: {
              where: { phoneLookupKey: { in: string[] } };
            }) => where.phoneLookupKey.in.includes(
              createHostedPhoneLookupKey("+15552223333") ?? "",
            )
              ? [{ memberId: "member_prepared_owner" }]
              : []);
            const roster = [
              { handle: "+15550000000", isMe: true, status: "active" },
              { handle: "+15551112222", isMe: false, status: "active" },
              { handle: "+15552223333", isMe: false, status: "active" },
            ];
            vi.mocked(linqClient.getHostedLinqChatSummary).mockImplementation(async () => {
              expect(transactionOpen).toBe(false);
              return { handles: roster, isGroup: true };
            });
            vi.mocked(linqClient.getHostedLinqChatHandles).mockResolvedValue(roster);
            preparedThreadMocks.ensureHostedPreparedLinqThreadContainerRouteTx
              .mockImplementationOnce(async () => {
                const accountLookupKey = createHostedPhoneLookupKey("+15550000000");
                const threadLookupKey = createHostedExternalThreadLookupKey({
                  accountLookupKey,
                  channel: "linq",
                  threadId: "chat_group_123",
                });
                const threadIdentityLookupKey = createHostedExternalThreadIdentityLookupKey({
                  channel: "linq",
                  threadId: "chat_group_123",
                });
                if (!threadLookupKey || !threadIdentityLookupKey) {
                  throw new Error("Expected prepared group route lookup keys.");
                }
                prisma.seedThreadRoute({
                  channel: "linq",
                  containerMemberId: "member_thread_container_123",
                  ownerMemberId: "member_prepared_owner",
                  threadIdentityLookupKey,
                  threadLookupKey,
                });
                return {
                  ensure: {
                    activationEventId: "member.activated:prepared",
                    activationMailboxItemId: "mailbox_activation_prepared",
                    containerMemberId: "member_thread_container_123",
                    created: true,
                    demotedMailboxConsumedAt: null,
                  },
                  kind: "ensured",
                  ownerMemberId: "member_prepared_owner",
                  ownerResolution: "pending_only_candidate",
                  pendingSetupApplied: true,
                  pendingSetupResolution: "only_candidate",
                } as never;
              });

            const response = await handleHostedOnboardingLinqWebhook({
              rawBody: "{}",
              signature: null,
              timestamp: null,
            });

            expect(response).toMatchObject({
              ignored: false,
              ok: true,
              reason: "wake-appended-thread-route",
            });
            expect(
              preparedThreadMocks.ensureHostedPreparedLinqThreadContainerRouteTx,
            ).toHaveBeenCalledWith(expect.objectContaining({
              fallbackOwnerMemberId: null,
              participantMemberIds: ["member_prepared_owner"],
              senderMemberId: null,
            }));
            expect(readSingleWakeHandoff(response as never)).toBeUndefined();
            expect(signalRuntime.signalHostedMailboxAppendRuntime).toHaveBeenCalledWith(
              expect.objectContaining({
                expectedUserId: "member_thread_container_123",
              }),
            );
          });

'''
          if "uses a unique prepared owner when an unregistered participant speaks first" not in tests:
              if marker not in tests:
                  raise SystemExit("regression-test insertion marker not found")
              tests = tests.replace(marker, regression + marker, 1)
          test_path.write_text(tests)
          PY
      - name: Commit focused fix
        run: |
          git config user.name "Codex"
          git config user.email "codex@openai.com"
          git rm .github/workflows/agent-apply-pending-group-first-speaker-fix.yml
          git add apps/web/src/lib/hosted-onboarding/webhook-provider-linq.ts \
            apps/web/test/hosted-onboarding-linq-thread-route.test.ts
          git diff --check
          git commit -m "fix(linq): admit prepared group before sender fallback"
          git push origin HEAD:agent/pending-group-setup
