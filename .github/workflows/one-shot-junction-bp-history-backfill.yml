name: One-shot Junction blood pressure history backfill

on:
  push:
    branches:
      - codex/junction-blood-pressure-history-backfill
    paths:
      - .github/workflows/one-shot-junction-bp-history-backfill.yml

permissions:
  contents: write

jobs:
  implement:
    if: contains(github.event.head_commit.message, '[junction-bp-history-backfill]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: codex/junction-blood-pressure-history-backfill

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Implement resource-specific sparse timeseries backfill
        shell: python
        run: |
          from pathlib import Path
          import re

          target = Path('packages/device-syncd/src/providers/junction.ts')
          text = target.read_text()

          def replace_once(label: str, old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'sparse resource constants',
              '''const DEFAULT_SUMMARY_BACKFILL_DAYS = JUNCTION_DEVICE_PROVIDER_DESCRIPTOR.sync.windows.backfillDays;
          const DEFAULT_TIMESERIES_BACKFILL_DAYS = 14;
          const DEFAULT_RECONCILE_DAYS = JUNCTION_DEVICE_PROVIDER_DESCRIPTOR.sync.windows.reconcileDays;
          '''.replace('\n          ', '\n'),
              '''const DEFAULT_SUMMARY_BACKFILL_DAYS = JUNCTION_DEVICE_PROVIDER_DESCRIPTOR.sync.windows.backfillDays;
          const DEFAULT_TIMESERIES_BACKFILL_DAYS = 14;
          // Sparse paired readings are cheap enough to backfill across the full
          // summary-history window. Dense timeseries retain the bounded default
          // below, and an explicit timeseriesBackfillDays override still wins.
          const JUNCTION_EXTENDED_TIMESERIES_BACKFILL_RESOURCES = Object.freeze([
            "blood_pressure",
          ] as const);
          const JUNCTION_EXTENDED_TIMESERIES_BACKFILL_RESOURCE_SET = new Set<string>(
            JUNCTION_EXTENDED_TIMESERIES_BACKFILL_RESOURCES,
          );
          const DEFAULT_RECONCILE_DAYS = JUNCTION_DEVICE_PROVIDER_DESCRIPTOR.sync.windows.reconcileDays;
          '''.replace('\n          ', '\n'),
          )

          replace_once(
              'provider backfill partitions',
              '''  const summaryBackfillDays = config.summaryBackfillDays ?? DEFAULT_SUMMARY_BACKFILL_DAYS;
            const timeseriesBackfillDays = config.timeseriesBackfillDays ?? DEFAULT_TIMESERIES_BACKFILL_DAYS;
            const reconcileDays = config.reconcileDays ?? DEFAULT_RECONCILE_DAYS;
          '''.replace('\n            ', '\n  '),
              '''  const summaryBackfillDays = config.summaryBackfillDays ?? DEFAULT_SUMMARY_BACKFILL_DAYS;
            const timeseriesBackfillDays = config.timeseriesBackfillDays ?? DEFAULT_TIMESERIES_BACKFILL_DAYS;
            const extendedTimeseriesBackfillDays = config.timeseriesBackfillDays ?? summaryBackfillDays;
            const boundedBackfillTimeseriesResources = timeseriesResources.filter(
              (resource) => !JUNCTION_EXTENDED_TIMESERIES_BACKFILL_RESOURCE_SET.has(resource),
            );
            const extendedBackfillTimeseriesResources = timeseriesResources.filter(
              (resource) => JUNCTION_EXTENDED_TIMESERIES_BACKFILL_RESOURCE_SET.has(resource),
            );
            const reconcileDays = config.reconcileDays ?? DEFAULT_RECONCILE_DAYS;
          '''.replace('\n            ', '\n  '),
          )

          replace_once(
              'backfill resource selection',
              '''    const baseTimeseriesWindowStart = job.kind === "backfill"
                ? maxIsoTimestamp(window.windowStart, subtractDays(window.windowEnd, timeseriesBackfillDays))
                : window.windowStart;
          '''.replace('\n              ', '\n    '),
              '''    const jobTimeseriesResources = job.kind === "backfill"
                ? boundedBackfillTimeseriesResources
                : timeseriesResources;
              const baseTimeseriesWindowStart = job.kind === "backfill"
                ? maxIsoTimestamp(window.windowStart, subtractDays(window.windowEnd, timeseriesBackfillDays))
                : window.windowStart;
          '''.replace('\n              ', '\n    '),
          )

          replace_once(
              'backfill import call',
              '''    if (
                job.kind === "backfill"
                || shouldImportClosedTimeseriesForReconcile(context.account.lastSyncCompletedAt, window.windowEnd)
              ) {
                const timeseriesImport = await importTimeseriesDailySnapshots(
                  context,
                  sourceProviders,
                  timeseriesWindowStart,
                  window.windowEnd,
                  skippedOptionalResources,
                );
          '''.replace('\n              ', '\n    '),
              '''    if (
                jobTimeseriesResources.length > 0
                && (
                  job.kind === "backfill"
                  || shouldImportClosedTimeseriesForReconcile(context.account.lastSyncCompletedAt, window.windowEnd)
                )
              ) {
                const timeseriesImport = await importTimeseriesDailySnapshots(
                  context,
                  sourceProviders,
                  timeseriesWindowStart,
                  window.windowEnd,
                  skippedOptionalResources,
                  jobTimeseriesResources,
                );
          '''.replace('\n              ', '\n    '),
          )

          initial_jobs_pattern = re.compile(
              r'''  function buildInitialJobs\(
              now: string,
              sourceProviderSlug\?: string \| null,
            \): DeviceSyncJobInput\[\] \{.*?\n  \}\n\n  return \{\n    provider: "junction",'''.replace('\n            ', '\n  '),
              re.S,
          )
          initial_jobs_replacement = '''  function buildExtendedTimeseriesBackfillJob(input: {
            now: string;
            resource: string;
            sourceProviderSlug: string | null;
          }): DeviceSyncJobInput {
            const windowStart = subtractDays(input.now, extendedTimeseriesBackfillDays);
            const payload = {
              resource: input.resource,
              resourceCategory: "timeseries",
              ...(input.sourceProviderSlug
                ? { sourceProviderSlug: input.sourceProviderSlug }
                : {}),
              windowStart,
              windowEnd: input.now,
            } satisfies JunctionDeviceSyncJobPayloads["resource"];

            return {
              kind: "resource",
              payload,
              priority: JUNCTION_HISTORICAL_BACKFILL_PRIORITY,
              dedupeKey: sha256Text(JSON.stringify([
                "junction",
                "extended-timeseries-backfill",
                input.sourceProviderSlug,
                input.resource,
                windowStart,
                input.now,
              ])),
            };
          }

          function buildInitialJobs(
            now: string,
            sourceProviderSlug?: string | null,
          ): DeviceSyncJobInput[] {
            const normalizedSourceProviderSlug = normalizeProviderSlug(sourceProviderSlug);
            const payload = normalizedSourceProviderSlug
              ? { sourceProviderSlug: normalizedSourceProviderSlug }
              : undefined;
            return [
              buildWindowJob({
                kind: "backfill",
                now,
                payload,
                windowStart: subtractDays(now, summaryBackfillDays),
                priority: 30,
              }),
              ...extendedBackfillTimeseriesResources.map((resource) =>
                buildExtendedTimeseriesBackfillJob({
                  now,
                  resource,
                  sourceProviderSlug: normalizedSourceProviderSlug,
                })
              ),
              buildWindowJob({
                kind: "reconcile",
                now,
                payload,
                windowStart: subtractDays(now, reconcileDays),
                priority: 40,
              }),
            ];
          }

          return {
            provider: "junction",'''.replace('\n          ', '\n')
          text, count = initial_jobs_pattern.subn(initial_jobs_replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f'initial jobs replacement: expected one match, found {count}')

          target.write_text(text)

          Path('packages/device-syncd/test/junction-blood-pressure-backfill.test.ts').write_text(r'''import assert from "node:assert/strict";
          import { test } from "vitest";

          import { createJunctionDeviceSyncProvider } from "../src/providers/junction.ts";
          import { createJsonResponse, readUrl, requireValue } from "./helpers.ts";

          import type {
            DeviceSyncAccount,
            DeviceSyncJobInput,
            DeviceSyncJobRecord,
            ProviderJobContext,
          } from "../src/types.ts";

          const NOW = "2026-06-11T12:00:00.000Z";

          interface TimeseriesRequest {
            end: string | null;
            resource: string;
            start: string | null;
          }

          function createAccount(): DeviceSyncAccount {
            return {
              id: "acct-junction-bp-1",
              provider: "junction",
              externalAccountId: "junction-user-1",
              disconnectGeneration: 0,
              credential: {
                kind: "provider_config",
                providerConfigKey: "junction",
                credentialMetadata: {},
              },
              displayName: "Junction",
              status: "active",
              scopes: [],
              accessTokenExpiresAt: null,
              metadata: {},
              connectedAt: NOW,
              lastWebhookAt: null,
              lastSyncStartedAt: null,
              lastSyncCompletedAt: null,
              lastSyncErrorAt: null,
              lastErrorCode: null,
              lastErrorMessage: null,
              nextReconcileAt: null,
              createdAt: NOW,
              updatedAt: NOW,
            };
          }

          function toJobRecord(input: DeviceSyncJobInput, index: number): DeviceSyncJobRecord {
            return {
              id: `job-${index}`,
              provider: "junction",
              accountId: "acct-junction-bp-1",
              kind: input.kind,
              payload: input.payload ?? {},
              priority: input.priority ?? 0,
              availableAt: input.availableAt ?? NOW,
              attempts: 0,
              maxAttempts: input.maxAttempts ?? 5,
              dedupeKey: input.dedupeKey ?? null,
              status: "queued",
              leaseOwner: null,
              leaseExpiresAt: null,
              lastErrorCode: null,
              lastErrorMessage: null,
              createdAt: NOW,
              updatedAt: NOW,
              startedAt: null,
              finishedAt: null,
            };
          }

          function createJobContext(): ProviderJobContext {
            const account = createAccount();
            return {
              account,
              now: NOW,
              importSnapshot: async () => ({ imported: true }),
              upsertConnectionSource: (input) => ({
                id: "src-1",
                connectionId: account.id,
                ...input,
                displayName: input.displayName ?? null,
                resourceAvailabilitySummary: input.resourceAvailabilitySummary ?? {},
                lastErrorCode: input.lastErrorCode ?? null,
                lastErrorMessage: input.lastErrorMessage ?? null,
                firstSeenAt: input.firstSeenAt ?? input.lastSeenAt,
                lastDataAt: input.lastDataAt ?? null,
                createdAt: input.lastSeenAt,
                updatedAt: input.lastSeenAt,
              }),
              refreshAccountTokens: async () => account,
              logger: {},
            };
          }

          function createProvider(input: {
            requests: TimeseriesRequest[];
            timeseriesBackfillDays?: number;
          }) {
            return createJunctionDeviceSyncProvider({
              apiKey: "sk_us_test_123",
              clientUserIdSecret: "junction-client-user-id-secret",
              environment: "sandbox",
              region: "us",
              summaryResources: ["activity"],
              summaryBackfillDays: 30,
              timeseriesResources: ["blood_pressure", "stress_level"],
              ...(input.timeseriesBackfillDays === undefined
                ? {}
                : { timeseriesBackfillDays: input.timeseriesBackfillDays }),
              fetchImpl: async (request) => {
                const url = new URL(readUrl(request));

                if (url.pathname.includes("/v2/user/resolve/")) {
                  return createJsonResponse({ user_id: "junction-user-1" });
                }
                if (url.pathname === "/v2/user/providers/junction-user-1") {
                  return createJsonResponse({
                    providers: [{
                      id: "provider-omron-1",
                      slug: "omron",
                      name: "Omron",
                      status: "connected",
                      resource_availability: {
                        activity: true,
                        blood_pressure: true,
                        stress_level: true,
                      },
                    }],
                  });
                }
                if (url.pathname === "/v2/summary/activity/junction-user-1") {
                  return createJsonResponse({ data: [] });
                }
                if (url.pathname === "/v2/introspect/historical_pull") {
                  return createJsonResponse({ data: [] });
                }
                const timeseriesPrefix = "/v2/timeseries/junction-user-1/";
                if (url.pathname.startsWith(timeseriesPrefix)) {
                  input.requests.push({
                    end: url.searchParams.get("end_date"),
                    resource: url.pathname.slice(timeseriesPrefix.length),
                    start: url.searchParams.get("start_date"),
                  });
                  return createJsonResponse({ groups: {} });
                }

                throw new Error(`Unexpected request: ${url.toString()}`);
              },
            });
          }

          test("Junction gives sparse blood pressure its own full-history resumable job", async () => {
            const requests: TimeseriesRequest[] = [];
            const provider = createProvider({ requests });
            const connection = await requireValue(provider.sdkConnectionHandler).ensureConnection({
              ownerId: "member-1",
              now: NOW,
            });
            const jobs = connection.initialJobs ?? [];
            const backfill = requireValue(jobs.find((job) => job.kind === "backfill"));
            const bloodPressure = requireValue(jobs.find((job) =>
              job.kind === "resource"
              && job.payload?.resource === "blood_pressure"
            ));

            assert.deepEqual(bloodPressure.payload, {
              resource: "blood_pressure",
              resourceCategory: "timeseries",
              windowStart: "2026-05-12T12:00:00.000Z",
              windowEnd: NOW,
            });

            const executor = requireValue(provider.jobExecutor);
            await executor.executeJob(createJobContext(), toJobRecord(backfill, 1));
            const boundedRequests = [...requests];
            assert.equal(boundedRequests.length, 14);
            assert.equal(
              boundedRequests.every((request) => request.resource === "stress_level"),
              true,
            );
            assert.equal(
              boundedRequests.some((request) => request.resource === "blood_pressure"),
              false,
            );

            await executor.executeJob(createJobContext(), toJobRecord(bloodPressure, 2));
            const bloodPressureRequests = requests.filter(
              (request) => request.resource === "blood_pressure",
            );
            assert.equal(bloodPressureRequests.length, 30);
            assert.equal(bloodPressureRequests[0]?.start, "2026-05-12T12:00:00.000Z");
            assert.equal(bloodPressureRequests.at(-1)?.end, NOW);
          });

          test("an explicit Junction timeseries backfill window still governs blood pressure", async () => {
            const provider = createProvider({
              requests: [],
              timeseriesBackfillDays: 5,
            });
            const connection = await requireValue(provider.sdkConnectionHandler).ensureConnection({
              ownerId: "member-1",
              now: NOW,
            });
            const bloodPressure = requireValue((connection.initialJobs ?? []).find((job) =>
              job.kind === "resource"
              && job.payload?.resource === "blood_pressure"
            ));

            assert.equal(bloodPressure.payload?.windowStart, "2026-06-06T12:00:00.000Z");
            assert.equal(bloodPressure.payload?.windowEnd, NOW);
          });
          '''.replace('\n          ', '\n').lstrip())

      - name: Run focused device-sync proof
        run: |
          pnpm --filter @murphai/device-syncd test -- junction-blood-pressure-backfill
          pnpm --filter @murphai/device-syncd typecheck

      - name: Commit verified implementation
        shell: bash
        run: |
          rm .github/workflows/one-shot-junction-bp-history-backfill.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: backfill sparse blood pressure history"
          git push origin HEAD:codex/junction-blood-pressure-history-backfill
