name: Apply group call cleanup

on:
  push:
    branches:
      - agent/remove-group-call-preview-clean

permissions:
  contents: write

concurrency:
  group: apply-group-call-cleanup-macos-v2
  cancel-in-progress: true

jobs:
  cleanup-and-verify:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply guarded source and test edits
        run: python3 scripts/apply-group-call-cleanup.py

      - name: Reject residual preview authority machinery
        run: |
          if git grep -n -E 'currentGroupPhoneCallPreviewAuthority|resolveDeliveredAssistantGroupPhoneCallPreviewAuthority|AssistantGroupPhoneCallPreviewAuthority|group-phone-call-preview-authority' -- packages/assistant-engine; then
            echo 'Legacy group-call preview authority machinery remains.' >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused assistant-engine tests
        run: >-
          pnpm --dir packages/assistant-engine exec vitest run
          --config vitest.config.ts
          --no-coverage
          test/assistant-phone-calls.test.ts
          test/assistant-capability-policy-skills.test.ts
          test/assistant-codex-turn-planning.test.ts
          test/assistant-codex-scripted-runtime.test.ts
          test/assistant-codex-real-e2e.test.ts

      - name: Typecheck assistant-engine
        run: pnpm --dir packages/assistant-engine typecheck

      - name: Commit verified cleanup and remove temporary automation
        run: |
          rm -f \
            .github/group-call-cleanup-trigger \
            .github/group-call-cleanup-merge-trigger \
            .github/group-call-cleanup-macos-trigger \
            .github/group-call-cleanup-macos-trigger-2 \
            .github/workflows/apply-group-call-cleanup.yml \
            .github/workflows/apply-group-call-cleanup-macos.yml \
            scripts/apply-group-call-cleanup.py
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(assistant): remove group-only call preview flow'
          git push origin HEAD:${GITHUB_REF_NAME}
