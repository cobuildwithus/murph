name: Bootstrap managed group skill test cutover

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - agent/private-group-assistant-skills-cutover

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ github.event_name == 'push' || github.head_ref == 'agent/private-group-assistant-skills-cutover' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out cutover branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: agent/private-group-assistant-skills-cutover

      - name: Move direct private-text assertions out of public coverage
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("packages/assistant-engine/test/assistant-skill-assets.test.ts")
          source = path.read_text(encoding="utf-8")

          removed_import = """import {
  HOSTED_VAULT_SHARE_ACTIVITY_MINUTES_PROJECTION_KIND,
  HOSTED_VAULT_SHARE_SELECTABLE_PROJECTION_KINDS,
} from '@murphai/hosted-execution/vault-share'

"""
          source = source.replace(removed_import, "")

          def replace_test(name: str, replacement: str = "") -> None:
              global source
              marker = f"  it('{name}'"
              start = source.find(marker)
              if start < 0:
                  if replacement and replacement in source:
                      return
                  raise SystemExit(f"Missing test block: {name}")
              next_test = source.find("\n  it('", start + len(marker))
              if next_test < 0:
                  raise SystemExit(f"Could not find end of test block: {name}")
              source = source[:start] + replacement + source[next_test + 1:]

          public_activity_test = """  it('keeps private activity interpretation in its public owner', async () => {
    const skill = ASSISTANT_SKILLS.find(
      (candidate) => candidate.slug === 'daily-activity',
    )
    if (!skill) throw new Error('Missing registered skill: daily-activity')
    const daily = (await readSkillFile(skill)).replace(/\\s+/gu, ' ')

    expect(daily).toMatch(
      /wearables day <date>.+wearables activity list.+canonical workout-day rollup/u,
    )
    expect(daily).toContain('current-local-day totals as provisional and say "so far."')
    expect(daily).toContain('not proof of failed provider sync or import')
  })

"""
          replace_test(
              "keeps private and shared activity interpretation in their owners",
              public_activity_test,
          )
          for test_name in (
              "keeps group newsletter setup and opt-out behavior in the group-chat skill",
              "keeps the new-group contact handoff natural and reactive",
              "polls scheduled member asks to a terminal result in the current turn",
              "registers a dedicated group newsletter editorial skill",
              "keeps group challenge guidance aligned with selectable scoring projections",
          ):
              replace_test(test_name)

          path.write_text(source, encoding="utf-8")
          PY

          git rm -f \
            packages/assistant-engine/test/assistant-group-chat-style-skill.test.ts \
            packages/assistant-engine/test/assistant-group-challenge-buy-in-skill.test.ts \
            packages/assistant-engine/test/assistant-group-challenge-diagnostics-skill.test.ts \
            packages/assistant-engine/test/assistant-group-challenge-scorecards-skill.test.ts \
            packages/assistant-engine/test/assistant-groupchat-comedy-skill.test.ts

      - name: Commit test ownership cutover when needed
        shell: bash
        run: |
          set -euo pipefail
          git add packages/assistant-engine/test
          if git diff --cached --quiet; then
            echo "Managed group skill test cutover is already applied."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Move managed group skill text pins out of public tests"
          git push origin HEAD:agent/private-group-assistant-skills-cutover
