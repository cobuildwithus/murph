name: Hosted Web Contract Migrations

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Current Vercel production commit SHA to prove before applying contract migrations.
        required: true
        type: string
      deployment_url:
        description: Exact ready Vercel production deployment URL to prove.
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-contract-migrations:
    name: Run post-deploy contract migrations
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.description == 'Deployment has completed' && contains(fromJSON('["Production","production"]'), github.event.deployment.environment) && (github.event.deployment_status.creator.login == 'vercel[bot]' || github.event.deployment.creator.login == 'vercel[bot]')) }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.deployment.sha || inputs.deployed_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify deployed commit is from main
        id: production-branch
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha || inputs.deployed_sha }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

          if git merge-base --is-ancestor "${DEPLOYED_SHA}" origin/main; then
            echo "should_run=true" >> "${GITHUB_OUTPUT}"
            if [ "${DEPLOYED_SHA}" = "$(git rev-parse origin/main)" ]; then
              echo "should_require_current=true" >> "${GITHUB_OUTPUT}"
            else
              echo "should_require_current=false" >> "${GITHUB_OUTPUT}"
              echo "::notice::The deployed SHA is from main but is no longer its tip; a newer ready main deployment owns production convergence."
            fi
            exit 0
          fi

          echo "should_run=false" >> "${GITHUB_OUTPUT}"
          echo "should_require_current=false" >> "${GITHUB_OUTPUT}"
          echo "::notice::Skipping hosted web contract migrations because deployed SHA is not reachable from origin/main."

      - name: Setup pnpm
        if: ${{ steps.production-branch.outputs.should_run == 'true' }}
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        if: ${{ steps.production-branch.outputs.should_run == 'true' }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Install deps
        if: ${{ steps.production-branch.outputs.should_run == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Verify current Vercel production deployment
        id: current-production
        if: ${{ steps.production-branch.outputs.should_run == 'true' }}
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha || inputs.deployed_sha }}
          HOSTED_WEB_PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
          HOSTED_WEB_VERCEL_DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || inputs.deployment_url }}
          HOSTED_WEB_VERCEL_PROJECT_ID: ${{ vars.HOSTED_WEB_VERCEL_PROJECT_ID }}
          HOSTED_WEB_VERCEL_TEAM_ID: ${{ vars.HOSTED_WEB_VERCEL_TEAM_ID }}
          HOSTED_WEB_VERCEL_TOKEN: ${{ secrets.HOSTED_WEB_VERCEL_TOKEN }}
          HOSTED_WEB_CONTRACT_MIGRATION_DRAIN_SECONDS: ${{ vars.HOSTED_WEB_CONTRACT_MIGRATION_DRAIN_SECONDS || '300' }}
          SHOULD_REQUIRE_CURRENT: ${{ steps.production-branch.outputs.should_require_current }}
        run: |
          set -euo pipefail

          if [ -z "${HOSTED_WEB_VERCEL_TOKEN}" ]; then
            echo "::error::HOSTED_WEB_VERCEL_TOKEN is required to verify the current Vercel production deployment."
            exit 1
          fi

          if [ -z "${HOSTED_WEB_VERCEL_PROJECT_ID}" ]; then
            echo "::error::HOSTED_WEB_VERCEL_PROJECT_ID is required to verify the current Vercel production deployment."
            exit 1
          fi

          if [ -z "${HOSTED_WEB_PRODUCTION_BASE_URL}" ]; then
            echo "::error::HOSTED_WEB_PRODUCTION_BASE_URL is required to verify the current Vercel production deployment."
            exit 1
          fi

          if ! [[ "${HOSTED_WEB_CONTRACT_MIGRATION_DRAIN_SECONDS}" =~ ^[0-9]+$ ]]; then
            echo "::error::HOSTED_WEB_CONTRACT_MIGRATION_DRAIN_SECONDS must be a non-negative integer."
            exit 1
          fi

          if [ "${HOSTED_WEB_CONTRACT_MIGRATION_DRAIN_SECONDS}" -gt 600 ]; then
            echo "::error::HOSTED_WEB_CONTRACT_MIGRATION_DRAIN_SECONDS must be 600 or less unless the workflow timeout is also raised."
            exit 1
          fi

          current_sha="$(
            pnpm --dir apps/web exec tsx scripts/resolve-vercel-production-alias-sha.ts
          )"

          if [ "${current_sha}" != "${DEPLOYED_SHA}" ]; then
            if [ "${SHOULD_REQUIRE_CURRENT}" = "true" ]; then
              echo "::error::The current main Vercel deployment is Ready, but the production base domain still serves another commit."
              exit 1
            fi
            echo "should_apply=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping hosted web contract migrations because current Vercel production is ${current_sha}, not ${DEPLOYED_SHA}."
            exit 0
          fi

          verified_sha="$(
            pnpm --dir apps/web exec tsx scripts/verify-vercel-production-deployment.ts
          )"
          if [ "${verified_sha}" != "${DEPLOYED_SHA}" ]; then
            echo "::error::Exact Vercel production deployment verification returned an unexpected commit."
            exit 1
          fi

          if [ "${HOSTED_WEB_CONTRACT_MIGRATION_DRAIN_SECONDS}" -gt 0 ]; then
            echo "::notice::Waiting ${HOSTED_WEB_CONTRACT_MIGRATION_DRAIN_SECONDS}s for prior production function executions to drain before contract migrations."
            sleep "${HOSTED_WEB_CONTRACT_MIGRATION_DRAIN_SECONDS}"
          fi

          current_sha="$(
            pnpm --dir apps/web exec tsx scripts/resolve-vercel-production-alias-sha.ts
          )"
          if [ "${current_sha}" != "${DEPLOYED_SHA}" ]; then
            if [ "${SHOULD_REQUIRE_CURRENT}" = "true" ]; then
              echo "::error::The current main Vercel deployment changed during the prior-function drain."
              exit 1
            fi
            echo "should_apply=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Skipping hosted web contract migrations because Vercel production advanced during the prior-function drain."
            exit 0
          fi

          verified_sha="$(
            pnpm --dir apps/web exec tsx scripts/verify-vercel-production-deployment.ts
          )"
          if [ "${verified_sha}" != "${DEPLOYED_SHA}" ]; then
            echo "::error::Final exact Vercel production deployment verification returned an unexpected commit."
            exit 1
          fi

          echo "should_apply=true" >> "${GITHUB_OUTPUT}"

      - name: Apply contract migrations
        if: ${{ steps.production-branch.outputs.should_run == 'true' && steps.current-production.outputs.should_apply == 'true' }}
        shell: bash
        env:
          DEPLOYED_SHA: ${{ github.event.deployment.sha || inputs.deployed_sha }}
          HOSTED_WEB_PRODUCTION_BASE_URL: ${{ vars.HOSTED_WEB_PRODUCTION_BASE_URL }}
          HOSTED_WEB_VERCEL_DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || inputs.deployment_url }}
          HOSTED_WEB_VERCEL_PROJECT_ID: ${{ vars.HOSTED_WEB_VERCEL_PROJECT_ID }}
          HOSTED_WEB_VERCEL_TEAM_ID: ${{ vars.HOSTED_WEB_VERCEL_TEAM_ID }}
          HOSTED_WEB_VERCEL_TOKEN: ${{ secrets.HOSTED_WEB_VERCEL_TOKEN }}
          SHOULD_REQUIRE_CURRENT: ${{ steps.production-branch.outputs.should_require_current }}
          DIRECT_DATABASE_URL: ${{ secrets.HOSTED_WEB_DIRECT_DATABASE_URL }}
          MURPH_REQUIRE_DIRECT_DATABASE_URL_FOR_MIGRATIONS: "1"
          MURPH_RUN_HOSTED_WEB_CONTRACT_MIGRATIONS: "1"
        run: |
          set -euo pipefail

          if [ -z "${DIRECT_DATABASE_URL}" ]; then
            echo "::error::HOSTED_WEB_DIRECT_DATABASE_URL is required to apply hosted web contract migrations."
            exit 1
          fi

          current_sha="$(
            env \
              -u DIRECT_DATABASE_URL \
              -u MURPH_REQUIRE_DIRECT_DATABASE_URL_FOR_MIGRATIONS \
              -u MURPH_RUN_HOSTED_WEB_CONTRACT_MIGRATIONS \
              pnpm --dir apps/web exec tsx scripts/resolve-vercel-production-alias-sha.ts
          )"

          if [ "${current_sha}" != "${DEPLOYED_SHA}" ]; then
            if [ "${SHOULD_REQUIRE_CURRENT}" = "true" ]; then
              echo "::error::The current main Vercel deployment changed immediately before contract migrations."
              exit 1
            fi
            echo "::notice::Skipping hosted web contract migrations because current Vercel production is ${current_sha}, not ${DEPLOYED_SHA}."
            exit 0
          fi

          verified_sha="$(
            env \
              -u DIRECT_DATABASE_URL \
              -u MURPH_REQUIRE_DIRECT_DATABASE_URL_FOR_MIGRATIONS \
              -u MURPH_RUN_HOSTED_WEB_CONTRACT_MIGRATIONS \
              pnpm --dir apps/web exec tsx scripts/verify-vercel-production-deployment.ts
          )"
          if [ "${verified_sha}" != "${DEPLOYED_SHA}" ]; then
            echo "::error::Exact Vercel production deployment verification returned an unexpected commit."
            exit 1
          fi

          pnpm --dir apps/web release:production:contract-migrate
