name: Hosted Web Contract Migrations

on:
  deployment_status:

permissions:
  contents: read

jobs:
  production-contract-migrations:
    name: Run post-deploy contract migrations
    if: ${{ github.event.deployment_status.state == 'success' && github.event.deployment.ref == 'main' && contains(fromJSON('["Production","production"]'), github.event.deployment.environment) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: hosted-web-contract-migrations-production
      cancel-in-progress: false
    env:
      DIRECT_DATABASE_URL: ${{ secrets.HOSTED_WEB_DIRECT_DATABASE_URL }}
      MURPH_REQUIRE_DIRECT_DATABASE_URL_FOR_MIGRATIONS: "1"
      MURPH_RUN_HOSTED_WEB_CONTRACT_MIGRATIONS: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.deployment.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Apply hosted web contract migrations
        run: pnpm --dir apps/web release:production:contract-migrate
