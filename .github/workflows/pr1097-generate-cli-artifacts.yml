name: PR 1097 Generate CLI Artifacts

on:
  push:
    branches:
      - agent/group-challenge-scorecards

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exercise-library:generate && pnpm health-commons:generate
      - run: pnpm --dir packages/cli gen:config-schema
      - name: Commit generated artifacts and remove this one-use workflow
        run: |
          rm .github/workflows/pr1097-generate-cli-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/pr1097-generate-cli-artifacts.yml \
            packages/cli/config.schema.json \
            packages/cli/src/incur.generated.ts \
            packages/cli/src/vault-cli-skill-hash.generated.ts
          git commit -m "Regenerate CLI artifacts for challenge scoring"
          git push origin HEAD:agent/group-challenge-scorecards
