name: Export PR957 Patch

on:
  pull_request:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Export exact pull request patch
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --binary "$BASE_SHA" "$HEAD_SHA" -- . \
            ':(exclude).github/workflows/export-pr957-patch.yml' \
            > murph-visible-secondary-outcomes.patch
          test -s murph-visible-secondary-outcomes.patch

      - name: Upload patch
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: murph-visible-secondary-outcomes-patch
          path: murph-visible-secondary-outcomes.patch
          retention-days: 1
          if-no-files-found: error
