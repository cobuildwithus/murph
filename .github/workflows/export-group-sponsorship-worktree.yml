name: Export group sponsorship worktree

on:
  pull_request:
    branches:
      - agent/reuse-saved-card-for-group-funding-v2
    types:
      - opened
      - reopened
      - synchronize
  push:
    branches:
      - agent/group-sponsorship-moments

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Create source archive
        run: |
          git archive --format=tar.gz --output=murph-group-sponsorship-worktree.tar.gz HEAD

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: murph-group-sponsorship-worktree
          path: murph-group-sponsorship-worktree.tar.gz
          if-no-files-found: error
          retention-days: 1
