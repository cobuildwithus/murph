name: Agent Pending Group Source Snapshot

on:
  pull_request:
  push:
    branches:
      - agent/pending-group-setup

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack tracked branch files
        run: git ls-files -z | tar --null -T - -czf murph-pending-group-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: murph-pending-group-source
          path: murph-pending-group-source.tar.gz
          if-no-files-found: error
          retention-days: 1
