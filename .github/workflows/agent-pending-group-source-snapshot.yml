name: Agent Pending Group Source Snapshot

on:
  push:
    branches:
      - agent/pending-group-setup

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack scoped source snapshot
        run: |
          tar -czf pending-group-source.tar.gz \
            packages/assistant-engine/src/assistant-codex/dynamic-tools.ts \
            packages/assistant-engine/test/assistant-tool-description-contracts.test.ts \
            packages/assistant-engine/test/assistant-codex-group-tool.test.ts \
            packages/assistant-runtime/src/hosted-runtime/context.ts \
            packages/hosted-execution/src/contracts.ts \
            packages/hosted-execution/src/builders.ts \
            packages/hosted-execution/src/parsers/runtime-control.ts \
            apps/web/src/lib/hosted-onboarding/webhook-service.ts \
            apps/web/src/lib/hosted-onboarding/webhook-provider-linq.ts \
            apps/web/src/lib/hosted-routing/thread-container-service.ts \
            apps/web/src/lib/hosted-privacy/account-data-service.ts \
            apps/web/prisma/schema.prisma
      - uses: actions/upload-artifact@v4
        with:
          name: pending-group-source
          path: pending-group-source.tar.gz
          if-no-files-found: error
          retention-days: 1
