name: PR 1381 final audit verification 2026-08-09

on:
  push:
    branches:
      - agent/pr1381-final-audit-verify-20260809

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact PR on audited main
        run: |
          git config user.name "PR 1381 final audit"
          git config user.email "pr1381-audit@users.noreply.github.com"
          git fetch --no-tags origin +refs/heads/agent/codex-exact-app-server-protocol:refs/remotes/origin/agent/codex-exact-app-server-protocol
          git cherry-pick \
            28395092b56325e0a8955408e7aaee6df752dbbe \
            956b123d4cf07820269a4f6153b21e591ef5bcc8 \
            9383777dd24b747e55dbb3f871bbfc3e51305094 \
            48af94011e4d90e86eb9caa90a3b376dfaade018
          base64 --decode .github/pr1381-audit-fixes.patch.gz.b64 | gunzip > /tmp/pr1381-audit-fixes.patch
          git apply --check /tmp/pr1381-audit-fixes.patch
          git apply /tmp/pr1381-audit-fixes.patch
          git diff --check
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck assistant engine
        run: pnpm --dir packages/assistant-engine typecheck
      - name: Run focused Codex protocol and runtime tests
        run: >-
          pnpm --dir packages/assistant-engine exec vitest run
          --config vitest.config.ts
          --no-coverage
          test/app-server-protocol.test.ts
          test/assistant-codex-runtime.test.ts
          test/codex-runtime-helpers.test.ts
      - name: Run complete assistant engine suite
        run: pnpm --dir packages/assistant-engine test
      - name: Run affected hosted runtime fixture
        run: >-
          pnpm --dir packages/assistant-runtime exec vitest run
          --config vitest.config.ts
          --no-coverage
          test/hosted-runtime-workspace-entrypoint.test.ts
      - name: Run affected CLI fixture
        run: >-
          pnpm --dir packages/cli exec vitest run
          --config vitest.config.ts
          --no-coverage
          test/assistant-codex.test.ts
