name: PR 1381 final audit verification 2026-08-09

on:
  push:
    branches:
      - agent/pr1381-final-audit-verify-20260809

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild exact PR on audited main
        run: |
          cp .github/pr1381-audit-fixes.patch.gz.b64 /tmp/pr1381-audit-fixes.patch.gz.b64
          git config user.name "PR 1381 final audit"
          git config user.email "pr1381-audit@users.noreply.github.com"
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/agent/codex-exact-app-server-protocol:refs/remotes/origin/agent/codex-exact-app-server-protocol
          git checkout --detach refs/remotes/origin/agent/codex-exact-app-server-protocol
          git merge --no-commit --no-ff e0a40645663e4479e3a58dcbe21f790d3c737c87
          base64 --decode /tmp/pr1381-audit-fixes.patch.gz.b64 | gunzip > /tmp/pr1381-audit-fixes.patch
          git apply --check /tmp/pr1381-audit-fixes.patch
          git apply /tmp/pr1381-audit-fixes.patch
          git diff --check
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck assistant engine
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/assistant-engine typecheck 2>&1 | tee /tmp/pr1381-typecheck.log
      - name: Run focused Codex protocol and runtime tests
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/assistant-engine exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/app-server-protocol.test.ts \
            test/assistant-codex-runtime.test.ts \
            test/codex-runtime-helpers.test.ts \
            2>&1 | tee /tmp/pr1381-focused.log
      - name: Run complete assistant engine suite
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/assistant-engine test 2>&1 | tee /tmp/pr1381-full.log
      - name: Run affected hosted runtime fixture
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/assistant-runtime exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/hosted-runtime-workspace-entrypoint.test.ts \
            2>&1 | tee /tmp/pr1381-runtime.log
      - name: Run affected CLI fixture
        shell: bash
        run: |
          set -o pipefail
          pnpm --dir packages/cli exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/assistant-codex.test.ts \
            2>&1 | tee /tmp/pr1381-cli.log
      - name: Upload final audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1381-final-audit-logs
          path: |
            /tmp/pr1381-typecheck.log
            /tmp/pr1381-focused.log
            /tmp/pr1381-full.log
            /tmp/pr1381-runtime.log
            /tmp/pr1381-cli.log
          if-no-files-found: ignore
          retention-days: 1
