name: Deploy Render Temporal Worker

on:
  workflow_run:
    workflows:
      - Murph Host Support
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: deploy-render-temporal-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy worker after CI
    runs-on: ubuntu-24.04
    environment: production
    if: >-
      ${{
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'
      }}
    env:
      GH_TOKEN: ${{ github.token }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_TEMPORAL_WORKER_DEPLOY_HOOK }}
    steps:
      - name: Verify required CI passed for current main
        id: gate
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          owner_repo="${GITHUB_REPOSITORY}"
          sha="$WORKFLOW_RUN_SHA"

          main_sha="$(gh api "repos/${owner_repo}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$sha" != "$main_sha" ]]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Render deploy because ${sha} is not the current main tip."
            exit 0
          fi

          required_workflows=(
            "host-support.yml:Murph Host Support"
            "repo-hygiene.yml:Repo Hygiene"
          )

          deadline=$((SECONDS + 600))
          while true; do
            current_main_sha="$(gh api "repos/${owner_repo}/git/ref/heads/main" --jq '.object.sha')"
            if [[ "$sha" != "$current_main_sha" ]]; then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping Render deploy because ${sha} is no longer the current main tip."
              exit 0
            fi

            all_success=true

            for entry in "${required_workflows[@]}"; do
              workflow_file="${entry%%:*}"
              workflow_name="${entry#*:}"
              response="$(
                gh api "repos/${owner_repo}/actions/workflows/${workflow_file}/runs" \
                  --method GET \
                  -f branch=main \
                  -f event=push \
                  -f head_sha="$sha" \
                  -f per_page=5
              )"
              run_json="$(
                jq -cr '.workflow_runs | sort_by(.created_at) | reverse | .[0] // empty' \
                  <<< "$response"
              )"

              if [[ -z "$run_json" ]]; then
                echo "::notice::Waiting for ${workflow_name} to start for ${sha}."
                all_success=false
                continue
              fi

              status="$(jq -r '.status' <<< "$run_json")"
              conclusion="$(jq -r '.conclusion // ""' <<< "$run_json")"

              if [[ "$status" != "completed" ]]; then
                echo "::notice::Waiting for ${workflow_name}; current status is ${status}."
                all_success=false
                continue
              fi

              if [[ "$conclusion" != "success" ]]; then
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Skipping Render deploy because ${workflow_name} concluded ${conclusion}."
                exit 0
              fi
            done

            if [[ "$all_success" == "true" ]]; then
              current_main_sha="$(gh api "repos/${owner_repo}/git/ref/heads/main" --jq '.object.sha')"
              if [[ "$sha" != "$current_main_sha" ]]; then
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Skipping Render deploy because ${sha} is no longer the current main tip."
                exit 0
              fi

              echo "deploy=true" >> "$GITHUB_OUTPUT"
              echo "sha=$sha" >> "$GITHUB_OUTPUT"
              echo "Required CI workflows passed for ${sha}."
              exit 0
            fi

            if (( SECONDS >= deadline )); then
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              echo "::error::Timed out waiting for required CI workflows for ${sha}."
              exit 1
            fi

            sleep 20
          done

      - name: Trigger Render deploy
        if: ${{ steps.gate.outputs.deploy == 'true' }}
        env:
          DEPLOY_SHA: ${{ steps.gate.outputs.sha }}
        run: |
          set -euo pipefail

          if [[ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]]; then
            echo "::error::Missing GitHub Actions secret RENDER_TEMPORAL_WORKER_DEPLOY_HOOK."
            exit 1
          fi

          current_main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$DEPLOY_SHA" != "$current_main_sha" ]]; then
            echo "::notice::Skipping Render deploy because ${DEPLOY_SHA} is no longer the current main tip."
            exit 0
          fi

          separator="?"
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
            separator="&"
          fi

          deploy_url="${RENDER_DEPLOY_HOOK_URL}${separator}ref=${DEPLOY_SHA}"
          response_file="$(mktemp)"
          status="$(
            curl \
              --silent \
              --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request POST \
              "$deploy_url"
          )"

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "::error::Render deploy hook request failed with HTTP ${status}."
            exit 1
          fi

          echo "Triggered Render deploy for ${DEPLOY_SHA}."
