name: Agent physical notes finalize

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: agent-physical-notes-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-and-clean:
    if: github.event.pull_request.head.ref == 'agent/physical-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/physical-notes

      - name: Wire source contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          web_tsconfig = Path('apps/web/tsconfig.json')
          web_text = web_tsconfig.read_text()
          web_mapping = '''      "@murphai/hosted-execution/physical-notes": [
                  "../../packages/hosted-execution/src/physical-notes.ts"
                ],
          '''
          if web_mapping not in web_text:
              web_anchor = '''      "@murphai/hosted-execution/phone-calls": [
                  "../../packages/hosted-execution/src/phone-calls.ts"
                ],
          '''
              if web_anchor not in web_text:
                  raise SystemExit('hosted-execution phone-calls path anchor not found')
              web_tsconfig.write_text(web_text.replace(web_anchor, web_anchor + web_mapping, 1))

          exports_test = Path('packages/hosted-execution/test/hosted-execution.test.ts')
          exports_text = exports_test.read_text()
          exports_expected = '''      "./phone-calls",
                "./physical-notes",
                "./plan-usage",
          '''
          if exports_expected not in exports_text:
              exports_anchor = '''      "./phone-calls",
                "./plan-usage",
          '''
              if exports_anchor not in exports_text:
                  raise SystemExit('hosted-execution export allowlist anchor not found')
              exports_test.write_text(
                  exports_text.replace(exports_anchor, exports_expected, 1),
              )
          PY
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck affected owners
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @murphai/hosted-execution typecheck
          pnpm --filter @murphai/assistant-engine typecheck
          pnpm --filter @murphai/assistant-runtime typecheck
          pnpm --dir apps/cloudflare typecheck
          pnpm --dir apps/web typecheck

      - name: Run exact affected tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/hosted-execution exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/physical-notes.test.ts \
            test/hosted-execution.test.ts
          pnpm --dir packages/assistant-engine exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/assistant-physical-notes.test.ts \
            test/assistant-hosted-image-completion.test.ts
          pnpm --dir packages/assistant-runtime exec vitest run \
            --config vitest.config.ts \
            --no-coverage \
            test/hosted-runtime-image-generation.test.ts
          pnpm exec vitest run \
            --config apps/web/vitest.workspace.ts \
            --no-coverage \
            apps/web/test/physical-notes-lob-runtime.test.ts \
            apps/web/test/hosted-execution-usage-lob.test.ts \
            apps/web/test/hosted-physical-note-storage-contract.test.ts \
            apps/web/test/hosted-account-data-service.test.ts

      - name: Commit verified integration and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/agent-physical-notes-*
          git rm -f .github/workflows/agent-physical-notes-bootstrap.yml
          git add \
            apps/web/tsconfig.json \
            packages/hosted-execution/test/hosted-execution.test.ts
          git diff --cached --check
          git commit -m 'chore: finalize physical-note integration'
          git push origin HEAD:agent/physical-notes
