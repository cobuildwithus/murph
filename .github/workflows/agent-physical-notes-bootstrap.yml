name: Agent physical notes finalize

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: agent-physical-notes-finalize-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-and-clean:
    if: github.event.pull_request.head.ref == 'agent/physical-notes'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/physical-notes

      - name: Wire Web source path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/web/tsconfig.json')
          text = path.read_text()
          mapping = '''      "@murphai/hosted-execution/physical-notes": [
                  "../../packages/hosted-execution/src/physical-notes.ts"
                ],
          '''
          if mapping not in text:
              anchor = '''      "@murphai/hosted-execution/phone-calls": [
                  "../../packages/hosted-execution/src/phone-calls.ts"
                ],
          '''
              if anchor not in text:
                  raise SystemExit('hosted-execution phone-calls path anchor not found')
              path.write_text(text.replace(anchor, anchor + mapping, 1))
          PY
          git diff --check

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck affected owners
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @murphai/hosted-execution typecheck
          pnpm --filter @murphai/assistant-engine typecheck
          pnpm --filter @murphai/assistant-runtime typecheck
          pnpm --dir apps/cloudflare typecheck
          pnpm --dir apps/web typecheck

      - name: Run focused tests
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @murphai/hosted-execution test -- physical-notes
          pnpm --filter @murphai/assistant-engine test -- assistant-physical-notes assistant-hosted-image-completion
          pnpm --filter @murphai/assistant-runtime test -- hosted-runtime-image-generation
          pnpm --dir apps/web test:prepared -- physical-notes-lob-runtime hosted-execution-usage-lob hosted-physical-note-storage-contract hosted-account-data-service

      - name: Commit verified integration and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/agent-physical-notes-*
          git rm -f .github/workflows/agent-physical-notes-bootstrap.yml
          git add apps/web/tsconfig.json
          git diff --cached --check
          git commit -m 'chore: finalize physical-note integration'
          git push origin HEAD:agent/physical-notes
