packages:
  - packages/*
  - apps/*
# Keep this list intentionally short. Review new entries with `pnpm deps:approve-builds` on a trusted machine.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
blockExoticSubdeps: true
engineStrict: true
managePackageManagerVersions: true
minimumReleaseAge: 1440
overrides:
  axios: 1.15.2
  '@prisma/dev@0.24.3>@hono/node-server': 1.19.13
  '@workflow/core@4.2.4>devalue': 5.8.1
  '@workflow/world-local>undici': 7.24.8
  '@workflow/world-vercel>undici': 7.24.8
  'ajv@8.18.0>fast-uri': 3.1.2
  'ajv@8.20.0>fast-uri': 3.1.2
  'fast-xml-parser@5.7.2>fast-xml-builder': 1.2.0
  'next@16.2.4>postcss': 8.5.13
  'repomix@1.14.0>fast-xml-builder': 1.2.0
minimumReleaseAgeExclude:
  - incur@0.4.4
  - '@cobuild/review-gpt@0.5.92'
  - fast-uri@3.1.2
  - fast-xml-builder@1.2.0
nodeVersion: 24.14.1
packageManagerStrictVersion: true
patchedDependencies:
  incur@0.4.5: patches/incur@0.4.5.patch
savePrefix: ''
trustPolicy: no-downgrade
# Ignore provenance-era drift for older releases that predate broad trusted publishing.
trustPolicyIgnoreAfter: 259200
