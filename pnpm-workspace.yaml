  '@coinbase/cdp-sdk>axios': 1.17.0
  '@hono/node-server>hono': 4.12.25
  '@metamask/sdk-communication-layer>uuid': 11.1.1
  '@metamask/sdk>uuid': 11.1.1
  '@metamask/utils>uuid': 11.1.1
  '@modelcontextprotocol/sdk>hono': 4.12.25
  '@privy-io/js-sdk-core>js-cookie': 3.0.8
  '@privy-io/react-auth>js-cookie': 3.0.8
  '@solana/rpc-subscriptions-channel-websocket>ws': 8.21.0
  '@temporalio/client>@grpc/grpc-js': 1.14.4
  '@temporalio/core-bridge>@grpc/grpc-js': 1.14.4
  '@temporalio/worker>@grpc/grpc-js': 1.14.4
  '@workflow/builders>esbuild': 0.28.1
  '@workflow/cli>esbuild': 0.28.1
  axios-retry>axios: 1.17.0
  body-parser>qs: 6.15.2
  engine.io-client>ws: 8.21.0
  express-rate-limit>ip-address: 10.2.0
  express>qs: 6.15.2
  ink>ws: 8.21.0
  isows>ws: 8.21.0
  'minimatch@>=10.0.0>brace-expansion': 5.0.6
  miniflare>ws: 8.21.0
  next>postcss: 8.5.15
  porto>hono: 4.12.25
  terser-webpack-plugin>esbuild: 0.28.1
  tsx>esbuild: 0.28.1
  viem>ws: 8.21.0
  vite>esbuild: 0.28.1
  wrangler>esbuild: 0.28.1
  '@prisma/dev>@hono/node-server': 1.19.13
  '@prisma/dev>hono': 4.12.25
  '@workflow/core@4.2.4>devalue': 5.8.1
  '@workflow/world-local>undici': 7.24.8
  '@workflow/world-vercel>undici': 7.24.8
