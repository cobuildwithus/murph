packages:
  - packages/*
  - apps/*
# Keep this list intentionally short. Review new entries with `pnpm deps:approve-builds` on a trusted machine.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
blockExoticSubdeps: true
engineStrict: true
managePackageManagerVersions: true
minimumReleaseAge: 1440
overrides:
