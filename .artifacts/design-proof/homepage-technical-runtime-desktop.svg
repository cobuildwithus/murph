<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1420" viewBox="0 0 1440 1420" role="img" aria-labelledby="title desc">
  <title id="title">Desktop design proof for the Murph technical runtime homepage section</title>
  <desc id="desc">A warm dark homepage section describing Murph's Codex runtime, browser, phone, bounded subagents, reasoning effort, and provider choices.</desc>
  <rect width="1440" height="1420" fill="#2d3436"/>

  <g transform="translate(120 110)">
    <line x1="0" y1="8" x2="40" y2="8" stroke="#d4b87a" stroke-width="1" opacity=".8"/>
    <text x="58" y="12" fill="#d4b87a" font-family="DM Mono, ui-monospace, monospace" font-size="11" font-weight="600" letter-spacing="2.4">UNDER THE HOOD</text>
    <text x="0" y="78" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="62" font-weight="600" letter-spacing="-2.4">
      <tspan x="0" dy="0">A real agent runtime</tspan>
      <tspan x="0" dy="64">behind a simple text.</tspan>
    </text>
    <text x="0" y="232" fill="#f5f0e8" fill-opacity=".68" font-family="DM Sans, Arial, sans-serif" font-size="18">
      <tspan x="0" dy="0">Murph can use a browser, place phone calls, operate tools,</tspan>
      <tspan x="0" dy="29">and delegate bounded work. It changes model and reasoning</tspan>
      <tspan x="0" dy="29">effort to fit the task, while you choose the inference.</tspan>
    </text>
  </g>

  <g transform="translate(790 105)">
    <rect width="530" height="350" rx="22" fill="#252b2c" stroke="#d4c4a8" stroke-opacity=".2"/>
    <circle cx="32" cy="31" r="5" fill="#b56f5c"/>
    <circle cx="50" cy="31" r="5" fill="#d4b87a"/>
    <circle cx="68" cy="31" r="5" fill="#8fa082"/>
    <text x="496" y="35" text-anchor="end" fill="#f5f0e8" fill-opacity=".55" font-family="DM Mono, ui-monospace, monospace" font-size="10" letter-spacing="1.8">MURPH RUNTIME</text>
    <line x1="24" y1="58" x2="506" y2="58" stroke="#d4c4a8" stroke-opacity=".14"/>

    <g font-family="DM Mono, ui-monospace, monospace" font-size="13">
      <text x="26" y="96" fill="#aebca5" font-size="10" letter-spacing="1.5">RUNTIME</text>
      <text x="145" y="96" fill="#f5f0e8" fill-opacity=".78">Codex CLI + App Server</text>
      <line x1="24" y1="118" x2="506" y2="118" stroke="#d4c4a8" stroke-opacity=".12"/>

      <text x="26" y="155" fill="#aebca5" font-size="10" letter-spacing="1.5">TOOLS</text>
      <text x="145" y="155" fill="#f5f0e8" fill-opacity=".78">browser · phone · integrations</text>
      <line x1="24" y1="178" x2="506" y2="178" stroke="#d4c4a8" stroke-opacity=".12"/>

      <text x="26" y="215" fill="#aebca5" font-size="10" letter-spacing="1.5">WORKERS</text>
      <text x="145" y="215" fill="#f5f0e8" fill-opacity=".78">root · bounded subagents</text>
      <line x1="24" y1="238" x2="506" y2="238" stroke="#d4c4a8" stroke-opacity=".12"/>

      <text x="26" y="275" fill="#aebca5" font-size="10" letter-spacing="1.5">REASONING</text>
      <text x="145" y="275" fill="#f5f0e8" fill-opacity=".78">low · medium · high · xhigh</text>
    </g>
    <text x="26" y="316" fill="#d4b87a" font-family="DM Mono, ui-monospace, monospace" font-size="12">&gt;</text>
    <text x="43" y="316" fill="#f5f0e8" fill-opacity=".60" font-family="DM Mono, ui-monospace, monospace" font-size="12">select the lightest capable path</text>
    <text x="26" y="337" fill="#d4b87a" font-family="DM Mono, ui-monospace, monospace" font-size="12">&gt;</text>
    <text x="43" y="337" fill="#f5f0e8" fill-opacity=".60" font-family="DM Mono, ui-monospace, monospace" font-size="12">keep the member in control</text>
  </g>

  <g transform="translate(120 520)">
    <rect width="1200" height="470" rx="22" fill="#d4c4a8" fill-opacity=".16"/>

    <g font-family="DM Sans, Arial, sans-serif">
      <g transform="translate(1 1)">
        <rect width="398" height="233" fill="#2d3436"/>
        <text x="32" y="40" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.6">RUNTIME</text>
        <text x="32" y="83" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">Codex-native</text>
        <text x="32" y="122" fill="#f5f0e8" fill-opacity=".62" font-size="15">
          <tspan x="32" dy="0">Codex CLI and App Server provide native</tspan>
          <tspan x="32" dy="24">thread continuity, tools, and agent work.</tspan>
        </text>
      </g>
      <g transform="translate(401 1)">
        <rect width="398" height="233" fill="#2d3436"/>
        <text x="32" y="40" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.6">COMPUTER</text>
        <text x="32" y="83" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">Its own browser</text>
        <text x="32" y="122" fill="#f5f0e8" fill-opacity=".62" font-size="15">
          <tspan x="32" dy="0">Research, compare options, fill forms,</tspan>
          <tspan x="32" dy="24">and complete real web tasks.</tspan>
        </text>
      </g>
      <g transform="translate(801 1)">
        <rect width="398" height="233" fill="#2d3436"/>
        <text x="32" y="40" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.6">VOICE</text>
        <text x="32" y="83" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">A real phone number</text>
        <text x="32" y="122" fill="#f5f0e8" fill-opacity=".62" font-size="15">
          <tspan x="32" dy="0">Place calls, wait on hold, and report</tspan>
          <tspan x="32" dy="24">back where you already talk.</tspan>
        </text>
      </g>
      <g transform="translate(1 236)">
        <rect width="398" height="233" fill="#2d3436"/>
        <text x="32" y="40" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.6">PARALLEL WORK</text>
        <text x="32" y="83" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">Bounded subagents</text>
        <text x="32" y="122" fill="#f5f0e8" fill-opacity=".62" font-size="15">
          <tspan x="32" dy="0">Independent work can continue while the</tspan>
          <tspan x="32" dy="24">main conversation stays responsive.</tspan>
        </text>
      </g>
      <g transform="translate(401 236)">
        <rect width="398" height="233" fill="#2d3436"/>
        <text x="32" y="40" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.6">COMPUTE</text>
        <text x="32" y="83" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">Reasoning on demand</text>
        <text x="32" y="122" fill="#f5f0e8" fill-opacity=".62" font-size="15">
          <tspan x="32" dy="0">Choose Luna, Terra, or Sol and scale</tspan>
          <tspan x="32" dy="24">reasoning from low to xhigh.</tspan>
        </text>
      </g>
      <g transform="translate(801 236)">
        <rect width="398" height="233" fill="#2d3436"/>
        <text x="32" y="40" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.6">INFERENCE</text>
        <text x="32" y="83" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">No model lock-in</text>
        <text x="32" y="122" fill="#f5f0e8" fill-opacity=".62" font-size="15">
          <tspan x="32" dy="0">Choose Venice, bring an endpoint + key,</tspan>
          <tspan x="32" dy="24">or run an open-source model locally.</tspan>
        </text>
      </g>
    </g>
  </g>

  <g transform="translate(120 1060)">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="#d4c4a8" stroke-opacity=".2"/>
    <line x1="0" y1="250" x2="1200" y2="250" stroke="#d4c4a8" stroke-opacity=".2"/>
    <text x="0" y="49" fill="#d4b87a" font-family="DM Mono, ui-monospace, monospace" font-size="10" font-weight="600" letter-spacing="1.7">INFERENCE IS A CHOICE</text>
    <text x="0" y="101" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="38" font-weight="600" letter-spacing="-1.1">
      <tspan x="0" dy="0">The agent stays.</tspan>
      <tspan x="0" dy="43">The inference path is yours.</tspan>
    </text>
    <text x="0" y="204" fill="#f5f0e8" font-family="DM Sans, Arial, sans-serif" font-size="14" text-decoration="underline">See how provider choice works →</text>

    <g transform="translate(550 45)">
      <rect width="650" height="150" rx="14" fill="#d4c4a8" fill-opacity=".18"/>
      <g font-family="DM Sans, Arial, sans-serif">
        <g transform="translate(1 1)">
          <rect width="323" height="73" fill="#262c2d"/>
          <text x="22" y="28" fill="#f5f0e8" fill-opacity=".60" font-family="DM Mono, ui-monospace, monospace" font-size="9" letter-spacing="1.4">MANAGED</text>
          <text x="22" y="53" fill="#f5f0e8" font-size="15" font-weight="600">OpenAI</text>
        </g>
        <g transform="translate(326 1)">
          <rect width="323" height="73" fill="#262c2d"/>
          <text x="22" y="28" fill="#f5f0e8" fill-opacity=".60" font-family="DM Mono, ui-monospace, monospace" font-size="9" letter-spacing="1.4">PRIVACY CHOICE</text>
          <text x="22" y="53" fill="#f5f0e8" font-size="15" font-weight="600">Venice</text>
        </g>
        <g transform="translate(1 76)">
          <rect width="323" height="73" fill="#262c2d"/>
          <text x="22" y="28" fill="#f5f0e8" fill-opacity=".60" font-family="DM Mono, ui-monospace, monospace" font-size="9" letter-spacing="1.4">BRING YOUR OWN</text>
          <text x="22" y="53" fill="#f5f0e8" font-size="15" font-weight="600">Endpoint + key</text>
        </g>
        <g transform="translate(326 76)">
          <rect width="323" height="73" fill="#262c2d"/>
          <text x="22" y="28" fill="#f5f0e8" fill-opacity=".60" font-family="DM Mono, ui-monospace, monospace" font-size="9" letter-spacing="1.4">RUN IT YOURSELF</text>
          <text x="22" y="53" fill="#f5f0e8" font-size="15" font-weight="600">Local OSS</text>
        </g>
      </g>
    </g>
  </g>
</svg>
