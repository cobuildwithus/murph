<text x="32" y="56" font-family="DM Mono, Menlo, monospace" font-size="18" font-weight="500" fill="#736a58" letter-spacing="3">GROUP SPONSORSHIP ACCOUNTING</text>
<text x="32" y="133" font-family="Fraunces, Georgia, serif" font-size="43" font-weight="600" fill="#2d3436">Group sponsorships</text>
<text x="32" y="203" font-family="DM Sans, Arial, sans-serif" font-size="25" fill="#736a58">Monthly sponsorships are capped usage authorizations,</text>
<text x="32" y="243" font-family="DM Sans, Arial, sans-serif" font-size="25" fill="#736a58">not subscriptions, so their caps and charges stay outside</text>
<text x="32" y="283" font-family="DM Sans, Arial, sans-serif" font-size="25" fill="#736a58">plan MRR. Gross charges are fulfilled live-mode</text>
<text x="32" y="323" font-family="DM Sans, Arial, sans-serif" font-size="25" fill="#736a58">payments still represented in the retained sponsorship</text>
<text x="32" y="363" font-family="DM Sans, Arial, sans-serif" font-size="25" fill="#736a58">ledger in the current UTC month and do not net refunds</text>
<text x="32" y="403" font-family="DM Sans, Arial, sans-serif" font-size="25" fill="#736a58">or disputes; usage is exact sponsor-funded credit</text>
<text x="32" y="443" font-family="DM Sans, Arial, sans-serif" font-size="25" fill="#736a58">consumed in the same window.</text>
