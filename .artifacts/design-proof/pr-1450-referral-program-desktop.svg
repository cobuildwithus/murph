<text x="180" y="445" font-family="Fraunces, Georgia, serif" font-size="74" font-weight="600" fill="#f5f0e8" text-anchor="start">Bring your people.</text>
<text x="180" y="537" font-family="Fraunces, Georgia, serif" font-size="74" font-weight="600" fill="#f5f0e8" text-anchor="start">Earn more time with Murph.</text>
<text x="180" y="670" font-family="DM Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.78">Share your personal link or start a qualifying group mission. When</text>
<text x="180" y="712" font-family="DM Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.78">a new member finishes setup or a fresh group gets genuinely</text>
<text x="180" y="754" font-family="DM Sans, Arial, sans-serif" font-size="29" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.78">active, Murph adds usage to your account automatically.</text>
<rect x="180" y="860" width="410" height="78" fill="#f5f0e8" rx="18"/>
<text x="385" y="910" font-family="DM Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#2d3436" text-anchor="middle">Join Murph to start referring  ></text>
<text x="180" y="990" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#f5f0e8" text-anchor="start" opacity="0.78">See how rewards qualify  v</text>
<text x="180" y="1045" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.56">Rewards are usage, not cash. Message counts are approximate and vary with the</text>
<text x="180" y="1073" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.56">model, tools, media, and task complexity.</text>
