<text x="1528" y="423" font-family="DM Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#2d3436" text-anchor="start">Murph</text>
<text x="1528" y="451" font-family="DM Mono, Menlo, monospace" font-size="15" font-weight="500" fill="#736a58" text-anchor="start" letter-spacing="2">JUST NOW</text>
