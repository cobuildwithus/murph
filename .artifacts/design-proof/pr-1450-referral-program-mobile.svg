<svg xmlns="http://www.w3.org/2000/svg" width="780" height="2700" viewBox="0 0 780 2700">
<rect x="0" y="0" width="780" height="2700" fill="#f5f0e8" rx="0"/>
<text x="38" y="50" font-family="DM Mono, Menlo, monospace" font-size="16" font-weight="600" fill="#736a58" text-anchor="start" letter-spacing="2.4">REFERRAL PROGRAM · MOBILE</text>
<rect x="20" y="86" width="740" height="1390" fill="#1d271b" rx="36"/>
<circle cx="120" cy="256" r="180" fill="#d4b87a" opacity="0.08"/>
<circle cx="670" cy="446" r="220" fill="#5a6e32" opacity="0.24"/>
<text x="62" y="168" font-family="DM Mono, Menlo, monospace" font-size="15" font-weight="600" fill="#d4b87a" text-anchor="start" letter-spacing="2.4">MURPH REFERRALS</text>
<text x="62" y="261" font-family="Fraunces, Georgia, serif" font-size="50" font-weight="600" fill="#f5f0e8" text-anchor="start">Bring your people.</text>
<text x="62" y="326" font-family="Fraunces, Georgia, serif" font-size="50" font-weight="600" fill="#f5f0e8" text-anchor="start">Earn more time</text>
<text x="62" y="391" font-family="Fraunces, Georgia, serif" font-size="50" font-weight="600" fill="#f5f0e8" text-anchor="start">with Murph.</text>
<text x="62" y="481" font-family="DM Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.78">Share your personal link or start a</text>
<text x="62" y="515" font-family="DM Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.78">qualifying group mission. When a new</text>
<text x="62" y="549" font-family="DM Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.78">member finishes setup or a fresh group</text>
<text x="62" y="583" font-family="DM Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.78">gets genuinely active, Murph adds usage</text>
<text x="62" y="617" font-family="DM Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.78">automatically.</text>
<rect x="62" y="676" width="470" height="72" fill="#f5f0e8" rx="16"/>
<text x="297" y="722" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#2d3436" text-anchor="middle">Join Murph to start referring  ></text>
<text x="62" y="801" font-family="DM Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#f5f0e8" text-anchor="start" opacity="0.78">See how rewards qualify  v</text>
<text x="62" y="852" font-family="DM Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.55">Rewards are usage, not cash. Message counts are approximate.</text>
<rect x="62" y="921" width="656" height="455" fill="#f5f0e8" rx="30" stroke="#ffffff" stroke-width="2"/>
<circle cx="117" cy="979" r="30" fill="#5a6e32"/>
<text x="117" y="989" font-family="DM Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">M</text>
<text x="162" y="975" font-family="DM Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#2d3436" text-anchor="start">Murph</text>
<text x="162" y="1001" font-family="DM Mono, Menlo, monospace" font-size="12" font-weight="500" fill="#736a58" text-anchor="start" letter-spacing="1.5">JUST NOW</text>
<rect x="87" y="1033" width="606" height="112" fill="#ffffff" rx="22" stroke="#c4a882" stroke-width="1"/>
<text x="110" y="1075" font-family="DM Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#2d3436" text-anchor="start">Your referral came through. About 100 messages</text>
<text x="110" y="1102" font-family="DM Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#2d3436" text-anchor="start">are already added to your Murph.</text>
<rect x="87" y="1171" width="285" height="125" fill="#e7eedf" rx="22"/>
<text x="110" y="1203" font-family="DM Mono, Menlo, monospace" font-size="12" font-weight="600" fill="#5a6e32" text-anchor="start" letter-spacing="1.5">REWARD</text>
<text x="110" y="1256" font-family="Fraunces, Georgia, serif" font-size="42" font-weight="600" fill="#2d3436" text-anchor="start">+100</text>
<text x="110" y="1283" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a4036" text-anchor="start">approx. messages</text>
<rect x="390" y="1171" width="303" height="125" fill="#eee3d3" rx="22"/>
<text x="412" y="1203" font-family="DM Mono, Menlo, monospace" font-size="12" font-weight="600" fill="#736a58" text-anchor="start" letter-spacing="1.5">STATUS</text>
<text x="412" y="1250" font-family="DM Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#2d3436" text-anchor="start">Applied</text>
<text x="412" y="1279" font-family="DM Sans, Arial, sans-serif" font-size="14" font-weight="400" fill="#4a4036" text-anchor="start">No claim needed</text>
<text x="97" y="1341" font-family="DM Sans, Arial, sans-serif" font-size="16" font-weight="400" fill="#4a4036" text-anchor="start">PRIVATE  Their conversations and health data stay private.</text>
<text x="38" y="1535" font-family="DM Mono, Menlo, monospace" font-size="16" font-weight="600" fill="#736a58" text-anchor="start" letter-spacing="2.5">WAYS TO EARN</text>
<text x="38" y="1597" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#2d3436" text-anchor="start">Three paths.</text>
<text x="38" y="1650" font-family="Fraunces, Georgia, serif" font-size="44" font-weight="600" fill="#2d3436" text-anchor="start">One shared reward balance.</text>
<rect x="28" y="1700" width="724" height="275" fill="#253321" rx="28" stroke="#75885a" stroke-width="2"/>
<text x="56" y="1746" font-family="DM Mono, Menlo, monospace" font-size="13" font-weight="600" fill="#d4b87a" text-anchor="start" letter-spacing="1.5">PERSONAL REFERRAL LINK</text>
<text x="56" y="1788" font-family="DM Mono, Menlo, monospace" font-size="13" font-weight="600" fill="#d4b87a" text-anchor="start" letter-spacing="1.3">ABOUT 100 MORE MESSAGES</text>
<text x="56" y="1837" font-family="Fraunces, Georgia, serif" font-size="31" font-weight="600" fill="#f5f0e8" text-anchor="start">Invite someone to Murph</text>
<text x="56" y="1883" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.76">Share your stable link. The reward lands after a</text>
<text x="56" y="1909" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.76">genuinely new member completes setup.</text>
<text x="56" y="1952" font-family="DM Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#f5f0e8" text-anchor="start" opacity="0.72">Applied automatically when qualified</text>
<rect x="28" y="1997" width="724" height="275" fill="#faf7f1" rx="28" stroke="#c4a882" stroke-width="2"/>
<text x="56" y="2043" font-family="DM Mono, Menlo, monospace" font-size="13" font-weight="600" fill="#736a58" text-anchor="start" letter-spacing="1.5">FRESH iMESSAGE GROUP</text>
<text x="56" y="2085" font-family="DM Mono, Menlo, monospace" font-size="13" font-weight="600" fill="#736a58" text-anchor="start" letter-spacing="1.3">ABOUT 100 MORE MESSAGES</text>
<text x="56" y="2134" font-family="Fraunces, Georgia, serif" font-size="31" font-weight="600" fill="#2d3436" text-anchor="start">Bring someone new to Murph</text>
<text x="56" y="2180" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a4036" text-anchor="start">Start the mission first, then create a fresh group</text>
<text x="56" y="2206" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a4036" text-anchor="start">and help someone new join the conversation.</text>
<text x="56" y="2249" font-family="DM Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a4036" text-anchor="start">Applied automatically when qualified</text>
<rect x="28" y="2294" width="724" height="275" fill="#faf7f1" rx="28" stroke="#c4a882" stroke-width="2"/>
<text x="56" y="2340" font-family="DM Mono, Menlo, monospace" font-size="13" font-weight="600" fill="#736a58" text-anchor="start" letter-spacing="1.5">SUPPORTED GROUP CHATS</text>
<text x="56" y="2382" font-family="DM Mono, Menlo, monospace" font-size="13" font-weight="600" fill="#736a58" text-anchor="start" letter-spacing="1.3">ABOUT 140 MORE MESSAGES</text>
<text x="56" y="2431" font-family="Fraunces, Georgia, serif" font-size="31" font-weight="600" fill="#2d3436" text-anchor="start">Start an active group</text>
<text x="56" y="2477" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a4036" text-anchor="start">15 human messages, 8 from at least two other</text>
<text x="56" y="2503" font-family="DM Sans, Arial, sans-serif" font-size="18" font-weight="400" fill="#4a4036" text-anchor="start">people, across at least 10 minutes.</text>
<text x="56" y="2546" font-family="DM Sans, Arial, sans-serif" font-size="15" font-weight="400" fill="#4a4036" text-anchor="start">Applied automatically when qualified</text>
</svg>