<svg xmlns="http://www.w3.org/2000/svg" width="390" height="2540" viewBox="0 0 390 2540" role="img" aria-labelledby="title desc">
  <title id="title">Mobile design proof for the Murph technical runtime homepage section</title>
  <desc id="desc">A stacked mobile homepage section describing Murph's Codex runtime, browser, phone, bounded subagents, reasoning effort, and provider choices.</desc>
  <rect width="390" height="2540" fill="#2d3436"/>

  <g transform="translate(24 62)">
    <line x1="0" y1="7" x2="34" y2="7" stroke="#d4b87a" opacity=".8"/>
    <text x="48" y="11" fill="#d4b87a" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="1.7">UNDER THE HOOD</text>
    <text x="0" y="66" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="43" font-weight="600" letter-spacing="-1.5">
      <tspan x="0" dy="0">A real agent</tspan>
      <tspan x="0" dy="44">runtime behind</tspan>
      <tspan x="0" dy="44">a simple text.</tspan>
    </text>
    <text x="0" y="230" fill="#f5f0e8" fill-opacity=".68" font-family="DM Sans, Arial, sans-serif" font-size="15">
      <tspan x="0" dy="0">Murph can use a browser, place phone calls,</tspan>
      <tspan x="0" dy="24">operate tools, and delegate bounded work.</tspan>
      <tspan x="0" dy="24">It changes model and reasoning effort to fit</tspan>
      <tspan x="0" dy="24">the task, while you choose the inference.</tspan>
    </text>
  </g>

  <g transform="translate(24 390)">
    <rect width="342" height="340" rx="20" fill="#252b2c" stroke="#d4c4a8" stroke-opacity=".2"/>
    <circle cx="24" cy="27" r="4" fill="#b56f5c"/>
    <circle cx="40" cy="27" r="4" fill="#d4b87a"/>
    <circle cx="56" cy="27" r="4" fill="#8fa082"/>
    <text x="318" y="31" text-anchor="end" fill="#f5f0e8" fill-opacity=".55" font-family="DM Mono, ui-monospace, monospace" font-size="8" letter-spacing="1.3">MURPH RUNTIME</text>
    <line x1="18" y1="51" x2="324" y2="51" stroke="#d4c4a8" stroke-opacity=".14"/>
    <g font-family="DM Mono, ui-monospace, monospace">
      <text x="20" y="82" fill="#aebca5" font-size="8" letter-spacing="1.2">RUNTIME</text>
      <text x="20" y="106" fill="#f5f0e8" fill-opacity=".78" font-size="12">Codex CLI + App Server</text>
      <line x1="18" y1="124" x2="324" y2="124" stroke="#d4c4a8" stroke-opacity=".12"/>
      <text x="20" y="151" fill="#aebca5" font-size="8" letter-spacing="1.2">TOOLS</text>
      <text x="20" y="175" fill="#f5f0e8" fill-opacity=".78" font-size="12">browser · phone · integrations</text>
      <line x1="18" y1="193" x2="324" y2="193" stroke="#d4c4a8" stroke-opacity=".12"/>
      <text x="20" y="220" fill="#aebca5" font-size="8" letter-spacing="1.2">WORKERS</text>
      <text x="20" y="244" fill="#f5f0e8" fill-opacity=".78" font-size="12">root · bounded subagents</text>
      <line x1="18" y1="262" x2="324" y2="262" stroke="#d4c4a8" stroke-opacity=".12"/>
      <text x="20" y="289" fill="#aebca5" font-size="8" letter-spacing="1.2">REASONING</text>
      <text x="20" y="313" fill="#f5f0e8" fill-opacity=".78" font-size="12">low · medium · high · xhigh</text>
    </g>
  </g>

  <g transform="translate(24 774)" font-family="DM Sans, Arial, sans-serif">
    <rect width="342" height="206" rx="18" fill="#2d3436" stroke="#d4c4a8" stroke-opacity=".18"/>
    <text x="22" y="37" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="1.3">RUNTIME</text>
    <text x="22" y="76" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600">Codex-native</text>
    <text x="22" y="113" fill="#f5f0e8" fill-opacity=".62" font-size="14">
      <tspan x="22" dy="0">Codex CLI and App Server provide native</tspan>
      <tspan x="22" dy="22">thread continuity, tools, and agent work.</tspan>
    </text>

    <g transform="translate(0 224)">
      <rect width="342" height="206" rx="18" fill="#2d3436" stroke="#d4c4a8" stroke-opacity=".18"/>
      <text x="22" y="37" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="1.3">COMPUTER</text>
      <text x="22" y="76" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600">Its own browser</text>
      <text x="22" y="113" fill="#f5f0e8" fill-opacity=".62" font-size="14">
        <tspan x="22" dy="0">Research, compare options, fill forms,</tspan>
        <tspan x="22" dy="22">and complete real web tasks.</tspan>
      </text>
    </g>

    <g transform="translate(0 448)">
      <rect width="342" height="206" rx="18" fill="#2d3436" stroke="#d4c4a8" stroke-opacity=".18"/>
      <text x="22" y="37" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="1.3">VOICE</text>
      <text x="22" y="76" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600">A real phone number</text>
      <text x="22" y="113" fill="#f5f0e8" fill-opacity=".62" font-size="14">
        <tspan x="22" dy="0">Place calls, wait on hold, and report back</tspan>
        <tspan x="22" dy="22">where you already talk.</tspan>
      </text>
    </g>

    <g transform="translate(0 672)">
      <rect width="342" height="206" rx="18" fill="#2d3436" stroke="#d4c4a8" stroke-opacity=".18"/>
      <text x="22" y="37" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="1.3">PARALLEL WORK</text>
      <text x="22" y="76" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600">Bounded subagents</text>
      <text x="22" y="113" fill="#f5f0e8" fill-opacity=".62" font-size="14">
        <tspan x="22" dy="0">Independent work can continue while the</tspan>
        <tspan x="22" dy="22">main conversation stays responsive.</tspan>
      </text>
    </g>

    <g transform="translate(0 896)">
      <rect width="342" height="206" rx="18" fill="#2d3436" stroke="#d4c4a8" stroke-opacity=".18"/>
      <text x="22" y="37" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="1.3">COMPUTE</text>
      <text x="22" y="76" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600">Reasoning on demand</text>
      <text x="22" y="113" fill="#f5f0e8" fill-opacity=".62" font-size="14">
        <tspan x="22" dy="0">Choose Luna, Terra, or Sol and scale</tspan>
        <tspan x="22" dy="22">reasoning from low to xhigh.</tspan>
      </text>
    </g>

    <g transform="translate(0 1120)">
      <rect width="342" height="206" rx="18" fill="#2d3436" stroke="#d4c4a8" stroke-opacity=".18"/>
      <text x="22" y="37" fill="#aebca5" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="1.3">INFERENCE</text>
      <text x="22" y="76" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="26" font-weight="600">No model lock-in</text>
      <text x="22" y="113" fill="#f5f0e8" fill-opacity=".62" font-size="14">
        <tspan x="22" dy="0">Choose Venice, bring an endpoint + key,</tspan>
        <tspan x="22" dy="22">or run an open-source model locally.</tspan>
      </text>
    </g>
  </g>

  <g transform="translate(24 2145)">
    <line x1="0" y1="0" x2="342" y2="0" stroke="#d4c4a8" stroke-opacity=".2"/>
    <text x="0" y="39" fill="#d4b87a" font-family="DM Mono, ui-monospace, monospace" font-size="9" font-weight="600" letter-spacing="1.3">INFERENCE IS A CHOICE</text>
    <text x="0" y="80" fill="#f5f0e8" font-family="Fraunces, Georgia, serif" font-size="28" font-weight="600">
      <tspan x="0" dy="0">The agent stays.</tspan>
      <tspan x="0" dy="32">The inference path</tspan>
      <tspan x="0" dy="32">is yours.</tspan>
    </text>
    <g transform="translate(0 175)" font-family="DM Sans, Arial, sans-serif">
      <rect width="342" height="118" rx="13" fill="#d4c4a8" fill-opacity=".18"/>
      <rect x="1" y="1" width="169" height="57" fill="#262c2d"/>
      <rect x="172" y="1" width="169" height="57" fill="#262c2d"/>
      <rect x="1" y="60" width="169" height="57" fill="#262c2d"/>
      <rect x="172" y="60" width="169" height="57" fill="#262c2d"/>
      <text x="14" y="23" fill="#f5f0e8" fill-opacity=".60" font-family="DM Mono, ui-monospace, monospace" font-size="7" letter-spacing="1">MANAGED</text>
      <text x="14" y="44" fill="#f5f0e8" font-size="12" font-weight="600">OpenAI</text>
      <text x="185" y="23" fill="#f5f0e8" fill-opacity=".60" font-family="DM Mono, ui-monospace, monospace" font-size="7" letter-spacing="1">PRIVACY CHOICE</text>
      <text x="185" y="44" fill="#f5f0e8" font-size="12" font-weight="600">Venice</text>
      <text x="14" y="82" fill="#f5f0e8" fill-opacity=".60" font-family="DM Mono, ui-monospace, monospace" font-size="7" letter-spacing="1">BRING YOUR OWN</text>
      <text x="14" y="103" fill="#f5f0e8" font-size="12" font-weight="600">Endpoint + key</text>
      <text x="185" y="82" fill="#f5f0e8" fill-opacity=".60" font-family="DM Mono, ui-monospace, monospace" font-size="7" letter-spacing="1">RUN IT YOURSELF</text>
      <text x="185" y="103" fill="#f5f0e8" font-size="12" font-weight="600">Local OSS</text>
    </g>
    <text x="0" y="330" fill="#f5f0e8" font-family="DM Sans, Arial, sans-serif" font-size="12" text-decoration="underline">See how provider choice works →</text>
  </g>
</svg>
