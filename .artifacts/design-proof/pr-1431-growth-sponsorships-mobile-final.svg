<text x="32" y="225" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#736a58" text-anchor="start">Monthly sponsorships are capped usage</text>
<text x="32" y="272" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#736a58" text-anchor="start">authorizations, not subscriptions, so their caps and</text>
