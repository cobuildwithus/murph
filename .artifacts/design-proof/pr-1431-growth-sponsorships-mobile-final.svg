<text x="32" y="460" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#736a58" text-anchor="start">month and do not net refunds or disputes; usage is</text>
<text x="32" y="507" font-family="DM Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#736a58" text-anchor="start">exact sponsor-funded credit consumed in the same window.</text>
